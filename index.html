<style>
:root{
  --bg:#131519;
  --bg2:#1C1E24;
  --panel:#1A1C22;
  --panel2:#20232A;
  --line:#2A2D35;
  --line2:#33363F;
  --tx:#E9E7E0;
  --tx2:#9A9CA5;
  --tx3:#6E7077;
  --accent:#3DDCBF;
  --accent-soft:#71F2DD;
  --good:#7FB069;
  --risk:#C96F5A;
  --info:#6E8FB8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:'Noto Serif SC',serif;
  --sans:'Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-weight:300;line-height:1.7;
  min-height:100vh;
  background-image:radial-gradient(1200px 500px at 80% -10%,rgba(61,220,191,.06),transparent 60%),
                   radial-gradient(900px 400px at 0% 110%,rgba(110,143,184,.05),transparent 60%);
  background-attachment:fixed;
}
::selection{background:rgba(61,220,191,.3)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:16px;
  padding:14px 28px;background:rgba(19,21,25,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:600;letter-spacing:.5px}
.brand .dot{width:22px;height:22px;flex:0 0 auto}
.steps{margin-left:auto;display:flex;gap:6px;align-items:center}
.step{font-size:12px;color:var(--tx3);padding:4px 10px;border-radius:20px;border:1px solid transparent;white-space:nowrap;cursor:pointer}
.step.on{color:var(--accent);border-color:rgba(61,220,191,.35)}
.step .n{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-right:5px}
.step.on .n{color:var(--accent)}

/* ============ 布局 ============ */
.layout{
  display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:0;
  max-width:1380px;margin:0 auto;
}
.pane{padding:28px;min-width:0}
.pane-left{border-right:1px solid var(--line)}
.pane-right{}

/* ============ 录入面板 ============ */
.h-label{
  font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:1px;
  color:var(--accent);margin-bottom:4px;
}
.h-title{font-family:var(--serif);font-weight:600;font-size:26px;margin-bottom:6px}
.h-sub{font-size:13px;color:var(--tx2);margin-bottom:22px}

.form{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px;margin-bottom:20px;
}
.f-row{display:flex;gap:10px;margin-bottom:12px}
.f-field{flex:1}
.f-label{display:block;font-size:12px;color:var(--tx3);margin-bottom:6px;letter-spacing:.5px}
select,input[type=text],input[type=number],textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;
  color:var(--tx);font-family:var(--sans);font-weight:300;font-size:14px;
  padding:10px 12px;outline:none;transition:border-color .15s;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:110px;line-height:1.6}
.energy-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.energy-row .e-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);width:100%}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--line2);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:#04120F;font-family:var(--sans);font-weight:600;font-size:14px;
  border:none;border-radius:9px;padding:11px 18px;cursor:pointer;transition:transform .08s,background .15s;
  width:100%;
}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--tx2);width:auto}
.btn.ghost:hover{border-color:var(--tx2);color:var(--tx)}
.btn.sm{padding:7px 12px;font-size:13px;width:auto}
.hint{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.6}
.quick{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}

/* 日志列表 */
.logs{display:flex;flex-direction:column;gap:10px}
.log-item{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  position:relative;
}
.log-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.log-type{padding:2px 8px;border-radius:12px;font-size:11px;border:1px solid}
.log-type.work{color:var(--info);border-color:rgba(110,143,184,.4)}
.log-type.fit{color:var(--good);border-color:rgba(127,176,105,.4)}
.log-type.life{color:var(--accent);border-color:rgba(61,220,191,.4)}
.log-time{color:var(--tx3);font-family:var(--mono);font-size:11px;margin-left:auto}
.log-score{margin-left:6px;font-family:var(--mono);font-size:11px;color:var(--accent)}
.log-body{font-size:13.5px;color:var(--tx);line-height:1.6}
.log-tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--tx2);border:1px solid var(--line2);border-radius:10px;padding:1px 8px}
.log-del{position:absolute;top:9px;right:9px;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.log-del:hover{color:var(--risk);background:rgba(201,111,90,.12)}
.empty{color:var(--tx3);font-size:13px;text-align:center;padding:26px 10px;border:1px dashed var(--line2);border-radius:12px}

/* ============ 报告面板 ============ */
.report-tools{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px}
.tab{border:none;background:none;color:var(--tx2);font-family:var(--sans);font-size:14px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--bg2);color:var(--accent)}
.tab[data-empty].on{color:var(--tx3)}
.gen{width:auto;margin-left:auto}

.report-shell{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:30px 34px;min-height:420px;
}
.md{font-size:14.5px;color:var(--tx);line-height:1.85;word-break:break-word}
.md h1{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:.5px;margin:0 0 4px;color:var(--tx)}
.md .kicker{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:22px}
.md h2{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--accent);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.md h3{font-size:14px;font-weight:600;color:var(--tx);margin:16px 0 6px}
.md p{margin-bottom:10px}
.md ul{margin:0 0 12px 0;padding-left:4px;list-style:none}
.md li{padding-left:20px;position:relative;margin-bottom:5px}
.md li:before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7}
.md strong{font-weight:600;color:var(--tx)}
.md .conf{color:var(--tx3)}
.md .warn{color:var(--risk)}
.md .good{color:var(--good)}
.md .info{color:var(--info)}
.md .sum{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.md blockquote{border-left:2px solid var(--accent);padding:8px 14px;margin:14px 0;background:rgba(61,220,191,.05);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--tx2)}
.md .scenario{display:block;padding:12px 16px;border:1px solid var(--line2);border-radius:10px;margin:12px 0}
.md .scenario.base{border-left:3px solid var(--info)}
.md .scenario.good{border-left:3px solid var(--good)}
.md .scenario.risk{border-left:3px solid var(--risk)}
.scn-tag{font-size:11px;font-weight:600;letter-spacing:.5px;display:inline-block;margin-bottom:6px}
.base .scn-tag{color:var(--info)}.good .scn-tag{color:var(--good)}.risk .scn-tag{color:var(--risk)}

.intro-empty{text-align:center;color:var(--tx3);padding:80px 20px}
.intro-empty .big{font-family:var(--serif);font-size:20px;color:var(--tx2);margin-bottom:8px}
.intro-empty p{font-size:13.5px;margin-bottom:22px}
/* ============ 日志 & 统计 ============ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-bar select,.filter-bar input{width:auto;flex:1;min-width:90px;background:var(--bg2)}
.filter-bar .fcount{margin-left:auto;font-size:12px;color:var(--tx3);white-space:nowrap}
.log-panel{display:flex;flex-direction:column;gap:10px}
.edit-form{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:14px;margin-top:10px}
.edit-form .f-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.edit-form .f-row > *{flex:1}
.edit-form textarea{background:var(--bg)}
.edit-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.edit-actions .btn{width:auto}
.btn.danger:hover{color:var(--risk);border-color:var(--risk)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.chart-box h3{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--accent);margin:0 0 8px}
.chart-canvas{width:100%;height:260px}
.gantt-box{grid-column:1/-1}
.gantt-box .chart-canvas{height:380px}
.energy-row input[type=range]{flex:1;min-width:120px}
select[multiple]{height:auto;min-height:64px}
.tag-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.tag-list .tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px}
.tag-list .tag button{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.tag-list .tag button:hover{color:var(--risk)}
.add-row{display:flex;gap:8px;margin-bottom:18px}
.add-row input{flex:1}
.add-row .btn{width:auto}
.setting-sec{margin-bottom:26px}
.type-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.type-card .type-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.type-card .deltype{background:none;border:none;color:var(--risk);cursor:pointer;font-size:12px;margin-left:auto}
.type-card .tag-list.sub{margin-bottom:10px}
.tag-list .tag.muted{opacity:.55}
.type-card .add-row{margin-bottom:0}
/* ===== 训练模块 ===== */
.train-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:1080px){.train-grid{grid-template-columns:1fr}}
.train-search{display:flex;gap:10px;margin-bottom:12px}
.train-search input{flex:1;min-width:0}
.train-search select{flex:0 0 124px}
@media(max-width:600px){.train-search{flex-wrap:wrap}.train-search input{flex:1 1 100%}.train-search select{flex:1 1 calc(50% - 5px)}}
.train-search input{flex:1}
.ex-list{max-height:380px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.ex-list::-webkit-scrollbar{width:8px}
.ex-list::-webkit-scrollbar-thumb{background:#3a3d44;border-radius:8px}
.ex-list::-webkit-scrollbar-track{background:transparent}
.ex-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.ex-item:last-child{border-bottom:none}
.ex-item:hover{background:rgba(255,255,255,.03)}
.ex-item.on{background:rgba(61,220,191,.09);box-shadow:inset 3px 0 0 var(--accent)}
.ex-item.on .ex-name{color:var(--accent);font-weight:650}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:nowrap}
.ex-name{font-weight:600;font-size:14px;color:var(--tx);white-space:nowrap}
.ex-meta{font-size:11px;color:var(--tx3);font-family:var(--mono);white-space:nowrap}
.ex-item .ex-sub{font-size:12px;color:var(--tx3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ==================================================================
   布局重构 + 科技感视觉
   ================================================================== */
:root{
  --bg:#07090E;--bg2:#0B1016;--panel:#0E141B;--panel2:#121A23;
  --line:#1A2431;--line2:#26323F;
  --tx:#E4EDF4;--tx2:#8695A5;--tx3:#5A6776;
  --accent:#3DDCBF;--accent-soft:#71F2DD;--good:#5FD3A0;--risk:#F06A5A;--info:#6D8CFF;
  --serif:'Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(61,220,191,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(61,220,191,.026) 1px,transparent 1px),
    radial-gradient(1100px 460px at 76% -14%,rgba(61,220,191,.10),transparent 62%),
    radial-gradient(860px 420px at 2% 104%,rgba(109,140,255,.06),transparent 60%);
  background-size:46px 46px,46px 46px,auto,auto;
  background-attachment:fixed;
  font-weight:400;
  letter-spacing:.1px;
}
::selection{background:rgba(61,220,191,.24)}

/* 顶栏 */
.topbar{height:60px;padding:0 26px;background:rgba(7,9,14,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.2px}
.brand-sub{color:var(--tx3);font-weight:400;font-size:12px;letter-spacing:1.4px;margin-left:9px}
.brand .dot{width:18px;height:18px;filter:drop-shadow(0 0 6px rgba(61,220,191,.5))}
.steps{gap:2px}
.step{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:6px;border:1px solid transparent;font-size:12px;color:var(--tx3);transition:background .15s,color .15s,border-color .15s}
.step:hover{color:var(--tx2);background:rgba(255,255,255,.03)}
.step.on{color:var(--accent);border-color:rgba(61,220,191,.3);background:rgba(61,220,191,.08)}
.step .n{font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--tx3)}
.step.on .n{color:var(--accent)}

/* 页面骨架 */
.stage{max-width:1340px;margin:0 auto;padding:30px 26px 0}
.page[hidden]{display:none!important}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--accent);opacity:.85;margin:0 0 10px}
.page-title{font-family:var(--sans);font-weight:600;font-size:26px;letter-spacing:-.4px;line-height:1.3;color:var(--tx)}
.page-desc{font-size:13px;color:var(--tx2);margin-top:7px;line-height:1.7;max-width:660px}

/* 记录页 */
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:28px;align-items:start}
@media(max-width:1000px){.rec-grid{grid-template-columns:1fr;gap:22px}}
@media(min-width:1001px){.rec-grid{grid-template-columns:minmax(0,720px) minmax(320px,1fr);gap:34px;justify-content:space-between}}
.rec-side{position:relative;padding-top:2px}
.side-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.side-head .eyebrow{margin:0}
.rec-side .logs{max-height:560px;overflow-y:auto;padding-right:6px}
.rec-side .logs::-webkit-scrollbar{width:6px}
.rec-side .logs::-webkit-scrollbar-thumb{background:#1F2A37;border-radius:6px}
@media(max-width:1000px){.rec-side .logs{max-height:none}}

/* 分析页 */
.rp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
.rp-top .btn{width:auto;flex:0 0 auto}
.rp-top .page-desc{margin-top:4px}
.tabs{display:inline-flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:16px}
.tab{font-size:13px;font-weight:500;color:var(--tx2);padding:7px 15px;border-radius:6px;background:none;border:none;cursor:pointer;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{background:rgba(61,220,191,.1);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(61,220,191,.24)}
.report-shell{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:28px 32px 36px;min-height:420px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 24px 60px -40px rgba(0,0,0,.9);
}
@media(max-width:640px){.stage{padding:20px 16px 0}.report-shell{padding:20px 16px 26px}.rp-top{flex-direction:column;align-items:flex-start}.tabs{display:flex;width:100%;overflow-x:auto}.tab{flex:0 0 auto}}

/* 排版 */
.md{font-size:14.5px;line-height:1.85}
.md h1{font-family:var(--sans);font-size:24px;font-weight:600;letter-spacing:-.3px;margin:0 0 6px;color:var(--tx)}
.md .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;color:var(--accent);opacity:.7;margin-bottom:22px}
.md h2{
  font-family:var(--sans);font-size:15px;font-weight:600;color:var(--tx);
  letter-spacing:.3px;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;
}
.md h2:before{content:"";width:5px;height:5px;background:var(--accent);box-shadow:0 0 8px rgba(61,220,191,.6);flex:0 0 auto}
.md h3{font-size:13.5px;font-weight:600;color:var(--tx);margin:16px 0 6px;letter-spacing:.2px}
.md li:before{width:4px;height:4px;border-radius:1px;opacity:.55;top:12px}
.md blockquote{border-left:2px solid rgba(61,220,191,.5);background:rgba(61,220,191,.045);border-radius:0 6px 6px 0}
.md .scenario{border-radius:8px;background:rgba(255,255,255,.015)}
.profile-summary{background:rgba(61,220,191,.04);border-radius:8px;border-color:var(--line2)}
.profile-summary li:before{width:4px;height:4px;border-radius:1px}

/* 控件 */
.form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.quick .btn{width:auto}
.btn{
  border-radius:7px;font-weight:600;letter-spacing:.2px;
  background:var(--accent);color:#04120F;
  box-shadow:0 0 0 1px rgba(61,220,191,.45),0 8px 22px -12px rgba(61,220,191,.5);
}
.btn:hover{background:var(--accent-soft)}
.btn.ghost{background:rgba(255,255,255,.02);border:1px solid var(--line2);color:var(--tx2);box-shadow:none}
.btn.ghost:hover{border-color:rgba(61,220,191,.55);color:var(--accent);background:rgba(61,220,191,.06)}
.btn.sm{padding:8px 13px}
select,input[type=text],input[type=number],textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;font-weight:400}
select:focus,input:focus,textarea:focus{border-color:rgba(61,220,191,.7);box-shadow:0 0 0 3px rgba(61,220,191,.09)}
input[type=range]{height:3px;background:#1E2836}
input[type=range]::-webkit-slider-thumb{width:14px;height:14px;background:var(--accent);box-shadow:0 0 10px rgba(61,220,191,.55),0 0 0 4px rgba(61,220,191,.12)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border:none}
.f-label{font-size:11.5px;color:var(--tx3);letter-spacing:.4px}
.hint{font-size:12px;color:var(--tx3)}
.log-score{color:var(--accent);font-family:var(--mono)}

/* 卡片与列表 */
.log-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.log-head{flex-wrap:wrap;row-gap:5px;padding-right:22px}
.log-time{margin-left:auto;white-space:nowrap}
.log-item:hover{border-color:var(--line2)}
.log-type.work{color:var(--info);border-color:rgba(109,140,255,.35)}
.log-type.fit{color:var(--good);border-color:rgba(95,211,160,.35)}
.log-type.life{color:var(--accent);border-color:rgba(61,220,191,.35)}
.tag{border-radius:4px;border-color:var(--line2);color:var(--tx2);font-family:var(--sans)}
.empty{border-radius:8px}
.chart-box,.my-lib,.quick-box,.today-box,.type-card,.cu-form{border-radius:10px;border-color:var(--line);background:var(--panel)}
.chart-box h3{font-family:var(--sans);font-size:14px;color:var(--tx);letter-spacing:.3px}
.ex-list{border-radius:8px;border-color:var(--line)}
.ex-item.on{background:rgba(61,220,191,.07);box-shadow:inset 2px 0 0 var(--accent)}
.sel-ex{background:rgba(61,220,191,.07);border-radius:6px;font-family:var(--sans)}
.stepper button{border-radius:6px;border-color:var(--line)}
.stepper button:hover{border-color:rgba(61,220,191,.55);color:var(--accent)}
.lib-chip{border-radius:5px;border-color:var(--line)}
.lib-chip.on{background:rgba(61,220,191,.08);border-color:rgba(61,220,191,.5);color:var(--accent)}
.ex-media{width:170px;height:170px}
.ex-gif{border-radius:8px}
.setting-sec h2{border-bottom:1px solid var(--line);color:var(--tx);font-family:var(--sans);letter-spacing:.3px}
.toast{background:#0C1218;border-color:rgba(61,220,191,.4);border-radius:8px;font-size:12.5px;box-shadow:0 12px 32px -12px rgba(0,0,0,.8)}
.footnote{border-top:1px solid var(--line);max-width:1340px;padding:20px 26px 40px;margin:36px auto 0}
.filter-bar input[type=date]{flex:0 0 148px;min-width:0;padding:8px 10px;font-family:var(--mono);font-size:12px}

.sel-ex{font-size:13px;color:var(--tx2);padding:8px 12px;border-radius:8px;background:rgba(61,220,191,.08);margin-bottom:12px}

.cu-form .f-row{margin-bottom:0}
.chart-sm{height:158px;width:100%}
.ex-en{font-size:11px;color:var(--tx3);font-family:var(--mono);margin-bottom:8px;letter-spacing:.02em}
.my-lib{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.my-head{font-size:13px;color:var(--tx);display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.my-count{font-size:11px;color:var(--accent);font-family:var(--mono)}
.my-tip{font-size:11px;color:var(--tx3);margin-left:auto}
.my-empty{font-size:12px;color:var(--tx3);line-height:1.6}
.lib-group{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.lib-part{font-size:11px;color:var(--tx3);flex:0 0 32px;padding-top:5px}
.lib-chips{display:flex;flex-wrap:wrap;gap:6px}
.lib-chip{font-size:12px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--tx2);cursor:pointer}
.lib-chip:hover{border-color:var(--accent);color:var(--accent)}
.lib-chip.on{border-color:var(--accent);color:var(--accent);background:rgba(61,220,191,.08)}
.plan-in{display:flex;gap:10px;margin-bottom:12px}
.plan-in select{flex:1}
.plan-wrap{border-top:1px solid var(--line);padding-top:12px}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--tx);margin-bottom:8px}
.plan-head span{font-size:11px;color:var(--tx3);font-family:var(--mono)}
.plan-item{padding:9px 0;border-bottom:1px solid var(--line)}
.plan-item:last-of-type{border-bottom:none}
.plan-line{display:flex;align-items:baseline;gap:8px}
.plan-name{font-size:13px;color:var(--tx);font-weight:600;cursor:pointer}
.plan-name:hover{color:var(--accent)}
.plan-tag{font-size:10px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.plan-vol{margin-left:auto;font-size:11px;color:var(--accent);font-family:var(--mono);white-space:nowrap}
.plan-note{font-size:11px;color:var(--tx3);margin-top:4px;line-height:1.5}
.name-edit{display:flex;flex-direction:column;gap:8px}
.name-edit input{width:100%}
.name-edit .tr-actions{flex-wrap:wrap}
.ex-count{font-size:11px;color:var(--tx3);margin-bottom:8px;font-family:var(--mono)}
.ex-cu{color:var(--tx3);font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
.ex-gif{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:12px;background:#fff;display:block;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .25s ease;z-index:1}
.ex-media{margin:8px auto 14px;position:relative;width:180px;height:180px}
.gif-ph{position:absolute;inset:0;border-radius:12px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);background:rgba(255,255,255,.03);z-index:0}
.gif-fail{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:0 12px;font-size:12px;color:var(--tx3);border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a1c20;color:#eee;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;border:1px solid rgba(61,220,191,.45);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.setting-sec h2{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--accent);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}

.profile-summary{border:1px dashed var(--line2);border-radius:12px;padding:16px 18px;margin:6px 0 22px;background:rgba(61,220,191,.04)}
.profile-summary h3{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--accent);margin:0 0 10px}
.profile-summary ul{margin:0;padding-left:4px;list-style:none}
.profile-summary li{padding-left:18px;position:relative;margin-bottom:5px;font-size:13.5px}
.profile-summary li:before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7}
.profile-summary .note{color:var(--tx3);font-size:12px;margin-top:8px}
.profile-saved{color:var(--good);font-size:12px;align-self:center}

@media(max-width:860px){.chart-grid{grid-template-columns:1fr}}


/* ============ 页脚 ============ */
.footnote{
  border-top:1px solid var(--line);margin:40px 28px 0;padding:22px 0 40px;
  font-size:12px;color:var(--tx3);line-height:1.8;max-width:1380px;margin-left:auto;margin-right:auto;
}
.footnote b{color:var(--tx2);font-weight:500}

/* ============ 响应式 ============ */
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .pane-left{border-right:none;border-bottom:1px solid var(--line)}
  .steps .step .lbl{display:none}
}
@media(max-width:560px){
  .pane{padding:18px}
  .report-shell{padding:20px 18px}
  .topbar{padding:12px 16px}
  .f-row{flex-direction:column}
}

/* ==================================================================
   布局重构 + 科技感视觉
   ================================================================== */
:root{
  --bg:#07090E;--bg2:#0B1016;--panel:#0E141B;--panel2:#121A23;
  --line:#1A2431;--line2:#26323F;
  --tx:#E4EDF4;--tx2:#8695A5;--tx3:#5A6776;
  --accent:#3DDCBF;--accent-soft:#71F2DD;--good:#5FD3A0;--risk:#F06A5A;--info:#6D8CFF;
  --serif:'Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body{
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(61,220,191,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(61,220,191,.026) 1px,transparent 1px),
    radial-gradient(1100px 460px at 76% -14%,rgba(61,220,191,.10),transparent 62%),
    radial-gradient(860px 420px at 2% 104%,rgba(109,140,255,.06),transparent 60%);
  background-size:46px 46px,46px 46px,auto,auto;
  background-attachment:fixed;
  font-weight:400;
  letter-spacing:.1px;
}
::selection{background:rgba(61,220,191,.24)}

/* 顶栏 */
.topbar{height:60px;padding:0 26px;background:rgba(7,9,14,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.2px}
.brand-sub{color:var(--tx3);font-weight:400;font-size:12px;letter-spacing:1.4px;margin-left:9px}
.brand .dot{width:18px;height:18px;filter:drop-shadow(0 0 6px rgba(61,220,191,.5))}
.steps{gap:2px}
.step{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:6px;border:1px solid transparent;font-size:12px;color:var(--tx3);transition:background .15s,color .15s,border-color .15s}
.step:hover{color:var(--tx2);background:rgba(255,255,255,.03)}
.step.on{color:var(--accent);border-color:rgba(61,220,191,.3);background:rgba(61,220,191,.08)}
.step .n{font-family:var(--mono);font-size:10px;letter-spacing:.6px;color:var(--tx3)}
.step.on .n{color:var(--accent)}

/* 页面骨架 */
.stage{max-width:1340px;margin:0 auto;padding:30px 26px 0}
.page[hidden]{display:none!important}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--accent);opacity:.85;margin:0 0 10px}
.page-title{font-family:var(--sans);font-weight:600;font-size:26px;letter-spacing:-.4px;line-height:1.3;color:var(--tx)}
.page-desc{font-size:13px;color:var(--tx2);margin-top:7px;line-height:1.7;max-width:660px}

/* 记录页 */
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:28px;align-items:start}
@media(max-width:1000px){.rec-grid{grid-template-columns:1fr;gap:22px}}
@media(min-width:1001px){.rec-grid{grid-template-columns:minmax(0,720px) minmax(320px,1fr);gap:34px;justify-content:space-between}}
.rec-side{position:relative;padding-top:2px}
.side-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.side-head .eyebrow{margin:0}
.rec-side .logs{max-height:560px;overflow-y:auto;padding-right:6px}
.rec-side .logs::-webkit-scrollbar{width:6px}
.rec-side .logs::-webkit-scrollbar-thumb{background:#1F2A37;border-radius:6px}
@media(max-width:1000px){.rec-side .logs{max-height:none}}

/* 分析页 */
.rp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
.rp-top .btn{width:auto;flex:0 0 auto}
.rp-top .page-desc{margin-top:4px}
.tabs{display:inline-flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:16px}
.tab{font-size:13px;font-weight:500;color:var(--tx2);padding:7px 15px;border-radius:6px;background:none;border:none;cursor:pointer;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{background:rgba(61,220,191,.1);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(61,220,191,.24)}
.report-shell{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:28px 32px 36px;min-height:420px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 24px 60px -40px rgba(0,0,0,.9);
}
@media(max-width:640px){.stage{padding:20px 16px 0}.report-shell{padding:20px 16px 26px}.rp-top{flex-direction:column;align-items:flex-start}.tabs{display:flex;width:100%;overflow-x:auto}.tab{flex:0 0 auto}}

/* 排版 */
.md{font-size:14.5px;line-height:1.85}
.md h1{font-family:var(--sans);font-size:24px;font-weight:600;letter-spacing:-.3px;margin:0 0 6px;color:var(--tx)}
.md .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;color:var(--accent);opacity:.7;margin-bottom:22px}
.md h2{
  font-family:var(--sans);font-size:15px;font-weight:600;color:var(--tx);
  letter-spacing:.3px;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;
}
.md h2:before{content:"";width:5px;height:5px;background:var(--accent);box-shadow:0 0 8px rgba(61,220,191,.6);flex:0 0 auto}
.md h3{font-size:13.5px;font-weight:600;color:var(--tx);margin:16px 0 6px;letter-spacing:.2px}
.md li:before{width:4px;height:4px;border-radius:1px;opacity:.55;top:12px}
.md blockquote{border-left:2px solid rgba(61,220,191,.5);background:rgba(61,220,191,.045);border-radius:0 6px 6px 0}
.md .scenario{border-radius:8px;background:rgba(255,255,255,.015)}
.profile-summary{background:rgba(61,220,191,.04);border-radius:8px;border-color:var(--line2)}
.profile-summary li:before{width:4px;height:4px;border-radius:1px}

/* 控件 */
.form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.quick .btn{width:auto}
.btn{
  border-radius:7px;font-weight:600;letter-spacing:.2px;
  background:var(--accent);color:#04120F;
  box-shadow:0 0 0 1px rgba(61,220,191,.45),0 8px 22px -12px rgba(61,220,191,.5);
}
.btn:hover{background:var(--accent-soft)}
.btn.ghost{background:rgba(255,255,255,.02);border:1px solid var(--line2);color:var(--tx2);box-shadow:none}
.btn.ghost:hover{border-color:rgba(61,220,191,.55);color:var(--accent);background:rgba(61,220,191,.06)}
.btn.sm{padding:8px 13px}
select,input[type=text],input[type=number],textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:7px;font-weight:400}
select:focus,input:focus,textarea:focus{border-color:rgba(61,220,191,.7);box-shadow:0 0 0 3px rgba(61,220,191,.09)}
input[type=range]{height:3px;background:#1E2836}
input[type=range]::-webkit-slider-thumb{width:14px;height:14px;background:var(--accent);box-shadow:0 0 10px rgba(61,220,191,.55),0 0 0 4px rgba(61,220,191,.12)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--accent);border:none}
.f-label{font-size:11.5px;color:var(--tx3);letter-spacing:.4px}
.hint{font-size:12px;color:var(--tx3)}
.log-score{color:var(--accent);font-family:var(--mono)}

/* 卡片与列表 */
.log-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.log-head{flex-wrap:wrap;row-gap:5px;padding-right:22px}
.log-time{margin-left:auto;white-space:nowrap}
.log-item:hover{border-color:var(--line2)}
.log-type.work{color:var(--info);border-color:rgba(109,140,255,.35)}
.log-type.fit{color:var(--good);border-color:rgba(95,211,160,.35)}
.log-type.life{color:var(--accent);border-color:rgba(61,220,191,.35)}
.tag{border-radius:4px;border-color:var(--line2);color:var(--tx2);font-family:var(--sans)}
.empty{border-radius:8px}
.chart-box,.my-lib,.quick-box,.today-box,.type-card,.cu-form{border-radius:10px;border-color:var(--line);background:var(--panel)}
.chart-box h3{font-family:var(--sans);font-size:14px;color:var(--tx);letter-spacing:.3px}
.ex-list{border-radius:8px;border-color:var(--line)}
.ex-item.on{background:rgba(61,220,191,.07);box-shadow:inset 2px 0 0 var(--accent)}
.sel-ex{background:rgba(61,220,191,.07);border-radius:6px;font-family:var(--sans)}
.stepper button{border-radius:6px;border-color:var(--line)}
.stepper button:hover{border-color:rgba(61,220,191,.55);color:var(--accent)}
.lib-chip{border-radius:5px;border-color:var(--line)}
.lib-chip.on{background:rgba(61,220,191,.08);border-color:rgba(61,220,191,.5);color:var(--accent)}
.ex-media{width:170px;height:170px}
.ex-gif{border-radius:8px}
.setting-sec h2{border-bottom:1px solid var(--line);color:var(--tx);font-family:var(--sans);letter-spacing:.3px}
.toast{background:#0C1218;border-color:rgba(61,220,191,.4);border-radius:8px;font-size:12.5px;box-shadow:0 12px 32px -12px rgba(0,0,0,.8)}
.footnote{border-top:1px solid var(--line);max-width:1340px;padding:20px 26px 40px;margin:36px auto 0}
.filter-bar input[type=date]{flex:0 0 148px;min-width:0;padding:8px 10px;font-family:var(--mono);font-size:12px}
.filter-bar .btn{flex:0 0 auto}
@media(max-width:640px){.filter-bar input[type=date]{flex:1 1 100%}}

/* 训练页双栏：满宽后放宽右栏 */
@media(min-width:1081px){.train-grid{grid-template-columns:minmax(0,1fr) 384px}}
  .brand{font-size:15px}
  .brand-sub{display:none}
  .steps{gap:0;overflow-x:auto;scrollbar-width:none;margin-left:auto;flex:1 1 auto;min-width:0;justify-content:flex-end}
  .step{flex:0 0 auto}
  .steps::-webkit-scrollbar{display:none}
  .step{padding:6px 8px;font-size:11.5px;gap:0;white-space:nowrap;border-radius:5px}
  .steps .step .n{display:none}
  .steps .step .lbl{display:inline!important}
}
@media(max-width:1080px){.train-grid{grid-template-columns:1fr}}
.train-side .quick-box .f-row{flex-direction:column;gap:8px}
.train-side .stepper{gap:6px}
.train-side .stepper input{width:auto;flex:1;min-width:0}
.train-side .stepper button{width:30px;height:30px;flex:0 0 auto}
.train-side .today-box .tr-sum{gap:14px}
.plan-in{gap:8px}
/* ===== 四页结构 ===== */
.zone-sep{display:flex;align-items:center;gap:14px;margin:36px 0 16px}
.zone-sep span{font-family:var(--mono);font-size:11px;letter-spacing:1.9px;color:var(--accent);white-space:nowrap}
.zone-sep:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rec-side .side-head{align-items:center;gap:10px}
.rec-side .side-head .btn{width:auto;padding:4px 10px;font-size:11.5px}
@media(max-width:900px){.zone-sep{margin:26px 0 12px;gap:10px}.page-title{font-size:22px}}
/* 记录页内嵌训练区：标题降级 + 最近记录卡片精简 */
.sub-zone .md h1{font-size:19px;letter-spacing:-.2px}
.sub-zone .md .kicker{margin-bottom:16px}
.sub-zone .md h2{margin-top:20px}
.rec-side .log-item .log-score,.rec-side .log-item .tag{display:none}
.rec-side .log-head{flex-wrap:nowrap;gap:8px}
.rec-side .log-time{margin-left:auto;flex:0 0 auto}
/* 训练区容器收缩（避免窄屏溢出） */
.train-grid>div{min-width:0}
@media(max-width:1080px){.train-grid{grid-template-columns:minmax(0,1fr)}}
.sub-zone .md{max-width:100%}
/* 窄屏搜索栏：输入框独占一行（覆盖前面的 flex:1） */
@media(max-width:600px){
  .train-search{flex-wrap:wrap}
  .train-search input{flex:1 1 100%;min-width:0}
  .train-search select{flex:1 1 calc(50% - 5px);min-width:0}
}
/* 记录页训练区：列表高度对齐右侧卡片，消除左列空白 */
@media(min-width:1081px){.sub-zone .ex-list{max-height:600px}}
/* iOS 全屏与刘海安全区 */
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.backup-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.imp-area{width:100%;min-height:96px;margin-top:10px;background:var(--panel2);color:var(--tx);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.imp-area[hidden]{display:none}
.backup-msg{margin-top:8px;font-size:13px;color:var(--tx2)}
.cloud-grid{display:grid;gap:8px;margin-top:12px}
.cloud-grid input{width:100%}

/* ===== 移动端记录页：分段导航 + 精简层级 + 交互动画 ===== */
.m-seg,.m-guide{display:none}
#recLogWrap[hidden],#recTrainWrap[hidden],.m-guide[hidden]{display:none!important}
@keyframes segIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes toastUp{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes popBtn{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
.btn,.m-seg-btn,.stepper button{transition:transform .16s ease,box-shadow .24s ease,border-color .2s ease,color .2s ease,background .2s ease}
.btn:active,.m-seg-btn:active,.stepper button:active{transform:scale(.975)}
.btn.done{animation:popBtn .5s ease}
.toast{animation:toastUp .34s cubic-bezier(.2,.9,.25,1) both}
@media(max-width:640px){
  .m-seg{display:flex;position:relative;padding:4px;margin:2px 0 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.02);overflow:hidden}
  .m-seg-ink{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:999px;background:linear-gradient(135deg,rgba(61,220,191,.24),rgba(61,220,191,.06));border:1px solid rgba(61,220,191,.45);transition:transform .42s cubic-bezier(.22,.9,.25,1);pointer-events:none}
  .m-seg-ink.right{transform:translateX(100%)}
  .m-seg-btn{flex:1;position:relative;z-index:1;background:none;border:none;color:var(--tx3);font:inherit;font-size:13px;padding:9px 0;border-radius:999px;cursor:pointer}
  .m-seg-btn.on{color:var(--accent);font-weight:600}
  .m-guide{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tx3);margin:-2px 0 12px;letter-spacing:.2px}
  .m-guide i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--accent);border:1px solid rgba(61,220,191,.4);background:rgba(61,220,191,.07)}
  .m-guide s{text-decoration:none;color:#3a3d44}
  .panel-in{animation:segIn .38s cubic-bezier(.22,.9,.25,1) both}
  #reportBody h1{font-size:19px;margin:2px 0 6px}
  #reportBody .kicker{display:none}
  #reportBody>.hint{display:none}
  .ex-list{max-height:42vh}
  .today-box,.quick-box{padding:13px;margin-bottom:12px;border-radius:12px;animation:segIn .45s cubic-bezier(.22,.9,.25,1) both}
  .zone-sep{margin:18px 0 10px}
  .train-side .today-box:nth-child(2){animation-delay:.04s}
  .train-side .today-box:nth-child(3){animation-delay:.08s}
  .train-side .today-box:nth-child(4){animation-delay:.12s}
  .tr-sum b{font-variant-numeric:tabular-nums}
  .sel-ex{animation:popIn .4s ease both}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

@media(max-width:640px){
  #reportBody>h1{display:none}

  .train-side .quick-box{order:2}
  .train-side .today-box:nth-child(1){order:3}
  .train-side .today-box:nth-child(4){order:4}
  #trChart{max-height:150px;overflow:hidden}
  .my-empty{font-size:11.5px;line-height:1.5}
  .my-hot{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .my-hot .lib-chip{padding:6px 11px;font-size:12.5px}

}

@media(max-width:640px){

  .quick-box:not(.ready) .tr-actions,
  .quick-box:not(.ready) #trDetail{display:none}

.m-more-btn,.m-extra{display:none}
@media(min-width:641px){.m-extra{display:contents}}
@media(max-width:640px){
  .quick{flex-wrap:wrap}
  .m-more-btn{display:inline-flex}
  .m-extra{width:100%;display:none;gap:8px}
  .m-extra.open{display:flex;animation:segIn .3s ease both}
}

/* ===== 一句话快记 / 标签 chips / 情绪刻度 ===== */
.fast-box{background:linear-gradient(180deg,rgba(61,220,191,.06),rgba(61,220,191,0));border:1px solid rgba(61,220,191,.28);border-radius:12px;padding:12px;margin-bottom:14px}
.fast-box textarea{width:100%;min-height:64px;resize:vertical;background:transparent;border:none;color:var(--tx);font:15px/1.6 inherit;padding:0;outline:none}
.fast-box textarea::placeholder{color:var(--tx3)}
.fast-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.fast-hint{font-size:11.5px;color:var(--tx3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--tx2);font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:border-color .18s,color .18s,background .18s,transform .16s}
.chip:hover{border-color:rgba(61,220,191,.5);color:var(--tx)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(61,220,191,.1)}
.chip-none{font-size:11.5px;color:var(--tx3)}
.mood-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--tx3);margin-top:2px;padding:0 2px}
.mood-scale s{text-decoration:none;opacity:.7}
.quick-line{display:flex;gap:8px}
.quick-line input{flex:1;min-width:0}
.toast.nudge{bottom:78px;display:flex;align-items:center;gap:10px}
.toast.nudge button{background:none;border:1px solid rgba(61,220,191,.5);color:var(--accent);border-radius:999px;font:inherit;font-size:12px;padding:4px 10px;cursor:pointer}

.quick-line .btn{flex:0 0 auto;white-space:nowrap}
.log-detail summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--tx3);padding:6px 0 2px;display:flex;align-items:center;gap:6px}
.log-detail summary::-webkit-details-marker{display:none}
.log-detail summary::before{content:'+';display:inline-flex;width:15px;height:15px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;font-size:11px;color:var(--accent)}
.log-detail[open] summary::before{content:'−'}
.log-detail summary:hover{color:var(--tx2)}
@media(max-width:640px){.log-detail[open] summary{padding-bottom:8px}}

/* ===== 画像首屏摘要卡 ===== */
.brief{display:grid;gap:10px;margin:4px 0 16px}
.brief .brief-card{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.brief-k{font-size:12px;color:var(--tx3);grid-column:1}
.brief-v{grid-column:2;grid-row:1/3;font-size:22px;color:var(--tx);font-weight:600;letter-spacing:-.4px}
.brief-v em{font-style:normal;font-size:12px;color:var(--tx3);font-weight:400;margin-left:2px}
.brief-s{grid-column:1;font-size:11.5px;color:var(--tx2)}
.brief-signal{font-size:12.5px;color:var(--tx2);border-left:2px solid rgba(61,220,191,.6);padding:6px 0 6px 10px;background:rgba(61,220,191,.04);border-radius:0 6px 6px 0}
.report-fold summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin:4px 0 14px;transition:border-color .2s,color .2s}
.report-fold summary::-webkit-details-marker{display:none}
.report-fold summary:hover{border-color:rgba(61,220,191,.5);color:var(--tx)}
.report-fold[open] summary{color:var(--accent);border-color:rgba(61,220,191,.5)}
@media(min-width:900px){.brief{grid-template-columns:repeat(3,1fr)}.brief-signal{grid-column:1/-1}}

/* ===== 移动端底部 tab 栏 ===== */
.m-tabbar{display:none}
@media(max-width:640px){
  .m-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(10,12,15,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:5px 0 calc(5px + env(safe-area-inset-bottom))}
  .m-tabbar button{position:relative;flex:1;background:none;border:none;color:#8593A6;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 5px;cursor:pointer;transition:color .18s,-webkit-tap-highlight-color .18s}
  .m-tabbar button .ti{width:23px;height:23px;display:block;opacity:.74;transition:opacity .18s ease,transform .18s ease,color .18s ease}
  .m-tabbar button .tl{font-size:11px;letter-spacing:.01em;line-height:1.2;transition:color .18s,font-weight .18s}
  .m-tabbar button:before{content:"";position:absolute;top:0;left:50%;width:18px;height:2px;border-radius:2px;background:var(--accent);transform:translateX(-50%) scaleX(0);transform-origin:center;transition:transform .24s ease;opacity:.9}
  .m-tabbar button.on{color:var(--accent)}
  .m-tabbar button.on .ti{opacity:1;transform:translateY(-1px)}
  .m-tabbar button.on .tl{font-weight:600}
  .m-tabbar button.on:before{transform:translateX(-50%) scaleX(1)}
  .m-tabbar button:active .ti{transform:scale(.92)}
  nav.steps{display:none!important}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
}

/* ===== 日志改日期 ===== */
.log-time{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.22);padding-bottom:1px}
.log-time:hover{color:var(--tx)}
.log-time i{font-style:normal;font-size:10px;opacity:.55;margin-left:3px;letter-spacing:0}
.log-date{background:rgba(255,255,255,.04);border:1px solid var(--accent);color:var(--tx);font:inherit;font-size:12px;border-radius:6px;padding:2px 6px;color-scheme:dark;width:auto;max-width:132px}

/* ===== 首页仪表板 ===== */
.page-home .home-wrap{max-width:1080px;margin:0 auto}
.home-today{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin:16px 0 18px}
@media(min-width:900px){.home-today{grid-template-columns:repeat(4,1fr)}}
.hc{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.hc-k{display:block;font-size:11.5px;color:var(--tx3)}
.hc-v{display:block;font-size:26px;font-weight:600;color:var(--tx);letter-spacing:-.6px;margin-top:5px}
.hc-v em{font-style:normal;font-size:11.5px;color:var(--tx3);font-weight:400;margin-left:4px;letter-spacing:0}
.home-hm{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:16px}
.hm-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--tx3);margin-bottom:11px}
.hm-legend{display:flex;align-items:center;gap:4px}
.hm-legend i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.06);display:block}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:2px}
.hm i{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.05);display:block;transition:transform .15s}
.hm i:hover{transform:scale(1.18)}
.hm i[data-l="1"],.hm-legend i[data-l="1"]{background:rgba(61,220,191,.24)}
.hm i[data-l="2"],.hm-legend i[data-l="2"]{background:rgba(61,220,191,.42)}
.hm i[data-l="3"],.hm-legend i[data-l="3"]{background:rgba(61,220,191,.62)}
.hm i[data-l="4"],.hm-legend i[data-l="4"]{background:rgba(61,220,191,.86)}
.home-signals{display:grid;gap:8px;margin-bottom:18px}
.sig{font-size:12.5px;color:var(--tx2);background:rgba(255,255,255,.02);border:1px solid var(--line);border-left:2px solid rgba(61,220,191,.55);border-radius:10px;padding:10px 12px}
.sig.warn{border-left-color:var(--risk);color:var(--tx)}
.home-actions{display:flex;gap:10px}

/* ===== 训练 +1 组 ===== */
.tr-plus{background:rgba(61,220,191,.1);border:1px solid rgba(61,220,191,.45);color:var(--accent);font:inherit;font-size:11.5px;border-radius:999px;padding:3px 9px;cursor:pointer;margin-right:6px;white-space:nowrap}
.tr-plus:active{transform:scale(.95)}

/* ===== 报告图表 / 溯源 / 下钻 / 快记工具 ===== */
.rpt-charts{display:grid;gap:10px;margin:4px 0 14px}
@media(min-width:900px){.rpt-charts{grid-template-columns:1fr 1fr}}
.rpt-chart{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px}
.rc-title{font-size:11.5px;color:var(--tx3);margin-bottom:6px}
.rc-canvas{height:132px}
.ev-list{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:6px}
.ev-list li{display:grid;grid-template-columns:88px 1fr;gap:2px 10px;font-size:12px;color:var(--tx2);border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:6px}
.ev-t{color:var(--tx3);font-size:11px}
.ev-c{color:var(--tx)}
.ev-w{grid-column:2;font-size:11px;color:rgba(61,220,191,.85)}
.ev-w.none{color:var(--tx3)}
.day-detail{margin-top:8px}
.dd-head{font-size:11.5px;color:var(--tx3);margin-bottom:6px}
.dd-row{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.dd-row.muted{color:var(--tx3)}
.fast-right{display:flex;align-items:center;gap:8px}
.ybtn{background:none;border:1px solid var(--line);color:var(--tx3);font:inherit;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ybtn.on{border-color:var(--accent);color:var(--accent);background:rgba(61,220,191,.1)}
.fast-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fast-chips .chip{font-size:11.5px;padding:4px 10px}

/* ===== 里程碑弹层 ===== */
.milestone{position:fixed;inset:0;z-index:120;background:rgba(6,8,10,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px}
.ms-inner{background:#0d1216;border:1px solid rgba(61,220,191,.45);border-radius:16px;padding:26px 24px;text-align:center;max-width:300px;box-shadow:0 20px 60px -20px rgba(0,0,0,.9)}
.ms-num{font-size:52px;font-weight:700;color:var(--accent);letter-spacing:-2px;line-height:1}
.ms-t{font-size:15px;color:var(--tx);margin:8px 0 4px}
.ms-s{font-size:12px;color:var(--tx3);margin-bottom:16px}

/* ===== 全局悬浮快记 ===== */
.fab{position:fixed;right:18px;bottom:24px;z-index:90;width:48px;height:48px;border-radius:50%;
display:flex;align-items:center;justify-content:center;cursor:pointer;color:#06110f;
background:var(--accent);box-shadow:0 10px 26px -8px rgba(61,220,191,.6);transition:transform .18s ease}
.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab-sheet{position:fixed;inset:0;z-index:110;background:rgba(6,8,10,.6);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;padding:16px}
.fab-sheet.on{display:flex}
.fab-inner{width:100%;max-width:520px;background:#0d1216;border:1px solid var(--line);border-radius:14px;padding:14px}
.fab-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--tx3);margin-bottom:8px}
.fab-x{background:none;border:0;color:var(--tx3);font-size:18px;cursor:pointer;line-height:1}
.fab-bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px}
@media(max-width:760px){.fab{bottom:86px}}

.rc-empty{height:132px;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--tx3);text-align:center;padding:0 12px}

/* ===== 动作库：选择器化 ===== */
.ex-item{position:relative;padding-right:86px}
.ex-quick{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:1px solid rgba(61,220,191,.5);color:var(--accent);font:inherit;font-size:11.5px;padding:5px 9px;border-radius:999px;cursor:pointer;opacity:.5;transition:opacity .16s,background .16s}
.ex-item:hover .ex-quick{opacity:1}
.ex-quick:hover{background:rgba(61,220,191,.14)}
@media(max-width:760px){.ex-quick{opacity:1}}
.ex-sub{display:flex;gap:8px;align-items:baseline}
.ex-last{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.ex-last.none{color:var(--tx3)}
.ex-ago{font-size:11px;color:var(--tx3)}
.lib-chip.picked{background:rgba(61,220,191,.16);border-color:var(--accent);color:var(--accent)}
/* ===== 三档功能色 ===== */
#reportBody[data-tone="info"] h1{color:#C9D6FF}
#reportBody[data-tone="info"] .kicker{color:#8FA4FF}
#reportBody[data-tone="info"] .btn{background:var(--info,#6D8CFF);color:#0b1020;border-color:transparent}
#reportBody[data-tone="info"] .btn.ghost{background:none;color:#A9BDFF;border-color:rgba(109,140,255,.42)}
#reportBody[data-tone="info"] .hc-v,#reportBody[data-tone="info"] .stat-v{color:#C9D6FF}
#reportBody[data-tone="info"] .h-title{color:#B8C8FF}
.btn.danger{color:#F06A5A}
.btn.danger:hover{border-color:rgba(240,106,90,.6);background:rgba(240,106,90,.1)}

/* ===== 筛选 chips ===== */
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--tx3);font:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.fchip.on{border-color:var(--accent);color:var(--accent);background:rgba(61,220,191,.12)}
/* ===== 重量 stepper ===== */
.stepper.grow{display:grid;grid-template-columns:38px 1fr 38px}
.stepper.grow input{min-width:0}
/* ===== 数字层级：数据数字用等宽 + 更大字号 ===== */
.tr-sum b,.tr-sum .num,.hc-v,.stat-v,.log-score b{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tr-sum{font-size:12px;color:var(--tx3)}
.tr-sum b{font-size:16px;color:var(--tx);font-weight:600}
/* ===== 动作详情抽屉（移动端） ===== */
.ex-sheet{position:fixed;inset:0;z-index:115;background:rgba(6,8,10,.6);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px}
.ex-sheet.on{display:flex}
.ex-sheet-inner{width:min(92vw,356px);max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 18px}.ex-sheet.plan-sheet{align-items:flex-end;justify-content:center}.ex-sheet.plan-sheet .ex-sheet-inner{width:100%;max-height:78vh;border-radius:16px 16px 0 0}
.ex-sheet-bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--tx3);margin-bottom:10px;position:sticky;top:-14px;background:var(--panel);padding:6px 0}
.ex-sheet-x{background:none;border:0;color:var(--tx3);font-size:22px;line-height:1;cursor:pointer}
.ex-dt-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.ex-dt-name{font-size:16px;color:var(--tx);font-weight:600}
.ex-dt-meta{font-size:11.5px;color:var(--tx3)}
.ex-my-last{font-size:12px;color:var(--accent);margin-bottom:10px}
.ex-my-last.none{color:var(--tx3)}

/* ===== 情绪色带 ===== */
#logMood,#eMood{-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;
background:linear-gradient(90deg,#F06A5A 0%,#F2B45C 46%,#5FD3A0 100%)}
#logMood::-webkit-slider-thumb,#eMood::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
background:#0d1216;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#logMood::-moz-range-thumb,#eMood::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#0d1216;border:2px solid #fff}
/* ===== 搜索联想 ===== */
.search-wrap{position:relative}
.search-sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none}
.search-sug.on{display:block}
.sug-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:12.5px;cursor:pointer}
.sug-item.on,.sug-item:hover{background:rgba(61,220,191,.12)}
.sug-item.muted{color:var(--tx3);cursor:default}
.sug-n{color:var(--tx)}
.sug-m{color:var(--tx3);font-size:11px}
/* ===== 触控目标 ===== */
.tag button,.lib-chip,.ex-item button{min-width:30px;min-height:30px;display:inline-flex;align-items:center;justify-content:center}
.log-item .edit-actions .btn{min-height:34px;padding:0 12px}

/* ===== 分析页整体换信息色 ===== */
#pageAgent[data-tone="info"] h1{color:#C9D6FF}
#pageAgent[data-tone="info"] .kicker{color:#8FA4FF}
#pageAgent[data-tone="info"] .btn{background:#6D8CFF;color:#0b1020;border-color:transparent}
#pageAgent[data-tone="info"] .btn.ghost{background:none;color:#A9BDFF;border-color:rgba(109,140,255,.42)}
#pageAgent[data-tone="info"] .tab.on{color:#A9BDFF;border-color:#6D8CFF}
#pageAgent[data-tone="info"] .hc-v,#pageAgent[data-tone="info"] .stat-v{color:#C9D6FF}
#pageAgent[data-tone="info"] .h-title{color:#B8C8FF}
#pageAgent[data-tone="info"] .seg button.on{color:#A9BDFF;border-color:#6D8CFF}

#pageAgent[data-tone="info"] .page-title{color:#C9D6FF}
#pageAgent[data-tone="info"] .eyebrow{color:#8FA4FF}
#pageAgent[data-tone="info"] .page-desc{color:#8b93a6}
#pageAgent[data-tone="info"] .tab.on{color:#A9BDFF;border-color:#6D8CFF;background:rgba(109,140,255,.1)}

/* ===== 排序标签 ===== */
.chip-label{font-size:11px;color:var(--tx3);align-self:center;margin-right:2px}
/* ===== 今日行内微调 ===== */
.tr-row{flex-wrap:wrap;gap:6px}
.tr-detail{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12px}
.tr-detail em{font-style:normal;color:var(--tx3);font-size:11px;margin-right:2px}
.tr-detail b.num{font-variant-numeric:tabular-nums;color:var(--tx);min-width:14px;text-align:center;font-weight:600}
.mini{background:none;border:1px solid var(--line2);color:var(--tx2);width:22px;height:22px;line-height:1;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini:active{background:rgba(61,220,191,.14)}
/* ===== 训练小结卡 ===== */
.sum-card{position:fixed;inset:0;z-index:120;background:rgba(6,8,10,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.sum-inner{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:20px}
.sum-h{font-size:12px;color:var(--tx3);letter-spacing:.4px;margin-bottom:14px}
.sum-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin-bottom:14px}
.sum-grid div{display:flex;flex-direction:column;gap:3px}
.sum-grid b{font-size:22px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum-grid span{font-size:10.5px;color:var(--tx3)}
.sum-pr{font-size:12px;color:var(--accent);margin-bottom:6px}
.sum-cmp{font-size:12px;color:var(--tx2);margin-bottom:6px}
.sum-parts{font-size:11.5px;color:var(--tx3);margin-bottom:16px}
.sum-close{width:100%;justify-content:center}
/* ===== 恢复提示 ===== */
.plan-recovery{font-size:11.5px;color:var(--tx3);margin:2px 0 8px}
.plan-recovery.warn{color:var(--risk)}
/* ===== 情绪/精力色语义 ===== */
.log-score.tone-risk{color:var(--risk)}
.log-score.tone-mid{color:var(--tx3)}
.log-score.tone-good{color:var(--good)}
/* ===== 滑条进度 ===== */
#logScore,#eScore{-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;
background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.09) var(--p,50%))}
#logMood,#eMood{-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;
background:linear-gradient(90deg,#F06A5A 0%,#F2B45C 46%,#5FD3A0 100%) 0/var(--p,50%) 100% no-repeat,rgba(255,255,255,.07)}
#logScore::-webkit-slider-thumb,#eScore::-webkit-slider-thumb,
#logMood::-webkit-slider-thumb,#eMood::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
background:var(--panel);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
/* ===== 触控目标 ===== */
.tag button{min-width:32px;min-height:32px}
.log-del{min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
/* ===== GIF 骨架屏 ===== */
.gif-ph{background:linear-gradient(100deg,rgba(255,255,255,.04) 20%,rgba(255,255,255,.12) 40%,rgba(255,255,255,.04) 60%);background-size:220% 100%;
animation:skel 1.4s ease-in-out infinite;color:transparent;position:relative}
.gif-ph::after{content:'动画加载中';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px}
@keyframes skel{0%{background-position:120% 0}100%{background-position:-40% 0}}
/* ===== 浅色主题（跟随系统） ===== */
.theme-btn{margin-left:auto;flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--panel2);color:var(--tx2);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s}
.theme-btn:hover{color:var(--accent);border-color:rgba(61,220,191,.35)}
.theme-btn:active{transform:scale(.94)}
.theme-btn svg{width:18px;height:18px;display:block}
html[data-theme="light"] .theme-btn{background:#fff}
html[data-theme="light"] .theme-btn:hover{border-color:rgba(15,158,134,.45)}
html[data-theme="light"] .i-sun{display:none}
html:not([data-theme="light"]) .i-moon{display:none}

/* ===== 更多折叠：所有断点生效 ===== */
.m-more-btn{display:inline-flex}
.m-extra{display:none;gap:8px;width:100%;flex-wrap:wrap}
.m-extra.open{display:flex}
/* ===== 未选动作时收起表单（所有断点） ===== */
.quick-box:not(.ready) #trFormBox,
.quick-box:not(.ready) #trDetail{display:none}
.quick-box:not(.ready) .sel-ex{margin-bottom:0;cursor:pointer}
/* ===== chips 行不被压缩 ===== */
.chip-label{flex:0 0 auto;white-space:nowrap}
.fchip{flex:0 0 auto;white-space:nowrap}
#trSortRow{flex-wrap:wrap;overflow:visible}
/* ===== ＋记一组 完成态 ===== */
.ex-quick.done{background:rgba(61,220,191,.2);border-color:var(--accent);color:var(--accent);opacity:1}
/* ===== 今日徽标 ===== */
.today-badge{display:inline-flex;align-items:center;margin-left:8px;padding:1px 8px;border-radius:999px;
border:1px solid rgba(61,220,191,.4);color:var(--accent);font-size:11px;font-variant-numeric:tabular-nums}
.today-badge:empty{display:none}
/* ===== chip 收藏星 ===== */
.lib-chip{display:inline-flex;align-items:center;gap:4px}
.chip-star{background:none;border:0;padding:0;width:20px;height:20px;color:var(--tx3);font-size:13px;line-height:1;cursor:pointer;flex:0 0 auto}
.chip-star:hover{color:var(--accent)}
.chip-nm{white-space:nowrap}

/* ===== 组级卡片 ===== */
.set-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.02);animation:segIn .25s ease both}
.set-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.set-head .nm{font-weight:600;font-size:14px}
.set-head .meta{flex:1;font-size:11px;color:var(--tx3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-x{width:26px;height:26px;flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--tx3);border-radius:8px;font-size:14px;cursor:pointer}
.set-x:hover{color:var(--risk);border-color:var(--risk)}
.set-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px dashed rgba(255,255,255,.06)}
.set-row.done{opacity:.72}
.set-tick{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:none;color:var(--tx3);font-size:12px;cursor:pointer;transition:all .18s ease}
.set-tick.done{background:var(--accent);border-color:var(--accent);color:#04231d;font-weight:700}
.set-val{min-width:96px;font-size:14px;font-variant-numeric:tabular-nums}
.set-edit{display:flex;gap:6px;flex:0 0 auto}
.edit-grp{display:inline-flex;align-items:center;gap:2px;padding:1px 4px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.edit-grp i{font-style:normal;font-size:9px;color:var(--tx3);margin-right:1px}
.mini{width:22px;height:26px;border:1px solid var(--line);background:none;color:var(--tx2);border-radius:6px;font-size:11px;cursor:pointer}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.rpe-set{display:flex;gap:4px;margin-left:auto;flex:0 0 auto}
.rpe-dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;padding:0;transition:all .15s ease}
.rpe-dot.on.easy{background:#5fd3a0;border-color:#5fd3a0}
.rpe-dot.on.ok{background:#e7c56a;border-color:#e7c56a}
.rpe-dot.on.hard{background:#f06a5a;border-color:#f06a5a}
.set-foot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.tr-plus{border:1px solid rgba(61,220,191,.35);background:rgba(61,220,191,.08);color:var(--accent);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.mini-text{border:0;background:none;color:var(--tx3);font-size:11px;cursor:pointer;text-decoration:underline}
.wchips{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.wchip{border:1px solid var(--line);background:none;color:var(--tx2);border-radius:999px;padding:2px 8px;font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums}
.wchip:hover{border-color:var(--accent);color:var(--accent)}
/* ===== 休息倒计时 ===== */
.rest{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(4,7,9,.94);backdrop-filter:blur(6px);animation:fadeIn .2s ease both}
.rest-box{text-align:center;color:var(--tx1);padding:24px}
.rest-ring{position:relative;width:176px;height:176px;border-radius:50%;margin:0 auto 18px;
background:conic-gradient(var(--accent) var(--deg,0deg),rgba(255,255,255,.09) 0);display:grid;place-items:center}
.rest-ring::before{content:'';position:absolute;inset:7px;border-radius:50%;background:#080c0f}
.rest-ring span{position:relative;font-size:46px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.rest-lbl{font-size:12px;color:var(--tx3);letter-spacing:3px;margin-bottom:6px}
.rest-next{font-size:15px;color:var(--tx2);margin-bottom:18px}
.rest-btns{display:flex;gap:8px;justify-content:center}
.rest-cfg{margin-top:16px;font-size:11px;color:var(--tx3)}
.rest-cfg span{margin-left:8px;cursor:pointer;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.rest-cfg span.on{color:var(--accent);border-color:rgba(61,220,191,.4)}
.rest.alarm{background:rgba(61,220,191,.14);animation:alarmPulse 1s ease 3 both}
.rest-alarm{font-size:26px;font-weight:600;color:var(--accent);margin-bottom:10px}
@keyframes alarmPulse{0%,100%{background:rgba(61,220,191,.10)}50%{background:rgba(61,220,191,.28)}}
.toast.undo{display:flex;gap:10px;align-items:center}
.toast.undo button{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer;text-decoration:underline}

/* ===== 组数值可点 ===== */
.set-val{border:0;background:none;color:inherit;text-align:left;padding:0;min-width:96px;font-size:14px;
font-variant-numeric:tabular-nums;cursor:pointer;border-bottom:1px dashed transparent}
.set-val:hover{border-bottom-color:rgba(61,220,191,.5);color:var(--accent)}
.wchip.setw{border-style:dashed;color:var(--accent);border-color:rgba(61,220,191,.5)}
/* ===== 组参数浮层 ===== */
.msheet{position:fixed;inset:0;z-index:9998;display:flex;align-items:flex-end;justify-content:center;
background:rgba(4,7,9,.6);backdrop-filter:blur(3px);animation:fadeIn .18s ease both}
.msheet-box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;
padding:18px 18px 22px;animation:sheetUp .26s cubic-bezier(.22,.9,.25,1) both}
.ms-title{font-size:14px;font-weight:600;margin-bottom:14px}
.ms-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ms-row label{width:64px;font-size:12px;color:var(--tx3)}
.ms-row input{flex:1;background:var(--bg2,rgba(255,255,255,.04));border:1px solid var(--line);border-radius:10px;
color:var(--tx1);padding:9px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.ms-all{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);margin:14px 0}
.ms-btns{display:flex;gap:10px;justify-content:flex-end}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ===== 休息 pill / 全屏 ===== */
.rest.pill{inset:auto;position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:700;
display:flex;align-items:center;gap:10px;padding:9px 12px 9px 9px;border-radius:999px;
background:var(--panel);border:1px solid rgba(61,220,191,.35);box-shadow:0 8px 28px rgba(0,0,0,.5);cursor:pointer;
animation:pillIn .26s cubic-bezier(.22,.9,.25,1) both}
.rest.pill .pill-ring{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
background:conic-gradient(var(--accent) var(--deg,0deg),rgba(255,255,255,.09) 0);display:grid;place-items:center;position:relative}
.rest.pill .pill-ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--panel)}
.rest.pill .pill-body{display:flex;flex-direction:column;line-height:1.2}
.rest.pill .pill-num{font-size:16px;font-variant-numeric:tabular-nums}
.rest.pill .pill-body small{font-size:10px;color:var(--tx3)}
.rest.pill .pill-x{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--tx3);cursor:pointer;font-size:12px}
.rest.full{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(4,7,9,.94);backdrop-filter:blur(6px)}
.rest.alarm{background:rgba(61,220,191,.14);animation:alarmPulse 1s ease 3 both}
@keyframes pillIn{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* ===== 打勾热区与 pop ===== */
.set-tick{width:44px;height:44px;font-size:13px}
@keyframes tickPop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.set-tick.done{animation:tickPop .28s cubic-bezier(.22,.9,.25,1)}
/* ===== 下一组聚焦 ===== */
.set-row.focus,.set-card.focus{animation:focusPulse 1.2s ease 2 both;border-radius:10px}
@keyframes focusPulse{0%,100%{box-shadow:0 0 0 0 rgba(61,220,191,0)}50%{box-shadow:0 0 0 3px rgba(61,220,191,.35)}}

/* ===== 专注训练 ===== */
.focus-mode{position:fixed;inset:0;z-index:6000;background:#080b0e;display:flex;flex-direction:column;
padding:16px 18px 22px;animation:fadeIn .2s ease both}
.fm-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx3)}
.fm-x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx2);font-size:16px;cursor:pointer}
.fm-name{font-size:30px;font-weight:600;letter-spacing:-.5px;margin:12px 0 4px;line-height:1.15}
.fm-sub{font-size:12px;color:var(--tx3);margin-bottom:16px}
.fm-sets{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.fm-row{display:flex;align-items:center;gap:14px;flex:0 0 auto;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
.fm-row.done{opacity:.55}
.fm-tick{width:56px;height:56px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--tx3);font-size:15px;cursor:pointer}
.fm-tick.done{background:var(--accent);border-color:var(--accent);color:#04231d;font-weight:700;animation:tickPop .28s cubic-bezier(.22,.9,.25,1)}
.fm-val{font-size:22px;font-variant-numeric:tabular-nums;flex:1}
.fm-edit{display:flex;gap:4px}
.fm-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.fm-foot .btn[disabled]{opacity:.35;pointer-events:none}
.fm-foot .btn,.fm-more .btn{width:100%;height:44px;padding:0 10px;font-size:13px;justify-content:center;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest.pill{z-index:6500}
.trStat .stale{color:#e7c56a}
#trStat .stale b{color:#e7c56a}

/* ===== 首页训练圆心按钮 ===== */
.orb-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;margin:4px 0 20px}
.orb{position:relative;width:134px;height:134px;border-radius:50%;border:0;cursor:pointer;
background:radial-gradient(circle at 50% 38%,rgba(61,220,191,.16),rgba(61,220,191,.02) 70%);
color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
transition:transform .18s ease,box-shadow .18s ease}
.orb:active{transform:scale(.965)}
.orb:hover{box-shadow:0 0 0 1px rgba(61,220,191,.25),0 10px 28px rgba(0,0,0,.35)}
.orb-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.orb-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:6}
.orb-arc{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .45s ease}
.orb.done .orb-arc{stroke:#e7c56a}
.orb-k{font-size:11px;color:var(--tx3);letter-spacing:.02em}
.orb-t{font-size:17px;font-weight:600;letter-spacing:-.2px}
.orb-sub{font-size:11.5px;color:var(--tx3);text-align:center}
/* ===== 专注主题 ===== */
.focus-mode[data-theme="focus"]{--accent:#5cf5d6}
.fm-progress{position:absolute;left:0;top:0;height:2px;width:100%;background:rgba(255,255,255,.06);border-radius:0 0 2px 0}
.fm-progress i{display:block;height:100%;background:var(--accent);transition:width .35s ease;border-radius:0 2px 2px 0}
.fm-x.armed{width:auto;padding:0 10px;font-size:12px;color:#f06a5a;border-color:rgba(240,106,90,.5)}
.fm-more{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.fm-add{position:fixed;inset:0;z-index:6800;background:rgba(4,6,8,.72);backdrop-filter:blur(4px);display:none;align-items:flex-end}
.fm-add.on{display:flex}
.fm-add-inner{width:100%;max-height:72vh;overflow:auto;background:var(--panel);border-top-left-radius:16px;border-top-right-radius:16px;padding:14px 16px 22px}
.fm-add-bar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--tx3);margin-bottom:10px}
.fm-add-bar input{width:100%;margin-bottom:10px}
#fmAddQ{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);font-size:13px}
.fm-add-list{display:flex;flex-direction:column;gap:6px}
.fm-add-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--tx);cursor:pointer;text-align:left}
.fm-add-item:hover{border-color:rgba(61,220,191,.45)}
.fm-add-item em{font-style:normal;font-size:11px;color:var(--tx3)}
.fm-add-empty{font-size:12px;color:var(--tx3);padding:12px 0;text-align:center}

/* 专注模式：动作预览条 / 加组 / 用时 */
.fm-strip{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.fm-strip::-webkit-scrollbar{display:none}
.fm-chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx2);font-size:11.5px;cursor:pointer;white-space:nowrap}
.fm-chip em{font-style:normal;color:var(--tx3)}
.fm-chip.on{border-color:var(--accent);color:var(--tx);background:rgba(61,220,191,.1)}
.fm-chip.on em{color:var(--accent)}
.fm-chip.done{opacity:.55}
.fm-val i{font-style:normal;font-size:11px;color:var(--tx3);margin-left:5px}
.fm-setadd{display:flex;justify-content:center;margin-top:10px}
.fm-edit .fm-kg{width:auto;padding:0 5px;font-size:10px;color:var(--tx3)}

/* ===== 身体图 ===== */
.bodymap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 2px}
.bm-cell{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:9px;
border:1px solid var(--line);background:rgba(255,255,255,.02);cursor:pointer;color:var(--tx)}
.bm-cell b{font-weight:600;font-size:13px;white-space:nowrap}
.bm-cell em{font-style:normal;font-size:10px;color:var(--tx3);white-space:nowrap}
.bm-cell.ok{border-color:rgba(61,220,191,.35);background:rgba(61,220,191,.05)}
.bm-cell.ok b{color:var(--accent)}
.bm-cell.resting{border-color:rgba(231,197,106,.4);background:rgba(231,197,106,.06)}
.bm-cell.resting b,.bm-cell.resting em{color:#e7c56a}
.bm-cell.done{border-color:var(--line);background:rgba(255,255,255,.015);opacity:.62}
.fm-hold-wrap{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.fm-hold-btn{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid rgba(92,245,214,.4);
background:rgba(92,245,214,.07);color:var(--accent);font:inherit;font-size:15px;font-weight:600;cursor:pointer;
transition:background .18s,border-color .18s,color .18s}
.fm-hold-btn b{font-variant-numeric:tabular-nums;font-size:17px;margin:0 2px}
.fm-hold-btn.is-all-done{min-height:48px;border-color:rgba(62,196,120,.4);background:rgba(62,196,120,.1);color:#7fe0a7;cursor:default}
.fm-hold-btn.on{background:rgba(242,193,78,.16);color:#f2c14e;border-color:rgba(242,193,78,.65);animation:fmBreath 1.6s ease-in-out infinite}
.fm-hold-tip{font-size:11px;color:var(--tx3);text-align:center}
/* 运动中：屏幕四周呼吸光环 */
.focus-mode::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .45s;
box-shadow:inset 0 0 46px 14px rgba(242,193,78,.16),inset 0 0 0 1.5px rgba(242,193,78,.42)}
.focus-mode.timing::after{opacity:1;animation:focusRing 2.6s ease-in-out infinite}
@keyframes focusRing{0%,100%{opacity:.42}50%{opacity:1}}

.fm-clock{border:1px solid var(--line);background:none;color:var(--tx3);border-radius:8px;padding:6px 9px;
font-size:11px;cursor:pointer;flex:0 0 auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.fm-clock.on{border-color:rgba(92,245,214,.55);background:rgba(92,245,214,.1);color:var(--accent)}

/* ===== p45 触控目标 / 窄屏组行 ===== */
.set-val{min-height:40px;min-width:104px;padding:8px 10px;font-size:14px}
.set-tick{width:40px;height:40px;font-size:13px}
.set-no{width:40px;height:40px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
 display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx3);background:none;user-select:none}
.set-no.done{border-color:rgba(61,220,191,.45);color:var(--accent);background:rgba(61,220,191,.10);font-weight:700}

.ms-copy{width:100%;min-height:40px;margin:2px 0 8px;border-radius:9px;border:1px dashed var(--line2);
 background:none;color:var(--tx2);font:inherit;font-size:12.5px;cursor:pointer}
.ms-copy:active{background:rgba(61,220,191,.08);color:var(--accent)}
.ld-dir{display:flex;gap:8px;margin:0 0 12px}
.ld-chip{flex:1;min-height:40px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--tx2);
 font:inherit;font-size:13px;cursor:pointer}
.ld-chip.on{border-color:rgba(61,220,191,.5);background:rgba(61,220,191,.10);color:var(--accent);font-weight:600}
.set-row{touch-action:pan-y}
html[data-theme="light"] .set-no.done{color:#0B7A68;border-color:rgba(14,143,122,.4);background:rgba(14,143,122,.07)}
.mini{width:36px;height:36px;font-size:12px}
.edit-grp{gap:4px;padding:2px 4px}
.set-edit{display:flex;gap:8px;flex-wrap:wrap}
.fm-edit{display:flex;gap:8px;flex-wrap:wrap}
.chip-star{width:32px;height:32px;font-size:15px}
.rpe-dot{width:16px;height:16px}
.fab-inner{max-height:80dvh;overflow:auto}
@media (max-width:430px){

  .rpe-set,.fm-clock{order:19}
  .fm-name{font-size:26px}
  .fm-sub{font-size:12px}
  .fm-row{gap:10px;padding:10px 11px}
  .fm-tick{width:48px;height:48px;font-size:14px}
  .fm-val{font-size:18px}
  .fm-val i{font-size:10px}

}
