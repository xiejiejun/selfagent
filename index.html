}

/* ===== p46 日志页承载 ===== */
.log-extra{display:grid;gap:14px;margin-top:14px}
@media (min-width:1000px){ .log-extra{grid-template-columns:1.1fr 1fr;align-items:start} }
.log-extra .rec-side{margin:0}
details.my-lib{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:0 10px}
details.my-lib>summary{list-style:none;cursor:pointer;padding:9px 0;display:flex;align-items:center;gap:8px}
details.my-lib>summary::-webkit-details-marker{display:none}
details.my-lib>summary:after{content:'▾';margin-left:auto;color:var(--tx3);font-size:11px}
details.my-lib[open]>summary:after{transform:rotate(180deg)}
details.my-lib>.my-empty,details.my-lib>.my-hot,details.my-lib>.lib-group{margin:6px 0}

/* ===== p46 专注组行：点击计时 + 左滑操作 ===== */
.fm-row{position:relative;overflow:hidden;transition:background .18s,box-shadow .18s}
.fm-row .fm-main{display:flex;align-items:center;gap:10px;width:100%;min-height:44px}
.fm-row.timing{background:rgba(232,178,58,.14);box-shadow:inset 0 0 0 1px rgba(232,178,58,.45);animation:fmBreath 1.5s ease-in-out infinite}
.fm-row.timing .fm-val,.fm-row.timing .fm-val i{color:#f2c14e}
.fm-row.done{background:rgba(62,196,120,.13);box-shadow:inset 0 0 0 1px rgba(62,196,120,.42)}
.fm-row.done .fm-val{color:#7fe0a7}
@keyframes fmBreath{0%,100%{box-shadow:inset 0 0 0 1px rgba(232,178,58,.45),0 0 0 0 rgba(232,178,58,0)}50%{box-shadow:inset 0 0 0 1px rgba(232,178,58,.9),0 0 0 5px rgba(232,178,58,.12)}}
.fm-side{position:absolute;top:0;right:0;height:100%;display:flex;align-items:center;gap:6px;padding:0 8px 0 26px;background:linear-gradient(90deg,rgba(8,11,14,0),rgba(8,11,14,.94) 22%);transform:translateX(105%);transition:transform .18s ease}
.fm-row.open .fm-side{transform:none}
.fm-act{min-width:56px;height:36px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font-size:13px}
.fm-act.del{border-color:rgba(220,80,80,.5);color:#ff8b8b}
.ex-addform{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
.ex-addform-h{font-size:13px;color:var(--tx2);margin-bottom:10px}

.focus-entry{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.focus-entry .btn{width:100%}

/* ===== p51 页面拆分：训练 / 日志 ===== */
.log-input{margin:0 0 14px}
.log-input .rec-main{padding:0}
.log-input .page-title{font-size:22px;margin:2px 0 4px}
.log-input .page-desc{margin-bottom:12px}
.log-input .fast-box{margin-top:0}

/* ===== p51 统一时间线 ===== */
.day-block{margin-bottom:14px}
.day-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 2px;background:linear-gradient(180deg,rgba(8,11,14,.96),rgba(8,11,14,.72));backdrop-filter:blur(6px);font-size:12px;color:var(--tx2);letter-spacing:.02em}
.day-head em{margin-left:auto;font-style:normal;color:var(--tx3);font-size:11px}
.log-item{position:relative;overflow:hidden;border-radius:10px}
.log-item:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2,#2a3540)}
.log-item.tcard:before,.tcard-min:before{background:#3DDCBF}
.tc-body{display:flex;flex-direction:column;gap:4px;margin-top:6px}

.tc-row b{color:var(--tx);font-weight:600}
.tc-row em{font-style:normal;color:var(--tx2)}
.tc-row s{text-decoration:none;color:#7fe0a7;font-size:11px}
.tc-row i{font-style:normal;color:var(--tx3);font-size:11px}
.lg-ex{margin-top:10px}
.lg-ex:first-child{margin-top:2px}
.lg-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lg-h b{color:var(--tx);font-size:13px;font-weight:600}
.lg-sets{display:grid;gap:2px;margin-top:4px}
.lg-set{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);padding-left:2px}
.lg-set .lg-no{width:16px;flex:0 0 16px;text-align:center;font-size:10.5px;color:var(--tx3);
  border:1px solid var(--line);border-radius:50%;line-height:14px;height:14px}
.lg-set .lg-no.warm{border-style:dashed;color:var(--tx3)}
.lg-set em{font-style:normal;color:var(--tx2)}
.lg-set s{text-decoration:none;color:#7fe0a7;font-size:10.5px}
.lg-set i{font-style:normal;color:var(--tx3);font-size:10.5px}
.lg-sum{font-size:12px;color:var(--tx2);margin:2px 0 2px;letter-spacing:.01em}
.lg-sum b.lg-pr{color:#E3B341;font-weight:600}
.lg-list{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.lg-ex{border-radius:9px}
.lg-ex.fin .lg-h b{color:var(--tx2)}
.lg-h{display:flex;align-items:center;gap:8px;min-height:42px;cursor:pointer}
.lg-ex.open .lg-h{border-bottom:1px dashed var(--line);margin-bottom:3px}
.lg-h b{font-size:13.5px;font-weight:600;color:var(--tx);max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-h em{font-style:normal;color:var(--tx2);font-size:11.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-dots{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.lg-dot{width:6px;height:6px;border-radius:50%;border:1px solid var(--line2)}
.lg-dot.on{background:#3DDCBF;border-color:#3DDCBF}
.lg-dotx{font-size:10.5px;color:var(--tx3)}
.lg-prch{font-size:10px;color:#E3B341;border:1px solid rgba(227,179,65,.45);border-radius:5px;padding:0 4px;flex:0 0 auto}
.lg-ar{color:var(--tx3);font-size:11px;transition:transform .18s;flex:0 0 auto}
.lg-ex.open .lg-ar{transform:rotate(90deg)}
.lg-ex .lg-sets{display:none}
.lg-ex.open .lg-sets{display:grid;gap:2px;padding:2px 0 6px}
.lg-more{border:0;background:none;color:var(--tx3);font-size:17px;line-height:1;padding:2px 6px;cursor:pointer;margin-left:auto}
.lg-more:active{color:var(--accent)}
.lg-menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.4);display:flex;flex-direction:column;min-width:112px;overflow:hidden}
.lg-menu button{border:0;background:none;color:var(--tx);font:inherit;font-size:13px;text-align:left;padding:11px 14px;cursor:pointer}
.lg-menu button:active{background:rgba(255,255,255,.06)}
.lg-menu button[data-mact="del"]{color:#e06e78;border-top:1px solid var(--line)}
.lib-favrow{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.lib-favscroll{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px 0;scrollbar-width:none}
.lib-favscroll::-webkit-scrollbar{display:none}
.fav-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);cursor:pointer;white-space:nowrap}
.fav-chip.picked{border-color:rgba(61,220,191,.55);color:var(--accent);background:rgba(61,220,191,.12)}
.fav-chip:active{transform:scale(.96)}
.fav-chip i{font-style:normal;font-size:11px}
.fav-empty{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.fav-cu{flex:0 0 auto;font-size:11.5px;color:var(--accent);background:none;border:1px solid rgba(61,220,191,.4);
  border-radius:8px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.bm-cell.on{outline:2px solid var(--accent);outline-offset:1px}
.ex-dt-head{align-items:center}
.ex-fav{border:0;background:none;font-size:17px;line-height:1;padding:2px 4px;cursor:pointer;color:var(--tx3);margin-left:auto}
.ex-fav.on{color:#e7c56a}
.ex-more{border:0;background:none;color:var(--tx3);font-size:17px;line-height:1;padding:2px 6px;cursor:pointer}
/* p236 动作照片 */
.ex-item.cu-item{padding-right:14px}
.cu-row{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel);transition:background .18s}
.cu-row .cu-main{padding:11px 14px}
.cu-side{position:absolute;top:0;right:0;bottom:0;width:140px;display:flex;padding-left:26px;
  transform:translateX(104%);transition:transform .2s cubic-bezier(.22,.61,.36,1);
  background:linear-gradient(90deg,rgba(0,0,0,0),var(--panel) 26%)}
html[data-theme="light"] .cu-side{background:linear-gradient(90deg,rgba(255,255,255,0),var(--panel) 26%)}
.cu-row.open .cu-side{transform:none}
.cu-act{flex:1 1 0;border:0;border-left:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx2);font:inherit;font-size:12.5px}
.cu-act.del{background:rgba(224,90,90,.18);color:#e05a5a;font-weight:600}
.cu-act:active{filter:brightness(.9)}
html[data-theme="light"] .cu-act{background:#F1F4F9}
html[data-theme="light"] .cu-act.del{background:rgba(224,90,90,.12)}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ai-head .ai-bar{flex:1 1 auto;margin:0}
.ai-empty{font-size:12.5px;color:var(--tx3);line-height:1.6;padding:2px 2px 10px}
.ai-head #aiRunBtn{flex:0 0 auto;white-space:nowrap;align-self:flex-start}
/* ---------- 洞察 Feed ---------- */
.ins-bar{display:flex;align-items:stretch;gap:8px;margin:2px 0 12px}
.ins-cell{flex:1 1 0;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.03);min-width:0}
.ins-cell .k{display:block;font-size:10.5px;color:var(--tx3);letter-spacing:.04em}
.ins-cell .v{display:block;font-size:16px;font-weight:600;color:var(--tx);margin-top:2px;line-height:1.2}
.ins-cell .v em{font-style:normal;font-size:11px;color:var(--tx3);font-weight:400}
.ins-cell .s{display:block;font-size:10.5px;color:var(--tx3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins-feed{display:flex;flex-direction:column;gap:9px}
.ins-card{border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);padding:11px 13px 12px;position:relative}
.ins-card[data-cat="rest"]{border-left:3px solid #E8B23A}
.ins-card[data-cat="mood"]{border-left:3px solid #6D8CFF}
.ins-card[data-cat="fit"]{border-left:3px solid #3EC478}
.ins-card[data-cat="energy"]{border-left:3px solid #2FD1C5}
.ins-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ins-cat{font-size:10.5px;color:var(--tx3);letter-spacing:.06em}
.ins-lv{font-size:10px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--tx2)}
.ins-lv.warn{background:rgba(232,178,58,.16);color:#E8B23A}
.ins-lv.up{background:rgba(62,196,120,.16);color:#3EC478}
.ins-more{margin-left:auto;width:30px;height:26px;border:0;background:none;color:var(--tx3);font-size:15px;line-height:1;border-radius:7px}
.ins-more:active{background:rgba(255,255,255,.06)}
.ins-head{font-size:13.5px;line-height:1.55;color:var(--tx);font-weight:600}
.ins-why{font-size:11.5px;line-height:1.65;color:var(--tx3);margin-top:5px}
.ins-acts{display:flex;gap:8px;margin-top:9px}
.ins-acts .btn{min-height:30px;font-size:12px;padding:0 12px}
.ins-ev{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ins-ev[hidden]{display:none!important}
.ins-ev .ev-chip{max-width:48%;flex:0 1 auto;font-size:10px;padding:3px 7px}
.ins-ev-t{font-size:10.5px;color:var(--tx3);width:100%;margin-bottom:2px}
.ins-week{margin-top:14px;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:linear-gradient(180deg,rgba(47,209,197,.07),rgba(255,255,255,.02))}
.ins-week .h{font-size:12px;color:var(--tx2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ins-week .h b{font-size:13px;color:var(--tx);font-weight:600}
.ins-week .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}
.ins-week .kv{display:flex;align-items:baseline;gap:2px;white-space:nowrap}
@media(min-width:420px){.ins-week .row{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ins-week .kv{font-size:11.5px;color:var(--tx3)}
.ins-week .kv b{color:var(--tx);font-weight:600;font-size:12.5px}
.ins-foot{display:flex;gap:8px;margin-top:14px}
.ins-foot .btn{flex:1 1 0;min-height:34px;font-size:12.5px}
.ins-two{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ins-two>div{display:flex;gap:8px;align-items:flex-start}
.ins-two span{flex:0 0 34px;font-size:10.5px;color:var(--tx3);padding-top:2px}
.ins-two b{flex:1 1 0;font-size:12px;font-weight:500;line-height:1.6;color:var(--tx2)}
.arch-box{max-height:86vh;display:flex;flex-direction:column}
.arch-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 14px}
.arch-t{font-size:11px;color:var(--tx3);letter-spacing:.06em;margin:14px 0 6px}
.arch-t:first-child{margin-top:2px}
html[data-theme="light"] .ins-card{background:#fff}
html[data-theme="light"] .ins-cell{background:#fff}
:root{--t-fast:.15s;--t-base:.2s;--t-slow:.35s;--ease:cubic-bezier(.2,.8,.2,1)}
button,a,.ins-card,.ins-filter button,.toast{transition-timing-function:var(--ease)}
:focus-visible{outline:2px solid #2FD1C5;outline-offset:2px}
html[data-theme="light"] .ins-ev .ev-chip{border-color:#E3E8F0;background:#F7F9FC}
/* sheet 拖拽手柄 + 空态组件 + 计数动画 */
.sheet-grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:2px auto 10px;flex:0 0 auto}

#planSheet .ex-sheet-inner,.msheet-box,#logSheet .ls-card{touch-action:pan-y}
.dragging{transition:none!important;cursor:grabbing}
.ins-bar .v .cnt{font-style:normal}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:34px 18px;text-align:center}
.empty-state .es-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(47,209,197,.1);color:var(--ac, #2FD1C5)}
.empty-state .es-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.empty-state .es-tx{font-size:12.5px;color:var(--tx3);line-height:1.6;max-width:260px}
.empty-state .es-cta{margin-top:2px}
html[data-theme="light"] .ins-filter button{border-color:#E3E8F0}
html[data-theme="light"] .ins-filter button.on{border-color:rgba(20,170,160,.5);background:rgba(20,170,160,.1)}
.ask-card{animation:none}
.ins-follow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ins-follow button{border:1px solid var(--line);background:none;color:var(--tx3);border-radius:999px;padding:4px 10px;font:inherit;font-size:11px;min-height:26px;transition:all var(--t-fast) var(--ease)}
.ins-follow button:hover{border-color:rgba(47,209,197,.5);color:var(--tx2)}
.toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:auto;transform:translate(-50%,-6px);animation:toastIn .22s var(--ease) both;max-width:82vw;text-align:center;font-size:12.5px;z-index:999}
.toast.warn{border-color:rgba(232,178,58,.55);color:#F2D08A}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
/* NEW 角标 / 筛选 / 置信点 / 迷你走势 */
.ins-new{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:#3E8BFF;box-shadow:0 0 0 3px rgba(62,139,255,.14);animation:insPop .3s var(--ease) both}
@keyframes insPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.ins-filter{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 0 10px;scrollbar-width:none}
.ins-filter::-webkit-scrollbar{display:none}
.ins-filter button{flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--tx3);border-radius:999px;padding:5px 11px;font:inherit;font-size:11.5px;min-height:28px;transition:all var(--t-fast) var(--ease)}
.ins-filter button.on{border-color:rgba(47,209,197,.55);color:var(--tx);background:rgba(47,209,197,.12)}
.ins-dots{display:inline-flex;gap:3px;align-items:center;margin-left:auto}
.ins-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.16)}
.ins-dots i.on{background:rgba(255,255,255,.72)}
html[data-theme="light"] .ins-dots i{background:#DCE2EA}
html[data-theme="light"] .ins-dots i.on{background:#8A94A6}
.ins-spark{display:flex;align-items:flex-end;gap:3px;height:18px;margin:8px 0 2px;padding:0 2px}
.ins-spark i{flex:1 1 0;background:rgba(47,209,197,.35);border-radius:2px;min-height:3px;position:relative}
.ins-spark i.today{background:#2FD1C5}
.ins-week .kv em{font-style:normal;font-size:10px;margin-left:3px}
.ins-week .kv em.up{color:#3EC478}
.ins-week .kv em.down{color:#F0715C}

/* p51 卡片色条可见性 */

/* p51 日志编辑底部 sheet */
.log-sheet{position:fixed;inset:0;z-index:130;display:flex;align-items:flex-end}

@media (min-width:900px){ .ls-card{max-width:520px;margin:0 auto;border-radius:16px 16px 0 0} }

/* p51 组明细 + 标题渲染兜底 */
.tc-more{margin-top:8px}

.tg s{text-decoration:none;color:#7fe0a7}
.tg i{font-style:normal;color:var(--tx3);font-size:11px}
.tg-none{font-size:11.5px;color:var(--tx3)}
.log-input .page-title{background:none;-webkit-text-fill-color:currentColor}

/* p52 训练日志编辑 */
.ts-wrap{display:grid;gap:10px;max-height:52dvh;overflow:auto;padding-right:2px}
.ts-block{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ts-h{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}

.ts-done.on{border-color:#3DDCBF;color:#3DDCBF;background:rgba(61,220,191,.12)}

/* p56 底部栏 · 分析按钮：平放 + 常驻微光晕，其余与四个 tab 同语言 */
.m-tabbar .tab-cta{position:relative;flex:0 0 70px;overflow:visible;color:#8593A6}
.m-tabbar .tab-cta .cta-core{position:absolute;left:50%;top:2px;width:34px;height:34px;margin-left:-17px;border-radius:10px;
  display:grid;place-items:center;pointer-events:none;color:inherit;
  background:radial-gradient(circle at 50% 50%,rgba(109,140,255,.16),rgba(109,140,255,0) 72%);
  border:0;box-shadow:none;transition:background .24s ease,color .2s ease}
.m-tabbar .tab-cta .cta-core svg{width:23px;height:23px;display:block;transition:transform .18s ease}
.m-tabbar .tab-cta .cta-lbl{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:11px;letter-spacing:.01em;line-height:1.2;color:inherit;transition:color .18s,font-weight .18s}
.m-tabbar .tab-cta.on{color:#A9BCFF}
.m-tabbar .tab-cta.on .cta-core{color:#A9BCFF;
  background:radial-gradient(circle at 50% 50%,rgba(109,140,255,.3),rgba(109,140,255,0) 72%)}
.m-tabbar .tab-cta.on .cta-core svg{animation:ctaBreath 3s ease-in-out infinite}
.m-tabbar .tab-cta.on .cta-lbl{color:#A9BCFF;font-weight:600}
.m-tabbar .tab-cta.on:before{background:#A9BCFF}
.m-tabbar .tab-cta:active .cta-core svg{transform:scale(.92)}
.m-tabbar .tab-cta:after{content:'';position:absolute;left:50%;top:0;width:44px;height:42px;margin-left:-22px}
@keyframes ctaBreath{0%,100%{opacity:1}50%{opacity:.6}}
.m-tabbar .tab-cta .cta-dot{position:absolute;right:13px;top:7px;width:6px;height:6px;border-radius:50%;background:#A9BCFF;z-index:2}


/* p54 问自己的数据 */
.ask{margin:0 0 14px;border:1px solid rgba(109,140,255,.22);border-radius:14px;padding:12px;background:linear-gradient(180deg,rgba(109,140,255,.06),rgba(109,140,255,.02))}

.ask-sub{margin-top:6px;font-size:11.5px;color:var(--tx3);line-height:1.6}

.rv-card{margin:2px 0 18px;border-radius:16px;padding:16px 16px 12px;position:relative;overflow:hidden;

/* p57 新手引导 */

.ob-acts{display:flex;gap:10px;margin-top:16px}
.ob-acts .btn{flex:1}
.ob-card textarea{width:100%;min-height:80px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--tx);padding:10px;font:inherit;font-size:13px;resize:vertical}

.ob-tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ob-ti{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.02);color:var(--tx3)}

.ob-dots i.on{background:#3DDCBF;width:14px;border-radius:3px}

.ob-eg em{display:block;font-style:normal;font-size:11.5px;color:#3DDCBF;margin-top:6px}
.ob-link{display:block;margin:10px auto 0;background:none;border:0;color:var(--tx3);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ob-pick{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.ob-pickk{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:8px}
.coach-mask{position:fixed;inset:0;z-index:12000;background:transparent}
.coach-tip .coach-acts{display:flex;gap:8px;margin-top:10px}
.coach-tip .coach-acts .btn{flex:1}
.grad-mask{position:fixed;inset:0;z-index:13000;background:rgba(4,7,10,.86);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);display:grid;place-items:center;padding:20px}
.about-more{margin-top:12px}
.about-more summary{cursor:pointer;font-size:12.5px;color:var(--tx2);padding:8px 0;list-style:none}
.about-more summary::before{content:'▸ ';color:var(--tx3)}
.about-more[open] summary::before{content:'▾ '}
.about-more .hint{margin:8px 0 0}
html[data-theme="light"] .ob-card{background:#fff;border-color:var(--line2)}
html[data-theme="light"] .ob-ti{background:#F4F7FA;border-color:var(--line2)}
html[data-theme="light"] .ob-eg{background:rgba(14,143,122,.07);border-color:rgba(14,143,122,.28);color:var(--tx)}
html[data-theme="light"] .ob-eg em{color:#0E8F7A}
html[data-theme="light"] .ob-p{background:#fff;border-color:var(--line2);color:var(--tx2)}
html[data-theme="light"] .ob-p.on{background:rgba(14,143,122,.1);border-color:rgba(14,143,122,.45);color:#0E8F7A}
html[data-theme="light"] .grad-mask{background:rgba(243,246,250,.94)}
html[data-theme="light"] .coach-mask .tour-hole{box-shadow:0 0 0 2000px rgba(18,26,38,.62);outline-color:rgba(14,143,122,.8)}

/* Agent 接入：AI 报告 / 问答 / 设置 */
.ai-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3);padding:8px 10px;border:1px solid rgba(61,220,191,.18);border-radius:10px;background:rgba(61,220,191,.05);margin:0 0 10px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:#3DDCBF;animation:aiPulse 1.2s infinite}
@keyframes aiPulse{0%,100%{opacity:.35}50%{opacity:1}}
.ai-bar.off{border-color:rgba(240,106,90,.28);background:rgba(240,106,90,.06);color:#e08b84}
.ai-report{margin:0 0 14px}
.ai-sec{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:0 0 10px;background:rgba(255,255,255,.02)}
.ai-sec-t{font-size:13.5px;font-weight:600;color:var(--tx);margin:0 0 6px}
.ai-sec p{margin:0 0 6px;font-size:12.6px;line-height:1.7;color:var(--tx2)}
.ai-sec-src{font-size:10.5px;color:var(--tx3);font-family:var(--mono);letter-spacing:.4px;margin-top:4px}
.ai-one{font-size:12.5px;color:var(--tx2);margin:0 0 10px;line-height:1.7}
.ai-src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ai-chip{font:inherit;font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:var(--tx2);cursor:pointer}
.ai-chip:hover{border-color:rgba(61,220,191,.5);color:#3DDCBF}
.ai-fold{margin:10px 0 0}
.ai-fold summary{cursor:pointer;font-size:11.5px;color:var(--tx3);padding:6px 0}
.plan-why{font-size:12px;color:var(--tx2);border-left:2px solid rgba(61,220,191,.5);padding:7px 0 7px 9px;margin:8px 0;background:rgba(61,220,191,.04);border-radius:0 6px 6px 0;line-height:1.6}
.sig.ai{border-color:rgba(61,220,191,.35)}
.ai-eng{display:flex;gap:6px;padding:4px;margin:10px 0 0;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
.ai-eng button{flex:1;padding:9px 0;border:1px solid transparent;border-radius:999px;background:none;color:var(--tx3);font:inherit;font-size:13px;cursor:pointer;transition:background .2s ease,color .2s ease,border-color .2s ease}
.ai-eng button.on{background:linear-gradient(135deg,rgba(61,220,191,.2),rgba(61,220,191,.05));border-color:rgba(61,220,191,.45);color:var(--accent);font-weight:600}
html[data-theme="light"] .ai-eng{background:#fff}
html[data-theme="light"] .ai-eng button.on{background:rgba(13,138,120,.1);border-color:rgba(13,138,120,.5);color:#0b6f63}
.ai-prev[hidden]{display:none}
.ai-grid{display:grid;gap:8px}
.ai-grid input,.ai-grid select{width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx);padding:0 10px;font:inherit;font-size:12.5px}
.ai-prev{width:100%;min-height:170px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--tx2);font:inherit;font-size:11.5px;line-height:1.6;padding:10px;resize:vertical}
html[data-theme="light"] .ai-sec{background:#fff}
html[data-theme="light"] .ai-grid input,html[data-theme="light"] .ai-prev,html[data-theme="light"] .ai-chip{background:#fff}
html[data-theme="light"] .ai-bar{background:rgba(14,143,122,.07);color:#3b6f66}
html[data-theme="light"] .plan-why{background:rgba(14,143,122,.06)}

/* p56 训练页：加动作符号 + 今日计划池 + 专注入口 */
.ex-add{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(61,220,191,.42);background:rgba(61,220,191,.08);color:#3DDCBF;
  font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.18s;padding:0}
.ex-add:hover{background:rgba(61,220,191,.18);border-color:rgba(61,220,191,.75)}
.ex-add:active{transform:translateY(-50%) scale(.94)}
.pool-wrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.pool-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:8px}
.pool-h em{margin-left:auto;font-style:normal;font-size:11px;color:var(--tx3);font-family:var(--mono)}
.focus-cta{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.focus-cta .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;font-size:14px}
.ps-meta{font-size:12px;color:var(--tx3);margin-bottom:12px}
.ps-note{font-size:11.5px;color:var(--tx3);margin:10px 0 12px;line-height:1.6}

/* 今日训练计划：卡头左侧删除键 */
.set-head .set-x{margin-right:9px;width:30px;height:30px;font-size:15px;line-height:1;background:rgba(255,255,255,.03)}
.set-head .set-x:hover,.set-head .set-x:active{color:var(--risk);border-color:var(--risk);background:rgba(255,90,110,.08)}

/* 定制计划：可编辑购物车 */
.plan-tools{display:flex;align-items:center;gap:10px;margin:-2px 0 6px}
.plan-reset{border:1px solid var(--line);background:none;color:var(--tx3);border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer}
.plan-reset:hover{color:var(--accent);border-color:var(--accent)}
.plan-tools em{font-style:normal;font-size:11px;color:var(--tx3)}
.plan-item.joined{opacity:.62}
.plan-line{align-items:center}
.plan-adj{font-size:10px;color:#A9BCFF;border:1px solid rgba(169,188,255,.4);border-radius:4px;padding:1px 5px}
.plan-x{width:32px;height:32px;flex:0 0 auto;margin-left:auto;border:1px solid var(--line);background:none;color:var(--tx3);border-radius:8px;font-size:14px;line-height:1;cursor:pointer}
.plan-x:hover{color:var(--risk);border-color:var(--risk)}
.plan-gear{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px}
.plan-ctl{display:inline-flex;align-items:center;gap:6px}
.plan-ctl>i{font-style:normal;font-size:11.5px;color:var(--tx3);min-width:14px}
.pl-step{width:36px;height:36px;flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:9px;color:var(--tx);font-size:15px;line-height:1;cursor:pointer}
.pl-step:active{background:rgba(255,255,255,.1)}
.plan-num{min-width:36px;text-align:center;font-size:14px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.plan-num:empty{display:none}
.plan-wchips{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.plan-w{height:36px;min-width:50px;padding:0 9px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:9px;color:var(--tx2);font-size:12px;cursor:pointer}
.plan-w.on{border-color:var(--accent);color:var(--accent);background:rgba(61,220,191,.08)}
.plan-joined{font-size:11.5px;color:var(--accent)}
.plan-item .plan-joined{opacity:1}

.set-foot .tr-minus{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx2);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.set-foot .tr-minus:hover:not(:disabled){color:var(--risk);border-color:rgba(255,90,110,.55);background:rgba(255,90,110,.07)}
.set-foot .tr-minus:disabled{opacity:.5;cursor:not-allowed;color:var(--tx3)}
.set-foot .tr-plus{height:32px;padding:0 12px;font:inherit;font-size:12px}
.toast.confirm{bottom:88px;gap:10px 16px;flex-wrap:wrap;justify-content:flex-end;max-width:min(92vw,420px);align-items:center;padding:12px 14px}
.toast.confirm span{flex:1 1 100%;line-height:1.5;font-size:13px;color:var(--tx)}
.toast.confirm button{background:none;border:0;font-size:13px;cursor:pointer;color:var(--tx3);padding:4px 8px;white-space:nowrap}
.toast.confirm button.c-del{color:var(--risk)}
.gif-fail .gif-retry{border:1px solid var(--line);background:none;color:var(--tx2);border-radius:9px;padding:7px 14px;font-size:12px;cursor:pointer}
.gif-fail .gif-retry:active{transform:scale(.96)}
/* 移动端去毛玻璃：iOS 上 fixed 栏的 backdrop-filter 会把整页内容错误采样，出现整页模糊 */
@media (max-width:768px){
  .m-tabbar{background:#0A0C0F;backdrop-filter:none;-webkit-backdrop-filter:none}
  .topbar{background:#07090E;backdrop-filter:none;-webkit-backdrop-filter:none}
  .day-head{background:#080B0E;backdrop-filter:none;-webkit-backdrop-filter:none}
  .fab-sheet,.ex-sheet,.fm-add,.milestone,.sum-card,.ob-mask,.rest,.rest.full,.sheet,.m-seg{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
@supports (-webkit-touch-callout:none){
  .fab-sheet,.ex-sheet,.fm-add,.milestone,.sum-card,.ob-mask,.rest,.rest.full,.sheet,.m-seg{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important}
  .fab-sheet,.ex-sheet{background:rgba(6,8,10,.88)}
  .fm-add{background:rgba(4,6,8,.92)}
  .milestone,.sum-card,.ob-mask{background:rgba(4,7,10,.92)}
  .rest,.rest.full{background:rgba(4,7,9,.97)}
}
/* ===== 浅色主题（显式切换：右上角按钮） ===== */
html[data-theme="light"]{
  --bg:#F3F6FA;--bg2:#FFFFFF;--panel:#FFFFFF;--panel2:#EEF2F7;--line:#DCE3EC;--line2:#C6D0DC;
  --tx:#101823;--tx2:#465366;--tx3:#6B7789;--accent:#0E8F7A;--accent-soft:#0B7A68;--good:#1C8259;--risk:#C1432F;--info:#2F49B5}
html[data-theme="light"] body{background-image:none;background-color:var(--bg);color:var(--tx)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.92)}
html[data-theme="light"] .sum-card{background:rgba(240,243,248,.72)}
html[data-theme="light"] .ex-sheet{background:rgba(240,243,248,.72)}
html[data-theme="light"] .search-sug,html[data-theme="light"] .ex-sheet-inner{background:var(--panel)}
/* 表单控件：白底浅框，杜绝黑输入框 */
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea{
  background:#fff;border-color:var(--line2);color:var(--tx)}
html[data-theme="light"] input::placeholder,html[data-theme="light"] textarea::placeholder{color:#9AA5B4}
html[data-theme="light"] .ts-row input,html[data-theme="light"] .ask-row input,html[data-theme="light"] .ob-card textarea,html[data-theme="light"] .ms-row input{background:#fff;border-color:var(--line2)}
html[data-theme="light"] .sel-ex{background:#fff;border-color:var(--line2)}
/* 按钮 / chip */
html[data-theme="light"] .btn.ghost{background:rgba(15,23,33,.045);border-color:var(--line);color:var(--tx2)}
html[data-theme="light"] .btn.ghost:hover{background:rgba(15,23,33,.08)}
html[data-theme="light"] .chip,html[data-theme="light"] .fchip{background:rgba(15,23,33,.045);border-color:var(--line);color:var(--tx2)}
html[data-theme="light"] .chip.on,html[data-theme="light"] .fchip.on{background:rgba(15,158,134,.12);border-color:rgba(15,158,134,.5);color:#0B8A72}
/* 卡片 / 区块 */
html[data-theme="light"] .ex-item{background:#fff;border-color:var(--line);box-shadow:0 1px 2px rgba(15,23,33,.05)}
html[data-theme="light"] .ex-item:hover{background:#F6F9FC}
html[data-theme="light"] .set-card,html[data-theme="light"] .set-row{background:rgba(15,23,33,.025);border-color:var(--line)}
html[data-theme="light"] .quick-box{background:rgba(15,23,33,.03);border-color:var(--line)}
html[data-theme="light"] .report-shell,html[data-theme="light"] .rv-card,html[data-theme="light"] .ask-card{background:#fff;border-color:var(--line)}
html[data-theme="light"] .md .scenario{background:rgba(15,23,33,.04);border-color:var(--line)}
html[data-theme="light"] .fm-row{background:rgba(15,23,33,.03);border-color:var(--line)}
html[data-theme="light"] .gif-ph{background:rgba(15,23,33,.04)}
/* 身体图 */
html[data-theme="light"] .bm-cell{background:rgba(15,23,33,.03);border-color:var(--line)}
html[data-theme="light"] .bm-cell.ok{background:rgba(15,158,134,.08);border-color:rgba(15,158,134,.35)}
html[data-theme="light"] .bm-cell.resting{background:rgba(200,150,40,.1);border-color:rgba(200,150,40,.4)}
html[data-theme="light"] .bm-cell.resting b,html[data-theme="light"] .bm-cell.resting em{color:#9A7415}
/* 底栏 / 休息层 */
html[data-theme="light"] .m-tabbar{background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
html[data-theme="light"] .rest,html[data-theme="light"] .rest.full{background:rgba(243,246,250,.97);color:var(--tx)}
html[data-theme="light"] .rest-ring::before{background:#fff}
html[data-theme="light"] .log-time,html[data-theme="light"] .log-date{color:var(--tx3)}
html[data-theme="light"] .eyebrow{opacity:1}
html[data-theme="light"] .chip-star{color:#7C8798}
html[data-theme="light"] .hm-legend i{background:rgba(15,23,33,.08)}
html[data-theme="light"] .hm i[data-l="1"],html[data-theme="light"] .hm-legend i[data-l="1"]{background:rgba(15,158,134,.28)}
html[data-theme="light"] .hm-legend i[data-l="2"]{background:rgba(15,158,134,.45)}
html[data-theme="light"] .hm-legend i[data-l="3"]{background:rgba(15,158,134,.66)}
html[data-theme="light"] .hm-legend i[data-l="4"]{background:rgba(15,158,134,.9)}
/* 分析页 info 组色：浅蓝字在白底不可读，换深蓝 */
html[data-theme="light"] #pageAgent[data-tone="info"] .page-title{color:#1B2A63}
html[data-theme="light"] #pageAgent[data-tone="info"] .eyebrow{color:#3A55B8}
html[data-theme="light"] #pageAgent[data-tone="info"] .tab.on{color:#26409F;background:rgba(47,73,181,.1);border-color:rgba(47,73,181,.45)}
html[data-theme="light"] #pageAgent[data-tone="info"] .tab.on{box-shadow:inset 0 0 0 1px rgba(47,73,181,.28)}
/* 类型 / 状态小标签 */
html[data-theme="light"] .log-type.life{color:#0B7A68;border-color:rgba(14,143,122,.45)}
html[data-theme="light"] .log-type.fit{color:#1C8259;border-color:rgba(28,130,89,.45)}
html[data-theme="light"] .log-type.work{color:#2F49B5;border-color:rgba(47,73,181,.4)}
html[data-theme="light"] .ev-w{color:#0B7A68}
html[data-theme="light"] .ev-w.none{color:var(--tx3)}
html[data-theme="light"] .tag{color:#2F49B5}
html[data-theme="light"] .tag{background:rgba(47,73,181,.08);border-color:rgba(47,73,181,.35)}
html[data-theme="light"] .ex-add{color:#0B7A68;background:rgba(14,143,122,.12);border-color:rgba(14,143,122,.45)}
html[data-theme="light"] .tc-done{color:#0B7A68}
/* 主题切换按钮 */
/* 底栏：分析（tab-cta）与文字标签在浅色下提升对比 */
html[data-theme="light"] .m-tabbar .tab-cta{color:#6B7789}
html[data-theme="light"] .m-tabbar .tab-cta.on{color:#2340A8}
html[data-theme="light"] .m-tabbar .tab-cta.on .cta-core{color:#2340A8;background:radial-gradient(circle at 50% 50%,rgba(47,73,181,.18),rgba(47,73,181,0) 72%)}
html[data-theme="light"] .m-tabbar .tab-cta.on .cta-lbl{color:#2340A8}
html[data-theme="light"] .m-tabbar .tab-cta.on:before{background:#2340A8}
html[data-theme="light"] .m-tabbar .tab-cta .cta-dot{background:#2340A8}
html[data-theme="light"] .m-tabbar button .tl{color:var(--tx2)}
html[data-theme="light"] .m-tabbar button.on .tl{color:var(--accent-soft)}

/* ===== 浅色：内联颜色与残留浅色修正（放在样式表末尾，保证优先级） ===== */
html[data-theme="light"] .log-type.fit{color:#1C8259!important;border-color:rgba(28,130,89,.45)!important}
html[data-theme="light"] .log-type.life{color:#0B7A68!important;border-color:rgba(14,143,122,.45)!important}
html[data-theme="light"] .log-type.work{color:#2F49B5!important;border-color:rgba(47,73,181,.4)!important}
html[data-theme="light"] .tag{color:#2F49B5!important}
html[data-theme="light"] .tag button{color:#5A6577}
html[data-theme="light"] #pageAgent[data-tone="info"] .page-desc{color:var(--tx2)}
html[data-theme="light"] #pageAgent[data-tone="info"] h1,html[data-theme="light"] #reportBody[data-tone="info"] h1{color:#16224F}
html[data-theme="light"] #pageAgent[data-tone="info"] .hc-v,html[data-theme="light"] #pageAgent[data-tone="info"] .stat-v,
html[data-theme="light"] #reportBody[data-tone="info"] .hc-v,html[data-theme="light"] #reportBody[data-tone="info"] .stat-v{color:#16224F}
html[data-theme="light"] .tc-row s,html[data-theme="light"] .tg s{color:#1C8259}
html[data-theme="light"] .tc-done{color:#1C8259!important}
html[data-theme="light"] .day-head{background:rgba(15,23,33,.04)}

/* ===== 浅色：专注模式改浅色皮肤（原为硬编码深色底 #080b0e） ===== */
html[data-theme="light"] .focus-mode{background:#F3F6FA}
html[data-theme="light"] .focus-mode::after{box-shadow:inset 0 0 46px 14px rgba(197,132,10,.22),inset 0 0 0 1.5px rgba(197,132,10,.5)}
html[data-theme="light"] .focus-mode .fm-progress{background:rgba(15,23,33,.08)}
html[data-theme="light"] .focus-mode .fm-row{background:rgba(255,255,255,.92);border-color:var(--line)}
html[data-theme="light"] .focus-mode .fm-val{color:var(--tx)}
html[data-theme="light"] .focus-mode .fm-row.done .fm-val{color:#1C8259}
html[data-theme="light"] .focus-mode .fm-row.timing .fm-val{color:#8A5A05}
html[data-theme="light"] .focus-mode .fm-val i{color:var(--tx3)}
html[data-theme="light"] .focus-mode .fm-row.done .fm-val i{color:#1C8259}
html[data-theme="light"] .focus-mode .fm-row.timing .fm-val i{color:#8A5A05}
html[data-theme="light"] .focus-mode .fm-tick.done{color:#FFFFFF}
html[data-theme="light"] .focus-mode .fm-side{background:linear-gradient(90deg,rgba(243,246,250,0),#EEF2F7 40%)}
html[data-theme="light"] .focus-mode .fm-act{background:#FFFFFF;color:var(--tx2)}
html[data-theme="light"] .focus-mode .focus-entry .btn,.focus-mode .fm-foot .btn,.focus-mode .fm-more .btn{background:#FFFFFF;color:var(--tx2);border-color:var(--line)}
/* 浅色：专注模式强调色改深（原来 --accent:#5cf5d6 在浅底不可读） */
html[data-theme="light"] .focus-mode[data-theme="focus"]{--accent:#0B7A68}
html[data-theme="light"] .focus-mode .tr-plus{color:#0B7A68;border-color:rgba(14,143,122,.45);background:rgba(14,143,122,.08)}
html[data-theme="light"] .kicker{color:#5A6577!important}

/* ===== 模式球（快记 + 专注合一：单击跑默认动作 / 长按换挡 / 拖拽吸附边缘） ===== */
.mode-orb{position:fixed;right:18px;bottom:86px;z-index:92;width:56px;height:56px;
touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.mode-orb .orb-core{position:relative;width:56px;height:56px;border-radius:50%;overflow:hidden;
display:grid;place-items:center;cursor:pointer;
background:radial-gradient(circle at 50% 24%,#17282E 0%,#0A1116 60%,#06090C 100%);
box-shadow:0 14px 30px -12px rgba(0,0,0,.78),0 0 0 1px rgba(61,220,191,.18),0 0 24px -8px rgba(61,220,191,.35);
transition:transform .16s ease}
.mode-orb.dragging .orb-core,.mode-orb.menu-on .orb-core{transform:scale(.92)}
.mode-orb .orb-core::after{content:'';position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
background:radial-gradient(circle,rgba(61,220,191,.2),rgba(61,220,191,0) 70%);animation:foBreath 3s ease-in-out infinite}
.mode-orb.full .orb-core::after{background:radial-gradient(circle,rgba(62,224,143,.22),rgba(62,224,143,0) 72%);animation:none;opacity:.6}
.mode-orb .orb-ring{position:absolute;inset:0;width:56px;height:56px;transform:rotate(-90deg)}
.mode-orb .fo-ticks{fill:none;stroke:rgba(120,210,196,.26);stroke-width:1.2}
.mode-orb .ring-in{fill:none;stroke:rgba(255,255,255,.05);stroke-width:1}
.mode-orb .ring-bg{fill:none;stroke:rgba(255,255,255,.09);stroke-width:3.4}
.mode-orb .ring-fg{fill:none;stroke:url(#foGrad);stroke-width:3.4;stroke-linecap:round;transition:stroke-dashoffset .45s ease}
.mode-orb.full .ring-fg{stroke:#3EE08F}
.mode-orb .orb-face{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1;color:#EAFBF7}
.mode-orb .orb-plus,.mode-orb .orb-dumbbell{display:none}
.mode-orb .orb-num{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.mode-orb[data-mode="record"] .orb-plus{display:block}
.mode-orb[data-mode="record"] .orb-num{display:none}
.mode-orb[data-mode="focus"] .orb-dumbbell{display:block}
.mode-orb .orb-menu{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .16s ease}
.mode-orb.menu-on .orb-menu{opacity:1}
.mode-orb .orb-opt{position:absolute;pointer-events:none;display:flex;align-items:center;gap:6px;
height:36px;padding:0 13px;border-radius:18px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer;
color:#D8F7EE;background:rgba(9,16,20,.95);border:1px solid rgba(61,220,191,.32);
box-shadow:0 10px 22px -10px #000;transition:border-color .15s,background .15s}
.mode-orb.menu-on .orb-opt{pointer-events:auto}
.mode-orb .orb-opt.on,.mode-orb .orb-opt.hover{border-color:rgba(61,220,191,.85);background:rgba(18,40,38,.96);color:#7FF0DA}
.mode-orb .orb-opt[data-opt="focus"]{right:0;left:auto;margin-left:0;bottom:66px}
.mode-orb[data-side="left"] .orb-opt[data-opt="focus"]{left:0;right:auto}
.mode-orb .orb-opt[data-opt="record"]{right:64px;top:50%;margin-top:-18px}
.mode-orb[data-side="left"] .orb-opt[data-opt="record"]{left:64px;right:auto}
body:has(#focusMode) .mode-orb{opacity:0;pointer-events:none}
@keyframes foBreath{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.8;transform:scale(1.04)}}
@media(prefers-reduced-motion:reduce){.mode-orb .orb-core::after{animation:none;opacity:.45}}

/* ===== 设置页：分组列表 + 二级面板 ===== */

.sp-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}

.toggle{width:44px;height:26px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);
position:relative;cursor:pointer;flex:0 0 44px;padding:0}
.toggle i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--tx3);
transition:transform .18s ease,background .18s ease;display:block}

.toggle[aria-checked="true"] i{transform:translateX(18px);background:var(--accent)}

body:has(#pageSetting:not([hidden])) .mode-orb{opacity:0;pointer-events:none}

}

/* ===== p130 移动端输入聚焦缩放治理 ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

  body{overflow-x:hidden}

/* ===== p131 模式球：禁长按选择，长按换挡改为双击换挡 ===== */
.mode-orb,.mode-orb *,.orb-opt,.orb-opt *{
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent;
}

/* ===== p132 长按换挡：按压反馈 + 松手不关菜单 ===== */
.mode-orb.pressing .orb-core{transform:scale(.95)}
.mode-orb.menu-on .orb-core{transform:scale(.94)}

/* ===== p133 训练录入弹层：键盘避让，输入框始终可见 ===== */

.set-more{border:0;background:none;color:var(--tx3);font-size:16px;line-height:1;padding:0 6px;cursor:pointer}
.rm-t{font-size:12px;color:var(--tx3);padding:6px 10px 8px}
.rm-i{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;font-size:14px;padding:12px 10px;border-radius:8px;cursor:pointer}
.rm-i:active{background:var(--panel2)}
.rm-i.del{color:#E0574F}
/* 折叠行：从这条开始 */
.tc-fold.next{border-left:3px solid var(--accent);padding-left:9px}
.tc-drag,.set-drag{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;color:var(--tx3);font-size:15px;line-height:1;padding:6px 8px;flex:0 0 auto}
.set-drag{margin-left:auto;margin-right:2px}
[data-urow].dragging{position:relative;z-index:9;opacity:.92;box-shadow:0 8px 22px rgba(0,0,0,.35);border-radius:12px;background:var(--panel)}
.tcf-done,.tc-fold,.set-card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cd-sheet-inner .cd-hintline{font-size:12px;color:var(--tx3);line-height:1.5}
.tc-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:middle;animation:cdPulse 1.8s ease-in-out infinite}
/* 今日空态头 */
.tr-empty-h{padding:4px 2px 10px;display:flex;flex-direction:column;gap:2px}
.tr-empty-h[hidden]{display:none!important}
.tr-empty-h b{font-size:13px;font-weight:600}
.tr-empty-h em{font-style:normal;font-size:11.5px;color:var(--tx3)}
.cd-sheet-inner{padding:4px 2px 10px}
.ex-sheet.cd-sheet{align-items:flex-end;justify-content:center}
.ex-sheet.cd-sheet .ex-sheet-inner{border-radius:16px 16px 0 0;padding-bottom:24px}
.add-mode{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.add-mode:active{transform:scale(.99)}
.add-mode-ic{font-size:20px;line-height:1}
.add-mode span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:3px}
.add-mode b{font-size:14px;font-weight:600}
.add-mode i{font-style:normal;font-size:11.5px;color:var(--tx3)}
.add-mode em{font-style:normal;color:var(--tx3)}
.cd-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cd-h span{font-size:14px;font-weight:600}
.cd-lbl{font-size:11px;color:var(--tx3);margin:12px 0 6px}
.cd-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cd-chips button{min-height:36px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;color:var(--tx2);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-chips button.on{border-color:rgba(91,156,255,.6);color:var(--tx);background:rgba(91,156,255,.14)}
.cd-step{display:flex;align-items:center;gap:12px}
.cd-step button{width:38px;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;color:var(--tx);font-size:16px;cursor:pointer}
.cd-step b{font-size:20px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.cd-lv3{display:flex;gap:6px}
.cd-lv3 button{flex:1;min-height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;color:var(--tx2);font:inherit;font-size:12px;cursor:pointer}
.cd-lv3 button.on{border-color:rgba(47,209,197,.5);color:var(--tx);background:rgba(47,209,197,.1)}
.cd-dist{width:100%;margin-top:12px;min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--tx);padding:0 12px;font:inherit;font-size:13px}
/* 计划页：Feed 语言的卡片化 */
.plan-hero{margin:2px 0 12px;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:linear-gradient(180deg,rgba(47,209,197,.07),rgba(255,255,255,.02));position:relative}
.plan-hero .ph-t{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.plan-hero .ph-t b{font-size:15px;letter-spacing:.2px}
.plan-hero .ph-t em{font-style:normal;font-size:11px;color:var(--tx3)}
.plan-hero .ph-m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.plan-hero .ph-m span{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--tx3)}
.plan-hero .ph-m b{font-size:14px;color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.pl-eff{display:flex;gap:5px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.pl-eff button{flex:1;min-height:32px;border:1px solid var(--line);background:none;color:var(--tx3);border-radius:9px;font:inherit;font-size:12px;transition:all var(--t-fast) var(--ease)}
.pl-eff button.on{border-color:rgba(47,209,197,.55);color:var(--tx);background:rgba(47,209,197,.12)}
.pl-eff-note{font-size:10.5px;color:var(--tx3);margin-top:7px}
.pl-table{border:0;border-radius:0;overflow:visible;background:none;display:flex;flex-direction:column;gap:8px}
.pl-th{display:none}
.pl-row{display:grid;grid-template-columns:18px 1fr 74px 56px 22px;gap:6px;align-items:center;padding:0 10px 0 12px;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;position:relative;overflow:hidden;transition:background .16s,transform .16s,box-shadow .16s}
.pl-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#3EC478}
.pl-row.on{background:rgba(61,220,191,.07);border-color:rgba(61,220,191,.35)}
.pl-row.joined{opacity:.55;cursor:default}
.pl-row.swipe{transition:none}
.pl-row.rm{animation:plOut .22s var(--ease) both}
@keyframes plOut{to{opacity:0;transform:translateX(-40px)}}
.pl-drag{font-size:13px;color:var(--tx3);text-align:center;cursor:grab;touch-action:none;user-select:none}
.pl-rowmore{width:22px;height:28px;border:0;background:none;color:var(--tx3);font-size:15px;line-height:1;cursor:pointer}
.pl-swipe-hint{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:11px;color:#fff;opacity:0;pointer-events:none;padding:0 12px}
.pl-swipe-l{right:0;background:rgba(240,113,92,.9);border-radius:0 12px 12px 0}
.pl-swipe-r{left:0;background:rgba(62,196,120,.9);border-radius:12px 0 0 12px}
.pl-th{display:grid;grid-template-columns:1fr 62px 62px;gap:6px;align-items:center;padding:7px 10px;font-size:10.5px;color:var(--tx3);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
/* 旧表格式行规则已由上方卡片规则取代（保留选择器以防回退） */
.pl-idx{font-size:11px;color:var(--tx3)}
.pl-nm{font-size:13.5px;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;line-height:1.25}
.pl-no{font-style:normal;font-size:10.5px;color:var(--tx3);flex:0 0 auto}
.pl-tag{font-style:normal;font-size:9.5px;color:#a8792d;background:rgba(201,150,60,.14);border-radius:4px;padding:1px 4px;margin-left:4px}
.pl-warn{font:inherit;font-size:10.5px;color:#a8792d;background:rgba(201,150,60,.14);border:1px solid rgba(201,150,60,.45);border-radius:6px;padding:2px 6px;cursor:pointer}
.pl-jjoined{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--tx3);font:inherit;font-size:11.5px;padding:10px;cursor:pointer}
.pl-empty{font-size:11.5px;color:var(--tx3);padding:12px 10px}
.pl-go{padding:10px 0 2px}
.pl-go .btn{width:100%}
.plan-head{position:relative}
.pl-sum{font-size:11px;color:var(--tx3);margin-left:8px}
.plan-more{position:absolute;right:0;top:-4px;width:28px;height:28px;border:0;background:none;color:var(--tx3);font-size:16px;cursor:pointer}
.plan-menu{position:absolute;right:0;top:26px;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.25);padding:4px;min-width:132px}
.plan-menu button{display:block;width:100%;background:none;border:0;font:inherit;font-size:12px;color:var(--tx2);padding:9px 12px;text-align:left;cursor:pointer;border-radius:7px}
.plan-empty{padding:6px 0 10px}
.plan-empty-t{font-size:12px;color:var(--tx2);line-height:1.7;margin-bottom:10px}
.pl-nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl-st{font-size:10px}
.pl-nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-sx{font-size:12.5px;color:var(--tx2);white-space:nowrap}
.pl-wt{font-size:12.5px;color:var(--tx2);white-space:nowrap}
.pl-st{font-size:10.5px;text-align:right;white-space:nowrap}
.pl-st.ok{color:var(--accent)}
.pl-st.adj{color:var(--info)}
.pl-st.warn{color:var(--risk)}
.pl-st:not(.ok):not(.adj):not(.warn){color:var(--tx3)}
.pl-edit{padding:10px;border-bottom:1px solid var(--line);background:var(--panel);animation:plIn .18s ease}
@keyframes plIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.pl-edit .plan-gear{margin-top:0}
.pl-edit .plan-note{margin-top:8px}
.pl-edit-act{display:flex;gap:8px;margin-top:8px}
.plan-detail,.plan-del,.plan-swap{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);font-size:12px;cursor:pointer}
.plan-del{color:var(--risk);border-color:rgba(230,120,120,.35)}
@media(prefers-reduced-motion:reduce){.pl-edit{animation:none}}
/* 今日卡：状态驱动手风琴 */
.tr-next{font-size:11.5px;color:var(--tx3);padding:2px 2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-row{margin-bottom:8px}
html,body{touch-action:manipulation}
.drag-on{overscroll-behavior:contain}
[data-urow].dragging{position:relative;z-index:5;transition:none;box-shadow:0 10px 24px rgba(0,0,0,.35);border-radius:10px;opacity:.96}
[data-urow].dragging *{pointer-events:none}
#trToday{display:flex;flex-direction:column}
.tc-row{grid-template-columns:16px minmax(0,1fr) auto 24px!important}
.tc-row .pl-nm b{font-weight:600}
.tc-prog{font-size:11px;color:var(--tx3);white-space:nowrap;justify-self:end}
.tc-row.run::before{background:#3EC478}
.tc-row .pl-rowmore{justify-self:end}
.set-prog{font-style:normal;font-size:11px;color:var(--tx3);margin-left:6px}
.set-head .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-head .nm .set-prog{display:inline}
.set-more{margin-left:auto;flex:none}
.cd-drag{padding:0 6px 0 0;font-size:13px;color:var(--tx3)}
.cd-card{user-select:none;-webkit-user-select:none}
.tc-row,.set-card,.set-head{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tc-row .pl-drag,.set-head .pl-drag,.cd-drag{touch-action:none!important;-webkit-tap-highlight-color:transparent}
.set-card{max-width:100%;overflow:hidden}
.tc-fold:active{border-color:var(--line2)}
.tc-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.tc-fold .tc-sx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-drag{padding:6px 2px 6px 6px}
.tc-sx{font-size:11.5px;color:var(--tx2);white-space:normal;line-height:1.45;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-pr{font-size:11px;color:var(--tx3);border:1px solid var(--line2);border-radius:999px;padding:2px 7px;white-space:nowrap}
.tc-ar{font-size:11px;color:var(--tx3)}
.tc-row.done{opacity:.55}
.tc-row.done::before{background:var(--line2)}
.tc-ok{color:var(--accent);font-size:12px}
.tcf-done .tc-nm{font-size:13px}
.tcf-done .tc-sx{-webkit-line-clamp:1}
.set-card.open .set-head{cursor:pointer}
.set-head .pl-no{margin-right:5px}
.tc-row .pl-nm{gap:4px}
.tc-row .pl-nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.set-head .nm{display:flex;align-items:center;min-width:0}
.set-card{padding:8px 10px}
.set-card .set-row{padding:2px 0}
.set-more{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;margin-top:4px}
.set-head .nm{flex:1 1 auto!important;display:block!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-head .set-more{width:auto!important;flex:0 0 auto!important;margin:0 0 0 auto!important;display:block!important;gap:0!important;flex-wrap:nowrap!important}
.set-head .pl-drag{flex:0 0 auto!important}
.set-more[hidden]{display:none}
/* 卡底 +1 / −1 平铺 */
.set-foot{display:flex;align-items:stretch;gap:8px;margin-top:8px;flex-wrap:wrap}
.set-foot .tr-plus,.set-foot .tr-minus{flex:1 1 0;min-width:0;height:38px;border-radius:9px;
 font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,background .15s}
.set-foot .tr-plus{border:1px solid rgba(61,220,191,.5);background:rgba(61,220,191,.10);color:var(--accent)}
.set-foot .tr-plus:active{transform:scale(.97);background:rgba(61,220,191,.18)}
.set-foot .tr-minus{border:1px solid rgba(230,110,120,.5);background:rgba(230,110,120,.10);color:#E6808A}
.set-foot .tr-minus:active:not(:disabled){transform:scale(.97);background:rgba(230,110,120,.18)}
.set-foot .tr-minus:disabled{opacity:.38;cursor:not-allowed;color:var(--tx3);border-color:var(--line);background:none}
html[data-theme="light"] .set-foot .tr-minus{color:#C0392B;border-color:rgba(192,57,43,.4);background:rgba(192,57,43,.06)}
html[data-theme="light"] .set-foot .tr-plus{color:#0B7A68;border-color:rgba(14,143,122,.45);background:rgba(14,143,122,.08)}
.set-foot .wchip{flex:0 0 auto}
.more-btn{padding:0 10px;min-height:34px;font-size:14px;line-height:1}
.more-btn.on{color:var(--accent);border-color:var(--accent)}
/* 练后感受 */
.tr-feel{margin-top:4px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.tr-feel[hidden]{display:none}
.feel-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.feel-hd b{font-size:13.5px}
.feel-tip{font-size:11px;color:var(--tx3)}
.feel-row{display:grid;grid-template-columns:34px 1fr 46px;gap:10px;align-items:center;margin-bottom:8px}
.feel-lbl{font-size:12px;color:var(--tx3)}
.feel-val{font-size:12px;color:var(--accent);text-align:right;white-space:nowrap}
.feel-sum{display:flex;gap:16px;font-size:12.5px;color:var(--tx2)}
.feel-sum b{color:var(--accent)}
.feel-note{margin-top:8px;font-size:12.5px;color:var(--tx2);line-height:1.5}
.feel-note.dim{color:var(--tx3)}
.feel-save{margin-top:2px;display:block;width:100%}
.tr-feel input[type=range]{--p:50%;height:28px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line2) var(--p));
 border-radius:14px;background-size:100% 4px;background-repeat:no-repeat;background-position:0 center}
.log-body.feel-line{color:var(--tx3);font-size:11.5px}
.tc-feel{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;font-size:11.5px;color:var(--tx3);padding:2px 0 8px}
.tc-feel span{color:var(--accent)}
.tc-feel em{font-style:normal;color:var(--tx2);flex:1 1 100%}

/* ===== 按钮层级 ===== */
.btn{width:auto}
.btn-block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.danger{background:transparent;border:1px solid rgba(224,107,107,.55);color:#e06b6b;box-shadow:none}
.btn.danger:hover{background:rgba(224,107,107,.1);color:#e06b6b}

/* ===== 记录页快捷框 ===== */
.fast-cap{font-size:12px;font-weight:600;color:var(--tx2);letter-spacing:.5px;margin-bottom:6px}
.fast-box textarea{min-height:84px}
.fast-hint{flex:1 1 auto;min-width:0}
.fast-right{flex:0 0 auto}
.fast-save{height:36px;padding:0 18px;white-space:nowrap;flex:0 0 auto;font-size:13px;border-radius:8px}

/* ===== 头部与日志折叠 ===== */
.page-title{font-size:20px}
@media(max-width:900px){.page-title{font-size:18px}.wide-only{display:none}}
.day-block{margin-bottom:6px}
.day-tog{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;font-size:12.5px;color:var(--tx2);cursor:pointer;text-align:left;padding:0 2px}
.day-tog em{margin-left:auto;font-style:normal;color:var(--tx3);font-size:11px}
.day-ar{font-style:normal;color:var(--tx3);font-size:11px;transition:transform .18s}
.day-block.open .day-ar{transform:rotate(90deg)}
.day-body{padding-top:8px;display:flex;flex-direction:column;gap:10px}
.about-box{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:rgba(255,255,255,.02)}
.about-box summary{cursor:pointer;font-size:12.5px;color:var(--tx2);padding:12px 0;list-style:none}
.about-box summary::-webkit-details-marker{display:none}
.about-box p{margin:0 0 12px;font-size:11.5px;line-height:1.8;color:var(--tx3)}

/* 折叠修复 + 快记合并块 */
.day-body[hidden]{display:none}
.fast-box .log-detail{margin-top:10px;border-top:1px dashed rgba(128,128,128,.28);padding-top:8px}
.fast-box .log-detail>summary{cursor:pointer;font-size:11.5px;color:var(--tx2);list-style:none;padding:2px 0 6px}
.fast-box .log-detail>summary::-webkit-details-marker{display:none}

.fast-box .form{background:none;border:0;box-shadow:none;padding:0}
.fast-box .form .f-row{gap:10px}

/* 悬浮球拖动增强 */
.mode-orb{touch-action:none !important;-webkit-user-select:none;user-select:none;overscroll-behavior:contain}
.mode-orb.dragging{transition:none;cursor:grabbing}

/* 专注模式动作详情入口 */
.fm-titlerow{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.fm-titlerow .fm-name{margin:0;flex:1;min-width:0}
.fm-help{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(128,200,190,.45);background:rgba(128,200,190,.06);color:var(--tx2);font-size:15px;font-weight:600;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fm-help:active{transform:scale(.94)}
#exSheet{z-index:6100}

/* 专注模式底部按钮分级配色 */
.fm-setadd{gap:10px;align-items:center}
.fm-step{min-width:86px;height:40px;border-radius:10px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;touch-action:manipulation;transition:transform .12s,background .15s}
.fm-step:active{transform:scale(.97)}
.fm-step.plus{color:var(--accent);background:rgba(61,220,191,.13);border-color:rgba(61,220,191,.5)}
.fm-step.minus{color:#E58471;background:rgba(214,92,72,.10);border-color:rgba(214,92,72,.42)}
html[data-theme="light"] .fm-step.plus{color:#0B7A68;background:rgba(14,143,122,.10);border-color:rgba(14,143,122,.42)}
html[data-theme="light"] .fm-step.minus{color:#B5402A;background:rgba(200,72,52,.08);border-color:rgba(200,72,52,.38)}
.fm-foot .fm-nav,.fm-more .fm-mini{width:100%;height:44px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--tx2);touch-action:manipulation}
.fm-nav.prev{opacity:.9}
.fm-nav.next{border-color:rgba(61,220,191,.5);background:rgba(61,220,191,.12);color:var(--accent);font-weight:600}
.fm-nav[disabled]{opacity:.3}
.fm-mini.toggle.on{border-color:rgba(61,220,191,.5);background:rgba(61,220,191,.12);color:var(--accent)}
.fm-mini.add{border-style:dashed;border-color:rgba(255,255,255,.22);color:var(--tx2)}

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script id="engine">
/* =========================================================
 * 本地规则引擎：模拟「自我认知 Agent」的三阶段分析
 * 非真实大模型 —— 基于关键词词典 + 维度统计实时合成
 * ========================================================= */
const ENGINE = (()=>{

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = iso => { const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

const LEX = {
  time:{ morning:['早上','清晨','早起','上午','六点','7点','8点','早饭'],
         noon:['中午','下午','午后'],
         night:['晚上','深夜','凌晨','熬夜','晚睡','睡前','十点','11点','12点','一点','两点'] },
  energy:{ high:['精力好','状态好','清醒','专注','高效','精神','有劲','满血','干劲','状态在线','投入'],
           low:['累','疲惫','困','没精神','疲倦','昏沉','乏力','状态差','撑不住','虚','精疲力尽','犯困'] },
  action:{ delay:['拖延','拖','赶','临时','截止','deadline','压线','来不及','最后','踩点','拖延症'],
           focus:['专注','坚持','一口气','进入状态','心流','一口气写完','连做','认真'],
           giveup:['放弃','半途','坚持不下去','中断','搁置','没做完','三天打鱼','中途'] },
  fit:{ types:['跑步','跑','撸铁','力量','健身','瑜伽','游泳','打球','篮球','跳绳','拉伸','深蹲','卧推','引体','训练','骑行','爬山','有氧','无氧'],
        body:['体重','腰','膝盖','背','肩','伤病','疼','酸痛','恢复','睡眠不足','睡不够','肌肉','力竭','拉伸','体检'] },
  work:{ task:['开会','代码','写代码','需求','项目','汇报','报告','方案','客户','团队','review','迭代','改bug','测试','文档','评审','例会'],
         pressure:['加班','通宵','赶工','压','忙','加急','连轴','deadline','排期','紧张'] },
  mood:{ pos:['开心','轻松','满意','平静','充实','愉快','舒服','放松','爽','稳','顺'],
         neg:['焦虑','烦躁','低落','压力','崩溃','委屈','心累','慌','emo','烦','丧','内耗','紧绷'] },
  value:{ growth:['成长','学习','进步','技能','提升','读书','课','学','技术','深耕'],
          money:['收入','工资','钱','副业','赚钱','理财','涨薪','奖金'],
          health:['健康','身体','早睡','作息','锻炼','体检','元气'],
          freedom:['自由','节奏','可控','时间','自主','掌控','平衡'] }
};

const find = (log, words)=>{
  const t = (log.type)+' '+(log.tags||'')+' '+(log.content);
  const hit = words.filter(w=>t.includes(w));
  return hit;
};
const hitsIn = (dimKey, subKey, logs)=>{
  const arr=[];
  logs.forEach(log=>{
    const h = find(log, LEX[dimKey][subKey]);
    if(h.length) arr.push({log,h});
  });
  return arr;
};
const count = (arr)=>arr.length;
const uniqWords = (arr)=>[...new Set(arr.flatMap(x=>x.h))].slice(0,6);

/* 置信度：次数 >=3 高 3星，1-2 中 2星，0 低/不足 */
const conf = n => n>=3 ? {s:'高置信',c:3} : n>=1 ? {s:'中置信',c:2} : {s:'暂无足够记录',c:0};
const confStar = c => c===3?'⭐⭐⭐':c===2?'⭐⭐':'';

function analyze(logs){
  const d = {};
  d.time_m = hitsIn('time','morning',logs);
  d.time_n = hitsIn('time','noon',logs);
  d.time_ng= hitsIn('time','night',logs);
  d.energy_h = hitsIn('energy','high',logs);
  d.energy_l = hitsIn('energy','low',logs);
  d.act_delay = hitsIn('action','delay',logs);
  d.act_focus = hitsIn('action','focus',logs);
  d.act_giveup = hitsIn('action','giveup',logs);
  d.fit_types = hitsIn('fit','types',logs);
  d.fit_body = hitsIn('fit','body',logs);
  d.work_task = hitsIn('work','task',logs);
  d.work_pres = hitsIn('work','pressure',logs);
  d.mood_pos = hitsIn('mood','pos',logs);
  d.mood_neg = hitsIn('mood','neg',logs);
  d.val_growth = hitsIn('value','growth',logs);
  d.val_money = hitsIn('value','money',logs);
  d.val_health= hitsIn('value','health',logs);
  d.val_freedom= hitsIn('value','freedom',logs);
  // 类型分布
  const byType = {work:0,fit:0,life:0};
  logs.forEach(l=>{ if(byType[l.type]!=null) byType[l.type]++; });
  d.byType = byType;
  return d;
}

/* 生成「画像」HTML */
function genPersona(logs, d){
  const N = logs.length;
  const cF = n => conf(n).s;
  const li = (txt, cls='', note='')=>`<li class="${cls}">${txt} ${note}</li>`;
  let h = '';

  // 一、事实快照
  const typeMap = [['工作',d.byType.work],['健身',d.byType.fit],['生活习惯',d.byType.life]]
    .filter(x=>x[1]>0).map(x=>`${x[0]} ${x[1]} 条`).join('，');
  h += `<h2>一、事实快照</h2>`;
  h += `<p>共 ${N} 条记录，类型分布：${typeMap||'暂无'}。以下是抽样片段：</p><ul>`;
  logs.slice(-3).forEach(l=>{
    h += `<li><strong>[${esc(l.type==='work'?'工作':l.type==='fit'?'健身':'生活')}]</strong> ${esc(l.content)} <span class="conf">· ${esc(fmtT(l.time))}</span></li>`;
  });
  h += `</ul>`;

  // 二、精力节律
  const cm = count(d.time_m), cng = count(d.time_ng), ch = count(d.energy_h), cl = count(d.energy_l);
  h += `<h2>二、精力节律画像</h2><ul>`;
  const morningFav = cm>=ch && cm>0;
  if(cm>=2 || ch>=2){
    h += li(`活动记录偏集中在${cm>=cng?'白天时段':'夜间'}；${ch>=2?`多次提到「${uniqWords(d.energy_h).join('、')}」等状态词，判断白天尤其是上午精力较充沛。`:`精力状态描述有限，仅作中置信参考。`}`, morningFav?'':'', cF(Math.max(cm,ch)));
  } else {
    h += li(`精力状态线索不足，暂无法推断偏好时段。<span class="conf">${cF(0)}</span>`);
  }
  if(cl>=2){
    h += li(`存在明显的疲惫信号（命中「${uniqWords(d.energy_l).join('、')}」），且 ${cng>=2?'晚间/后半夜活动频繁，作息与精力恢复可能相互拖累':'尚未见对应作息数据'}。<span class="warn">需留意恢复</span>`, 'warn', cF(cl));
  } else if(cl>=1){
    h += li(`偶尔出现疲惫记录，暂未成稳定模式。`, '', cF(cl));
  }
  if(cng>=2){
    h += li(`记录显示晚间/后半夜仍有活动（命中「${uniqWords(d.time_ng).join('、')}」），若与低精力同时出现，是画像中的矛盾点。`, '', cF(cng));
  }
  h += `</ul>`;

  // 三、行为与执行力
  const cd = count(d.act_delay), cf = count(d.act_focus), cg = count(d.act_giveup);
  h += `<h2>三、行为与执行力特质</h2><ul>`;
  if(cd>=1||cf>=1||cg>=1){
    if(cd>=cf && cd>=1) h += li(`存在启动阻力：多次出现「${uniqWords(d.act_delay).join('、')}」，说明在缺少明确截止或兴趣的任务上，启动阶段易拖延。`, '', cF(cd));
    else if(cf>=1) h += li(`执行力偏积极：多次出现「${uniqWords(d.act_focus).join('、')}」，说明进入状态后可持续投入。`, '', cF(cf));
    if(cg>=1) h += li(`有中断记录（「${uniqWords(d.act_giveup).join('、')}」），可能反映坚持模式易受外部干扰。`, 'warn', cF(cg));
    if(cd>=1 && cf>=1) h += li(`矛盾点：既存在启动拖延、又存在进入状态后的专注，推测核心卡点可能在「开始」而非「过程」。`, '', '推断');
  } else {
    h += li(`暂无足够记录推断行为特质。${cF(0)}`);
  }
  h += `</ul>`;

  // 四、健身
  const cft = count(d.fit_types), cfb = count(d.fit_body);
  h += `<h2>四、身体 & 健身画像</h2><ul>`;
  if(cft>=1){
    h += li(`有规律的运动倾向，涉及「${uniqWords(d.fit_types).join('、')}」等，身体活跃度${cft>=3?'较高':'中等'}。`, '', cF(cft));
    if(cfb>=1) h += li(`同时出现身体反馈词（「${uniqWords(d.fit_body).join('、')}」），建议把恢复与睡眠纳入计划、与训练强度平衡。`, 'warn', cF(cfb));
  } else {
    h += li(`暂无运动类记录，无法判断健身倾向。${cF(0)}`);
  }
  h += `</ul>`;

  // 五、工作模式
  const cwt = count(d.work_task), cwp = count(d.work_pres);
  h += `<h2>五、工作认知模式</h2><ul>`;
  if(cwt>=1){
    h += li(`工作记录以「${uniqWords(d.work_task).join('、')}」为主，处于${cwt>=4?'多任务并行':'常规推进'}状态。`, '', cF(cwt));
    if(cwp>=1) h += li(`存在压力信号（「${uniqWords(d.work_pres).join('、')}」），高强度节奏若持续，可能挤占恢复与健身。`, 'warn', cF(cwp));
  } else {
    h += li(`暂无工作类记录。${cF(0)}`);
  }
  h += `</ul>`;

  // 六、情绪
  const cp = count(d.mood_pos), cn = count(d.mood_neg);
  h += `<h2>六、情绪反应模式</h2><ul>`;
  if(cp>=1||cn>=1){
    if(cn>cp) h += li(`近期负面情绪词偏多（「${uniqWords(d.mood_neg).join('、')}」），可能与工作压力/睡眠相关，是画像中的关注点。`, 'warn', cF(cn));
    else if(cp>=1) h += li(`情绪记录偏正向（「${uniqWords(d.mood_pos).join('、')}」），整体状态较稳定。`, '', cF(cp));
    if(cn>=1 && cwp>=1) h += li(`矛盾点：负面情绪与工作压力词重叠出现，提示「情绪低谷」很可能由工作节奏触发。`, '', '推断');
  } else {
    h += li(`暂无情绪类记录。${cF(0)}`);
  }
  h += `</ul>`;

  // 七、价值优先级
  const vals = [['成长',count(d.val_growth)],['健康',count(d.val_health)],['金钱',count(d.val_money)],['自由/平衡',count(d.val_freedom)]].sort((a,b)=>b[1]-a[1]);
  h += `<h2>七、内在价值优先级</h2>`;
  if(vals[0][1]>0){
    const order = vals.filter(v=>v[1]>0).map(v=>`${v[0]}(${v[1]})`).join(' → ');
    h += `<p>从记录中的关注点反推，当前价值排序：<strong>${order}</strong>。</p>`;
  } else {
    h += `<p>${cF(0)}，暂无足够记录推断价值偏好。</p>`;
  }

  // 八、校验清单
  h += `<h2>八、画像校验清单</h2><ul>`;
  const missing=[];
  if(cft===0) missing.push('健身');
  if(cwt===0) missing.push('工作');
  if(count(d.mood_pos)+count(d.mood_neg)===0) missing.push('情绪');
  if(cm+count(d.time_n)+cng===0) missing.push('作息时段');
  h += li(`矛盾点：${['启动拖延 vs 进入后专注', '夜间活动 vs 疲惫', '工作压力 vs 情绪低谷'].filter(x=>false).length? '见上文标注':'暂无明显矛盾（或数据不足）'}`, '', '');
  h += li(`缺失信息：${missing.length?missing.join('、')+' —— 建议补充对应记录以提升画像精度':'当前维度基本覆盖，可继续累积样本'}`, '', '');
  h += `</ul>`;

  // 九、摘要
  const sum = `N=${N}; 精力=${ch>=2?'白天高':'待观察'}; 执行=${cd&&cf?'启动拖/过程专':'待观察'}; 健身=${cft?'活跃':'不足'}; 情绪=${cn>cp?'偏负压':'偏稳'}; 价值top=${vals[0][1]>0?vals[0][0]:'待观察'}`;
  h += `<h2>九、画像摘要</h2><p class="sum">SUMMARY: ${sum}</p>`;

  // 十、训练压力与恢复
  try{
    const T = (typeof window.__trainData==='function') ? window.__trainData() : null;
    const recs = (T && T.records) ? T.records.filter(r=>r.date) : [];
    if(recs.length>=2){
      const day = {};
      recs.forEach(r=>{
        const d = day[r.date] = day[r.date] || {vol:0, hard:0};
        (r.groups||[]).forEach(g=>{
          if(!g.done) return;
          d.vol += (g.weight||0)*(g.reps||0);
          if(g.rpe==='hard') d.hard++;
        });
      });
      const dates = Object.keys(day).sort();
      const avgScore = ds => {
        const arr=[]; ds.forEach(d=>logs.forEach(l=>{ if((l.date||'').slice(0,10)===d && typeof l.score==='number') arr.push(l.score); }));
        return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;
      };
      const nxt = d => { const t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+1); return t.toISOString().slice(0,10); };
      const hardDates = dates.filter(d=>day[d].hard>=3);
      const otherDates = dates.filter(d=>day[d].hard<3);
      h += `<h2>十、训练压力与恢复</h2><ul>`;
      if(hardDates.length>=2 && otherDates.length>=1){
        const a = avgScore(hardDates.map(nxt)), b = avgScore(otherDates.map(nxt));
        if(a!=null && b!=null){
          const diff = a-b;
          h += li(`力竭组 ≥3 的训练日共 ${hardDates.length} 天，次日平均精力 ${a.toFixed(1)}；其余训练日次日 ${b.toFixed(1)}，差 ${diff>=0?'+':''}${diff.toFixed(1)}。${diff<-0.3?'<span class="warn">高强度后恢复偏慢，建议连续高力竭日之间插入轻量日</span>':''}`, diff<-0.3?'warn':'', cF(hardDates.length));
        } else {
          h += li(`已有 ${hardDates.length} 个高力竭训练日，但缺少对应次日的精力记录，补记后才能对比恢复情况。`, '', '');
        }
      } else {
        h += li(`高力竭训练日（单日力竭组 ≥3）目前 ${hardDates.length} 天，样本不足，暂不做压力-恢复对比。`, '', '');
      }
      // 容量趋势（按周）
      const week = {};
      dates.forEach(d=>{
        const t=new Date(d+'T00:00:00'); const k=t.getFullYear()+'-'+Math.ceil(((t-new Date(t.getFullYear(),0,1))/864e5+1)/7);
        week[k]=(week[k]||0)+day[d].vol;
      });
      const wk=Object.keys(week).sort();
      if(wk.length>=2){
        const cur=week[wk[wk.length-1]], prev=week[wk[wk.length-2]];
        const pct = prev>0 ? Math.round((cur-prev)/prev*100) : null;
        h += li(`本周总容量 ${Math.round(cur)} kg（训练容量=重量×次数），上周 ${Math.round(prev)} kg${pct!=null?`，变化 ${pct>=0?'+':''}${pct}%`:''}。${pct!=null&&Math.abs(pct)>=30?'<span class="warn">周间波动较大，注意渐进节奏</span>':''}`, (pct!=null&&Math.abs(pct)>=30)?'warn':'', cF(wk.length));
      } else {
        h += li(`容量趋势需要跨周数据，当前仅 ${wk.length} 周，继续累积。`, '', '');
      }
      const rpeN = recs.reduce((a,r)=>a+((r.groups||[]).filter(g=>g.rpe).length),0);
      h += li(`已采集带 RPE 的组共 ${rpeN} 组${rpeN<10?'（样本偏少，结论仅供参考）':'。'}`, '', '');
      h += `</ul>`;
    }
  }catch(e){}

  return h;
}

/* 生成「规划」HTML —— 依赖画像 */
function genPlan(logs, d){
  const has = x => count(x)>=1;
  const cd = count(d.act_delay);
  const cg = count(d.act_giveup);
  const energyHigh = count(d.energy_h)>=count(d.energy_l);
  const morning = count(d.time_m)>=count(d.time_ng);
  const workHeavy = count(d.work_task)>=2;
  const pressure = count(d.work_pres)>=1;
  const fitAct = count(d.fit_types)>=1;
  const bodyWarn = count(d.fit_body)>=1;

  const peak = morning ? '上午 9:00–11:30' : (energyHigh ? '状态进入后（约 10:00 起）' : '按实际精力峰值');
  const fragile = pressure||bodyWarn;
  const li = (txt, cls='', note='')=>`<li class="${cls}">${txt} ${note}</li>`;

  let h='';
  h += `<h2>一、目标对齐校验</h2><p>依据画像：当前是${workHeavy?'任务负载较高的节奏':''}${pressure?'、伴有压力信号':''}${fitAct?'、有运动习惯':''}${bodyWarn?'、但存在身体恢复提示':''}。规划以「稳住工作产出的同时，把恢复与节奏放回可控制范围」为底层目标。</p>`;

  h += `<h2>二、核心原则（由画像推导）</h2><ul>`;
  h += li(`把高难度任务排在${peak}——这是你的精力高区，不要反着用。`, '', has(d.energy_h)?conf(count(d.energy_h)).s:'');
  h += li(`${morning?'早间是相对清醒时段，适合列清单与低摩擦启动；':'晚间活动偏多，把「复盘」放在入睡前而非深度工作前。'}`, '', '');
  if(cd) h += li(`存在启动拖延：用「只做 5 分钟」的微启动降低心理门槛，先把引擎点着。`, '', '');
  if(cg) h += li(`有中断倾向：给任务设「最小完成单元」，完成一个单元即算一次闭合，减少半途感。`, '', '');
  h += `</ul>`;

  h += `<h2>三、本周滚动计划</h2><ul>`;
  h += li(`<strong class="good">P0 · 高优先：</strong>${workHeavy?'把 1 个关键产出切分为 3 个半天小步，每天完成一段':'为本周立 1 个可交付的小产出，用 5 个工作日各推进 20%'}`);
  h += li(`<strong class="good">P0 · 恢复：</strong>${fitAct?'保留健身 2 次，控制在不造成第二日疲劳的强度':'安排 3 次 30 分钟轻运动，作为精力充电而非消耗'}`);
  h += li(`<strong class="info">P1 · 中优先：</strong>睡前 30 分钟离开屏幕，记录当天气力/情绪评分`);
  h += li(`<strong class="info">P1 · 中优先：</strong>每日固定 2 个「不被打断」的时间块，各 45 分钟`);
  h += li(`<strong>P2 · 可舍弃：</strong>低价值刷信息流限时 1 次/天，作为状态切换的出口而非逃避`);
  h += `</ul>`;

  h += `<h2>四、典型单日节律模板</h2><blockquote><strong>${peak}</strong>：处理最难的一件事。<br>午后：轻量协同、会议、琐事。<br>${morning?'晚 18 点前后':'夜间'}<strong>：${fitAct?'运动':'散步/拉伸'} 30 分钟</strong>。<br>入睡前 30 分钟：复盘打分，不接触高强度内容。</blockquote>`;

  h += `<h2>五、降级预案（状态差时自动简化）</h2>`;
  h += fragile ? `<p>检测到压力/恢复风险，若某日精力极低：<strong>只保留 P0 的最小版本</strong>（当日 1 个产出单元 + 不运动），其余全部降级，别自责。</p>`
              : `<p>若某日精力不足，压缩为「1 个产出 + 1 次轻运动」，保底不崩。</p>`;

  h += `<h2>六、追踪指标（用于迭代画像）</h2><ul>`;
  h += li(`每日精力评分（1–5）、入睡时间、完成产出单元数`);
  h += li(`记录一次「今天卡在哪一步」（启动/中途/结束），用于校准行为画像`);
  h += `</ul>`;

  return h;
}

/* 生成「趋势推演」HTML */
function genTrend(logs, d){
  const workHeavy = count(d.work_task)>=3;
  const pressure = count(d.work_pres)>=1;
  const fitAct = count(d.fit_types)>=2;
  const bodyWarn = count(d.fit_body)>=1;
  const cn = count(d.mood_neg), cp = count(d.mood_pos);
  const moodNeg = cn>cp && cn>=1;
  const delay = count(d.act_delay)>=1;
  const night = count(d.time_ng)>=2;

  const ampPos = [];
  const ampNeg = [];
  if(fitAct) ampPos.push('运动习惯是显著的正向复利源：随恢复改善，工作耐力和情绪稳定性同步抬升');
  if(!night && !moodNeg) ampPos.push('作息与情绪整体稳定，是长期产出的底层保障');
  if(delay) ampNeg.push('启动拖延是负向放大器：单次拖延叠加到任务累积，会周期性制造赶工与焦虑');
  if(night && moodNeg) ampNeg.push('「夜间活动 + 情绪偏负」形成循环：睡得越晚状态越差，状态越差越容易刷手机熬夜');
  if(pressure && bodyWarn) ampNeg.push('高压工作挤占恢复，身体反馈与压力叠加，存在过劳信号');

  const interventions = [];
  if(delay) interventions.push('把最难任务固定在每天精力高区，用「5 分钟微启动」拆掉拖延门槛');
  if(night) interventions.push('把入睡时间向前移 30 分钟，切段「熬夜—低状态」循环');
  if(fitAct) interventions.push('保住运动频率这一复利源，并平衡强度保护恢复');
  if(pressure) interventions.push('为高压周主动预排降级预案，避免连轴转');

  const obs = [];
  if(moodNeg) obs.push('情绪低谷频率（每周负面记录次数）');
  if(night) obs.push('入睡时间的中位数与波动');
  if(fitAct) obs.push('运动周频与体感疲劳的匹配');
  if(workHeavy) obs.push('工作产出的完成单元数趋势');
  if(!obs.length) obs.push('开始累积记录后，先观察精力、情绪与作息的基线');
  const li = (txt, cls='', note='')=>`<li class="${cls}">${txt} ${note}</li>`;

  let h='';
  h += `<h2>一、推演前提假设</h2><ul>`;
  h += li(`在「保持当前行为模式、外部机遇与突发变量不变」的假设下推演`);
  h += li(`以下为可能性参考，不构成对未来结果的确定性预言`);
  h += `</ul>`;

  h += `<h2>二、三条情景分支</h2>`;
  h += `<span class="scenario base"><span class="scn-tag">情景A · 基准（最可能）</span>保持现状：${workHeavy?'工作量维持高位，产出稳定但节奏紧绷':'节奏平稳'}${delay?'，拖延偶发但在可接受范围':'，执行顺畅'}。${night&&moodNeg?'代价是恢复不足，状态小幅下行':'长期看状态缓慢改善'}。</span>`;
  h += `<span class="scenario good"><span class="scn-tag">情景B · 乐观（需满足条件）</span>若启动干预点（${interventions.slice(0,2).map(x=>x.split('：')[0]).join('、')}）执行 4–6 周，预计：恢复改善 → 精力与情绪更稳 → 工作产出质量与可持续性同时提升，进入正向复利。</span>`;
  h += `<span class="scenario risk"><span class="scn-tag">情景C · 风险（预警）</span>若${pressure?'高压节奏 + ':''}${night?'长期熬夜 + ':''}${moodNeg?'情绪负循环':'恢复不足'}持续叠加而无人为干预，最可能滑向过度疲劳与效率下行的阶段，届时健身与作息会成为最早被挤掉的项。</span>`;

  h += `<h2>三、正向 & 负向放大器</h2><ul>`;
  (ampPos.length?ampPos:['持续记录本身就是正向行为：数据积累会让画像越来越准，干预越来越精准']).forEach(t=>h+=li(`<span class="good">+ ${t}</span>`,''));
  (ampNeg.length?ampNeg:['暂无显著负向循环信号，但数据量仍少，需继续观察']).forEach(t=>h+=li(`<span class="warn">− ${t}</span>`,''));
  h += `</ul>`;

  h += `<h2>四、关键干预控制点（最小改动即可改变走向）</h2><ul>`;
  (interventions.length?interventions:['先从每天固定记录开始，让画像有数据可依']).forEach(t=>h+=li(t));
  h += `</ul>`;

  h += `<h2>五、需持续观测的信号</h2><ul>`;
  obs.forEach(t=>h+=li(t));
  h += `</ul>`;

  h += `<h2>六、推演局限性</h2><blockquote>本推演仅基于你过往行为模式做逻辑外推，外部机遇、突发变量会大幅改变走向；不构成职业、医疗、理财或任何重大决策依据。记录越多，推演越贴近真实。</blockquote>`;
  return h;
}

/* 空态文案 */
function genEmpty(){
  return `<div class="intro-empty">
    <div class="big">还没有可分析的记录</div>
    <p>先在「记录」页写几条日志（写一句话就能存），或点「载入示例数据」，再回到这里看画像、规划与趋势推演。</p>
  </div>`;
}

return { analyze, genPersona, genPlan, genTrend, genEmpty, esc };
})();
</script>
<script id="app">
(function(){
  const $ = id => document.getElementById(id);
  const STORE_KEY = 'selfagent_logs_v1';
  const PROFILE_KEY = 'selfagent_profile_v1';
  const SETTINGS_KEY = 'selfagent_settings_v1';

  const DEFAULT_SETTINGS = {
    types:[
      {key:'work',label:'工作',tags:['加班','代码','会议','汇报','需求']},
      {key:'fit',label:'健身',tags:['跑步','力量','瑜伽','游泳']},
      {key:'life',label:'生活习惯',tags:['作息','早起','饮食','睡眠','情绪']}
    ]
  };
  const TYPE_COLORS = ['#6D8CFF','#5FD3A0','#3DDCBF','#C77DB3','#5AA9A6','#E08A5B','#8FBF6C','#7E7BB5'];
  const MOOD_LABELS5 = ['','很糟','低落','一般','不错','很好'];
  const moodNorm = m => { m=Math.max(0,Math.min(10,parseInt(m,10)||3)); return m>5 ? Math.min(5,Math.ceil(m/2)) : (m||3); };

  let logs = [];
  try{ logs = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ logs=[]; }
  (function migrateEvents(){
    let changed=false;
    logs.forEach(l=>{
      if(!l.id){ l.id='e'+Date.now()+Math.random().toString(36).slice(2,7); changed=true; }
      if(!l.kind){
        const isAuto = /^(训练（自动同步）：|今日训练：)/.test(l.content||'') || /^(autotr-|tr\d)/.test(String(l.id));
        l.kind = isAuto ? 'train' : 'log';
        l.source = isAuto ? 'auto' : 'manual';

    let ch=false;

      arr.forEach(l=>{

          const p=merged[key];
          p.groups=(p.groups||[]).map((g,i)=>{ const g2=(it.groups||[])[i]; if(!g2) return g;
            return {no:g.no, reps:Math.max(g.reps||0,g2.reps||0), weight:Math.max(g.weight||0,g2.weight||0),

  const INFER_KW = {
    fit:['跑步','跑了','公里','深蹲','卧推','硬拉','引体','练了','练完','游泳','瑜伽','骑行','打球','撸铁','举铁','有氧','锻炼','健身','km'],

    life:['睡了','没睡好','熬夜','熬到','失眠','起床','起不来','早餐','午餐','午饭','晚饭','刷手机','焦虑','累','烦躁','情绪','作息','喝水','散步']
  };
  const TAG_HINT = [
    {tag:'跑步', re:/跑|公里|km/i}, {tag:'力量', re:/深蹲|卧推|硬拉|引体|撸铁|举铁/},
    {tag:'瑜伽', re:/瑜伽/}, {tag:'游泳', re:/游泳/},
    {tag:'加班', re:/加班/}, {tag:'代码', re:/代码|bug|debug|写代码/},
    {tag:'会议', re:/开会|会议/}, {tag:'需求', re:/需求|方案|评审/},
    {tag:'作息', re:/睡|起床|起不来|熬夜|熬到|失眠/}, {tag:'饮食', re:/早餐|午饭|晚饭|吃/},
    {tag:'情绪', re:/焦虑|烦躁|压力|情绪/}
  ];
  function hitWords(text){
    const t=(text||'').toLowerCase(), out=[];
    Object.keys(INFER_KW).forEach(k=>{ (INFER_KW[k]||[]).forEach(w=>{ if(w && t.indexOf(String(w).toLowerCase())>=0) out.push(w); }); });
    TAG_HINT.forEach(h=>{ if(h.re.test(t)) out.push(h.tag); });
    return Array.from(new Set(out));
  }
  function evidenceHtml(){
