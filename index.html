  const ASK_DK = d => { const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
  function askWindow(q){
    const now=new Date();
    const back=n=>{ const s=new Date(now); s.setDate(s.getDate()-n); return [ASK_DK(s), ASK_DK(now), '近'+(n+1)+'天']; };
    if(/今天|今日/.test(q)) return [ASK_DK(now), ASK_DK(now), '今天'];
    if(/昨天/.test(q)){ const y=new Date(now); y.setDate(y.getDate()-1); return [ASK_DK(y), ASK_DK(y), '昨天']; }
    if(/本周|这周|这星期|这一周/.test(q)){ const s=new Date(now); const wd=(s.getDay()+6)%7; s.setDate(s.getDate()-wd); return [ASK_DK(s), ASK_DK(now), '本周']; }
    if(/上周/.test(q)){ const e=new Date(now); const wd=(e.getDay()+6)%7; e.setDate(e.getDate()-wd-1); const s=new Date(e); s.setDate(s.getDate()-6); return [ASK_DK(s), ASK_DK(e), '上周']; }
    if(/本月|这个月/.test(q)){ const s=new Date(now.getFullYear(), now.getMonth(), 1); return [ASK_DK(s), ASK_DK(now), '本月']; }
    if(/上月|上个月/.test(q)){ const s=new Date(now.getFullYear(), now.getMonth()-1, 1); const e=new Date(now.getFullYear(), now.getMonth(), 0); return [ASK_DK(s), ASK_DK(e), '上月']; }
    if(/近30|一个月|30天/.test(q)) return back(29);
    if(/近14|两周/.test(q)) return back(13);
    if(/全部|所有|一直|总共|累计/.test(q)) return ['0000-00-00', ASK_DK(now), '全部'];
    return back(6);
  }
  const PART_RE = /背|胸|腿|臀|肩|臂|腹|腰腹|小腿|前臂|颈|有氧/;
  function askScope(a,b){
    const win = d => (d||'')>=a && (d||'')<=b;
    const lg = (logs||[]).filter(l=>l.kind!=='train' && win(l.date));
    const tr = (logs||[]).filter(l=>l.kind==='train' && win(l.date));
    const recs = ((train.records||[]).filter(r=>win(r.date)));
    return {win, lg, tr, recs};
  }
  function evRefHtml(items){
    if(!items.length) return '';
    return `<div class="ask-src"><span class="ask-src-t">依据 ${items.length} 条</span>`+
      items.slice(0,6).map(o=>`<button type="button" class="ev-chip" data-ev="${o.id}">${o.label}</span>`.replace('</span>','')+'</button>').join('')+`</div>`;
  }
  function answerAsk(q){
    q=String(q||'').trim(); if(!q) return null;
    const [a,b,rangeLabel]=askWindow(q);
    const sc=askScope(a,b);
    const fmt=n=>Math.round(n).toLocaleString();
    const dayShort=d=>{ const p=d.split('-'); return (+p[1])+'/'+(+p[2]); };
    const evOf=(l)=>({id:l.id, label:dayShort(l.date||'')+' '+(l.kind==='train'?'训练 · ':'')+String(l.content||'').slice(0,14)});
    const esc=ENGINE.esc;

    /* 1) 加班 × 睡眠/精力 关系 */
    if(/(加班|工作|压力).*(睡|精力|状态|情绪)|(睡|精力|状态|情绪).*(加班|工作)/.test(q)){
      const over=(logs||[]).filter(l=>l.kind!=='train' && /加班|熬夜|熬到/.test((l.content||'')+' '+(l.tags||'')));
      const next={};
      over.forEach(l=>{ const d=new Date((l.date||'')+'T00:00:00'); d.setDate(d.getDate()+1); next[ASK_DK(d)]=true; });
      const after=(logs||[]).filter(l=>l.kind!=='train' && next[l.date||'']);
      const calm=(logs||[]).filter(l=>l.kind!=='train' && !next[l.date||'']);
      const avg=arr=>{ const v=arr.filter(l=>typeof l.score==='number'&&l.score>0).map(l=>l.score); return v.length?v.reduce((x,y)=>x+y,0)/v.length:null; };
      const A=avg(after), C=avg(calm);
      if(A==null || C==null || over.length<2){
        return {title:'还不知道', main:'加班记录或次日精力样本不足（至少 2 次加班 + 有次日记录）。', sub:'多记几天再问，我不猜。', refs:over.map(evOf)};
      }
      const diff=(A-C);
      const verdict = Math.abs(diff)<0.3 ? '几乎没差别' : (diff<0?'明显更低':'反而更高');
      return {title:'加班 × 次日精力', range:rangeLabel,
        main:`加班后的第二天精力平均 ${A.toFixed(1)}，其它日子 ${C.toFixed(1)}，${verdict}（差 ${Math.abs(diff).toFixed(1)}）。`,
        sub:`加班 ${over.length} 次 · 有次日记录的 ${after.length} 天。基于你范围内的 ${sc.lg.length} 条日志，样本不大时只作参考。`,
        refs:over.map(evOf).concat(after.map(evOf)).slice(0,8)};
    }

    /* 2) 部位 / 最久没练 */
    if(/最久|多久没|没练/.test(q)){
      const parts=['胸','背','腿','肩','臂','腰腹','有氧'];
      const last={};
      (train.records||[]).forEach(r=>{ if(PART_RE.test(r.part||'')){ const k=(r.part||'').match(PART_RE)[0]; if(!last[k]||r.date>last[k]) last[k]=r.date; } });
      const rows=parts.map(p=>({p, d:last[p]||''})).filter(r=>r.d).sort((x,y)=> x.d<y.d?-1:1);
      if(!rows.length) return {title:'最久未练部位', range:'全部记录', main:'还没有带部位的训练记录，先练一次我就能算了。', sub:'', refs:[]};
      const top=rows[0];
      const days=Math.round((Date.now()-new Date(top.d+'T00:00:00').getTime())/864e5);
      return {title:'最久未练部位', range:'全部记录',
        main:`${top.p} 已经 ${days} 天没练（上次 ${top.d}）。`,
        sub: rows.map(r=>r.p+' · '+dayShort(r.d)+'（'+Math.round((Date.now()-new Date(r.d+'T00:00:00').getTime())/864e5)+' 天前）').join(' ／ '),
        refs:[]};
    }

    /* 3) 训练类：次数 / 组数 / 容量 / 部位 */
    if(/练了几次|训练几次|练了[几多]|几次训练|训练了|练了多少|几次/.test(q) || /(组|容量|总重|强度)/.test(q)){
      const part=(q.match(PART_RE)||[])[0]||'';
      const recs=part ? sc.recs.filter(r=>(r.part||'').indexOf(part)>=0) : sc.recs;
      if(!recs.length) return {title:'范围内没有训练', range:rangeLabel, main:`${rangeLabel}没有${part?'练'+part+'的':''}训练记录。`, sub:'去训练页排个计划，练完自动记账。', refs:[]};
      const days={}; recs.forEach(r=>days[r.date]=true);
      let sets=0, vol=0, done=0;
      recs.forEach(r=>{ const gs=(r.groups&&r.groups.length)?r.groups:[]; sets += gs.length||r.sets||0;
        gs.forEach(g=>{ if(g.done){ done++; if(!g.warmup) vol += (g.reps||0)*(g.weight||0); } }); });
      const partCnt={}; recs.forEach(r=>{ const k=(r.part||'其他'); partCnt[k]=(partCnt[k]||0)+1; });
      const topPart=Object.keys(partCnt).sort((x,y)=>partCnt[y]-partCnt[x])[0];
      if(/(容量|总重|强度|公斤|kg)/.test(q)){
        return {title:'训练容量', range:rangeLabel,
          main:`${rangeLabel}完成 ${done} 组，总容量 ${fmt(vol)} kg${part?'（只看'+part+'）':''}。`,
          sub:`${Object.keys(days).length} 个训练日 · ${recs.length} 个动作 · 平均每次 ${fmt(vol/Math.max(1,Object.keys(days).length))} kg`,
          refs:sc.tr.map(evOf)};
      }
      if(/组/.test(q)){
        return {title:'训练组数', range:rangeLabel, main:`${rangeLabel}计划 ${sets} 组，完成 ${done} 组${part?'（'+part+'）':''}。`,
          sub:`完成率 ${sets?Math.round(done/sets*100):0}% · ${Object.keys(days).length} 个训练日`, refs:sc.tr.map(evOf)};
      }
      return {title:'训练次数', range:rangeLabel,
        main:`${rangeLabel}练了 ${Object.keys(days).length} 天，共 ${recs.length} 个动作${part?'（'+part+'）':''}。`,
        sub:`最常练：${topPart}（${partCnt[topPart]} 次） · 完成 ${done} 组 · 容量 ${fmt(vol)} kg`,
        refs:sc.tr.map(evOf)};
    }

    /* 4) 精力/情绪 极值 */
    if(/状态|精力|情绪|心情|感觉/.test(q)){
      const good=/最好|最高|最棒|最佳|巅峰|精力好|状态好/.test(q);
      const pool=sc.lg.filter(l=>typeof l.score==='number'&&l.score>0);
      const moodPool=sc.lg.filter(l=>typeof l.mood==='number'&&l.mood>0);
      if(!pool.length && !moodPool.length) return {title:'没有可比的记录', range:rangeLabel, main:`${rangeLabel}还没有带精力/情绪的记录。`, sub:'写日志时拖动精力与情绪滑条，我就能做极值对比。', refs:[]};
      const useMood=/情绪|心情/.test(q);
      const val=l=>useMood?moodNorm(l.mood):l.score;
      const arr=(useMood?moodPool:pool).slice().sort((x,y)=>val(x)-val(y));
      const pick=good? arr[arr.length-1] : arr[0];
      const key=useMood?'mood':'score';
      const avg=arr.reduce((s,l)=>s+val(l),0)/arr.length;
      return {title:`${rangeLabel}${good?'状态最好':'状态最差'}的一天`, range:rangeLabel,
        main:`${pick.date}（${pick.date===ASK_DK(new Date())?'今天':dayShort(pick.date)}）${useMood?'情绪':'精力'} ${useMood?moodNorm(pick.mood):pick.score}/5，${good?'高于':'低于'}平均 ${avg.toFixed(1)}。`,
        sub:esc(String(pick.content||'').slice(0,60)) || '（这条没有正文）',
        refs:[evOf(pick)]};
    }

    /* 5) 睡眠 / 作息 */
    if(/睡|作息|熬夜/.test(q)){
      const hits=sc.lg.filter(l=>/睡|熬夜|作息/.test((l.content||'')+' '+(l.tags||'')));
      if(!hits.length) return {title:'睡眠记录还没有', range:rangeLabel, main:`${rangeLabel}没有提到睡眠的记录。`, sub:'写一条"昨晚一点才睡"，我就能开始看你的作息。', refs:[]};
      const avg=hits.filter(l=>l.score>0).map(l=>l.score);
      const mean=avg.length?avg.reduce((x,y)=>x+y,0)/avg.length:null;
      return {title:'作息记录', range:rangeLabel, main:`${rangeLabel}提到睡眠 ${hits.length} 次${mean?`，这些日子平均精力 ${mean.toFixed(1)}`:''}。`,
        sub:'想更准，可以连着记几天同一时间的入睡状态。', refs:hits.map(evOf)};
    }

    /* 6) 关键词 / 高频 */
    if(/最常|高频|关键词|频繁|最多/.test(q)){
      const cnt={};
      sc.lg.forEach(l=>{ String(l.tags||'').split(/[,、，]/).filter(Boolean).forEach(t=>cnt[t]=(cnt[t]||0)+1);
        String(l.content||'').replace(/[，,。、\s]+/g,' ').split(' ').filter(w=>w.length>=2).slice(0,8).forEach(w=>cnt[w]=(cnt[w]||0)+1); });
      const top=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x]).slice(0,6);
      if(!top.length) return {title:'关键词还不够', range:rangeLabel, main:'范围内记录太少，看不出高频词。', sub:'多记几条再问。', refs:[]};
      return {title:'高频词', range:rangeLabel, main: top.map(k=>`${k}（${cnt[k]}）`).join(' · '), sub:`基于 ${sc.lg.length} 条日志`, refs:[]};
    }

    /* 7) 记录条数 / 摘要（兜底） */
    if(/几条|多少条|记录数|记了多少/.test(q)){
      return {title:'记录量', range:rangeLabel, main:`${rangeLabel}写了 ${sc.lg.length} 条日志、${sc.tr.length} 张训练卡。`, sub:'日志与训练分开统计，都按记录日归档。', refs:[]};
    }
    const dayCnt={}; sc.lg.forEach(l=>dayCnt[l.date]=true);
    const moodAvg=(()=>{ const v=sc.lg.filter(l=>l.mood>0).map(l=>moodNorm(l.mood)); return v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(1):'—'; })();
    return {title:rangeLabel+' 概况', range:rangeLabel,
      main:`${sc.lg.length} 条日志 · ${Object.keys(dayCnt).length} 个记录日 · 平均情绪 ${moodAvg} · ${sc.recs.length} 个训练动作。`,
      sub:'可以继续问：训练次数 / 组数 / 容量 / 状态最差的一天 / 加班和睡眠 / 最久没练的部位。',
      refs:sc.lg.slice(0,4).map(evOf)};
  }
  function aiAskEnhance(q, r, box){

    box.appendChild(bar);
    aiAsk(q, r, box).then(out=>{
      const a=box.querySelector('.ask-a'); if(!a) return;

        const l=(logs||[]).find(x=>String(x.id)===m);
        if(!l) return m;
        const p=String(l.date||'').split('-');
        return '（'+((p[1]||'')+'/'+(p[2]||''))+'：'+String(l.content||'').slice(0,12)+'…）';
      });
      a.innerHTML='<b>AI 回答</b><p>'+ENGINE.esc(pretty(out.answer))+'</p>'+
        '<div class="ask-sub">'+(out.confidence!=null?('置信度 '+Math.round(out.confidence*100)+'% · '):'')+'模型 '+ENGINE.esc(aiCfg().model)+' · 原文依据见下</div>';
      const ids=(out.evidence||[]).filter(Boolean);

        src.innerHTML='<span class="ask-src-t">依据 '+ids.length+' 条</span>'+ids.map(id=>{

        }).join('');

      if(bar) bar.remove();

      setTimeout(()=>{ try{ bar.remove(); }catch(e3){} }, 4500);
    });
  }

      <div class="ins-follow"><button type="button" data-fq="本周">换成本周</button><button type="button" data-fq="近14天">近 14 天</button><button type="button" data-fq="全部记录">全部记录</button><button type="button" data-fq="why">为什么？</button></div>

  /* ==================== Agent 接入层：规则引擎 / LLM 共用同一份契约 ==================== */
  const AI_KEY='selfagent_ai_v1';
  const AIC_KEY='selfagent_ai_cache_v1';
  const AI_CONTRACT={
    persona:['energy','mood','fitness','work','values'],
    plan:['focus','sessions','rationale'],
    trend:['baseline','scenarios','watch'],
    ask:['answer','evidence','confidence']
  };
  let __aiCfg=null;
  function aiCfg(){
    if(__aiCfg) return __aiCfg;
    let c={}; try{ c=JSON.parse(localStorage.getItem(AI_KEY)||'{}')||{}; }catch(e){}
    __aiCfg={engine:(c.engine==='api'?'api':'rule'), base:String(c.base||'').trim(), key:String(c.key||'').trim(),
      model:String(c.model||'deepseek-chat').trim(), anon:c.anon!==false, count:+c.count||0, tokens:+c.tokens||0,
      last:+c.last||0, lastFp:String(c.lastFp||'')};
    return __aiCfg;
  }
  function aiSave(patch){
    const c=Object.assign({}, aiCfg(), patch||{});
    const raw={engine:c.engine,base:c.base,key:c.key,model:c.model,anon:c.anon,count:c.count,tokens:c.tokens,last:c.last,lastFp:c.lastFp};
    try{ localStorage.setItem(AI_KEY, JSON.stringify(raw)); }catch(e){}
    __aiCfg=raw; return c;
  }
  function aiReady(){ const c=aiCfg(); return c.engine==='api' && !!c.base && !!c.key; }
  function aiUsage(u, chars){
    const c=aiCfg();
    let tk=(u&&u.total_tokens)?u.total_tokens:Math.ceil((chars||0)/1.6);
    if(!isFinite(tk)||tk<0) tk=0;
    aiSave({count:c.count+1, tokens:c.tokens+tk, last:Date.now()});
    return tk;
  }

  function aiChat(o){
    o=o||{};
    const c=aiCfg();
    if(!c.base||!c.key) return Promise.reject(new Error('未配置 AI'));
    const base=c.base.replace(/\/+$/,'');
    const url=base.indexOf('/chat/completions')>=0 ? base : base+'/chat/completions';
    const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    const to=setTimeout(()=>{ try{ ctrl&&ctrl.abort(); }catch(e){} }, 60000);
    const body={model:c.model||'deepseek-chat',
      messages:[{role:'system',content:(o.system||'')+(aiMemText()?('\n\n【长期记忆】\n'+aiMemText()):'')},
        {role:'user',content:o.image?[{type:'text',text:o.user||''},{type:'image_url',image_url:{url:o.image}}]:(o.user||'')}],
      temperature:(o.temp!=null?+o.temp:0.4), stream:!!o.stream};
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify(body), signal:ctrl?ctrl.signal:undefined}).then(r=>{
      if(!r.ok){ clearTimeout(to); return r.text().catch(()=>'').then(t=>{ throw new Error('HTTP '+r.status+(t?' · '+String(t).slice(0,80):'')); }); }
      if(!o.stream){
        return r.json().then(j=>{
          clearTimeout(to); aiUsage(j.usage, 0);
          const str=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
          if(o.onLine) String(str).split(/\r?\n/).forEach(x=>{ const t=x.trim(); if(t) try{ o.onLine(t); }catch(e){} });
          return str;
        });
      }
      const rd=r.body.getReader(), dec=new TextDecoder();
      let buf='', full='', lineBuf='';
      const pump=()=>rd.read().then(({done,value})=>{
        if(done){
          clearTimeout(to); aiUsage(null, full.length);
          if(lineBuf.trim() && o.onLine) try{ o.onLine(lineBuf.trim()); }catch(e){}
          return full;
        }
        buf+=dec.decode(value,{stream:true});
        let idx;
        while((idx=buf.indexOf('\n'))>=0){
          const raw=buf.slice(0,idx).replace(/\r$/,''); buf=buf.slice(idx+1);
          if(raw.indexOf('data:')!==0) continue;
          const data=raw.slice(5).trim();
          if(data==='[DONE]') continue;
          let j; try{ j=JSON.parse(data); }catch(e){ continue; }
          const d=(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';
          if(!d) continue;
          full+=d; lineBuf+=d;
          if(o.onDelta) try{ o.onDelta(d, full); }catch(e){}
          let nl;
          while((nl=lineBuf.indexOf('\n'))>=0){
            const ln=lineBuf.slice(0,nl).trim(); lineBuf=lineBuf.slice(nl+1);
            if(ln && o.onLine) try{ o.onLine(ln); }catch(e){}
          }
        }
        return pump();
      });
      return pump();
    }).catch(e=>{
      clearTimeout(to);
      if(e&&e.name==='AbortError') throw new Error('请求超时');
      const raw=String(e&&e.message||e);
      if(/Failed to fetch|NetworkError|Load failed|ERR_|net::/i.test(raw)) throw new Error('网络不可达');
      throw (e instanceof Error)?e:new Error(raw);
    });
  }

  function aiJSON(t){
    const s=String(t||'').trim();
    const i=s.indexOf('{'), j=s.lastIndexOf('}');
    if(i<0||j<=i) return null;
    try{ return JSON.parse(s.slice(i,j+1)); }catch(e){ return null; }
  }
  const MEM_KEY='selfagent_agent_memory_v1';

  /* ---------- 事件归一 / 统计摘要 / 三级压缩 ---------- */
  function aiP2(n){ return String(n).padStart(2,'0'); }
  function aiDayStr(t){ const d=new Date(t); return d.getFullYear()+'-'+aiP2(d.getMonth()+1)+'-'+aiP2(d.getDate()); }
  function aiMask(t){
    return String(t||'')
      .replace(/1\d{10}/g,'[手机号]')
      .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[邮箱]')
      .replace(/身份证[:：]?\d{6,}/g,'身份证[已隐去]');
  }
  function aiStat(){
    const lg=((typeof logs!=='undefined'?(logs||[]):[])).filter(l=>l.kind!=='train');
    const recs=(typeof train!=='undefined'&&train&&Array.isArray(train.records))?train.records:[];
    const types=(typeof settings!=='undefined'&&settings&&Array.isArray(settings.types))?settings.types:[];
    const lab=k=>{ const t=types.find(x=>x.key===k); return t?t.label:('其他'); };
    const sc=lg.filter(l=>typeof l.score==='number'&&l.score>0).map(l=>l.score);
    const md=lg.filter(l=>l.mood>0).map(l=>moodNorm(l.mood));
    const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const tmap={}; lg.forEach(l=>{ tmap[l.type]=(tmap[l.type]||0)+1; });
    const tagmap={}; lg.forEach(l=>{ String(l.tags||'').split(/[,、，]/).filter(Boolean).forEach(t=>tagmap[t]=(tagmap[t]||0)+1); });
    const daySet={}; lg.forEach(l=>{ if(l.date) daySet[l.date]=1; });
    const dates=Object.keys(daySet).sort();
    let done=0, vol=0, rpe={easy:0,ok:0,hard:0};
    const partLast={};
    recs.forEach(r=>{
      (Array.isArray(r.groups)?r.groups:[]).forEach(g=>{ if(!g.done) return; done++; if(!g.warmup) vol+=(g.reps||0)*(g.weight||0); if(g.rpe&&rpe[g.rpe]!=null) rpe[g.rpe]++; });
      const pt=(r.part||''); if(pt){ if(!partLast[pt]||r.date>partLast[pt]) partLast[pt]=r.date; }
    });
    const weeks=[];
    for(let w=3;w>=0;w--){
      const lo=Date.now()-(w+1)*7*864e5, hi=Date.now()-w*7*864e5;
      let v=0,n=0;
      recs.forEach(r=>{ const t=new Date((r.date||'')+'T00:00:00').getTime(); if(t>lo&&t<=hi){ n++; (r.groups||[]).forEach(g=>{ if(g.done&&!g.warmup) v+=(g.reps||0)*(g.weight||0); }); } });
      weeks.push({w:'T-'+(w+1), n:n, v:Math.round(v)});
    }
    const gaps={};
    Object.keys(partLast).forEach(p=>{ gaps[p]=Math.round((Date.now()-new Date(partLast[p]+'T00:00:00').getTime())/864e5); });
    return {logsN:lg.length, days:dates.length, from:dates[0]||'', to:dates[dates.length-1]||'',
      energy:mean(sc), mood:mean(md), streak:(typeof streakDays==='function'?streakDays():0),
      tmap:Object.keys(tmap).sort((a,b)=>tmap[b]-tmap[a]).map(k=>lab(k)+'×'+tmap[k]),
      tags:Object.keys(tagmap).sort((a,b)=>tagmap[b]-tagmap[a]).slice(0,6).map(k=>k+'×'+tagmap[k]),
      recs:recs.length, done:done, vol:Math.round(vol), rpe:rpe, gaps:gaps, weeks:weeks,
      lg:lg, recsRaw:recs};
  }
  function aiDigest(slim){
    const st=aiStat();
    const c=aiCfg();
    const anon=c.anon!==false;
    const f1=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1);
    const lines=[];
    lines.push('【统计摘要】');
    lines.push('日志 '+st.logsN+' 条 / '+st.days+' 个记录日 / 跨度 '+(st.from||'—')+' ~ '+(st.to||'—')+' / 连续打卡 '+st.streak+' 天');
    lines.push('平均精力 '+f1(st.energy)+'/5 · 平均情绪 '+f1(st.mood)+'/5');
    if(st.tmap.length) lines.push('类型分布：'+st.tmap.join(' · '));
    if(st.tags.length) lines.push('高频标签：'+st.tags.join(' · '));
    lines.push('训练：'+st.recs+' 个动作 / 完成 '+st.done+' 组 / 总容量 '+st.vol+' kg / RPE 轻松'+st.rpe.easy+' 适中'+st.rpe.ok+' 吃力'+st.rpe.hard);
    const gaps=Object.keys(st.gaps);
    if(gaps.length) lines.push('各部位距今天数：'+gaps.map(p=>p+' '+st.gaps[p]+' 天').join(' / '));
    lines.push('近 4 周（旧→新）动作数/容量：'+st.weeks.map(w=>w.w+': '+w.n+' / '+w.v+'kg').join(' | '));
    const now=Date.now();
    const recent=st.lg.filter(l=>{ const t=new Date(l.time||'');
      return now-t.getTime()<=14*864e5; }).slice(-40);
    if(recent.length){
      lines.push(''); lines.push('【近 14 天记录原文】');
      recent.forEach(l=>{
        lines.push((l.date||aiDayStr(l.time||''))+' 精力'+(l.score||0)+' 情绪'+(l.mood||0)+
          (l.tags?' ['+l.tags+']':'')+'｜'+((c.anon!==false)?aiMask(String(l.content||'').slice(0,70)):String(l.content||'').slice(0,70)));
      });
    }
    const older=st.lg.filter(l=>{ const t=new Date(l.time||''); return now-t.getTime()>14*864e5; });
    if(older.length && !slim){
      const mm={}; older.forEach(l=>{ const k=String(l.date||'').slice(0,7); mm[k]=(mm[k]||0)+1; });
      const kws={};
      older.forEach(l=>{ String(l.content||'').replace(/[，,。、\s]+/g,' ').split(' ').filter(w=>w.length>=2).slice(0,6).forEach(w=>kws[w]=(kws[w]||0)+1); });
      lines.push(''); lines.push('【更早记录（仅摘要）】');
      lines.push('按月份：'+Object.keys(mm).sort().map(k=>k+' '+mm[k]+' 条').join(' · '));
      lines.push('关键词：'+Object.keys(kws).sort((a,b)=>kws[b]-kws[a]).slice(0,10).join(' · '));
    }
    const p=(typeof profile!=='undefined'?profile:{})||{};
    const ptxt=[p.gender,p.age,p.job,p.height,p.weight].filter(Boolean).join(' / ');
    if(ptxt){ lines.push(''); lines.push('【人物档案】'+ptxt); }
    const text=lines.join('\n');
    return {text:text, tokens:Math.ceil(text.length/1.6), anon:anon, st:st};
  }
  function aiFingerprint(){
    const lg=((typeof logs!=='undefined'?(logs||[]):[])); const recs=((typeof train!=='undefined'&&train&&train.records)||[]);
    const s=[lg.length, recs.length, (lg[lg.length-1]||{}).id||'', (recs[recs.length-1]||{}).date||'',
      JSON.stringify((typeof profile!=='undefined'?profile:{})||{}).length, aiCfg().model].join('|');
    let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
    return h.toString(36);
  }

  /* ---------- 报告 / 问答的 LLM 实现 ---------- */
  function aiCacheAll(){ try{ return JSON.parse(localStorage.getItem(AIC_KEY)||'{}')||{}; }catch(e){ return {}; } }
  function aiCacheGet(tab, fp, ttl){
    /* 命中也必须带 data，否则视为未命中 */
    const all=aiCacheAll(); const it=all[tab];
    if(!it || it.fp!==fp) return null;
    if(ttl && (Date.now()-it.ts)>ttl) return null;
    return it;
  }
  function aiCacheDel(tab){
    const all=aiCacheAll(); if(all[tab]){ delete all[tab]; try{ localStorage.setItem(AIC_KEY, JSON.stringify(all)); }catch(e){} }
  }
  function aiCacheSet(tab, fp, data){
    const all=aiCacheAll(); all[tab]={fp:fp, ts:Date.now(), data:data};
    const keys=Object.keys(all).filter(k=>k.indexOf('ins:')!==0);
    if(keys.length>8) keys.slice(0,keys.length-8).forEach(k=>{ delete all[k]; });
    try{ localStorage.setItem(AIC_KEY, JSON.stringify(all)); }catch(e){}
  }
  function aiSecHtml(o){
    const ps=(Array.isArray(o.p)?o.p:[String(o.p||'')]).map(x=>'<p>'+ENGINE.esc(String(x))+'</p>').join('');
    return '<div class="ai-sec"><div class="ai-sec-t">'+ENGINE.esc(String(o.t||''))+'</div>'+ps+
      '<div class="ai-sec-src">AI · '+ENGINE.esc(aiCfg().model)+'</div></div>';
  }
  const AI_SYS='你是 SelfAgent 的自我认知教练，只依据用户给出的记录做归纳，不编造数字、不做医疗诊断。'+
    '输出必须是纯 NDJSON（每行一个 JSON 对象），不要代码块、不要解释、不要多余文字，字段严格按用户要求。';
  function aiReport(tab, box, onState){
    const d=aiDigest(tab==='persona'?false:true);
    const spec=AI_CONTRACT[tab];
    const askSection={persona:'8-12 节：精力节律、情绪与触发源、工作模式、训练执行、恢复、价值观与动力、风险点、可执行建议',
      plan:'5-8 节：本周重点、每次训练的动作与组数建议（含重量建议）、负荷安排、恢复与睡眠安排、卡点与替代方案',
      trend:'5-7 节：当前基线、三种情景（维持/加强/过载）各自 2-4 周后的样子、早期预警信号、干预点'}[tab];
    const usr=[
      '契约字段：'+spec.join(', '),
      '输出格式：第 1 行 {"oneline":"一句 20 字内的总判断"}；之后每行 {"t":"节标题","p":["段落1","段落2"]}。',
      '要求：'+askSection+'。每节 1-3 段，每段不超过 60 字，必须有数字或引用具体记录，禁止空话。',
      '', '【用户数据】', d.text
    ].join('\n');
    const out={oneline:'',sections:[]};
    let shown=0;
    return aiChat({system:AI_SYS, user:usr, stream:!!box, temp:0.35, onLine:line=>{
      let o; try{ o=JSON.parse(line); }catch(e){ return; }
      if(o.oneline && !out.oneline){ out.oneline=String(o.oneline); }
      if(o.t && (o.p||o.para)){
        const sec={t:String(o.t), p:(Array.isArray(o.p)?o.p:[o.p||o.para]).map(String)};
        out.sections.push(sec);
        if(box){ const el=document.createElement('div'); el.innerHTML=aiSecHtml(sec); box.appendChild(el.firstChild); shown++; if(onState) onState(shown); }
      }
    }}).then(()=>{
      if(!out.sections.length) throw new Error('输出格式不符');
      return out;
    });
  }
  function aiRenderReport(tab, data){
    const secs=(data.sections||[]).map(aiSecHtml).join('');
    const one=data.oneline?'<div class="ai-one">'+ENGINE.esc(data.oneline)+'</div>':'';
    return '<div class="ai-report" data-ai="'+tab+'">'+one+secs+'</div>';
  }

  /* ---------- 问答 ---------- */
  function aiAskCtx(q){
    const st=aiStat();
    const hist=(window.__askHist||[]).slice(-3);
    const related=[];
    const kw=String(q||'').replace(/[？?。，,\s]/g,'').slice(0,8);
    (st.lg||[]).slice(-60).forEach(l=>{
      if(kw && (String(l.content||'').indexOf(kw.slice(0,2))>=0 || (l.tags||'').indexOf(kw.slice(0,2))>=0)) related.push(l);
    });
    return {hist:hist, related:related.slice(0,6)};
  }
  function aiAsk(q, ruleAns, box){
    const c=aiAskCtx(q);
    const d=aiDigest(true);
    const refs=(ruleAns&&ruleAns.refs)||[];
    const usr=[
      '输出：第 1 行 {"answer":"2-3 句中文回答，先给结论再给依据"}；第 2 行 {"evidence":["记录id",...],"confidence":0-1}。',
      '可引用的记录 id：'+refs.map(r=>r.id).join(', '),
      (c.hist.length?('\n【对话历史】'+c.hist.map(h=>'问：'+h.q+'\n答：'+String(h.a||'').slice(0,120)).join('\n')):''),
      '\n【用户问题】'+q,
      '\n【数据】'+d.text
    ].join('\n');
    const out={answer:'', evidence:[], confidence:null};
    return aiChat({system:AI_SYS, user:usr, stream:false, temp:0.3, onLine:line=>{
      let o; try{ o=JSON.parse(line); }catch(e){ return; }
      if(o.answer) out.answer=String(o.answer);
      if(Array.isArray(o.evidence)) out.evidence=o.evidence.map(String);
      if(o.confidence!=null) out.confidence=+o.confidence;
    }}).then(()=>{
      if(!out.answer) throw new Error('空回答');
      return out;
    });
  }

  /* 把模型输出收敛成一句可直接显示的话（防 JSON、防长句、防引号） */
  function aiOneLine(t, max){
    let s=String(t==null?'':t).split(/\r?\n/).map(x=>x.trim()).filter(Boolean)[0]||'';
    if(s.charAt(0)==='{' || s.charAt(0)==='['){
      try{
        let o=JSON.parse(String(t).trim());
        if(Array.isArray(o)) o=o[0]||{};
        s=o.answer||o.insight||o.rationale||o.oneline||o.text||'';
        s=String(s);
      }catch(e){}
    }
    s=s.replace(/^["'「『]+|["'」』]+$/g,'').replace(/\s+/g,' ').trim();
    const n=max||60;
    return s.length>n ? s.slice(0,n)+'…' : s;
  }

  function aiHomeInsight(){
    if(!aiReady()) return;
    const box=document.getElementById('homeSignals'); if(!box) return;
    if(((typeof logs!=='undefined'?(logs||[]):[])).length<3) return;
    const fp=aiFingerprint();

    const d=aiDigest(true);

      user:'最近数据：\n'+d.text, stream:false, temp:0.4}).then(t=>{

      if(!line){ aiSigShow('模型没给出可用观察，点此重试', true); return; }
      aiCacheSet('ins:'+fp, fp, line);

    }).catch(e=>{

  function aiSigShow(text, retry){
    const box=document.getElementById('homeSignals'); if(!box) return;
    let el=box.querySelector('.sig.ai');

    el.innerHTML='<b style="font-weight:600">AI 观察：</b>'+ENGINE.esc(String(text));
    el.onclick=retry ? ()=>{ aiCacheDel('ins:'+aiFingerprint()); aiHomeInsight(); } : null;
    el.style.cursor = retry ? 'pointer' : '';
    return el;
  }

  /* ---------- 快记输入联想 ---------- */
  function attachSuggest(inp){
    if(!inp || inp.dataset.sug) return; inp.dataset.sug='1';
    const box=document.createElement('div'); box.className='sug';
    if(inp.parentNode) inp.parentNode.insertBefore(box, inp.nextSibling);
    const fill=()=>{
      const v=(inp.value||'').trim();
      if(v.length<3){ box.innerHTML=''; return; }
      const seen={}, hits=[];
      (logs||[]).forEach(l=>{
        const t=(l.content||'').trim();
        if(!t || t.length<v.length || t===v) return;
        if(t.indexOf(v)>=0 && !seen[t]){ seen[t]=1; hits.push(t); }
      });
      // 也匹配“相同开头”的短句
      (logs||[]).forEach(l=>{
        const t=(l.content||'').trim();
        if(t.length>=6 && t.slice(0,3)===v.slice(0,3) && !seen[t] && hits.length<6){ seen[t]=1; hits.push(t); }
      });
      const list=hits.slice(0,3).filter(t=>t.length<=60).map(t=>`<button type="button" class="sug-i">${ENGINE.esc(t)}</button>`).join('');
      box.innerHTML=list;

        inp.value=b.textContent; inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,6*22)+'px';
        box.innerHTML=''; inp.focus();
      }));
    };
    inp.addEventListener('input',fill);
    inp.addEventListener('blur',()=>setTimeout(()=>{ box.innerHTML=''; },160));
  }

  /* ---------- 洞察 Feed：规则引擎产出 insights[]（与 LLM 契约同构） ---------- */
  let __feed={items:[],tab:'persona'};
  function insAgg(){
    const now=Date.now(), ms=864e5;
    const lg=(logs||[]).filter(l=>l.kind!=='train');
    const win=(arr,a,b)=>arr.filter(l=>{ const t=now-new Date(l.time||(l.date+'T12:00:00')).getTime(); return t>a && t<=b; });
    const avg=(arr,k)=>{ const v=arr.map(l=>l[k]).filter(x=>typeof x==='number'&&x>=0); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
    const moodAvg=arr=>{ const v=arr.map(l=>moodNorm(l.mood)).filter(x=>x>0); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
    const R=win(lg,0,7*ms), P=win(lg,7*ms,14*ms);
    const rAvg=avg(R,'score'), pAvg=avg(P,'score'), rMood=moodAvg(R), pMood=moodAvg(P);
    const rec7=(train.records||[]).filter(r=>{ const t=now-new Date((r.date||'')+'T00:00:00').getTime(); return t<=7*ms && t>=0; });
    const recP=(train.records||[]).filter(r=>{ const t=now-new Date((r.date||'')+'T00:00:00').getTime(); return t>7*ms && t<=14*ms; });
    const sets7=rec7.reduce((a,b)=>a+(b.sets||0),0), setsP=recP.reduce((a,b)=>a+(b.sets||0),0);
    const days7=Array.from(new Set(rec7.map(r=>r.date))).length;
    const night=lg.filter(l=>{ const h=new Date(l.time||(l.date+'T12:00:00')).getHours(); return h>=23||h<=3; });
    const nd=d=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+1); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
    const chk=d=>d||'';
    const nightNext={};
    night.forEach(l=>{ const d=(l.date||'').slice(0,10); if(d) nightNext[nd(d)]=true; });
    const aN=lg.filter(l=>nightNext[(l.date||'').slice(0,10)]);
    const aO=lg.filter(l=>!nightNext[(l.date||'').slice(0,10)]);
    const nA=avg(aN,'score'), nO=avg(aO,'score');
    const nightDiff=(nA!=null&&nO!=null&&aN.length>=2)?(nA-nO):null;
    const anx=win(lg,0,14*ms).filter(l=>/焦虑|烦|压抑|崩溃|累到|情绪低|失眠/.test(String((l.content||'')+' '+(l.tags||''))));
    const evOf=l=>({id:l.id, label:((l.date||'').slice(5)||'')+' '+String(l.content||'').slice(0,8)});
    return {now,ms,lg,R,P,rAvg,pAvg,rMood,pMood,rec7,recP,sets7,setsP,days7,night,nightDiff,anx,evOf};
  }
  function insPartGap(){
    const now=Date.now();
    const last={};
    (train.records||[]).forEach(r=>{ if(!r.part) return; const p=(r.part||'').match(/胸|背|腿|臀|肩|臂|腹|腰腹|有氧/)||[]; const k=p[0]||r.part; if(!last[k]||r.date>last[k]) last[k]=r.date; });
    let worst=null;
    Object.keys(last).forEach(k=>{ const g=Math.round((now-new Date(last[k]+'T00:00:00').getTime())/864e5); if(g>=0 && (!worst||g>worst.gap)) worst={part:k,gap:g,date:last[k]}; });
    return worst;
  }
  function insStall(){
    const byEx={};
    (train.records||[]).sort((a,b)=>(a.date>b.date?1:-1)).forEach(r=>{ if(!r.exId||!r.weight) return; (byEx[r.exId]=byEx[r.exId]||[]).push(r); });
    let best=null;
    Object.keys(byEx).forEach(k=>{
      const rs=byEx[k].slice(-3);
      if(rs.length<2) return;
      const w0=rs[rs.length-1].weight, w1=rs[rs.length-2].weight;
      if(Math.abs(w0-w1)>0.01) return;
      const gap=Math.round((Date.now()-new Date(rs[rs.length-1].date+'T00:00:00').getTime())/864e5);
      if(gap>21) return;
      if(!best || rs.length>best.n) best={n:rs.length, name:rs[rs.length-1].name||'该动作', weight:w0, exId:rs[rs.length-1].exId, recs:rs};
    });
    return best;
  }
  function genInsights(){

    const f1=v=>v==null?null:(Math.round(v*10)/10).toFixed(1);
    const push=o=>{ if(o) out.push(o); };
    /* 精力 */

        conf:'基于 '+(g.R.length+g.P.length)+' 条记录', refs:g.R.slice().sort((a,b)=>(a.score||5)-(b.score||5)).slice(0,3).map(g.evOf)});

        why:'7 天均值对比：本周 '+f1(g.rAvg)+' vs 上周 '+f1(g.pAvg)+'，保持当前作息',
        conf:'基于 '+(g.R.length+g.P.length)+' 条记录', refs:g.R.slice(-3).map(g.evOf)});
    }
    /* 作息 → 次日精力 */
    if(g.nightDiff!=null){
      const bad=g.nightDiff<0;
      push({cat:'rest',catLabel:'作息',lv:bad?'warn':'up',
        head:'深夜记录后的次日精力 '+(bad?'低 ':'高 ')+f1(Math.abs(g.nightDiff)),
        why:'深夜（23:00 后）记录 '+g.night.length+' 次，这些日子的次日精力均值 '+(f1(g.nightDiff)==null?'':f1(g.nightDiff))+(bad?'，比其余日子低 ':'，比其余日子高 ')+f1(Math.abs(g.nightDiff))+' 分',
        conf:'深夜记录 '+g.night.length+' 条', refs:g.night.slice(-4).map(g.evOf)});
    }
    /* 情绪 */
    if(g.rMood!=null && g.rMood<=3.5){
      const w=g.anx.length>=3?('近 14 天有 '+g.anx.length+' 条记录提到焦虑/疲劳/失眠'):('本周情绪均值 '+f1(g.rMood)+'，偏低');
      push({cat:'mood',catLabel:'情绪',lv:'warn',head:w,
        why:'情绪均值 '+f1(g.rMood)+'/5'+(g.anx.length?('，关键词命中 '+g.anx.length+' 条'):''),
        conf:'基于 '+g.R.length+' 条本周记录', refs:g.anx.slice(-4).map(g.evOf)});
    } else if(g.rMood!=null && g.rMood>=4){
      push({cat:'mood',catLabel:'情绪',lv:'up',head:'本周情绪稳定在 '+f1(g.rMood)+'/5', why:'7 天情绪均值 '+f1(g.rMood)+'，无连续低分记录', conf:'基于 '+g.R.length+' 条记录', refs:g.R.slice(-3).map(g.evOf)});
    }
    /* 训练停滞 → 可加重量 */
    const st=insStall();
    if(st) push({cat:'fit',catLabel:'健身',lv:'up',head:st.name+' 连续 '+st.n+' 次都是 '+st.weight+'kg，可以试 '+(st.weight*1.05).toFixed(1).replace('.0','')+'kg',
      why:'最近 '+st.n+' 次同重量、无递增，按 5% 递增推算', conf:'基于 '+st.n+' 次记录', refs:st.recs.map(r=>({id:r.id||'', label:(r.date||'').slice(5)+' '+st.name})), act:{kind:'planAdd', exId:st.exId, label:'按上次参数加入今日'}});
    /* 部位空窗 */
    const pg=insPartGap();

      why:'上次训练 '+(pg.date||'')+'，其它部位间隔都更短', conf:'基于全部训练记录', refs:[], act:{kind:'gotoPlan', label:'去排计划'}});
    /* 训练量 */
    if(g.sets7||g.setsP){
      const d=g.sets7-g.setsP;
      push({cat:'fit',catLabel:'训练',lv:(d>=0?'up':'warn'),head:'本周 '+g.sets7+' 组 · '+(g.setsP===0?'上周没有训练记录':(d>=0?'比上周多 '+d:'比上周少 '+Math.abs(d))+' 组'),
        why:g.days7+' 个训练日，上周 '+g.setsP+' 组', conf:'基于 '+g.rec7.length+' 条训练记录', refs:[]});
    }
    /* 有氧 */
    try{
      const now=Date.now(), ms=864e5;
      const cds=(train.cardio||[]);
      const cd7=cds.filter(c=>{ const t=now-new Date((c.date||'')+'T00:00:00').getTime(); return t<=7*ms&&t>=0; });
      const cdMin=cd7.filter(c=>c.done).reduce((a,c)=>a+(c.dur||0),0);
      const cdAllDone=cd7.length&&cd7.every(c=>c.done);

      const nxt=d=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+1); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };

      const y0=e.touches[0].clientY, x0=e.touches[0].clientX;

          if(y-y0>9 && Math.abs(y-y0)>Math.abs(x-x0)+4){ dragging=true; panel.classList.add('dragging'); }

        }

      };

        panel.style.transition='transform .2s var(--ease)';
        if(dy>86){
          panel.style.transform='translateY(105%)';
          setTimeout(()=>{ CLOSE.close(host); panel.style.transition=''; panel.style.transform=''; panel.classList.remove('dragging'); }, 200);
        }else{
          panel.style.transform='';

        }
      };
      const cleanup=()=>{ document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up); document.removeEventListener('touchcancel',up); };

      document.addEventListener('touchend',up);

    document.querySelectorAll('.msheet.arch').forEach(x=>x.remove());
    const t=new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const lbl={persona:'画像',plan:'规划',trend:'推演'}[tab]||'报告';
    let ai=null; try{ ai=aiCacheAll()[tab]; }catch(e){}
    let rule='';
    try{
      const d=ENGINE.analyze(logs);
      rule = tab==='persona' ? (briefHtml()+rptChartHtml()+evidenceHtml()+profileSummaryHtml()+'<h1>个人画像报告 · Persona</h1><div class="kicker">基于 '+logs.length+' 条记录</div>'+ENGINE.genPersona(logs,d))
        : tab==='plan' ? ENGINE.genPlan(logs,d) : ENGINE.genTrend(logs,d);
    }catch(e){ rule='<div class="ai-empty">规则版生成失败。</div>'; }
    const el=document.createElement('div'); el.className='msheet arch';
    el.innerHTML='<div class="msheet-box arch-box"><div class="ms-head"><b>'+lbl+'报告归档</b><button class="ms-x" type="button" data-ax>×</button></div>'+
      '<div class="arch-body">'+
      '<div class="arch-t">AI 版 · '+(ai?'生成于 '+new Date(ai.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'尚未生成')+'</div>'+
      (ai?aiRenderReport(tab, ai.data):'<div class="ai-empty">在分析页点「生成分析」后，完整 AI 报告会出现在这里。</div>')+
      '<div class="arch-t">内置规则版 · 现在 '+t+' 重算</div>'+rule+
      '</div></div>';
    document.body.appendChild(el);
    el.onclick=ev=>{ if(ev.target===el) el.remove(); };
    el.querySelector('[data-ax]').onclick=()=>el.remove();
    if(tab==='persona'){ try{ drawRptCharts(); }catch(e){} }
  }

  /* ---------- 报告渲染 ---------- */
  function renderReport(){
    disposeCharts();
    const body=$('reportBody');
    const btn=$('btnGen');
    if(btn) btn.style.display = 'none';
    if(currentTab==='logs'){ renderLogsPanel(); return; }
    if(currentTab==='stats'){ renderStatsPanel(); return; }
    if(currentTab==='train'){ renderTrainPanel(); return; }
    if(currentTab==='profile'){ renderSettingsPanel(); return; }
    if(!logs.length){ body.innerHTML=ENGINE.genEmpty(); return; }
    const d=ENGINE.analyze(logs);
    const stamp=fmtTime(new Date().toISOString());
    const out={};
    out[currentTab] = currentTab==='plan' ? feedPlanHtml() : currentTab==='trend' ? feedTrendHtml() : feedPersonaHtml();
    body.innerHTML=(['persona','plan','trend'].includes(currentTab)?'<div id="aiBox"></div>':'')+out[currentTab];
    try{ bindFeed(body); }catch(e){}
    setTimeout(()=>{ const b=body.querySelector('[data-emptywrite2]'); if(b) b.onclick=()=>{ try{ openPage('record'); }catch(e){} }; },0);
    try{ initAsk(); }catch(e){}
    if(['persona','plan','trend'].includes(currentTab)){ try{ aiFillReport(currentTab); }catch(e){} }
    if(btn) btn.textContent = '已自动同步 · '+logs.length+' 条记录';
    document.querySelectorAll('details.report-fold').forEach(dt=>{
      if(dt.__bound) return; dt.__bound=true;
      dt.addEventListener('toggle',()=>{ if(dt.open) chartInsts.forEach(c=>{ try{c.resize();}catch(e){} }); });
    });
  }

  /* ---------- 页面路由 ---------- */
  const PAGE_EL={home:'pageHome',record:'pageRecord',agent:'pageAgent',log:'pageLog',setting:'pageSetting'};
  const PAGE_NAV={home:'navHome',record:'navRecord',agent:'navAgent',log:'navLog',setting:'navSet'};
  const SLOT={record:'slotRecord',agent:'slotAgent',log:'slotLog',setting:'slotSet'};
  const TAB_PAGE={persona:'agent',plan:'agent',trend:'agent',logs:'log',stats:'log',train:'record',profile:'setting'};
  const PAGE_TAB={agent:['persona','plan','trend'],log:['logs','stats']};
  let currentPage='record';

  function showPage(p){
    ['pageHome','pageRecord','pageAgent','pageLog','pageSetting'].forEach(id=>{ const el=$(id); if(el) el.hidden=true; });
    const el=$(PAGE_EL[p]); if(el) el.hidden=false;
    const slot=$(SLOT[p]), body=$('reportBody');
    if(slot&&body&&body.parentNode!==slot) slot.appendChild(body);
    if(body) body.dataset.tone = (p==='agent' ? 'info' : '');
    const pgA=$('pageAgent'); if(pgA) pgA.dataset.tone = (p==='agent' ? 'info' : '');
    currentPage=p;
    ['navHome','navRecord','navAgent','navLog','navSet'].forEach(id=>{ const n=$(id); if(n) n.classList.toggle('on', id===PAGE_NAV[p]); });
    document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.page===p));
  }
  function syncTabs(){ document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===currentTab)); }
  function markStepIdx(n){
    const map={1:'record',2:'agent',3:'agent',4:'agent',5:'log',6:'log',7:'record',8:'setting'};
    const pg=map[n]||'record';
    ['navRecord','navAgent','navLog','navSet'].forEach(id=>{ const el=$(id); if(el) el.classList.toggle('on', id===PAGE_NAV[pg]); });
  }
  function openPage(p){
    try{ if(document.getElementById('focusMode')) closeFocus(); }catch(e){}
    if(p!=='setting'){ try{ if((location.hash||'').indexOf('#setting')===0) history.replaceState(null,'',location.pathname+location.search); window.__setPanel=''; }catch(e){} }
    if(p==='home'){ showPage('home'); syncTabs(); renderHome(); window.scrollTo({top:0}); try{ coachOnPage('home'); }catch(e){} return; }
    if(p==='record') currentTab='train';
    else if(PAGE_TAB[p]) currentTab = PAGE_TAB[p].includes(currentTab) ? currentTab : PAGE_TAB[p][0];
    else currentTab='profile';
    showPage(p); syncTabs(); renderReport();
    if(p==='log'){ try{ trRenderToday(); renderLogs(); }catch(e){} }
    window.scrollTo({top:0});
    try{ coachOnPage(p); }catch(e){}
    if(p==='agent'){ try{ mileMark('insight'); }catch(e){} }
  }
  function goTab(tab){
    const pg=TAB_PAGE[tab]||'agent';
    currentTab=tab; showPage(pg); syncTabs(); renderReport(); window.scrollTo({top:0});
  }
  ['navHome','navRecord','navAgent','navLog','navSet'].forEach(id=>{
    const el=$(id); if(!el) return;
    el.addEventListener('click',()=>openPage(el.dataset.page));
  try{
    document.addEventListener('focusout',function(e){
      var t=e.target;
      if(!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
      setTimeout(function(){
        try{
          if(document.documentElement.scrollLeft!==0) document.documentElement.scrollLeft=0;
          if(document.body && document.body.scrollLeft!==0) document.body.scrollLeft=0;
          if(document.documentElement.scrollTop<0) document.documentElement.scrollTop=0;
        }catch(err){}
      },60);
    },true);
  }catch(e){}
  });
  function bindTabbar(){
    document.querySelectorAll('#tabbar button').forEach(b=>{
      if(b.__b) return; b.__b=1;
      b.addEventListener('click',()=>openPage(b.dataset.page));
    });
  }
  bindTabbar();
  window.addEventListener('DOMContentLoaded',bindTabbar);
  window.addEventListener('load',bindTabbar);
  document.addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(!t||!t.dataset.tab) return;
    goTab(t.dataset.tab);
  });
  $('btnGen').addEventListener('click',()=>renderReport());
  const orbBtn=$('trainOrb');
  if(orbBtn) orbBtn.addEventListener('click',()=>{
    const recs=train.records.filter(r=>r.date===trDateVal());
    if(!recs.length){ openPage('record'); try{ trToast('先去挑几个动作，再回来点开始训练'); }catch(e){} return; }
    const allDone=recs.every(r=>ensureGroups(r).every(g=>g.done));
    if(allDone){ try{ showTrainSummary(); }catch(e){} return; }
    openFocus();
  });
  ['homeGoRec','homeGoAgent'].forEach((id,i)=>{ const b=$(id); if(b) b.addEventListener('click',()=>openPage(i?'agent':'record')); });

  /* 日志改日期（补记昨天） */
  const P2=n=>String(n).padStart(2,'0');
  document.addEventListener('click',e=>{
    const el=e.target.closest && e.target.closest('.log-time[data-lid]'); if(!el) return;
    const cur=logs.find(x=>String(x.id)===String(el.dataset.lid)); if(!cur) return;
    const d=new Date(cur.time);
    const inp=document.createElement('input');
    inp.type='date'; inp.className='log-date'; inp.dataset.lid=cur.id;
    inp.value=d.getFullYear()+'-'+P2(d.getMonth()+1)+'-'+P2(d.getDate());
    el.replaceWith(inp); try{ inp.focus(); }catch(_){}
  });
  document.addEventListener('change',e=>{
    const inp=e.target;
    if(!inp || !inp.classList || !inp.classList.contains('log-date') || !inp.value) return;
    const cur=logs.find(x=>String(x.id)===String(inp.dataset.lid)); if(!cur) return;
    const v=inp.value.split('-').map(Number);
    const d=new Date(cur.time); d.setFullYear(v[0],v[1]-1,v[2]);
    cur.time=d.toISOString();
    logs.sort((a,b)=>new Date(a.time)-new Date(b.time));
    save(); renderLogs(); renderReport(); trToast('已改到 '+inp.value);
  });
  const _bTrain=$('btnTrain'); if(_bTrain) _bTrain.addEventListener('click',()=>{
    if(currentPage!=='record') openPage('record');
    const slot=$('slotRecord'); if(slot) slot.scrollIntoView({behavior:'smooth',block:'start'});
  });
  const _bToLog=$('btnToLog'); if(_bToLog) _bToLog.addEventListener('click',()=>goTab('logs'));

  /* init */
  try{ refreshLogForm(); }catch(e){ console.warn('init:refreshLogForm',e); }
  try{ renderLogs(); }catch(e){ console.warn('init:renderLogs',e); }
  try{ renderReport(); }catch(e){ console.warn('init:renderReport',e); }
  try{ openPage('home'); }catch(e){ console.warn('init:openPage',e); }

  /* ---------- 情境式教练（Coach Marks）：用到才教，每条独立只出现一次 ---------- */
  const COACH_KEY='selfagent_coach_v1';
  function coachState(){ try{ return JSON.parse(localStorage.getItem(COACH_KEY)||'{}'); }catch(e){ return {}; } }
  function coachSeen(k){ try{ return !!coachState()[k]; }catch(e){ return true; } }
  function coachMark(k){ const st=coachState(); st[k]=1; try{ localStorage.setItem(COACH_KEY, JSON.stringify(st)); }catch(e){} }
  function coach(k, text, anchor, opts){
    if(!text) return false;
    if(document.getElementById('focusMode')) return false;
    if(document.getElementById('coach')) return false;
    opts=opts||{};
    if(!opts.replay && coachSeen(k)) return false;
    const t=(typeof anchor==='string')? document.querySelector(anchor): anchor;
    if(!t) return false;
    if(!opts.replay) coachMark(k);
    const w=document.createElement('div'); w.id='coach'; w.className='coach-mask';
    w.innerHTML='<div class="tour-hole off" id="coachHole"></div><div class="tour-tip coach-tip" id="coachTip"></div>';
    document.body.appendChild(w);
    const hole=w.querySelector('#coachHole'), tip=w.querySelector('#coachTip');
    const close=()=>{
      try{ w.remove(); }catch(e){}
      window.removeEventListener('resize', place);
      if(typeof opts.onClose==='function'){ try{ opts.onClose(); }catch(e){} }
    };
    const place=()=>{
      const r=t.getBoundingClientRect();
      if(r.width<2||r.height<2){ hole.className='tour-hole off'; }
      else{
        hole.className='tour-hole';
        hole.style.left=(r.left-6)+'px'; hole.style.top=(r.top-6)+'px';
        hole.style.width=(r.width+12)+'px'; hole.style.height=(r.height+12)+'px';
      }
      const vw=window.innerWidth, vh=window.innerHeight;
      const tw=tip.offsetWidth||300, th=tip.offsetHeight||120;
      const cx=Math.min(Math.max(12, r.left+r.width/2-tw/2), vw-tw-12);
      let top;
      if(r.top+6 > vh*0.52) top=Math.max(12, r.top-12-th);
      else top=Math.min(vh-th-12, r.bottom+12);
      if(top<8||top+th>vh-8) top=Math.max(12, vh-th-16);
      tip.style.left=Math.round(cx)+'px'; tip.style.top=Math.round(top)+'px';
    };
    tip.style.left='0px'; tip.style.top='0px';
    tip.innerHTML=`<div class="tour-k">提示</div><p>${text}</p>
      <div class="coach-acts"><button class="btn sm" type="button" data-cclose>知道了</button></div>`;
    tip.querySelector('[data-cclose]').onclick=close;
    w.addEventListener('click',ev=>{ if(!ev.target.closest('#coachTip')) close(); });
    window.addEventListener('resize', place);
    place();
    return true;
  }
  function coachOrbIntro(){
    if(document.getElementById('coach')) return;
    if(document.getElementById('onboard')){ setTimeout(()=>{ try{ coachOrbIntro(); }catch(e){} }, 1200); return; }
    if(window.__coachReplaying) return;
    if(!coachAuto() || coachAutoUsed()) return;
    if(coach('orb','悬浮球：点一下随手记，长按换挡到训练模式','#modeOrb')) coachAutoCap();
  }
  function coachAuto(){ try{ return localStorage.getItem('selfagent_coach_auto')!=='0'; }catch(e){ return true; } }
  function coachAutoUsed(){ try{ return sessionStorage.getItem('__coach_auto')==='1'; }catch(e){ return false; } }
  function coachAutoCap(){ try{ sessionStorage.setItem('__coach_auto','1'); }catch(e){} }
  function hasDoneSet(){
    try{
      if(typeof train==='undefined' || !train) return false;
      return (train.records||[]).some(r=>Array.isArray(r.groups) ? r.groups.some(g=>g.done) : (r.sets||0)>0);
    }catch(e){ return false; }
  }
  function coachOnPage(p){
    if(window.__coachReplaying) return;
    if(document.getElementById('onboard')) return;
    if(!coachAuto()) return;
    if(p==='record') setTimeout(()=>{
      if(coachAutoUsed() || hasDoneSet()) return;
      if(coach('train','每组做完点一下勾，会自动开始休息倒计时','#trStart')) coachAutoCap();
    }, 420);
    else if(p==='agent') setTimeout(()=>{
      let n=0; try{ n=(typeof logs!=='undefined'?logs.length:0); }catch(e){}
      if(coachAutoUsed() || n>=3) return;
      if(coach('insight','记录满 3 条就能生成第一版画像，去试试？','#btnGen')) coachAutoCap();
    }, 420);
  }
  function coachReplay(){
    const q=[
      {k:'orb', page:'home', anchor:'#modeOrb', text:'悬浮球：点一下随手记，长按换挡到训练模式'},
      {k:'train', page:'record', anchor:'#trStart', text:'每组做完点一下勾，会自动开始休息倒计时'},
      {k:'tick', page:'record', anchor:'#trStart', text:'倒计时结束会提醒你；RPE 三档顺手点一下，AI 分析会用到'},
      {k:'insight', page:'agent', anchor:'#btnGen', text:'记录满 3 条就能生成第一版画像，去试试？'}
    ];
    if(document.getElementById('coach')) return;
    let i=0;
    window.__coachReplaying=1;
    const next=()=>{
      if(i>=q.length){ window.__coachReplaying=0; try{ trToast('引导演示结束'); }catch(e){} return; }
      const it=q[i++];
      try{ openPage(it.page); }catch(e){}
      setTimeout(()=>{
        if(!coach(it.k, it.text, it.anchor, {replay:true, onClose:next})) next();
      }, 280);
    };
    next();
  }
  document.addEventListener('click',ev=>{
    const t=ev.target;
    if(t && t.closest && t.closest('#camPick')){
      ev.preventDefault();
      try{ camOpen(); }catch(e){ console.warn('cam',e); }
    }
  });

  const _tourBtn=document.getElementById('homeTour');
  if(_tourBtn) _tourBtn.addEventListener('click',()=>{ try{ coachReplay(); }catch(e){ console.warn('coach',e); } });

})();
</script>
<script>
/* ===== 云端数据库同步（Supabase REST） ===== */
(function(){
  var K={logs:'selfagent_logs_v1',settings:'selfagent_settings_v1',profile:'selfagent_profile_v1',training:'selfagent_training_v1'};
  var CK='selfagent_cloud_v1', TABLE='selfagent_state';
  var cfg={url:'',key:'',secret:''};
  try{ var raw=localStorage.getItem(CK); if(raw){ var o=JSON.parse(raw); if(o&&o.url) cfg.url=o.url; if(o&&o.key) cfg.key=o.key; if(o&&o.secret) cfg.secret=o.secret; } }catch(e){}
  var queue={}, timer=null;
  var _set=Storage.prototype.setItem;

  function on(){ return !!(cfg.url && cfg.key && cfg.secret); }
  function base(){ return cfg.url.replace(/\/+$/,''); }
  function hdrs(extra){ var h={'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'}; if(extra){ for(var k in extra){ h[k]=extra[k]; } } return h; }
  function setMsg(t){ var el=document.getElementById('cloudMsg'); if(el) el.textContent=t; }
  function norm(v){ try{ return JSON.parse(v); }catch(e){ return v; } }

  function pushOne(k,v){
    return fetch(base()+'/rest/v1/'+TABLE,{
      method:'POST',
      headers:hdrs({'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify([{k:k,secret:cfg.secret,v:norm(v),updated_at:new Date().toISOString()}])
    }).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r; });
  }

  function flush(){
    if(!on()) return;
    var ks=Object.keys(queue); if(!ks.length) return;
    var batch={}; ks.forEach(function(k){ batch[k]=queue[k]; delete queue[k]; });
    var ps=ks.map(function(k){ return pushOne(k,batch[k]).catch(function(){}); });
    Promise.all(ps).then(function(){
      if(Object.keys(queue).length){ flush(); return; }
      setMsg('已同步到云端 · '+new Date().toLocaleTimeString());
    });
  }
  function schedule(k,v){ queue[k]=v; clearTimeout(timer); timer=setTimeout(flush,700); }

  Storage.prototype.setItem=function(k,v){
    _set.call(this,k,v);
    if(!on() || k===CK) return;
    for(var key in K){ if(K[key]===k){ schedule(key,v); return; } }
  };

  function pushAll(){
    if(!on()){ setMsg('请先填写并保存配置'); return; }
    var n=0;
    Object.keys(K).forEach(function(k){ var v=localStorage.getItem(K[k]); if(v){ queue[k]=v; n++; } });
    if(!n){ setMsg('本机暂无数据'); return; }
    setMsg('正在上传 '+n+' 项…'); flush();
  }

  function pull(quiet){
    if(!on()){ if(!quiet) setMsg('请先填写并保存配置'); return; }
    fetch(base()+'/rest/v1/'+TABLE+'?secret=eq.'+encodeURIComponent(cfg.secret)+'&select=k,v,updated_at',{headers:hdrs()})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rows){
        var map={}; (rows||[]).forEach(function(r){ map[r.k]=r; });
        var restored=0;
        Object.keys(K).forEach(function(key){
          var r=map[key]; if(!r) return;
          var cur=localStorage.getItem(K[key]);
          var v=typeof r.v==='string' ? r.v : JSON.stringify(r.v);
          if(cur===null){ _set.call(localStorage,K[key],v); restored++; }
        });
        if(restored){ setMsg('已从云端恢复 '+restored+' 项，正在刷新…'); setTimeout(function(){ location.reload(); },600); }
        else if(!quiet) setMsg('云端已是最新 · 共 '+(rows||[]).length+' 项');
      })
      .catch(function(e){ setMsg('拉取失败：'+e.message); });
  }

  document.addEventListener('click',function(e){
    var id=e.target && e.target.id;
    if(id==='cloudSave'){
      var u=document.getElementById('cloudUrl'), k=document.getElementById('cloudKey'), sc=document.getElementById('cloudSecret');
      cfg.url=(u&&u.value||'').trim(); cfg.key=(k&&k.value||'').trim(); cfg.secret=(sc&&sc.value||'').trim();
      localStorage.setItem(CK, JSON.stringify(cfg));
      if(!on()){ setMsg('三项都填写后才能连接'); return; }
      setMsg('已保存，开始上传…'); pushAll(); pull(true);
    }
    if(id==='cloudPush'){ pushAll(); }
    if(id==='cloudPull'){ pull(false); }
  });

  window.__cloudFill=function(){
    var u=document.getElementById('cloudUrl'); if(!u) return;
    u.value=cfg.url||'';
    var k=document.getElementById('cloudKey'); if(k) k.value=cfg.key||'';
    var sc=document.getElementById('cloudSecret'); if(sc) sc.value=cfg.secret||'';
    setMsg(on()? ('已连接 '+base()) : '未配置：数据只存本机浏览器');
  };

  (function recSeg(){
    const seg=document.getElementById('recSeg');
    const ink=document.getElementById('recSegInk');
    const wrapLog=document.getElementById('recLogWrap');
    const wrapTrain=document.getElementById('recTrainWrap');
    const guide=document.getElementById('recGuide');
    if(!seg) return;
    const KEY='selfagent_recseg_v1';
    const isMob=()=>window.matchMedia('(max-width:640px)').matches;
    function paint(panel, animate){
      const btn=[...seg.querySelectorAll('.m-seg-btn')].find(b=>b.dataset.panel===panel) || seg.querySelector('.m-seg-btn');
      seg.querySelectorAll('.m-seg-btn').forEach(b=>b.classList.toggle('on', b===btn));
      if(ink) ink.classList.toggle('right', btn.dataset.panel==='log');
      const mob=isMob();
      if(wrapTrain) wrapTrain.hidden = mob ? btn.dataset.panel!=='train' : false;
      if(wrapLog) wrapLog.hidden = mob ? btn.dataset.panel!=='log' : false;
      if(guide) guide.hidden = !(mob && btn.dataset.panel==='train');
      if(mob && animate){
        const el = btn.dataset.panel==='train' ? wrapTrain : wrapLog;
        if(el){ el.classList.remove('panel-in'); void el.offsetWidth; el.classList.add('panel-in'); }
      }
    }
    function current(){ try{ return localStorage.getItem(KEY) || 'train'; }catch(e){ return 'train'; } }
    seg.addEventListener('click', ev=>{
      const b=ev.target.closest('.m-seg-btn'); if(!b) return;
      paint(b.dataset.panel, true);
      try{ localStorage.setItem(KEY, b.dataset.panel); }catch(e){}
    });
    let lastMob=isMob();
    window.addEventListener('resize', ()=>{
      const m=isMob();
      if(m!==lastMob){ lastMob=m; paint(current(), false); }
    });
    const dtl=document.getElementById('logDetail');
    if(dtl && isMob()) dtl.removeAttribute('open');
    paint(current(), false);
  })();

  document.addEventListener('click', function(ev){
    const b=ev.target.closest && ev.target.closest('#btnMore'); if(!b) return;
    const ex=document.getElementById('quickExtra'); if(ex) ex.classList.toggle('open');
  });

  window.addEventListener('load', function(){ if(on()) pull(true); });
})();
</script>

<div class="fab-sheet" id="fabSheet">
  <div class="fab-inner">
    <div class="fab-head"><span>随手记 · 自动认类型</span><button class="fab-x" id="fabClose" type="button">×</button></div>
    <textarea id="fabInput" rows="2" placeholder="跑了5公里 / 加班到十点，很焦虑 / 卧推 60 5x5"></textarea>
    <details class="fab-detail" id="fabDetail">
      <summary>补充细节：类型 · 标签 · 精力 · 情绪</summary>
      <div class="f-row">
        <div class="f-field"><label class="f-label">类型</label><select id="fabType"></select></div>
        <div class="f-field"><label class="f-label">标签</label><div class="chips" id="fabPick"></div><div class="tag-list" id="fabChips"></div></div>
      </div>
      <div class="f-row">
        <div class="f-field"><label class="f-label">精力</label><input type="range" id="fabScore" min="1" max="5" value="3"></div>
        <div class="f-field"><label class="f-label">情绪</label><input type="range" id="fabMood" min="1" max="5" value="3"></div>
      </div>
    </details>
    <div class="fab-bar"><button class="ybtn" id="fabYest" type="button" aria-label="开启后记录记为昨天">昨天</button><button class="btn sm" id="fabSave" type="button">存下</button></div>
  </div>
</div>
<script>
(function(){
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    try{ localStorage.setItem('selfagent_theme_v1',t); }catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t==='light'?'#F3F6FA':'#07090E');
  }
  var btn=document.getElementById('themeBtn');
  if(btn) btn.addEventListener('click',function(){
    apply(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
  });
  apply(document.documentElement.getAttribute('data-theme')||'dark');
})();
</script>
