<script id="engine">
/* =========================================================
 * 本地规则引擎：模拟「自我认知 Agent」的三阶段分析
 * 非真实大模型 —— 基于关键词词典 + 维度统计实时合成
 * ========================================================= */
const ENGINE = (()=>{

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = iso => { const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };

const LEX = {
  time:{ morning:['早上','清晨','早起','上午','六点','7点','8点','早饭'],
         noon:['中午','下午','午后'],
         night:['晚上','深夜','凌晨','熬夜','晚睡','睡前','十点','11点','12点','一点','两点'] },
  energy:{ high:['精力好','状态好','清醒','专注','高效','精神','有劲','满血','干劲','状态在线','投入'],
           low:['累','疲惫','困','没精神','疲倦','昏沉','乏力','状态差','撑不住','虚','精疲力尽','犯困'] },
  action:{ delay:['拖延','拖','赶','临时','截止','deadline','压线','来不及','最后','踩点','拖延症'],
           focus:['专注','坚持','一口气','进入状态','心流','一口气写完','连做','认真'],
           giveup:['放弃','半途','坚持不下去','中断','搁置','没做完','三天打鱼','中途'] },
  fit:{ types:['跑步','跑','撸铁','力量','健身','瑜伽','游泳','打球','篮球','跳绳','拉伸','深蹲','卧推','引体','训练','骑行','爬山','有氧','无氧'],
        body:['体重','腰','膝盖','背','肩','伤病','疼','酸痛','恢复','睡眠不足','睡不够','肌肉','力竭','拉伸','体检'] },
  work:{ task:['开会','代码','写代码','需求','项目','汇报','报告','方案','客户','团队','review','迭代','改bug','测试','文档','评审','例会'],
         pressure:['加班','通宵','赶工','压','忙','加急','连轴','deadline','排期','紧张'] },
  mood:{ pos:['开心','轻松','满意','平静','充实','愉快','舒服','放松','爽','稳','顺'],
         neg:['焦虑','烦躁','低落','压力','崩溃','委屈','心累','慌','emo','烦','丧','内耗','紧绷'] },
  value:{ growth:['成长','学习','进步','技能','提升','读书','课','学','技术','深耕'],
          money:['收入','工资','钱','副业','赚钱','理财','涨薪','奖金'],
          health:['健康','身体','早睡','作息','锻炼','体检','元气'],
          freedom:['自由','节奏','可控','时间','自主','掌控','平衡'] }
};

const find = (log, words)=>{
  const t = (log.type)+' '+(log.tags||'')+' '+(log.content);
  const hit = words.filter(w=>t.includes(w));
  return hit;
};
const hitsIn = (dimKey, subKey, logs)=>{
  const arr=[];
  logs.forEach(log=>{
    const h = find(log, LEX[dimKey][subKey]);
    if(h.length) arr.push({log,h});
  });
  return arr;
};
const count = (arr)=>arr.length;
const uniqWords = (arr)=>[...new Set(arr.flatMap(x=>x.h))].slice(0,6);

/* 置信度：次数 >=3 高 3星，1-2 中 2星，0 低/不足 */
const conf = n => n>=3 ? {s:'高置信',c:3} : n>=1 ? {s:'中置信',c:2} : {s:'暂无足够记录',c:0};
const confStar = c => c===3?'⭐⭐⭐':c===2?'⭐⭐':'';

function analyze(logs){
  const d = {};
  d.time_m = hitsIn('time','morning',logs);
  d.time_n = hitsIn('time','noon',logs);
  d.time_ng= hitsIn('time','night',logs);
  d.energy_h = hitsIn('energy','high',logs);
  d.energy_l = hitsIn('energy','low',logs);
  d.act_delay = hitsIn('action','delay',logs);
  d.act_focus = hitsIn('action','focus',logs);
  d.act_giveup = hitsIn('action','giveup',logs);
  d.fit_types = hitsIn('fit','types',logs);
  d.fit_body = hitsIn('fit','body',logs);
  d.work_task = hitsIn('work','task',logs);
  d.work_pres = hitsIn('work','pressure',logs);
  d.mood_pos = hitsIn('mood','pos',logs);
  d.mood_neg = hitsIn('mood','neg',logs);
  d.val_growth = hitsIn('value','growth',logs);
  d.val_money = hitsIn('value','money',logs);
  d.val_health= hitsIn('value','health',logs);
  d.val_freedom= hitsIn('value','freedom',logs);
  // 类型分布
  const byType = {work:0,fit:0,life:0};
  logs.forEach(l=>{ if(byType[l.type]!=null) byType[l.type]++; });
  d.byType = byType;
  return d;
}

/* 生成「画像」HTML */
function genPersona(logs, d){
  const N = logs.length;
  const cF = n => conf(n).s;
  const li = (txt, cls='', note='')=>`<li class="${cls}">${txt} ${note}</li>`;
  let h = '';

  // 一、事实快照
  const typeMap = [['工作',d.byType.work],['健身',d.byType.fit],['生活习惯',d.byType.life]]
    .filter(x=>x[1]>0).map(x=>`${x[0]} ${x[1]} 条`).join('，');
  h += `<h2>一、事实快照</h2>`;
  h += `<p>共 ${N} 条记录，类型分布：${typeMap||'暂无'}。以下是抽样片段：</p><ul>`;
  logs.slice(-3).forEach(l=>{
    h += `<li><strong>[${esc(l.type==='work'?'工作':l.type==='fit'?'健身':'生活')}]</strong> ${esc(l.content)} <span class="conf">· ${esc(fmtT(l.time))}</span></li>`;
  });
  h += `</ul>`;

  // 二、精力节律
  const cm = count(d.time_m), cng = count(d.time_ng), ch = count(d.energy_h), cl = count(d.energy_l);
  h += `<h2>二、精力节律画像</h2><ul>`;
  const morningFav = cm>=ch && cm>0;
  if(cm>=2 || ch>=2){
    h += li(`活动记录偏集中在${cm>=cng?'白天时段':'夜间'}；${ch>=2?`多次提到「${uniqWords(d.energy_h).join('、')}」等状态词，判断白天尤其是上午精力较充沛。`:`精力状态描述有限，仅作中置信参考。`}`, morningFav?'':'', cF(Math.max(cm,ch)));
  } else {
    h += li(`精力状态线索不足，暂无法推断偏好时段。<span class="conf">${cF(0)}</span>`);
  }
  if(cl>=2){
    h += li(`存在明显的疲惫信号（命中「${uniqWords(d.energy_l).join('、')}」），且 ${cng>=2?'晚间/后半夜活动频繁，作息与精力恢复可能相互拖累':'尚未见对应作息数据'}。<span class="warn">需留意恢复</span>`, 'warn', cF(cl));
  } else if(cl>=1){
    h += li(`偶尔出现疲惫记录，暂未成稳定模式。`, '', cF(cl));
  }
  if(cng>=2){
    h += li(`记录显示晚间/后半夜仍有活动（命中「${uniqWords(d.time_ng).join('、')}」），若与低精力同时出现，是画像中的矛盾点。`, '', cF(cng));
  }
  h += `</ul>`;

  // 三、行为与执行力
  const cd = count(d.act_delay), cf = count(d.act_focus), cg = count(d.act_giveup);
  h += `<h2>三、行为与执行力特质</h2><ul>`;
  if(cd>=1||cf>=1||cg>=1){
    if(cd>=cf && cd>=1) h += li(`存在启动阻力：多次出现「${uniqWords(d.act_delay).join('、')}」，说明在缺少明确截止或兴趣的任务上，启动阶段易拖延。`, '', cF(cd));
    else if(cf>=1) h += li(`执行力偏积极：多次出现「${uniqWords(d.act_focus).join('、')}」，说明进入状态后可持续投入。`, '', cF(cf));
    if(cg>=1) h += li(`有中断记录（「${uniqWords(d.act_giveup).join('、')}」），可能反映坚持模式易受外部干扰。`, 'warn', cF(cg));
    if(cd>=1 && cf>=1) h += li(`矛盾点：既存在启动拖延、又存在进入状态后的专注，推测核心卡点可能在「开始」而非「过程」。`, '', '推断');
  } else {
    h += li(`暂无足够记录推断行为特质。${cF(0)}`);
  }
  h += `</ul>`;

  // 四、健身
  const cft = count(d.fit_types), cfb = count(d.fit_body);
  h += `<h2>四、身体 & 健身画像</h2><ul>`;
  if(cft>=1){
    h += li(`有规律的运动倾向，涉及「${uniqWords(d.fit_types).join('、')}」等，身体活跃度${cft>=3?'较高':'中等'}。`, '', cF(cft));
    if(cfb>=1) h += li(`同时出现身体反馈词（「${uniqWords(d.fit_body).join('、')}」），建议把恢复与睡眠纳入计划、与训练强度平衡。`, 'warn', cF(cfb));
  } else {
    h += li(`暂无运动类记录，无法判断健身倾向。${cF(0)}`);
  }
  h += `</ul>`;

  // 五、工作模式
  const cwt = count(d.work_task), cwp = count(d.work_pres);
  h += `<h2>五、工作认知模式</h2><ul>`;
  if(cwt>=1){
    h += li(`工作记录以「${uniqWords(d.work_task).join('、')}」为主，处于${cwt>=4?'多任务并行':'常规推进'}状态。`, '', cF(cwt));
    if(cwp>=1) h += li(`存在压力信号（「${uniqWords(d.work_pres).join('、')}」），高强度节奏若持续，可能挤占恢复与健身。`, 'warn', cF(cwp));
  } else {
    h += li(`暂无工作类记录。${cF(0)}`);
  }
  h += `</ul>`;

  // 六、情绪
  const cp = count(d.mood_pos), cn = count(d.mood_neg);
  h += `<h2>六、情绪反应模式</h2><ul>`;
  if(cp>=1||cn>=1){
    if(cn>cp) h += li(`近期负面情绪词偏多（「${uniqWords(d.mood_neg).join('、')}」），可能与工作压力/睡眠相关，是画像中的关注点。`, 'warn', cF(cn));
    else if(cp>=1) h += li(`情绪记录偏正向（「${uniqWords(d.mood_pos).join('、')}」），整体状态较稳定。`, '', cF(cp));
    if(cn>=1 && cwp>=1) h += li(`矛盾点：负面情绪与工作压力词重叠出现，提示「情绪低谷」很可能由工作节奏触发。`, '', '推断');
  } else {
    h += li(`暂无情绪类记录。${cF(0)}`);
  }
  h += `</ul>`;

  // 七、价值优先级
  const vals = [['成长',count(d.val_growth)],['健康',count(d.val_health)],['金钱',count(d.val_money)],['自由/平衡',count(d.val_freedom)]].sort((a,b)=>b[1]-a[1]);
  h += `<h2>七、内在价值优先级</h2>`;
  if(vals[0][1]>0){
    const order = vals.filter(v=>v[1]>0).map(v=>`${v[0]}(${v[1]})`).join(' → ');
    h += `<p>从记录中的关注点反推，当前价值排序：<strong>${order}</strong>。</p>`;
  } else {
    h += `<p>${cF(0)}，暂无足够记录推断价值偏好。</p>`;
  }

  // 八、校验清单
  h += `<h2>八、画像校验清单</h2><ul>`;
  const missing=[];
  if(cft===0) missing.push('健身');
  if(cwt===0) missing.push('工作');
  if(count(d.mood_pos)+count(d.mood_neg)===0) missing.push('情绪');
  if(cm+count(d.time_n)+cng===0) missing.push('作息时段');
  h += li(`矛盾点：${['启动拖延 vs 进入后专注', '夜间活动 vs 疲惫', '工作压力 vs 情绪低谷'].filter(x=>false).length? '见上文标注':'暂无明显矛盾（或数据不足）'}`, '', '');
  h += li(`缺失信息：${missing.length?missing.join('、')+' —— 建议补充对应记录以提升画像精度':'当前维度基本覆盖，可继续累积样本'}`, '', '');
  h += `</ul>`;

  // 九、摘要
  const sum = `N=${N}; 精力=${ch>=2?'白天高':'待观察'}; 执行=${cd&&cf?'启动拖/过程专':'待观察'}; 健身=${cft?'活跃':'不足'}; 情绪=${cn>cp?'偏负压':'偏稳'}; 价值top=${vals[0][1]>0?vals[0][0]:'待观察'}`;
  h += `<h2>九、画像摘要</h2><p class="sum">SUMMARY: ${sum}</p>`;

  // 十、训练压力与恢复
  try{
    const T = (typeof window.__trainData==='function') ? window.__trainData() : null;
    const recs = (T && T.records) ? T.records.filter(r=>r.date) : [];
    if(recs.length>=2){
      const day = {};
      recs.forEach(r=>{
        const d = day[r.date] = day[r.date] || {vol:0, hard:0};
        (r.groups||[]).forEach(g=>{
          if(!g.done) return;
          d.vol += (g.weight||0)*(g.reps||0);
          if(g.rpe==='hard') d.hard++;
        });
      });
      const dates = Object.keys(day).sort();
      const avgScore = ds => {
        const arr=[]; ds.forEach(d=>logs.forEach(l=>{ if((l.date||'').slice(0,10)===d && typeof l.score==='number') arr.push(l.score); }));
        return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;
      };
      const nxt = d => { const t=new Date(d+'T00:00:00'); t.setDate(t.getDate()+1); return t.toISOString().slice(0,10); };
      const hardDates = dates.filter(d=>day[d].hard>=3);
      const otherDates = dates.filter(d=>day[d].hard<3);
      h += `<h2>十、训练压力与恢复</h2><ul>`;
      if(hardDates.length>=2 && otherDates.length>=1){
        const a = avgScore(hardDates.map(nxt)), b = avgScore(otherDates.map(nxt));
        if(a!=null && b!=null){
          const diff = a-b;
          h += li(`力竭组 ≥3 的训练日共 ${hardDates.length} 天，次日平均精力 ${a.toFixed(1)}；其余训练日次日 ${b.toFixed(1)}，差 ${diff>=0?'+':''}${diff.toFixed(1)}。${diff<-0.3?'<span class="warn">高强度后恢复偏慢，建议连续高力竭日之间插入轻量日</span>':''}`, diff<-0.3?'warn':'', cF(hardDates.length));
        } else {
          h += li(`已有 ${hardDates.length} 个高力竭训练日，但缺少对应次日的精力记录，补记后才能对比恢复情况。`, '', '');
        }
      } else {
        h += li(`高力竭训练日（单日力竭组 ≥3）目前 ${hardDates.length} 天，样本不足，暂不做压力-恢复对比。`, '', '');
      }
      // 容量趋势（按周）
      const week = {};
      dates.forEach(d=>{
        const t=new Date(d+'T00:00:00'); const k=t.getFullYear()+'-'+Math.ceil(((t-new Date(t.getFullYear(),0,1))/864e5+1)/7);
        week[k]=(week[k]||0)+day[d].vol;
      });
      const wk=Object.keys(week).sort();
      if(wk.length>=2){
        const cur=week[wk[wk.length-1]], prev=week[wk[wk.length-2]];
        const pct = prev>0 ? Math.round((cur-prev)/prev*100) : null;
        h += li(`本周总容量 ${Math.round(cur)} kg（训练容量=重量×次数），上周 ${Math.round(prev)} kg${pct!=null?`，变化 ${pct>=0?'+':''}${pct}%`:''}。${pct!=null&&Math.abs(pct)>=30?'<span class="warn">周间波动较大，注意渐进节奏</span>':''}`, (pct!=null&&Math.abs(pct)>=30)?'warn':'', cF(wk.length));
      } else {
        h += li(`容量趋势需要跨周数据，当前仅 ${wk.length} 周，继续累积。`, '', '');
      }
      const rpeN = recs.reduce((a,r)=>a+((r.groups||[]).filter(g=>g.rpe).length),0);
      h += li(`已采集带 RPE 的组共 ${rpeN} 组${rpeN<10?'（样本偏少，结论仅供参考）':'。'}`, '', '');
      h += `</ul>`;
    }
  }catch(e){}

  return h;
}

/* 生成「规划」HTML —— 依赖画像 */
function genPlan(logs, d){
  const has = x => count(x)>=1;
  const cd = count(d.act_delay);
  const cg = count(d.act_giveup);
  const energyHigh = count(d.energy_h)>=count(d.energy_l);
  const morning = count(d.time_m)>=count(d.time_ng);
  const workHeavy = count(d.work_task)>=2;
  const pressure = count(d.work_pres)>=1;
  const fitAct = count(d.fit_types)>=1;
  const bodyWarn = count(d.fit_body)>=1;

  const peak = morning ? '上午 9:00–11:30' : (energyHigh ? '状态进入后（约 10:00 起）' : '按实际精力峰值');
  const fragile = pressure||bodyWarn;
  const li = (txt, cls='', note='')=>`<li class="${cls}">${txt} ${note}</li>`;

  let h='';
  h += `<h2>一、目标对齐校验</h2><p>依据画像：当前是${workHeavy?'任务负载较高的节奏':''}${pressure?'、伴有压力信号':''}${fitAct?'、有运动习惯':''}${bodyWarn?'、但存在身体恢复提示':''}。规划以「稳住工作产出的同时，把恢复与节奏放回可控制范围」为底层目标。</p>`;

  h += `<h2>二、核心原则（由画像推导）</h2><ul>`;
  h += li(`把高难度任务排在${peak}——这是你的精力高区，不要反着用。`, '', has(d.energy_h)?conf(count(d.energy_h)).s:'');
  h += li(`${morning?'早间是相对清醒时段，适合列清单与低摩擦启动；':'晚间活动偏多，把「复盘」放在入睡前而非深度工作前。'}`, '', '');
  if(cd) h += li(`存在启动拖延：用「只做 5 分钟」的微启动降低心理门槛，先把引擎点着。`, '', '');
  if(cg) h += li(`有中断倾向：给任务设「最小完成单元」，完成一个单元即算一次闭合，减少半途感。`, '', '');
  h += `</ul>`;

  h += `<h2>三、本周滚动计划</h2><ul>`;
  h += li(`<strong class="good">P0 · 高优先：</strong>${workHeavy?'把 1 个关键产出切分为 3 个半天小步，每天完成一段':'为本周立 1 个可交付的小产出，用 5 个工作日各推进 20%'}`);
  h += li(`<strong class="good">P0 · 恢复：</strong>${fitAct?'保留健身 2 次，控制在不造成第二日疲劳的强度':'安排 3 次 30 分钟轻运动，作为精力充电而非消耗'}`);
  h += li(`<strong class="info">P1 · 中优先：</strong>睡前 30 分钟离开屏幕，记录当天气力/情绪评分`);
  h += li(`<strong class="info">P1 · 中优先：</strong>每日固定 2 个「不被打断」的时间块，各 45 分钟`);
  h += li(`<strong>P2 · 可舍弃：</strong>低价值刷信息流限时 1 次/天，作为状态切换的出口而非逃避`);
  h += `</ul>`;

  h += `<h2>四、典型单日节律模板</h2><blockquote><strong>${peak}</strong>：处理最难的一件事。<br>午后：轻量协同、会议、琐事。<br>${morning?'晚 18 点前后':'夜间'}<strong>：${fitAct?'运动':'散步/拉伸'} 30 分钟</strong>。<br>入睡前 30 分钟：复盘打分，不接触高强度内容。</blockquote>`;

  h += `<h2>五、降级预案（状态差时自动简化）</h2>`;
  h += fragile ? `<p>检测到压力/恢复风险，若某日精力极低：<strong>只保留 P0 的最小版本</strong>（当日 1 个产出单元 + 不运动），其余全部降级，别自责。</p>`
              : `<p>若某日精力不足，压缩为「1 个产出 + 1 次轻运动」，保底不崩。</p>`;

  h += `<h2>六、追踪指标（用于迭代画像）</h2><ul>`;
  h += li(`每日精力评分（1–5）、入睡时间、完成产出单元数`);
  h += li(`记录一次「今天卡在哪一步」（启动/中途/结束），用于校准行为画像`);
  h += `</ul>`;

  return h;
}

/* 生成「趋势推演」HTML */
function genTrend(logs, d){
  const workHeavy = count(d.work_task)>=3;
  const pressure = count(d.work_pres)>=1;
  const fitAct = count(d.fit_types)>=2;
  const bodyWarn = count(d.fit_body)>=1;
  const cn = count(d.mood_neg), cp = count(d.mood_pos);
  const moodNeg = cn>cp && cn>=1;
  const delay = count(d.act_delay)>=1;
  const night = count(d.time_ng)>=2;

  const ampPos = [];
  const ampNeg = [];
  if(fitAct) ampPos.push('运动习惯是显著的正向复利源：随恢复改善，工作耐力和情绪稳定性同步抬升');
  if(!night && !moodNeg) ampPos.push('作息与情绪整体稳定，是长期产出的底层保障');
  if(delay) ampNeg.push('启动拖延是负向放大器：单次拖延叠加到任务累积，会周期性制造赶工与焦虑');
  if(night && moodNeg) ampNeg.push('「夜间活动 + 情绪偏负」形成循环：睡得越晚状态越差，状态越差越容易刷手机熬夜');
  if(pressure && bodyWarn) ampNeg.push('高压工作挤占恢复，身体反馈与压力叠加，存在过劳信号');

  const interventions = [];
  if(delay) interventions.push('把最难任务固定在每天精力高区，用「5 分钟微启动」拆掉拖延门槛');
  if(night) interventions.push('把入睡时间向前移 30 分钟，切段「熬夜—低状态」循环');
  if(fitAct) interventions.push('保住运动频率这一复利源，并平衡强度保护恢复');
  if(pressure) interventions.push('为高压周主动预排降级预案，避免连轴转');

  const obs = [];
  if(moodNeg) obs.push('情绪低谷频率（每周负面记录次数）');
  if(night) obs.push('入睡时间的中位数与波动');
  if(fitAct) obs.push('运动周频与体感疲劳的匹配');
  if(workHeavy) obs.push('工作产出的完成单元数趋势');
  if(!obs.length) obs.push('开始累积记录后，先观察精力、情绪与作息的基线');
  const li = (txt, cls='', note='')=>`<li class="${cls}">${txt} ${note}</li>`;

  let h='';
  h += `<h2>一、推演前提假设</h2><ul>`;
  h += li(`在「保持当前行为模式、外部机遇与突发变量不变」的假设下推演`);
  h += li(`以下为可能性参考，不构成对未来结果的确定性预言`);
  h += `</ul>`;

  h += `<h2>二、三条情景分支</h2>`;
  h += `<span class="scenario base"><span class="scn-tag">情景A · 基准（最可能）</span>保持现状：${workHeavy?'工作量维持高位，产出稳定但节奏紧绷':'节奏平稳'}${delay?'，拖延偶发但在可接受范围':'，执行顺畅'}。${night&&moodNeg?'代价是恢复不足，状态小幅下行':'长期看状态缓慢改善'}。</span>`;
  h += `<span class="scenario good"><span class="scn-tag">情景B · 乐观（需满足条件）</span>若启动干预点（${interventions.slice(0,2).map(x=>x.split('：')[0]).join('、')}）执行 4–6 周，预计：恢复改善 → 精力与情绪更稳 → 工作产出质量与可持续性同时提升，进入正向复利。</span>`;
  h += `<span class="scenario risk"><span class="scn-tag">情景C · 风险（预警）</span>若${pressure?'高压节奏 + ':''}${night?'长期熬夜 + ':''}${moodNeg?'情绪负循环':'恢复不足'}持续叠加而无人为干预，最可能滑向过度疲劳与效率下行的阶段，届时健身与作息会成为最早被挤掉的项。</span>`;

  h += `<h2>三、正向 & 负向放大器</h2><ul>`;
  (ampPos.length?ampPos:['持续记录本身就是正向行为：数据积累会让画像越来越准，干预越来越精准']).forEach(t=>h+=li(`<span class="good">+ ${t}</span>`,''));
  (ampNeg.length?ampNeg:['暂无显著负向循环信号，但数据量仍少，需继续观察']).forEach(t=>h+=li(`<span class="warn">− ${t}</span>`,''));
  h += `</ul>`;

  h += `<h2>四、关键干预控制点（最小改动即可改变走向）</h2><ul>`;
  (interventions.length?interventions:['先从每天固定记录开始，让画像有数据可依']).forEach(t=>h+=li(t));
  h += `</ul>`;

  h += `<h2>五、需持续观测的信号</h2><ul>`;
  obs.forEach(t=>h+=li(t));
  h += `</ul>`;

  h += `<h2>六、推演局限性</h2><blockquote>本推演仅基于你过往行为模式做逻辑外推，外部机遇、突发变量会大幅改变走向；不构成职业、医疗、理财或任何重大决策依据。记录越多，推演越贴近真实。</blockquote>`;
  return h;
}

/* 空态文案 */
function genEmpty(){
  return `<div class="intro-empty">
    <div class="big">还没有可分析的记录</div>
    <p>先在「记录」页写几条日志（写一句话就能存），或点「载入示例数据」，再回到这里看画像、规划与趋势推演。</p>
  </div>`;
}

return { analyze, genPersona, genPlan, genTrend, genEmpty, esc };
})();
</script>
<script src="lib.js" defer></script>
<script id="app">
(function(){
  const $ = id => document.getElementById(id);
  const STORE_KEY = 'selfagent_logs_v1';
  const PROFILE_KEY = 'selfagent_profile_v1';
  const SETTINGS_KEY = 'selfagent_settings_v1';

  const DEFAULT_SETTINGS = {
    types:[
      {key:'work',label:'工作',tags:['加班','代码','会议','汇报','需求']},
      {key:'fit',label:'健身',tags:['跑步','力量','瑜伽','游泳']},
      {key:'life',label:'生活习惯',tags:['作息','早起','饮食','睡眠','情绪']}
    ]
  };
  const TYPE_COLORS = ['#6D8CFF','#5FD3A0','#3DDCBF','#C77DB3','#5AA9A6','#E08A5B','#8FBF6C','#7E7BB5'];
  const MOOD_LABELS5 = ['','很糟','低落','一般','不错','很好'];
  const moodNorm = m => { m=Math.max(0,Math.min(10,parseInt(m,10)||3)); return m>5 ? Math.min(5,Math.ceil(m/2)) : (m||3); };

  let logs = [];
  try{ logs = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ logs=[]; }
  (function migrateEvents(){
    let changed=false;
    logs.forEach(l=>{
      if(!l.id){ l.id='e'+Date.now()+Math.random().toString(36).slice(2,7); changed=true; }
      if(!l.kind){
        const isAuto = /^(训练（自动同步）：|今日训练：)/.test(l.content||'') || /^(autotr-|tr\d)/.test(String(l.id));
        l.kind = isAuto ? 'train' : 'log';
        l.source = isAuto ? 'auto' : 'manual';
        changed=true;
      }
      if(!l.date && l.time){ const d=new Date(l.time); const p=n=>String(n).padStart(2,'0'); l.date=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; changed=true; }
      if(l.kind==='train' && !l.meta){ l.meta={items:[],volume:0}; changed=true; }
    });
    if(changed){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(logs)); }catch(e){} }
  })();

  function dedupTrainEvents(){
    const byDate={};
    logs.forEach(l=>{ if(l.kind==='train'){ if(!byDate[l.date]) byDate[l.date]=[]; byDate[l.date].push(l); } });
    let ch=false;
    Object.keys(byDate).forEach(d=>{
      const arr=byDate[d]; if(arr.length<2) return;
      const base = arr.find(l=>String(l.id).indexOf('autotr-')===0) || arr[0];
      const merged={};
      arr.forEach(l=>{
        ((l.meta&&l.meta.items)||[]).forEach(it=>{
          const key=it.exId||it.name;
          if(!merged[key]){ merged[key]=JSON.parse(JSON.stringify(it)); return; }
          const p=merged[key];
          p.groups=(p.groups||[]).map((g,i)=>{ const g2=(it.groups||[])[i]; if(!g2) return g;
            return {no:g.no, reps:Math.max(g.reps||0,g2.reps||0), weight:Math.max(g.weight||0,g2.weight||0),
              done:!!(g.done||g2.done), rpe:g.rpe||g2.rpe||0, sec:g.sec||g2.sec||0}; });
          p.done=Math.max(p.done||0,it.done||0);
          p.volume=Math.max(p.volume||0,it.volume||0);
        });
      });
      const items=Object.keys(merged).map(k=>merged[k]);
      base.meta={items:items,volume:Math.round(items.reduce((a,i)=>a+(i.volume||0),0))};
      base.content=items.map(i=>i.name).join('、');
      logs=logs.filter(l=> l===base || !(l.kind==='train' && l.date===d));
      ch=true;
    });
    return ch;
  }
  try{ if(dedupTrainEvents()) localStorage.setItem(STORE_KEY, JSON.stringify(logs)); }catch(e){}
  let profile = {};
  try{ profile = JSON.parse(localStorage.getItem(PROFILE_KEY)) || {}; }catch(e){ profile={}; }
  let settings = loadSettings();
  let currentTab = 'persona';
  let logFilter = { type:'all', tag:'', range:30 };
  const logDayOpen = {};   // 日期 -> 是否展开；未记录时默认展开“今天”
  function keepDayOpen(id){
    const l=logs.find(x=>String(x.id)===String(id));
    const d=l ? (l.date||dayKey(l.time)) : dayKey(new Date());
    logDayOpen[d]=true;
  }
  let tagChips=[];
  let chartInsts = [];
  let ganttChart = null;
  let gantt = { start:'', end:'' };

  function loadSettings(){
    try{
      const s=JSON.parse(localStorage.getItem(SETTINGS_KEY));
      if(s && s.types && s.types.length){
        if(s.types.every(t=>Array.isArray(t.tags))) return s;   // 新格式
        // 旧格式迁移：平级 tags -> 并入各类型默认 + 多余挂到第一个类型
        const defTags={}; DEFAULT_SETTINGS.types.forEach(t=>defTags[t.key]=[...t.tags]);
        const oldTags = Array.isArray(s.tags)?s.tags:[];
        const migrated = s.types.map(t=>({key:t.key, label:t.label, tags:(defTags[t.key]||[]).slice()}));
        const extra = oldTags.filter(x=>!migrated.some(m=>m.tags.includes(x)));
        if(migrated.length && extra.length) migrated[0].tags.push(...extra);
        return {types:migrated};
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  }
  const typeTags = k => { const t=settings.types.find(x=>x.key===k); return t ? (t.tags||[]) : []; };
  function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

  const colorFor = k => { const i=settings.types.findIndex(t=>t.key===k); return i>=0 ? TYPE_COLORS[i%TYPE_COLORS.length] : '#8695A5'; };
  const typeLabel = k => { const t=settings.types.find(x=>x.key===k); return t ? t.label : k; };
  const typeCls = k => (k==='work'?'work':k==='fit'?'fit':'life');
  const moodText = m => MOOD_LABELS5[moodNorm(m)] || '一般';
  const moodClass = m => { const v=moodNorm(m); return v<=2?'tone-risk':(v===3?'tone-mid':'tone-good'); };
  const fmtTime = iso => { const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const dayKey = iso => { const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };

  function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(logs)); }
  window.__reloadLogs=function(){
    try{ logs=JSON.parse(localStorage.getItem(STORE_KEY))||[]; }catch(e){}
    if($('logList')) renderLogs();
    if($('reportBody')) renderLogsPanel();
  };

  /* ---------- 下拉填充 ---------- */
  function fillTypeSelect(sel, selected){
    sel.innerHTML = settings.types.map(t=>`<option value="${t.key}" ${selected===t.key?'selected':''}>${ENGINE.esc(t.label)}</option>`).join('');
  }
  function fillTagSelect(sel, selectedArr, typeKey){
    sel.innerHTML = typeTags(typeKey).map(t=>`<option value="${ENGINE.esc(t)}" ${(selectedArr||[]).includes(t)?'selected':''}>${ENGINE.esc(t)}</option>`).join('');
  }
  function selectedTags(sel){ return Array.from(sel.selectedOptions).map(o=>o.value); }

  /* ---------- 左侧列表 ---------- */
  function renderLogs(){
    const box=$('logList'); if(!box) return;
    if(!logs.length){ box.innerHTML=emptyState('note','还没有记录。写下第一条，开始认识自己。','去写一条','emptywrite'); setTimeout(()=>{ const b=box.querySelector('[data-emptywrite]'); if(b) b.onclick=()=>{ try{ openPage('record'); }catch(e){} }; },0); return; }
    box.innerHTML=[...logs].reverse().map(l=>{
      if(l.kind==='train'){
        const m=l.meta||{}; const names=(m.items||[]).slice(0,3).map(i=>i.name).join('、');
        return `
      <div class="log-item tcard-min">
        <button class="log-del" data-id="${l.id}" title="删除">×</button>
        <div class="log-head">
          <span class="log-type fit" style="color:#3DDCBF;border-color:#3DDCBF">训练</span>
          <span class="log-score">${m.volume?m.volume+'kg':'—'}</span>
          <span class="log-time">${fmtTime(l.time)}</span>
        </div>
        <div class="log-body">${ENGINE.esc(names)}${(m.items||[]).length>3?'…':''}</div>
        ${m.checkin?`<div class="log-body feel-line">情绪 ${m.checkin.mood}/5 · 状态 ${m.checkin.energy}/5${m.checkin.note?(' · '+ENGINE.esc(m.checkin.note)):''}</div>`:''}
      </div>`;
      }
      return `
      <div class="log-item">
        <button class="log-del" data-id="${l.id}" title="删除">×</button>
        <div class="log-head">
          <span class="log-type ${typeCls(l.type)}" style="color:${colorFor(l.type)};border-color:${colorFor(l.type)}">${ENGINE.esc(typeLabel(l.type))}</span>
          ${l.tags?`<span class="tag">${ENGINE.esc(l.tags)}</span>`:''}
          <span class="log-score ${moodClass(l.mood)}">精力 ${'●'.repeat(l.score||3)}${'○'.repeat(5-(l.score||3))} · 情绪 ${moodText(l.mood)}</span>
          <span class="log-time" data-lid="${l.id}">${fmtTime(l.time)}</span>
        </div>
        <div class="log-body">${ENGINE.esc(l.content)}</div>
      </div>`;}).join('');
    box.querySelectorAll('.log-del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(!(await Modal.confirm({title:'删除记录', body:'这条日志会从列表移除，删掉后不能恢复。', okText:'删除', cancelText:'保留', danger:true}))) return;
        const row=btn.closest('.log-item');
        collapseRemove(row,()=>{ deleteLogById(btn.dataset.id); renderLogs(); if(!logs.length) renderReport(); });
      });
    });
  }

  /* ---------- 录入 ---------- */
  function refreshLogForm(){
    const ty=$('logType').value || 'life';
    fillTypeSelect($('logType'), ty);
    fillTagSelect($('logTags'), null, ty);
    const sel=$('logTags'); if(sel){ sel.selectedIndex=-1;
      sel.onchange=()=>{ const v=sel.value; if(v && !tagChips.includes(v)){ tagChips.push(v); renderTagChips(); } sel.selectedIndex=-1; };
    }
    const tySel=$('logType');
    tySel.onchange=()=>{ fillTagSelect($('logTags'), null, tySel.value); renderTagChips(); };
    renderTagChips();
  }
  function renderTagChips(){
    const ty=$('logType') ? ($('logType').value||'life') : 'life';
    const pick=$('tagPick');
    if(pick){
      const all=typeTags(ty);
      pick.innerHTML = all.length
        ? all.map(t=>`<button type="button" class="chip${tagChips.includes(t)?' on':''}" data-pick="${ENGINE.esc(t)}">${ENGINE.esc(t)}</button>`).join('')
        : '<span class="chip-none">该类型下还没有标签，去「设置」加</span>';
      pick.querySelectorAll('[data-pick]').forEach(b=>{
        b.onclick=()=>{
          const t=b.dataset.pick;
          tagChips = tagChips.includes(t) ? tagChips.filter(x=>x!==t) : tagChips.concat([t]);
          renderTagChips();
        };
      });
    }
    const box=$('tagChips'); if(!box) return;
    box.innerHTML = tagChips.length ? tagChips.map(t=>`<span class="tag">${ENGINE.esc(t)}<button type="button" data-chip="${ENGINE.esc(t)}">×</button></span>`).join('') : '';
    box.querySelectorAll('[data-chip]').forEach(b=>{
      b.addEventListener('click',()=>{ tagChips=tagChips.filter(x=>x!==b.dataset.chip); renderTagChips(); });
    });
  }

  /* ---------- 自动推断类型/标签 ---------- */
  const INFER_KW = {
    fit:['跑步','跑了','公里','深蹲','卧推','硬拉','引体','练了','练完','游泳','瑜伽','骑行','打球','撸铁','举铁','有氧','锻炼','健身','km'],
    work:['加班','代码','开会','会议','需求','汇报','项目','文档','上线','bug','方案','评审','客户','甲方','debug'],
    life:['睡了','没睡好','熬夜','熬到','失眠','起床','起不来','早餐','午餐','午饭','晚饭','刷手机','焦虑','累','烦躁','情绪','作息','喝水','散步']
  };
  const TAG_HINT = [
    {tag:'跑步', re:/跑|公里|km/i}, {tag:'力量', re:/深蹲|卧推|硬拉|引体|撸铁|举铁/},
    {tag:'瑜伽', re:/瑜伽/}, {tag:'游泳', re:/游泳/},
    {tag:'加班', re:/加班/}, {tag:'代码', re:/代码|bug|debug|写代码/},
    {tag:'会议', re:/开会|会议/}, {tag:'需求', re:/需求|方案|评审/},
    {tag:'作息', re:/睡|起床|起不来|熬夜|熬到|失眠/}, {tag:'饮食', re:/早餐|午饭|晚饭|吃/},
    {tag:'情绪', re:/焦虑|烦躁|压力|情绪/}
  ];
  function hitWords(text){
    const t=(text||'').toLowerCase(), out=[];
    Object.keys(INFER_KW).forEach(k=>{ (INFER_KW[k]||[]).forEach(w=>{ if(w && t.indexOf(String(w).toLowerCase())>=0) out.push(w); }); });
    TAG_HINT.forEach(h=>{ if(h.re.test(t)) out.push(h.tag); });
    return Array.from(new Set(out));
  }
  function evidenceHtml(){
    if(!logs.length) return '';
    const rs=[...logs].reverse().slice(0,20).map(l=>{
      const w=hitWords(l.content);
      return `<li><span class="ev-t">${fmtTime(l.time)}</span><span class="ev-c">${ENGINE.esc((l.content||'').slice(0,46))}</span><span class="ev-w${w.length?'':' none'}">${w.length?('命中 '+w.join(' / ')):'未命中关键词（按表单类型归档）'}</span></li>`;
    }).join('');
    return `<details class="report-fold"><summary>结论依据 · 最近 ${Math.min(logs.length,20)} 条记录命中了哪些词</summary><ul class="ev-list">${rs}</ul></details>`;
  }
  function inferLog(text){
    const t=(' '+text+' ').toLowerCase();
    let best={key:(settings.types[0]||{}).key, sc:0, tags:[]};
    settings.types.forEach(ty=>{
      let sc=0; const hit=[];
      (ty.tags||[]).forEach(tag=>{ if(tag && t.includes(String(tag).toLowerCase())){ sc+=2; hit.push(tag); } });
      if(t.includes(String(ty.label||'').toLowerCase())) sc+=3;
      (INFER_KW[ty.key]||[]).forEach(w=>{ if(t.includes(w)) sc+=3; });
      if(sc>best.sc) best={key:ty.key, sc, tags:hit.slice(0,2)};
    });
    const hint=TAG_HINT.filter(h=>h.re.test(text) && (typeTags(best.key)||[]).includes(h.tag)).map(h=>h.tag);
    if(hint.length) best.tags=hint.slice(0,2);
    return best;
  }
  function currentLogMeta(){
    const ty=$('logType'), sc=$('logScore'), md=$('logMood');
    return {
      type: (ty && ty.value) || (settings.types[0]||{}).key,
      score: sc ? (parseInt(sc.value,10)||3) : 3,
      mood: md ? moodNorm(md.value) : 3
    };
  }
  function logNudge(n){
    if(n<3) return;
    const el=document.createElement('div'); el.className='toast nudge';
    el.innerHTML='已积累 <b>'+n+'</b> 条记录 <button type="button" id="nudgeGo">查看分析 →</button>';
    document.body.appendChild(el);
    const b=el.querySelector('#nudgeGo');
    if(b) b.onclick=()=>{ try{el.remove();}catch(e){} if(typeof showPage==='function') showPage('agent'); };
    setTimeout(()=>{ try{el.remove();}catch(e){} }, 5000);
  }
  function quickTrainParse(txt){
    let s=(txt||'').trim(); if(!s) return null;
    const sm=s.match(/(\d+)\s*[x×*]\s*(\d+)/i); if(!sm) return null;
    const sets=Math.max(1,Math.min(20,+sm[1])), reps=Math.max(1,Math.min(100,+sm[2]));
    s=s.replace(sm[0],' ');
    let weight=0;
    const wm=s.match(/(\d+(?:\.\d+)?)\s*(?:kg|公斤)?\s*$/i);
    if(wm && wm[0].trim()){ weight=parseFloat(wm[1])||0; s=s.replace(wm[0],' '); }
    const name=s.replace(/[，,。;；:：]+/g,' ').replace(/\s+/g,' ').trim();
    if(!name) return null;
    const cand=allExercises().filter(e=>e.n.includes(name)||((e.en||'').toLowerCase().includes(name.toLowerCase()))).sort((a,b)=>a.n.length-b.n.length)[0];
    return { name:cand?cand.n:name, part:cand?cand.p:'其他', sets, reps, weight, exId:cand?cand.id:('cuq'+Date.now().toString(36)) };
  }
  function pushLog(content, auto, dateKey, opts){
    content=(content||'').trim(); if(!content) return false;
    const meta=currentLogMeta();
    let type=meta.type, tags=tagChips.slice();
    let mood=meta.mood, moodHint='';
    if(auto){
      const tp=quickTrainParse(content);
      if(tp){
        const dd=new Date();
        const key=dateKey || (dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0'));
        train.records.push({date:key, exId:tp.exId, name:tp.name, part:tp.part, sets:tp.sets, reps:tp.reps, weight:tp.weight, dur:0});
        saveTrain(); trRenderToday(); refreshHome();
        trToast('已记为训练：'+tp.name+' '+tp.sets+'×'+tp.reps+(tp.weight>0?' @'+tp.weight+'kg':'(自重)'));
        return true;
      }
      const NEG=/焦虑|烦躁|压力|难受|累|失眠|熬夜|熬到|崩|烦|低落/;
      const POS=/开心|不错|舒服|状态好|很爽|顺利|轻松|满足|精神好/;
      if(NEG.test(content)){ mood=2; moodHint='低落'; }
      else if(POS.test(content)){ mood=4; moodHint='不错'; }
      const inf=inferLog(content);
      if(inf.sc>=2){ type=inf.key; if(!tags.length) tags=inf.tags.slice();
        trToast('已识别：'+typeLabel(type)+(tags.length?' · '+tags.join(' '):'')+(moodHint?' · 情绪'+moodHint:'')+'（可在补充细节里改）'); }
    }
    if(opts){
      if(opts.type) type=opts.type;
      if(Array.isArray(opts.tags)) tags=opts.tags.slice();
      if(opts.score!=null) meta.score=Math.max(1,Math.min(5,+opts.score||3));
      if(opts.mood!=null) mood=Math.max(1,Math.min(5,+opts.mood||3));
    }
    const stamp=new Date();
    if(dateKey){ const p=dateKey.split('-').map(Number); stamp.setFullYear(p[0],p[1]-1,p[2]); }
    const p2=n=>String(n).padStart(2,'0');
    const dk=`${stamp.getFullYear()}-${p2(stamp.getMonth()+1)}-${p2(stamp.getDate())}`;
    logs.push({ id:Date.now()+Math.random().toString(36).slice(2,7), kind:'log', source:'manual',
      type, tags:tags.join(','), score:meta.score, mood, content, time:stamp.toISOString(), date:dk });

  function fmtMS(sec){

  function fmPersist(){
    try{

        date:trDateVal(),

        adhoc:window.__fmCdAdhoc||null,
        idx:(__focusUids[__focusIdx]||null),
        starts:Object.assign({}, window.__grpStart||{})

      saveTrain();
    }catch(e){}
  }
  function fmRestore(){
    try{
      const st=train.fmState;
      if(!st || st.date!==trDateVal()){ return false; }
      const now=Date.now(), kept={};
      Object.keys(st.starts||{}).forEach(k=>{
        const p=k.split(':');
        const rec=(train.records||[]).find(x=>x.uid===p[0]); if(!rec) return;
        const g=(rec.groups||[]).find(q=>String(q.no)===p[1]);
        if(!g || g.done) return;
        const ts=st.starts[k];
        if(!ts || now-ts>6*3600*1000) return;
        kept[k]=ts;
      });
      window.__grpStart=kept;
      const rs=focusList();
      if(st.idx){ const i=rs.findIndex(r=>r.uid===st.idx); if(i>=0) __focusIdx=i; }
      if(st.adhoc) window.__fmCdAdhoc=st.adhoc;
      return true;
    }catch(e){ return false; }
  }
  function fmRebuildPhase(){
    const d=trDateVal();
    const cds=trCardioFor(d);
    if(window.__fmCdAdhoc){
      const a=cds.find(c=>c.uid===window.__fmCdAdhoc && !c.done && !c.skipped);
      if(a) return 'cardio';
    }
    if(cds.some(c=>c.role==='pre' && !c.done && !c.skipped)) return 'warmup';
    const rs=focusList();
    const allDone=rs.length>0 && rs.every(x=>{ const q=ensureGroups(x); return q.length>0 && q.every(g=>g.done); });
    if(!allDone) return 'strength';
    if(cds.some(c=>c.role==='post' && !c.done && !c.skipped)) return 'cooldown';

  function bindHoldFinish(btn, label, confirmText, onDone, ms){
    if(!btn) return;

    const paint=v=>{ btn.style.setProperty('--p', (v*100).toFixed(1)+'%'); btn.classList.toggle('charging', v>0.001); };
    const clear=()=>{ if(t){ clearTimeout(t); t=null; } if(iv){ clearInterval(iv); iv=null; } btn.classList.remove('charging'); btn.style.removeProperty('--p'); btn.textContent=label; };
    const start=e=>{
      if(e && e.preventDefault) e.preventDefault();
      fired=false; t0=Date.now(); btn.classList.add('charging'); btn.textContent=confirmText;
      paint(0);
      if(iv) clearInterval(iv);
      iv=setInterval(()=>{ paint(Math.min(1,(Date.now()-t0)/ms)); },50);
      t=setTimeout(()=>{ fired=true; clear(); try{ haptic('warn'); }catch(err){} btn.classList.add('flash'); setTimeout(()=>btn.classList.remove('flash'),420); onDone(); },ms);
    };
    const cancel=()=>{ if(fired) return; const was=!!t||btn.classList.contains('charging'); clear(); if(was) trToast('长按以确认'); };
    btn.addEventListener('pointerdown',start);
    btn.addEventListener('pointerup',cancel);
    btn.addEventListener('pointercancel',cancel);
    btn.addEventListener('pointerleave',ev=>{ if(ev.pointerType==='mouse'||!ev.buttons) cancel(); });
    btn.addEventListener('contextmenu',e=>e.preventDefault());
    btn.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); });
  }
  function fmTap(key){

  function bestSetWeight(exId, skipUid, skipNo){

      (x.groups||[]).forEach(g=>{

    rec.uid=trUid(rec);

  function bindSteppers(){

      const inp=sp.querySelector('input'); if(!inp) return;
      const delta=()=>parseFloat(inp.dataset.delta||sp.dataset.delta||'1');
      const apply=k=>{
        const d=delta()*k;
        let v=(parseFloat(inp.value)||0)+d;
        const min=inp.min===''?-Infinity:parseFloat(inp.min||'0');
        const max=inp.max===''?Infinity:parseFloat(inp.max||'999');

        inp.value=String(v); inp.dispatchEvent(new Event('change',{bubbles:true}));
      };
      sp.querySelectorAll('button').forEach(btn=>{
        const k=btn.dataset.step||btn.dataset.w; if(!k) return;
        let timer=null, hold=null;

          apply(parseFloat(k));

        };

  /* ===== 统一浮层底座（LayerManager） ===== */
  const Layer=(function(){
    const stack=[]; let lockN=0, prevOv='';
    function syncLock(){ document.body.style.overflow = lockN>0?'hidden':(prevOv||''); }
    function lock(){ if(lockN===0) prevOv=document.body.style.overflow||''; lockN++; syncLock(); }
    function unlock(){ if(lockN>0) lockN--; syncLock(); }
    function top(){ return stack[stack.length-1]||null; }
    function focusables(root){
      return Array.from(root.querySelectorAll('a[href],button:not([disabled]),input:not([type="hidden"]):not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'))
        .filter(x=>x.offsetParent!==null||x===document.activeElement);
    }
    function push(root,opt){
      opt=opt||{}; if(!root||stack.includes(root)) return root;
      root.__lopt=opt; root.__prevFocus=document.activeElement;
      lock(); stack.push(root);
      root.style.zIndex=String(6600+(stack.length-1)*10);
      root.setAttribute('role', opt.role||'dialog'); root.setAttribute('aria-modal','true');
      if(opt.maskClose!==false){
        root.addEventListener('click',e=>{ if(e.target===root) close(root); });
      }
      requestAnimationFrame(()=>{ if(root.isConnected) root.classList.add('on'); });
      return root;
    }
    function pop(root){
      const i=stack.indexOf(root); if(i<0) return;
      stack.splice(i,1); unlock();
      const p=root.__prevFocus;
      try{ if(p&&p.isConnected&&typeof p.focus==='function') p.focus({preventScroll:true}); }catch(e){}
    }
    function close(root){
      if(!root||root.__closing) return; root.__closing=true;
      root.classList.remove('on'); root.style.pointerEvents='none';
      pop(root);
      try{ if(root.__lopt&&root.__lopt.onClose) root.__lopt.onClose(); }catch(e){}
      const raw=root.__rawRemove;
      setTimeout(()=>{ try{ (raw||(()=>root.remove()))(); }catch(e){} }, 210);
    }
    document.addEventListener('keydown',e=>{
      const t=top(); if(!t) return;
      if(e.key==='Escape'){ const o=t.__lopt||{}; if(o.esc===false) return; e.preventDefault(); close(t); return; }
      if(e.key==='Tab'){
        const f=focusables(t); if(!f.length) return;
        const first=f[0], last=f[f.length-1];
        if(!t.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    }, true);
    return {push,close,top};
  })();

  function openMs(inner, opt){
    opt=opt||{};
    const el=document.createElement('div');
    el.className='msheet'+(opt.cls?(' '+opt.cls):'');
    el.innerHTML='<div class="msheet-box'+(opt.boxCls?(' '+opt.boxCls):'')+'"'+(opt.boxStyle?(' style="'+opt.boxStyle+'"'):'')+'>'+inner+'</div>';
    document.body.appendChild(el);
    el.__rawRemove=el.remove.bind(el);
    el.remove=()=>Layer.close(el);
    if(opt.kb){ try{ kbAvoid(el, el.querySelector('.msheet-box')); }catch(e){} }
    Layer.push(el, opt);
    return el;
  }

  function bindCuSwipe(rows){
    const closeAll=except=>{ rows.querySelectorAll('.cu-row.open').forEach(r=>{ if(r!==except) r.classList.remove('open'); }); };
    rows.querySelectorAll('.cu-row').forEach(row=>{
      const id=row.dataset.curow;
      let x0=null, y0=0, swiped=false;
      const skip=ev=>!!(ev.target.closest && ev.target.closest('.cu-side'));
      const begin=(x,y)=>{ x0=x; y0=y; swiped=false; };
      const moveTo=(x,y)=>{
        if(x0==null) return;
        const dx=x-x0, dy=y-y0;
        if(Math.abs(dx) < Math.abs(dy)*1.2) return;
        if(dx<-28 && !row.classList.contains('open')){ closeAll(row); row.classList.add('open'); swiped=true; }
        else if(dx>22 && row.classList.contains('open')){ row.classList.remove('open'); swiped=true; }
      };
      const endTap=()=>{ if(x0==null) return; x0=null; };
      const TOUCHED=('ontouchstart' in window) && navigator.maxTouchPoints>0;
      if(TOUCHED){
        row.addEventListener('touchstart',ev=>{
          if(ev.touches.length!==1 || skip(ev)){ x0=null; return; }
          begin(ev.touches[0].clientX, ev.touches[0].clientY);
        },{passive:true});
        row.addEventListener('touchmove',ev=>{
          if(x0==null || ev.touches.length!==1) return;
          const dx=ev.touches[0].clientX-x0, dy=ev.touches[0].clientY-y0;
          if(Math.abs(dx) >= Math.abs(dy)*1.2){ try{ ev.preventDefault(); }catch(e){} }
          moveTo(ev.touches[0].clientX, ev.touches[0].clientY);
        },{passive:false});
        row.addEventListener('touchend',()=>{ endTap(); },{passive:true});
        row.addEventListener('touchcancel',()=>{ x0=null; },{passive:true});
      } else {
        row.addEventListener('mousedown',ev=>{ if(skip(ev)) return; begin(ev.clientX, ev.clientY); });
        row.addEventListener('mousemove',ev=>{ if(x0!=null) moveTo(ev.clientX, ev.clientY); });
        row.addEventListener('mouseup',()=>{ endTap(); });
      }
      const body=row.querySelector('.cu-main');
      body.addEventListener('click',ev=>{
        if(skip(ev)) return;
        if(swiped){ swiped=false; return; }
        if(x0!=null){ x0=null; return; }
        if(row.classList.contains('open')){ row.classList.remove('open'); return; }
        try{ trSelect(id); }catch(e){}
      });
    });

  function trSyncStrips(){

    const cds=trCardioFor(day);
    const cdDone=cds.filter(c=>c.done).reduce((a,c)=>a+cdMinOf(c),0);

        const d=dates[dates.length-1];
        const list=d?train.records.filter(r=>r.date===d):[];
        const show=!items.length && !cds.length && list.length>0;
        rp.hidden=!show;
        if(show){
          const names=list.slice(0,2).map(r=>r.name).join(' + ')+(list.length>2?(' 等 '+list.length+' 个'):'');
          const b=rp.querySelector('b'), em=rp.querySelector('em');
          if(b) b.textContent='上次训练：'+names;

        }

    const kMon=fmt(mon), kNow=fmt(now);

    const thisW=(train.records||[]).filter(r=>r.date>=kMon && r.date<=kNow).reduce((a,r)=>a+(r.sets||0),0);
    const lastW=(train.records||[]).filter(r=>r.date>=fmt(pMon) && r.date<=fmt(pEnd)).reduce((a,r)=>a+(r.sets||0),0);
    const cdW=(train.cardio||[]).filter(c=>c.date>=kMon&&c.date<=kNow&&c.done).reduce((a,c)=>a+cdMinOf(c),0);
    let wk='本周 '+thisW+' 组'+(cdW?(' · 有氧 '+cdW+' 分钟'):'');

  function trExpand(t){
    const out=[t];
    TR_SYN.forEach(g=>{
      if(g.some(x=>x===t || (t.length>1 && x.includes(t)) || (x.length>1 && t.includes(x)))){
        g.forEach(x=>{ if(out.indexOf(x)<0) out.push(x); });
      }
    });
    Object.keys(CN2EN).forEach(k=>{ if(t.includes(k)){ const v=CN2EN[k].toLowerCase().replace(/\s+/g,''); if(out.indexOf(v)<0) out.push(v); } });
    return out;
  }
  function trFiltered(){
    const q=trState.q.toLowerCase().trim();
    const base=allExercises().filter(e=>{
      if(trState.part && !partHit(trState.part,e.p)) return false;
      if((trState.eqs||[]).length && trState.eqs.indexOf(e.e)<0) return false;
      return true;
    });
    if(!q){
      const seen=new Set(); const uni=base.filter(e=>{ const k=(e.n||'').trim().toLowerCase(); if(!k||seen.has(k)) return false; seen.add(k); return true; });
      if(trState.sort==='name') return uni.slice().sort((a,b)=>String(a.n).localeCompare(String(b.n),'zh'));
      return uni.slice().sort((a,b)=>(freqScore(b.id)-freqScore(a.id))||(a.n.length-b.n.length));
    }
    const rawToks=q.split(/[\s,，、;；+\/]+/).filter(Boolean);
    const toks=[];
    for(let i=0;i<rawToks.length;i++){
      let t=rawToks[i];
      if(t.length===1 && /[a-z0-9]/.test(t) && i+1<rawToks.length){ t=t+rawToks[++i]; }
      toks.push(t);
    }
    const lists=[];
    const scored=[];
    const norm=v=>v.toLowerCase().replace(/\s+/g,'');
    base.forEach(e=>{
      const name=norm(e.n+' '+(e.en||''));
      const meta=norm(e.p+' '+(e.e||'')+' '+(e.t||''));
      const steps=norm((e.s||[]).join(' '));
      let score=0, misses=0, allName=true;
      toks.forEach(t=>{
        const ex=trExpand(norm(t));
        const inName=ex.some(x=>name.includes(x));
        const inMeta=ex.some(x=>meta.includes(x));
        const inSteps=ex.some(x=>steps.includes(x));
        if(!inName) allName=false;
        if(name.includes(norm(t))) score+=20;
        else if(inName) score+=8;
        else if(inMeta) score+=4;
        else if(inSteps) score+=2;
        else { misses++; score-=1; }
      });
      if(allName && toks.length>1) score+=3;
      if(misses===0){ scored.push({e,score}); return; }
      if(misses===toks.length) return;
      lists.push({e,score});
    });
    const byScore=(a,b)=>(b.score-a.score)||(a.e.n.length-b.e.n.length);
    const dedupe=arr=>{ const seen=new Set(); return arr.filter(e=>{ const k=(e.n||'').trim().toLowerCase(); if(!k||seen.has(k)) return false; seen.add(k); return true; }); };
    if(scored.length) return dedupe(scored.sort(byScore).map(x=>x.e));
    return dedupe(lists.sort(byScore).map(x=>x.e));
  }

    const timed=g=>!!(g.timed && !(g.reps||0));
    const f=g=>timed(g)?((g.sec||0)+' 秒'):((((g.weight||0)>0)?(g.weight+'kg'):'自重')+'×'+(g.reps||0));
    const same=arr.every(g=>timed(g)===timed(arr[0]) && (timed(g)?((g.sec||0)===(arr[0].sec||0)):((g.weight||0)===(arr[0].weight||0)&&(g.reps||0)===(arr[0].reps||0))));
    if(same) return (opts.bare?'':arr.length+' 组 · ')+(timed(arr[0])?(f(arr[0])+'/组'):f(arr[0]));

  function trClipErr(v, box, e, ph){
    // 同一来源先重试 2 次（CDN 偶发 403/超时），再换下一个来源
    if(v.dataset.skipretry === '1'){ v.dataset.try = '3'; }
    else {
    const tries = (parseInt(v.dataset.try, 10) || 0) + 1;
    if(tries <= 2){
      v.dataset.try = String(tries);
      setTimeout(function(){
        try{ v.src = GYM_BASES[parseInt(v.dataset.bi, 10) || 0] + v.dataset.vid + '.mp4'; v.load(); v.play().catch(function(){}); }catch(err){}
      }, 700 * tries);
      return;
    }
    }
    v.dataset.try = '0';
    let bi = (parseInt(v.dataset.bi, 10) || 0) + 1;
    if(bi < GYM_BASES.length){
      v.dataset.bi = String(bi);
      v.src = GYM_BASES[bi] + v.dataset.vid + '.mp4';
      try{ v.load(); v.play().catch(function(){}); }catch(err){}
      return;
    }
    const im = document.createElement('img');
    im.className = 'ex-gif'; im.alt = '';
    if(v.parentElement) v.parentElement.replaceChild(im, v);
    if(e.g){ try{ trLoadGif(im, e.g, ph); }catch(err){} }

  }
  function trMountClip(box, e, ph){
    const id = gymClipOf(e.id);
    if(!box || !id) return false;
    if(box.querySelector('video')) return true;
    const busy=(window.__clipBusy||0);
    if(busy>=4){ setTimeout(function(){ try{ trMountClip(box, e, ph); }catch(err){} }, 260); return true; }
    window.__clipBusy=busy+1;
    var __released=false;
    var __free=function(){ if(__released) return; __released=true; window.__clipBusy=Math.max(0,(window.__clipBusy||1)-1); };
    setTimeout(__free, 5000);
    const v = document.createElement('video');
    v.className = 'ex-gif ex-vid';
    v.muted = true; v.loop = true; v.autoplay = true; v.preload = 'auto';
    v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.setAttribute('loop', '');
    v.style.opacity = '0';
    v.dataset.vid = id; v.dataset.bi = '0'; v.dataset.gif = e.g || '';
    const reveal = function(){
      if(v.videoWidth > 0 || v.readyState >= 2){ v.style.opacity = '1'; const p = box.querySelector('.gif-ph'); if(p) p.remove(); }
    };
    ['loadedmetadata','loadeddata','canplay','playing'].forEach(function(ev){ v.addEventListener(ev, reveal); });
    v.addEventListener('loadeddata', __free, {once:true});
    v.addEventListener('error', __free, {once:true});
    v.addEventListener('error', function(){ trClipErr(v, box, e, ph); });
    v.src = GYM_BASES[0] + id + '.mp4';
    const im = box.querySelector('.ex-gif');
    if(im) box.replaceChild(v, im); else box.appendChild(v);
    v.play().catch(function(){});
    setTimeout(reveal, 700);
    // 首个来源 3.5s 内没拿到元数据，视为不可达，直接切下一个来源
    setTimeout(function(){
      if(v.readyState === 0 && v.dataset.vid === id){ v.dataset.skipretry = '1'; trClipErr(v, box, e, ph); v.dataset.skipretry = '0'; }
    }, 3500);
    v.onclick = function(){ trToggleClip(v); };
    return true;
  }
  function trToggleClip(video){

  function trLoadGif(el,file,placeholder,force){
    const ph=placeholder || $('exGifPh');
    if(!force && GIF_OK[file]){ if(ph) ph.remove(); el.src=GIF_OK[file]; el.style.opacity='1'; return; }
    const bases=GIF_PRI.concat(GIF_ALT);
    if(ph){ ph.textContent='动画加载中…'; ph.style.display=''; }
    el.style.display=''; el.style.opacity='0';
    let i=0, done=false, timer=null;
    const fail=()=>{
      if(done) return; done=true; clearTimeout(timer);
      if(ph) ph.remove();
      const m=el.parentElement; if(!m) return;
      el.style.display='none';
      let box=m.querySelector('.gif-fail');
      if(!box){ m.insertAdjacentHTML('beforeend','<div class="gif-fail"><span>动图加载失败，多为网络问题</span><button type="button" class="gif-retry">重试</button></div>'); box=m.querySelector('.gif-fail'); }
      const rb=box.querySelector('.gif-retry');
      if(rb) rb.onclick=()=>{ box.remove(); trLoadGif(el,file,placeholder,true); };
    };
    const next=()=>{
      if(done) return;
      if(i>=bases.length){ fail(); return; }
      const url=bases[i++]+file;
      clearTimeout(timer);
      timer=setTimeout(()=>{ el.onload=null; el.onerror=null; next(); }, 8000);
      el.onload=()=>{ if(done) return; done=true; clearTimeout(timer); el.onload=null; el.onerror=null; GIF_OK[file]=url; el.style.opacity='1'; if(ph) ph.remove(); };
      el.onerror=()=>{ el.onload=null; el.onerror=null; next(); };
      el.referrerPolicy='no-referrer';
      el.src=url;
    };
    next();
  }

  /* ---------- 拍照识别器械：多模态 → 库内匹配 → 直接加今日 ---------- */
  function gifNorm(t){ return String(t||'').toLowerCase().replace(/[\s（）()·\-—_、，,。.]/g,''); }
  function gifCJK(t){
    const s=gifNorm(t);
    const c=s.replace(/[a-z0-9]/g,'');
    return c||s;
  }
  function gifLCS(a, b){
    let best=0;
    for(let i=0;i<a.length;i++){
      for(let j=i+1;j<=a.length;j++){
        const seg=a.slice(i,j);
        if(b.indexOf(seg)>=0) best=Math.max(best, seg.length); else break;
      }
    }
    return best;
  }
  function gifScore(name, e){
    const a=gifCJK(name), b=gifCJK(e.n);
    if(!a||!b) return 0;
    if(a===b) return 130;
    const mn=Math.min(a.length, b.length)||1;
    let sc=Math.round(gifLCS(a,b)/mn*45);
    const set={}; a.split('').forEach(c=>{ set[c]=1; });
    let hit=0; b.split('').forEach(c=>{ if(set[c]) hit++; });
    sc += Math.round(hit/mn*30);
    if(b.indexOf(a)>=0 || a.indexOf(b)>=0) sc+=20;
    const ea=gifCJK(e.e);
    if(ea && (a.indexOf(ea)>=0 || ea.indexOf(a)>=0)) sc+=10;
    return sc;
  }
  function gifFindLocal(name, part, equip){
    let best=null, bs=0;
    allExercises().forEach(e=>{
      if(!e.g) return;
      let sc=gifScore(name, e);
      if(part && e.p===part) sc+=8;
      const ee=gifNorm(e.e), qq=gifNorm(equip);
      if(ee && qq && (ee.indexOf(qq)>=0 || qq.indexOf(ee)>=0)) sc+=6;
      if(sc>bs){ bs=sc; best=e; }
    });
    return (best && bs>=50) ? {ex:best, score:bs} : null;
  }

  function camCompress(file, cb){
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const max=1024, sc=Math.min(1, max/Math.max(img.width,img.height));
          const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cb(cv.toDataURL('image/jpeg',0.72));
        }catch(e){ cb(null); }
      };
      img.onerror=()=>cb(null);
      img.src=fr.result;
    };
    fr.onerror=()=>cb(null);
    fr.readAsDataURL(file);
  }

  function partLastDate(part){
    return train.records.filter(r=>r.part===part).reduce((a,b)=>(a>b.date?a:b.date),'');
  }
  function partRecovery(part){
    const last=partLastDate(part);
    if(!last) return {h:999,text:'',warn:false};
    const h=Math.round((new Date(trToday()+'T00:00:00').getTime()-new Date(last+'T00:00:00').getTime())/36e5);
    if(h<24) return {h,text:part+' 今日已练 · 建议换部位或降低强度',warn:true};
    if(h<48) return {h,text:part+' 恢复中（'+h+' 小时）· 建议换部位',warn:true};
    return {h,text:part+' 已恢复 '+Math.floor(h/24)+' 天 · 可以练',warn:false};
  }
  function genPlan(part){
    const recs=(train.records||[]).filter(r=>r.part===part);
    const stat={};
    recs.forEach(r=>{ const k=r.exId||r.name; if(!stat[k]) stat[k]={exId:r.exId, name:r.name, n:0, last:r};
      stat[k].n++; stat[k].last=r; });
    const used=Object.values(stat).sort((a,b)=>b.n-a.n);
    const favs=(train.favs||[]).map(findEx).filter(e=>e&&e.p===part);
    const picked=[], seen=new Set();
    used.slice(0,3).forEach(u=>{ const e=findEx(u.exId); if(e&&!seen.has(e.id)){ seen.add(e.id); picked.push({e,src:'hist',u}); } });
    favs.forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); picked.push({e,src:'fav'}); } });
    const PART_KW={
      '胸':/卧推|飞鸟|夹胸|俯卧撑|推胸|臂屈伸|推/,
      '背':/划船|下拉|引体|上拉|直臂|面拉|硬拉/,
      '上腿':/深蹲|硬拉|弓步|腿举|腿屈伸|腿弯举|分腿|臀推|提踵/,
      '小腿':/提踵|小腿/,
      '腰腹':/卷腹|仰卧起坐|平板|抬腿|举腿|转体|侧屈|收腹|腹|屈膝/,
      '上臂':/弯举|臂屈伸|三头|二头|屈伸/,
      '前臂':/弯举|腕|握|前臂/,
      '肩':/推举|平举|耸肩|面拉|侧平|前平|肩/,
      '颈':/颈|桥/,
      '有氧':/跑|跳|单车|划船机|跳绳|登山|开合|波比/
    };
    const kw=PART_KW[part];
    const score=e=>{
      let v=0;
      if(/杠铃|哑铃|绳索|器械|史密斯|壶铃/.test(e.e||'')) v+=4;
      if(kw && kw.test(e.n)) v+=8;
      if(kw && !kw.test(e.n)) v-=4;
      if(/辅助/.test(e.n)) v-=8;
      if(/弹力带/.test(e.e||'')) v-=3;
      if(/跪姿|俯卧|瑜伽球|平衡/.test(e.n)) v-=1;
      return v-e.n.length*0.06;
    };
    const pool=allExercises().filter(e=>e.p===part&&!seen.has(e.id))
      .sort((a,b)=>score(b)-score(a));
    const coreOf=n=>{
      const m=n.match(/硬拉|深蹲|弓步|卧推|推胸|划船|下拉|肩推|推举|弯举|飞鸟|夹胸|臂屈伸|伸展|提踵|卷腹|仰卧起坐|平板支撑|引体向上|俯卧撑|臀推|抬腿|举腿|转体|侧屈|平举|耸肩|上拉|跑|单车|跳/);
      return m?m[0]:n.slice(-3);
    };
    const LEG=/深蹲|弓步|臀桥|臀推|腿举|腿弯|腿屈伸|提踵|小腿|分腿/;
    const UPPER=/弯举|飞鸟|夹胸|推胸|卧推|划船|下拉|平举|推举|臂屈伸/;
    const eqCount={}, coreCount={};
    for(const e of pool){
      if(picked.length>=4) break;
      if((part==='上臂'||part==='前臂') && LEG.test(e.n)) continue;
      if(part==='上腿' && UPPER.test(e.n)) continue;
      const eq=e.e||'自重', core=coreOf(e.n);
      if((eqCount[eq]||0)>=2) continue;
      if((coreCount[core]||0)>=1) continue;
      if(seen.has(e.id)) continue;
      seen.add(e.id); eqCount[eq]=(eqCount[eq]||0)+1; coreCount[core]=(coreCount[core]||0)+1;
      picked.push({e,src:'lib'});
    }
    const allRecs=(train.records||[]);
    const lastWOf=id=>{ const rs=allRecs.filter(r=>r.exId===id && (r.weight||0)>0); return rs.length?(rs[rs.length-1].weight||0):0; };
    const peerW=(eq)=>{ let rs=allRecs.filter(r=>r.part===part && (r.weight||0)>0);
      if(!rs.length && eq){
        rs=allRecs.filter(r=>{ try{ const x=findEx(r.exId)||{}; return (x.e||r.e||'')===eq && (r.weight||0)>0; }catch(e){ return false; } });
      }
      if(!rs.length) return 0;
      const t=rs.slice(-3).reduce((a,b)=>a+(b.weight||0),0)/Math.min(3,rs.length);
      return Math.max(2.5, Math.round(t/2.5)*2.5); };
    return picked.map(p=>{
      const u=p.u; let sets=3, reps=12, weight=0, note='', sugg=false;
      if(u){
        const last=u.last;
        sets=last.sets>=4?4:3;
        reps=Math.max(last.reps||10,8)+1;
        weight=last.weight||0;
        note=weight>0
          ? `上次 ${last.weight}kg × ${last.reps} 次（该动作 ${u.n} 次记录）· 重量保持，每组多做 1-2 次`
          : `上次 ${last.sets}×${last.reps} 自重（该动作 ${u.n} 次记录）· 加 1 组或放慢离心`;
      } else if(p.src==='fav'){
        note='你收藏的常用动作 · 按 3×12 起步';
      } else {
        note='同部位动作库补充 · 按 3×12 起步';
      }
      if(!u){
        const lw=lastWOf(p.e.id);
        if(lw){ weight=lw; sugg=false; note='上次 '+lw+'kg · 沿用重量，先做 3×12'; }
        else if((p.e.e||'')!=='自重'){
          const pw=peerW(p.e.e||'');
          if(pw){ weight=pw; sugg=true; note='按同部位最近重量估算 · 采纳后可微调'; }
        }
      }
      if(part==='有氧' && /单车|跑|走|游泳|椭圆|登山|跳|划船机/.test(p.e.n)){
        return {exId:p.e.id, name:p.e.n, part:p.e.p, eq:p.e.e, sets:1, reps:1, weight:0, dur:20,
          note:'有氧以时长为准 · 建议 20-30 分钟中等强度', src:p.src};
      }
      return {exId:p.e.id, name:p.e.n, part:p.e.p, eq:p.e.e, sets, reps, weight, note, sugg:!!sugg, src:p.src};
    });
  }

      }
    });

    // 参数 stepper
    const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    const bump=(idx,field,d)=>{
      const i=trPlan[idx]; if(!i || trPlanJoined(i.exId)) return false;
      if(field==='sets') i.sets=clamp((i.sets||1)+d,1,20);
      else if(field==='reps') i.reps=clamp((i.reps||1)+d,1,100);
      else if(field==='weight') i.weight=Math.max(0,Math.round(((i.weight||0)+d)*10)/10);
      else if(field==='dur') i.dur=clamp((i.dur||0)+d,5,90);
      else return false;
      i.adjUser=true;
      return true;
    };
    box.querySelectorAll('[data-pl]').forEach(b=>{
      const p=b.dataset.pl.split(':'), idx=+p[0], field=p[1], d=parseFloat(p[2]);
      let hold=null, timer=null;
      const paint=()=>{ const i=trPlan[idx]; if(!i) return;
        const num=box.querySelector(`[data-pnum="${idx}:${field}"]`);
        if(num) num.textContent = field==='weight' ? ((i.weight||0)>0?i.weight:'自重') : i[field];
      };
      const fire=()=>{ if(bump(idx,field,d)) paint(); };
      const stop=()=>{ clearTimeout(hold); clearInterval(timer); hold=timer=null; };
      b.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation(); fire(); hold=setTimeout(()=>{ timer=setInterval(fire,110); },420); });
      b.addEventListener('pointerup',()=>{ stop(); trPlanSave(); trRenderPlan(); });
      b.addEventListener('pointercancel',()=>{ stop(); trPlanSave(); trRenderPlan(); });
      b.addEventListener('pointerleave',()=>{ stop(); });

    box.querySelectorAll('[data-plw]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation();

        return; }
      const r=planImportAll();
      trToast('已加入 '+r.added+' 个动作'+(r.updated?('，更新 '+r.updated+' 个'):''));
      trRenderPlan();
    };
    if($('plGoToday')) $('plGoToday').onclick=()=>{
      const pend=trPlan.filter(i=>!trPlanJoined(i.exId)).length;
      if(pend){ const r=planImportAll(); trToast('已加入 '+r.added+' 个动作'); }
      plOpen=-1; trSetSeg('today'); try{ trRenderToday(); }catch(e){}
    };
  }

  // 有氧时长（分钟）：计划项取目标 dur，自由计时按实际计时换算
  function cdMinOf(c){ if(!c) return 0; return c.free ? Math.round((c.sec||0)/60) : (c.dur||Math.round((c.sec||0)/60)||0); }
  function cdSec(r){
    if(!r) return 0;
    return (r.sec||0) + (r.run&&r.t0 ? Math.floor((Date.now()-r.t0)/1000) : 0);
  }
  function cdMiniPaint(svg,sec,dur){
    if(!svg) return;
    const put=(cls,p)=>{ const b=svg.querySelector('.bar.'+cls); if(!b) return;
      const r=parseFloat(b.dataset.r)||1, C=2*Math.PI*r;
      b.setAttribute('stroke-dashoffset',(C*(1-Math.max(0,Math.min(1,p)))).toFixed(1)); };
    const target=dur?dur*60:0;
    put('h', target? sec/target : (sec%7200)/7200);
    put('m', (sec%3600)/3600);
    put('s', (sec%60)/60);
    const hb=svg.querySelector('.bar.h'); if(hb) hb.classList.toggle('goal', !!target);
  }
  function cdMiniSvg(sec,dur){
    const target=dur?dur*60:0;
    const arc=(cls,r,p)=>{ const C=2*Math.PI*r;
      return '<circle class="bar '+cls+(cls==='h'&&target?' goal':'')+'" data-r="'+r+'" cx="60" cy="60" r="'+r+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-Math.max(0,Math.min(1,p)))).toFixed(1)+'"></circle>'; };
    return '<svg class="cd-mini3" viewBox="0 0 120 120" aria-hidden="true">'
      +'<circle class="trk h" cx="60" cy="60" r="52"></circle>'
      +'<circle class="trk m" cx="60" cy="60" r="38"></circle>'
      +'<circle class="trk s" cx="60" cy="60" r="24"></circle>'
      +arc('h',52, target? sec/target : (sec%7200)/7200)
      +arc('m',38,(sec%3600)/3600)
      +arc('s',24,(sec%60)/60)
      +'</svg>';
  }
  function cdHMS(sec){
    const s2=Math.max(0,Math.floor(sec||0));
    const h=Math.floor(s2/3600), m=Math.floor(s2/60)%60, x=s2%60;
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(x<10?'0':'')+x;
  }
  function cdFmt(sec){
    const s2=Math.max(0,Math.floor(sec||0));

  }
  function cdStart(r){ if(!r||r.done) return; r.run=true; r.t0=Date.now(); }

  function cdFinish(r){

  function liveDragBind(cont,opt){
    if(!cont || cont.__ldb) return; cont.__ldb=1;
    const o=opt||{};
    let drag=null, raf=0;
    const list=()=>{
      if(o.nodes) return o.nodes().filter(n=>n&&n.isConnected);
      return [...cont.children].filter(n=>n.matches && n.matches(o.rowSel||'.pl-row'));
    };
    const paint=()=>{
      raf=0; if(!drag) return;
      const dt=drag.lastY-drag.startY;
      if(!drag.moved && Math.abs(dt)>4) drag.moved=true;
      const wantTop=drag.startTop+dt;
      const bTop=cont.getBoundingClientRect().top;
      drag.ty=wantTop-drag.layoutTop;
      drag.row.style.transform='translateY('+drag.ty+'px) scale(1.03)';
      const center=wantTop+drag.h0/2;
      const arr=list();
      let idx=0;
      arr.forEach(n=>{
        if(n===drag.row) return;
        const r=n.getBoundingClientRect();
        if(center > (r.top-bTop)+r.height/2) idx++;
      });
      const cur=arr.indexOf(drag.row);
      if(idx!==cur){
        let target;
        if(idx>cur){ target=arr[idx+1]; if(!target){ cont.appendChild(drag.row); target=null; } }
        else { target=arr[idx]; }
        if(target){ cont.insertBefore(drag.row, target); }
        else if(idx>cur){ /* 已移至末尾 */ }
        const bTop2=cont.getBoundingClientRect().top;
        drag.layoutTop=drag.row.getBoundingClientRect().top-bTop2-drag.ty;  // 换位后重新锚定布局位置
        try{ haptic('light'); }catch(e){}
      }
    };
    const finish=ev=>{
      if(!drag) return;
      const d=drag; drag=null;
      if(raf){ cancelAnimationFrame(raf); raf=0; }
      d.row.style.transform=''; d.row.classList.remove('dragging');
      cont.classList.remove('drag-on');
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      if(!d.moved) return;
      try{ o.onDrop && o.onDrop(d.row); }catch(e){}
      try{ haptic('core'); }catch(e){}
    };
    const onMove=ev=>{
      if(!drag || (ev.pointerId!=null && drag.id!=null && ev.pointerId!==drag.id)) return;
      drag.lastY=ev.clientY;
      if(!raf) raf=requestAnimationFrame(paint);
      ev.preventDefault();
    };
    const onUp=ev=>{
      if(ev && ev.pointerId!=null && drag && drag.id!=null && ev.pointerId!==drag.id) return;
      finish(ev);
    };
    cont.addEventListener('pointerdown',ev=>{
      const h=ev.target.closest(o.handle||'[data-drag],[data-pldrag]'); if(!h) return;
      const row=h.closest(o.rowSel||'[data-urow],.pl-row'); if(!row) return;
      if(ev.pointerType==='mouse' && ev.button!==0) return;
      const rr=row.getBoundingClientRect(), bt=cont.getBoundingClientRect().top;
      drag={row,h,startY:ev.clientY,lastY:ev.clientY,moved:false,startTop:rr.top-bt,layoutTop:rr.top-bt,ty:0,h0:rr.height,id:ev.pointerId};
      row.classList.add('dragging');
      cont.classList.add('drag-on');
      ev.preventDefault(); ev.stopPropagation();
      // 不设 pointer capture：换位会重插节点，capture 会被浏览器释放并打断拖拽（表现为只能拖一格）
      document.addEventListener('pointermove',onMove,{passive:false});
      document.addEventListener('pointerup',onUp);
      document.addEventListener('pointercancel',onUp);
    },{passive:false});
  }

    // 删除（二次确认）
    box.querySelectorAll('[data-rmu]').forEach(b=>b.onclick=()=>{

    // ＋1 组（沿用最后一组参数）
    box.querySelectorAll('[data-addu]').forEach(b=>b.onclick=()=>{

    // −1 组：只能移除未完成的组

      if(idx<0){ trToast('已完成的组不能移除'); return; }

      r.groups=gs.filter((_,i)=>i!==idx);

      r.sets=r.groups.length;

        r.groups.splice(idx,0,g); r.groups.forEach((x,i)=>{ x.no=i+1; });

      };

    box.querySelectorAll('[data-hold]').forEach(b=>{
      const key=b.dataset.hold;
      const paint=()=>{
        if(!document.body.contains(b)) return;
        const t0=window.__logT0&&window.__logT0[key];
        if(t0){ b.textContent='计时中 '+Math.round((Date.now()-t0)/1000)+'s · 点此结束'; b.classList.add('on'); }
        else { b.textContent='开始计时'; b.classList.remove('on'); }
      };
      b.onclick=()=>{
        window.__logT0=window.__logT0||{};
        if(!window.__logT0[key]){ window.__logT0[key]=Date.now(); paint(); return; }
        const sec=Math.max(1,Math.round((Date.now()-window.__logT0[key])/1000));
        delete window.__logT0[key];
        const r=train.records.find(x=>x.uid===key);
        if(!r){ paint(); return; }
        const gs=ensureGroups(r);
        const g=gs.filter(x=>!x.done)[0];
        if(g){ g.sec=sec; g.done=true; g.timed=true; }
        else { gs.push({no:gs.length+1,reps:sec,weight:0,done:true,timed:true,sec,uid:r.uid+'h'+Date.now().toString(36)}); r.groups=gs; }
        r.sets=gs.length; r.dur=(r.dur||0)+Math.round(sec/60*10)/10;
        saveTrain(); trRenderToday(); refreshHome();
        trToast('记录 '+sec+' 秒');
        startRest(r);
      };
      paint();

      b.__tk=setInterval(()=>{ if(!document.body.contains(b)){ clearInterval(b.__tk); return; } paint(); },250);
    });
    box.querySelectorAll('[data-reststart]').forEach(b=>b.onclick=()=>{

    });
    // 组行右滑复制 / 左滑删除
    box.querySelectorAll('.set-row').forEach(row=>{
      const tick=row.querySelector('[data-tick]'); if(!tick) return;
      let x0=null, dx=0;
      row.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; dx=0; },{passive:true});
      row.addEventListener('touchmove',e=>{
        if(x0==null) return; dx=e.touches[0].clientX-x0;
        if(Math.abs(dx)>6) row.style.transform='translateX('+Math.max(-90,Math.min(90,dx))+'px)';
      },{passive:true});
      row.addEventListener('touchend',()=>{
        row.style.transform='';
        if(dx>64){
          const {r,g}=setOf(tick.dataset.tick);
          if(r&&g){
            const gs=ensureGroups(r); const ng={no:gs.length+1,reps:g.reps,weight:g.weight,done:false,uid:r.uid+'s'+Date.now().toString(36)};
            r.groups.push(ng); r.sets=r.groups.length; saveTrain(); trRenderToday();
            trToast('已复制一组：'+(g.weight>0?g.weight+'kg × ':'自重 × ')+g.reps);
          }
        } else if(dx<-64){
          const {r,g}=setOf(tick.dataset.tick);
          if(r&&g && ensureGroups(r).length>1){
            r.groups=r.groups.filter(x=>x.no!==g.no); ensureGroups(r); saveTrain(); trRenderToday();
            trToast('已删除第 '+g.no+' 组');
          } else if(r){
            trToast('只剩一组了，先用 × 删除整个动作');
          }
        }
        x0=null;
      });
    });

    // 近7日
    const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
    const keys=days.map(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    const labels=days.map(d=>String(d.getMonth()+1)+'/'+String(d.getDate()));
    const vals=keys.map(k=>train.records.filter(r=>r.date===k).reduce((a,b)=>a+(b.sets||0),0));
    const el=$('trChart');
    if(el && typeof echarts!=='undefined'){
      const ex=echarts.getInstanceByDom(el); if(ex) ex.dispose();
      if(!vals.some(v=>v>0)){
        el.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px">还没有训练记录，保存一次后这里会显示每日组数</div>';
      } else {
        el.innerHTML='';
        const ci=makeChart('trChart',{
          animation:false,
          grid:{left:30,right:10,top:16,bottom:22},
          tooltip:{trigger:'axis'},
          xAxis:{type:'category',data:labels,axisLine:{lineStyle:{color:'#3a3d44'}},axisLabel:{color:'#8b8e97',fontSize:10,interval:0}},
          yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#2a2d33'}},axisLabel:{color:'#8b8e97',fontSize:10}},
          series:[{type:'bar',data:vals,barWidth:'52%',itemStyle:{color:'#3DDCBF',borderRadius:[4,4,0,0]}}]
        });
        if(ci) ci.on('click', p=>showDayDetail(keys[p.dataIndex]));
      }
    }
    if($('trStat')){
      const recTodayW=train.records.filter(r=>keys.includes(r.date));
      const days7=new Set(recTodayW.map(r=>r.date)).size;
      const parts={}; train.records.forEach(r=>{ parts[r.part]=(parts[r.part]||0)+(r.sets||0); });
      const topPart=Object.keys(parts).sort((a,b)=>parts[b]-parts[a])[0]||'—';
      const totalSets=train.records.reduce((a,b)=>a+(b.sets||0),0);
      let stale='';
      const lastByPart={};
      (train.records||[]).forEach(r=>{ if(!lastByPart[r.part]||r.date>lastByPart[r.part]) lastByPart[r.part]=r.date; });
      Object.keys(lastByPart).forEach(pt=>{
        const gap=Math.floor((Date.now()-new Date(lastByPart[pt]+'T00:00:00').getTime())/864e5);
        if(gap>=12 && (!stale || gap>stale.gap)) stale={pt, gap};
      });
      $('trStat').innerHTML=`<span><b>${days7}</b>近7日训练日</span><span><b>${totalSets}</b>累计组数</span><span><b>${ENGINE.esc(topPart)}</b>最常练部位</span>`
        + (stale?`<span class="stale"><b>${ENGINE.esc(stale.pt)}</b>已 ${stale.gap} 天没练</span>`:'');
    }
  }

  function dedupeLib(){
    const key=e=>(e.n||'').trim();
    const first={}, firstEx={};
    allExercises().forEach(e=>{ const k=key(e); if(!first[k]){ first[k]=e.id; firstEx[k]=e; } });
    let changed=false;
    (train.records||[]).forEach(r=>{
      const k=(r.name||'').trim();
      const id=first[k];
      if(id && r.exId!==id){ r.exId=id; changed=true; }
      const e=firstEx[k];
      if(e){
        if(e.p && r.part!==e.p){ r.part=e.p; changed=true; }
        if(e.n && r.name!==e.n){ r.name=e.n; changed=true; }
      }
    });
    // 同日同动作重复记录合并
    if(train.records && train.records.length){
      const by={}; const out=[];
      train.records.forEach(r=>{
        const k=r.date+'|'+r.exId;
        if(by[k]){
          const host=by[k];
          host.groups=ensureGroups(host).concat(ensureGroups(r));
          host.sets=host.groups.length;
          changed=true;
        } else { by[k]=r; out.push(r); }
      });
      if(out.length!==train.records.length) train.records=out;
    }
    (train.favs||[]).forEach((id,i)=>{
      const e=findEx(id); if(!e) return;
      const k=key(e); const fid=first[k];
      if(fid && id!==fid){ train.favs[i]=fid; changed=true; }
    });
    const seen=new Set(); train.favs=(train.favs||[]).filter(id=>{ if(seen.has(id)) return false; seen.add(id); return true; });
    if(changed){ _useStat=null; saveTrain(); }
  }

    function parseQuickTrain(txt){
      let s=(txt||'').trim(); if(!s) return null;
      let sets=3, reps=10, weight=0;
      const sm=s.match(/(\d+)\s*[x×*]\s*(\d+)/i);
      if(sm){ sets=Math.max(1,Math.min(20,+sm[1])); reps=Math.max(1,Math.min(100,+sm[2])); s=s.replace(sm[0],' '); }
      const wm=s.match(/(\d+(?:\.\d+)?)\s*(?:kg|公斤)?\s*$/i);
      let name=s.trim();
      if(wm){ weight=parseFloat(wm[1])||0; name=s.replace(wm[0],'').trim(); }
      name=name.replace(/[，,。;；:：]+/g,' ').trim();
      if(!name) return null;
      const cand=allExercises().filter(e=>e.n.includes(name) || e.en.toLowerCase().includes(name.toLowerCase())).sort((a,b)=>a.n.length-b.n.length)[0];
      return { name:cand?cand.n:name, part:cand?cand.p:'其他', sets, reps, weight, exId:cand?cand.id:('cuq'+Date.now().toString(36)) };
    }

      trToast('已加入：'+e.n);
    });
    $('trAgain').addEventListener('click',()=>{

      const reps=last?last.reps:(parseInt($('trReps').value,10)||10);
