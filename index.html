{"id":"1685","n":"深蹲过头触达","en":"squat to overhead reach","p":"上腿","e":"自重","t":"股四头肌","g":"1685-QChZi3x.gif","s":["站立，双脚分开与肩同宽，脚趾稍微外翻。","弯曲膝盖并将臀部向后推，将身体降低至蹲姿。","当你从深蹲中站起来时，将手臂伸过头顶，伸向天花板。","放下手臂并弯曲膝盖再次蹲下，回到起始位置。"]},
{"id":"1686","n":"深蹲过头触达转体","en":"squat to overhead reach with twist","p":"上腿","e":"自重","t":"股四头肌","g":"1686-5BZHW9s.gif","s":["站立，双脚分开与肩同宽，脚趾稍微外翻。","弯曲膝盖并将臀部向后推，将身体降低至蹲姿。","当你从深蹲中站起来时，将手臂举过头顶并将躯干扭转到一侧。","返回起始位置并重复下蹲，这次将躯干扭转到另一侧。","每次深蹲重复时继续交替进行。"]},
{"id":"2297","n":"瑜伽球卷腹全程幅度双手后头","en":"stability ball crunch (full range hands behind head)","p":"腰腹","e":"瑜伽球","t":"腹肌","g":"2297-Gn5FwYT.gif","s":["坐在稳定球上，双脚平放在地面上，膝盖弯曲成 90 度角。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢向前弯曲上半身，使胸部靠近膝盖。","在顶部停顿片刻，然后慢慢降低上半身回到起始位置。"]},
{"id":"3291","n":"施塔尔德推举","en":"stalder press","p":"上臂","e":"自重","t":"三头肌","g":"3291-zd4P4B2.gif","s":["首先站立，双脚分开与肩同宽，双臂伸过头顶。","稍微弯曲膝盖并启动核心。","将身体降低至蹲姿，同时保持手臂伸过头顶。","当你蹲下时，将手臂向下压向地面，锻炼三头肌。","在深蹲底部停顿片刻，然后用脚后跟站起来，同时将手臂举过头顶。"]},
{"id":"3669","n":"站姿射手","en":"standing archer","p":"背","e":"自重","t":"上背","g":"3669-JF8AkMX.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","将双臂伸直至前方，与肩同高，与地面平行。","将躯干向右旋转，保持双臂伸展，背部挺直。","旋转时，向前伸展右臂，向后伸展左臂，模仿拉弓弦的动作。","保持该姿势片刻，然后回到起始位置。"]},
{"id":"0788","n":"站姿颈后推举","en":"standing behind neck press","p":"肩","e":"杠铃","t":"三角肌","g":"0788-xDh0lJr.gif","s":["双脚分开与肩同宽站立，用正手握法将杠铃握在颈后。","保持背部挺直，核心参与。","伸展手臂，充分伸展肘部，将杠铃推过头顶。","在顶部停顿片刻，然后慢慢将杠铃放回起始位置。"]},
{"id":"1490","n":"站姿提踵阶梯","en":"standing calf raise (on a staircase)","p":"小腿","e":"自重","t":"小腿三头肌","g":"1490-6HmFgmx.gif","s":["站在台阶或坚固平台的边缘，脚后跟悬垂，脚趾放在台阶上。","如果需要，抓住栏杆或墙壁以保持平衡。","慢慢地尽可能高地抬起脚后跟，将身体重量转移到脚掌上。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},
{"id":"1397","n":"站姿小腿","en":"standing calves","p":"小腿","e":"自重","t":"小腿三头肌","g":"1397-XIHEoCG.gif","s":["双脚分开与肩同宽站立，脚趾指向前方。","将脚后跟抬离地面，尽可能高，用脚趾站立。","保持该姿势片刻，然后慢慢降低脚跟回到起始位置。"]},
{"id":"1398","n":"站姿小腿拉伸","en":"standing calves calf stretch","p":"小腿","e":"自重","t":"小腿三头肌","g":"1398-qOKcgVP.gif","s":["面朝墙壁或坚固物体站立，距离大约一臂远。","将手放在与肩同高的墙壁或物体上。","一只脚向后退一步，保持脚跟平放在地面上。","稍微弯曲前膝盖并向前倾斜，保持后腿伸直。","您应该感觉到小腿肌肉有拉伸感。"]},
{"id":"1599","n":"站姿腘绳肌小腿拉伸助力带","en":"standing hamstring and calf stretch with strap","p":"上腿","e":"绳","t":"腘绳肌","g":"1599-xTjr103.gif","s":["站直，双脚分开与肩同宽。","用双手握住带子并将其放在脚掌周围。","保持腿伸直，从臀部慢慢向前倾斜，保持背部挺直。","感受腿筋和小腿肌肉的拉伸。","保持拉伸 20-30 秒。"]},
{"id":"0794","n":"站姿侧向拉伸","en":"standing lateral stretch","p":"背","e":"自重","t":"背阔肌","g":"0794-1jXLYEw.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","将双臂伸直至两侧，与地面平行。","慢慢将上半身向一侧倾斜，感觉侧面和背阔肌有拉伸感。","保持拉伸 15-30 秒。","返回起始位置并在另一侧重复。"]},
{"id":"1364","n":"站姿骨盆倾斜","en":"standing pelvic tilt","p":"背","e":"自重","t":"竖脊肌","g":"1364-cuKYxhu.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","将双手放在臀部或垂在身体两侧。","调动核心肌肉并向前倾斜骨盆，将下背部推向身后的墙壁。","保持该位置几秒钟，然后松开并返回到起始位置。"]},
{"id":"0795","n":"站姿单腿弯举","en":"standing single leg curl","p":"上腿","e":"自重","t":"腘绳肌","g":"0795-C5jncD2.gif","s":["站立，双脚分开与臀部同宽，双手放在臀部。","将体重转移到左腿上，将右脚抬离地面，弯曲膝盖。","慢慢地将右脚跟卷向臀部，挤压腿筋。","在顶部暂停片刻，然后慢慢将右脚放回起始位置。"]},
{"id":"0796","n":"站姿健腹轮滚轴前推","en":"standing wheel rollerout","p":"腰腹","e":"健腹轮","t":"腹肌","g":"0796-KtRomty.gif","s":["首先，站直，双脚分开与肩同宽，滚轮位于您的前方。","弯腰，慢慢向前滚动轮子，保持背部挺直，核心肌群参与。","继续向前滚动，直到感觉到腹肌拉伸并且身体尽可能伸展。","暂停片刻，然后慢慢地将轮子向身体方向滚动，回到起始位置。"]},
{"id":"3223","n":"星式跳","en":"star jump (male)","p":"有氧","e":"自重","t":"心肺","g":"3223-HtfCpfi.gif","s":["双脚分开与肩同宽站立，双臂放在身体两侧。","稍微弯曲膝盖并爆发性地跳起来。","跳跃时，张开双腿，将手臂向两侧伸展，与身体形成星形。","膝盖轻轻弯曲，脚掌轻轻着地。"]},
{"id":"2138","n":"动感单车跑第三式","en":"stationary bike run v. 3","p":"有氧","e":"动感单车","t":"心肺","g":"2138-H1PESYI.gif","s":["调整座椅高度和位置以确保正确对齐。","将脚放在踏板上，并用带子（如果有）将其固定。","以舒适的速度开始踩踏板。","保持稳定的节奏并根据需要增加阻力。","调动核心肌肉以保持稳定性和正确的姿势。"]},
{"id":"0798","n":"动感单车行走","en":"stationary bike walk","p":"有氧","e":"器械","t":"心肺","g":"0798-a8VDgLw.gif","s":["调整固定自行车上的座椅高度和位置，以确保正确对齐。","将脚放在踏板上，并用带子（如果有）将其固定。","以舒适的速度开始踩踏，保持背部挺直，核心参与。","保持稳定的节奏，并根据需要增加阻力水平。","继续踩踏您的有氧运动所需的持续时间。"]},
{"id":"3314","n":"分腿马耳他","en":"straddle maltese","p":"腰腹","e":"自重","t":"腹肌","g":"3314-HfqciZF.gif","s":["首先，悬挂在一对环上，双臂完全伸展，身体呈一条直线。","双腿分开，形成跨坐姿势。","启动你的核心并慢慢降低你的身体，直到你的手臂与地面平行。","保持这个姿势几秒钟，然后将自己推回到起始位置。"]},
{"id":"3298","n":"分腿俄挺","en":"straddle planche","p":"腰腹","e":"自重","t":"腹肌","g":"3298-BL3GHeY.gif","s":["从俯卧撑位置开始，双手与肩同宽，双脚分开。","启动你的核心，慢慢地将你的重心向前移动，将你的肩膀放在你的手上。","弯曲肘部，将身体放低至地面，保持肘部靠近身体两侧。","在底部停顿片刻，然后双手用力伸直手臂，将身体抬回到起始位置。"]},
{"id":"1427","n":"直腿外侧髋外展肌","en":"straight leg outer hip abductor","p":"上腿","e":"自重","t":"外展肌","g":"1427-mQ1tBXn.gif","s":["侧躺，双腿伸直并叠放在一起。","将下臂放在头下方以获得支撑。","启动你的核心并尽可能高地抬起你的上腿，不要旋转你的臀部或向后倾斜。","在顶部暂停片刻，然后慢慢将腿放回起始位置。"]},
{"id":"0803","n":"超人式俯卧撑","en":"superman push-up","p":"胸","e":"自重","t":"胸大肌","g":"0803-4GqRrAk.gif","s":["从高位平板支撑开始，双手分开略宽于肩宽，双脚并拢。","收紧核心，将身体降低到地面，保持肘部靠近身体两侧。","当你降低身体时，同时将右臂和左腿抬离地面，笔直向外伸展。","在顶部暂停片刻，然后放下手臂和腿，同时将自己推回起始位置。","继续交替进行所需的重复次数。"]},
{"id":"0805","n":"悬吊腹部前伸","en":"suspended abdominal fallout","p":"腰腹","e":"自重","t":"腹肌","g":"0805-X3TCNEU.gif","s":["将悬挂训练器连接到高锚点并将带子调整至腰部高度。","背对锚点站立，并握住手柄，双臂向前伸展。","腰部向前倾，保持身体挺直，核心肌群参与。","尽可能降低身体，同时保持腹肌的控制和紧张。","在底部停顿片刻，然后慢慢抬起身体回到起始位置。"]},
{"id":"0806","n":"悬吊俯卧撑","en":"suspended push-up","p":"胸","e":"自重","t":"胸大肌","g":"0806-IaGQCrC.gif","s":["找到一个悬挂训练器并将其调整到合适的高度。","背对锚点站立，并用正手握住手柄。","双脚向前走，身体向前倾斜，直到悬架训练器支撑您的体重。","保持身体从头到脚跟伸直，核心部位收紧，胸部朝手柄方向降低。","推动你的胸部和手臂回到起始位置。"]},
{"id":"0807","n":"悬吊反向卷腹","en":"suspended reverse crunch","p":"腰腹","e":"自重","t":"腹肌","g":"0807-R1WYG5D.gif","s":["悬挂在引体向上杆上，双臂完全伸展，手掌背向自己。","收紧核心肌群，将膝盖抬向胸部，将骨盆卷向胸腔。","在顶部暂停片刻，然后慢慢将膝盖放回起始位置。"]},
{"id":"0808","n":"悬吊划船","en":"suspended row","p":"背","e":"自重","t":"上背","g":"0808-4OaumBr.gif","s":["将悬挂训练器设置在适当的高度。","面向锚点站立，双脚分开与肩同宽。","正手握住手柄，手掌相对。","向后倾斜，保持身体挺直，脚后跟着地。","将胸部拉向手柄，将肩胛骨挤压在一起。"]},
{"id":"0809","n":"悬吊分腿蹲","en":"suspended split squat","p":"上腿","e":"自重","t":"股四头肌","g":"0809-QpXqiq8.gif","s":["背对悬吊训练器站立，双脚与肩同宽。","向前伸展一条腿，将脚背放在悬吊训练器的脚托中。","弯曲站立的腿，将身体降低到弓步位置，保持胸部向上，膝盖与脚趾对齐。","推动脚后跟返回到起始位置。"]},
{"id":"3433","n":"游泳式踢第二式","en":"swimmer kicks v. 2 (male)","p":"上腿","e":"自重","t":"臀大肌","g":"3433-SP3hUez.gif","s":["脸朝下躺在垫子上，双臂伸过头顶。","启动核心肌群，同时将胸部和腿部抬离地面。","以扑动的动作上下踢腿，就像在游泳一样。","继续踢所需的重复次数。","将胸部和双腿放低至起始位置。"]},
{"id":"3318","n":"摆荡360度","en":"swing 360","p":"有氧","e":"自重","t":"心肺","g":"3318-tnaj0mT.gif","s":["站立，双脚分开与肩同宽，膝盖稍微弯曲。","将双臂伸直在身前，与地面平行。","启动你的核心并以圆周运动摆动你的手臂，同时旋转你的躯干。","继续圆周运动，摆动手臂并旋转躯干，达到所需的重复次数。","记住在整个练习过程中保持呼吸。"]},
{"id":"1753","n":"凳上臂屈伸","en":"three bench dip","p":"上臂","e":"自重","t":"三头肌","g":"1753-DQ0cqkT.gif","s":["坐在长凳上，双手抓住边缘，手指指向前方。","将臀部滑离长凳，用手支撑体重。","弯曲肘部并降低身体，直到上臂与地面平行。","将自己推回到起始位置。"]},
{"id":"2459","n":"翻轮胎","en":"tire flip","p":"上腿","e":"轮胎","t":"臀大肌","g":"2459-oZjMu1t.gif","s":["双脚分开与肩同宽站立，面向轮胎。","弯曲膝盖并以臀部为铰链，降低至蹲姿。","向下伸手，用双手抓住轮胎的底部边缘，手指朝向您。","调动你的臀部和腿部肌肉，并爆发性地推动你的腿，将轮胎抬离地面。","当轮胎翻转时，用上半身的力量引导轮胎并保持控制。"]},
{"id":"0811","n":"六角杠杠硬拉","en":"trap bar deadlift","p":"上腿","e":"六角杠","t":"臀大肌","g":"0811-jQGwmxN.gif","s":["双脚分开与肩同宽站立，将陷阱杆放在你面前的地面上。","弯曲臀部和膝盖，降低身体高度，并用正手握住陷阱杆的手柄。","当你开始通过伸展臀部和膝盖将陷阱杆抬离地面时，保持背部挺直，挺胸。","当你举起时，专注于通过脚后跟发力，并在运动的最高点挤压臀部。","弯曲臀部和膝盖，将陷阱杆放回地面，在整个运动过程中保持背部挺直。"]},
{"id":"0814","n":"三头臂屈伸","en":"triceps dip","p":"上臂","e":"自重","t":"三头肌","g":"0814-X6C6i5Y.gif","s":["坐在长凳或椅子的边缘，双手抓住边缘，手指指向前方。","将臀部滑离长凳，用手支撑体重。","弯曲肘部，将身体放低至地面，保持背部靠近长凳。","在底部暂停片刻，然后将自己推回到起始位置。"]},
{"id":"0812","n":"三头臂屈伸凳腿","en":"triceps dip (bench leg)","p":"上臂","e":"自重","t":"三头肌","g":"0812-VuoerH0.gif","s":["坐在长凳边缘，双手抓住边缘，手指指向前方。","双脚向前走，将臀部滑离长凳，然后伸直手臂。","弯曲肘部，将身体放低至地面，保持背部靠近长凳。","推动手掌以伸直手臂并返回到起始位置。"]},
{"id":"0813","n":"三头臂屈伸之间凳","en":"triceps dip (between benches)","p":"上臂","e":"自重","t":"三头肌","g":"0813-Wgbn9qo.gif","s":["坐在长凳上，双手抓住长凳边缘，手指指向前方。","将臀部滑离长凳，用手支撑体重。","弯曲肘部，将身体放低至地面，保持背部靠近长凳。","在底部暂停片刻，然后将自己推回到起始位置。"]},
{"id":"0815","n":"三头肌臂屈伸地面","en":"triceps dips floor","p":"上臂","e":"自重","t":"三头肌","g":"0815-7aVz15j.gif","s":["坐在椅子或长凳的边缘，双手放在臀部旁边，手指指向前方。","将你的屁股从椅子前面滑下来，双腿伸到你面前。","伸直手臂，保持肘部稍微弯曲，以保持三头肌和肘关节的张力。","慢慢弯曲你的肘部，将你的身体向地板降低，直到你的肘部成大约 90 度角。","一旦到达动作的底部，向下压入椅子以伸直肘部，返回到起始位置。"]},
{"id":"0816","n":"三头肌推举","en":"triceps press","p":"上臂","e":"自重","t":"三头肌","g":"0816-fSrPP6B.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","将双臂伸直在身前，与地面平行。","弯曲肘部，将身体放低至地面，保持上臂靠近身体两侧。","在底部暂停片刻，然后将自己推回到起始位置。"]},
{"id":"0817","n":"三头肌拉伸","en":"triceps stretch","p":"上臂","e":"自重","t":"三头肌","g":"0817-uOV3Itw.gif","s":["站立或坐直，背部挺直。","将一只手臂伸过头顶，肘部弯曲。","将另一只手放在弯曲的肘部上，然后轻轻地将其拉向头部。","保持拉伸 15-30 秒，感受三头肌的轻微拉伸。","松开拉伸并在另一只手臂上重复。"]},
{"id":"0871","n":"收腿卷腹","en":"tuck crunch","p":"腰腹","e":"自重","t":"腹肌","g":"0871-BMMolZ3.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，将肩胛骨抬离地面，将膝盖靠近胸部，同时将上半身卷向膝盖。","在顶部停顿片刻，然后慢慢降低肩胛骨并将双腿伸展回起始位置。"]},
{"id":"0818","n":"双手柄平行握高位下拉","en":"twin handle parallel grip lat pulldown","p":"背","e":"绳索","t":"背阔肌","g":"0818-rkg41Fb.gif","s":["调整座椅高度并将自己面向电缆机。","正手握住手柄，双手与肩同宽。","坐下来，将大腿放在大腿垫下方，保持双脚平放在地板上。","稍微向后倾斜，挺胸，保持脊柱中立。","将手柄向下拉至上胸部，将肩胛骨挤压在一起。"]},
{"id":"1466","n":"转体髋上举","en":"twist hip lift","p":"上腿","e":"自重","t":"臀大肌","g":"1466-AX1kB0o.gif","s":["仰卧，膝盖弯曲，双脚平放在地上。","将双手放在身体两侧以获得支撑。","收紧臀部并将臀部抬离地面，从膝盖到肩膀形成一条直线。","在保持臀部抬起的同时，将下半身扭转到右侧，使膝盖靠近地面。","返回起始位置并向左侧重复扭转。"]},
{"id":"2802","n":"转体举腿","en":"twisted leg raise","p":"腰腹","e":"自重","t":"腹肌","g":"2802-C0eCeEt.gif","s":["平躺，双腿伸展，双臂放在身体两侧。","将双手放在臀部下方以获得支撑。","收紧腹肌，将双腿抬离地面，保持伸直。","当你抬起双腿时，将臀部扭向一侧，将双腿拉向对面的肩膀。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"2801","n":"转体举腿","en":"twisted leg raise (female)","p":"腰腹","e":"自重","t":"腹肌","g":"2801-yT9tk17.gif","s":["平躺，双腿伸展，双臂放在身体两侧。","弯曲膝盖，将双腿抬离地面，将它们拉向胸部。","当你抬起双腿时，将臀部扭向一侧，将膝盖移向另一侧的肩膀。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。","重复这个动作，这次将臀部扭到另一侧。"]},
{"id":"3231","n":"双触足","en":"two toe touch (male)","p":"背","e":"自重","t":"竖脊肌","g":"3231-p195zsJ.gif","s":["双脚分开与肩同宽站立，双臂向两侧伸展。","腰部向前弯曲，保持背部挺直，膝盖稍微弯曲。","双手向下伸向脚趾，保持双腿伸直。","在底部停顿片刻，然后慢慢回到起始位置。"]},
{"id":"1365","n":"上背拉伸","en":"upper back stretch","p":"背","e":"自重","t":"上背","g":"1365-GSDioYu.gif","s":["站直，双脚分开与肩同宽。","将双臂伸直在身前，与地面平行。","手指交叉，手掌旋转远离身体。","慢慢地将手臂举过头顶，保持它们伸直并彼此平行。","当你举起手臂时，将肩胛骨挤压在一起。"]},
{"id":"1366","n":"向上朝向狗","en":"upward facing dog","p":"背","e":"自重","t":"竖脊肌","g":"1366-01qpYSe.gif","s":["脸朝下躺在地板上，双腿伸到身后。","将双手放在下肋骨旁边的地板上，手指指向前方。","双手用力按在地板上，伸直手臂，将躯干和大腿抬离地面。","向后和向下转动肩膀，打开胸部，将目光转向天花板。","保持这个姿势几次呼吸，然后慢慢将身体放回起始位置。"]},
{"id":"3420","n":"坐地面","en":"v-sit on floor","p":"腰腹","e":"自重","t":"腹肌","g":"3420-ZuXu4Eq.gif","s":["坐在地板上，双腿伸到身前。","稍微向后倾斜，将双腿抬离地面，保持伸直。","同时，将上半身抬离地面，并将手臂伸向腿部。","保持这个姿势几秒钟，然后慢慢降低上半身和双腿回到起始位置。"]},
{"id":"0826","n":"垂直举腿平行杠","en":"vertical leg raise (on parallel bars)","p":"腰腹","e":"自重","t":"腹肌","g":"0826-ZNgOYQU.gif","s":["悬挂在双杠上，双臂完全伸展，身体伸直。","启动你的核心并将双腿抬起到你面前，保持伸直。","继续抬起，直到双腿与地面平行或稍高。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"2141","n":"行走椭圆机交叉训练器","en":"walk elliptical cross trainer","p":"有氧","e":"椭圆机","t":"心肺","g":"2141-rjtuP6X.gif","s":["将椭圆机的阻力水平和倾斜度调整到您想要的设置。","踩上机器的踏板并轻轻握住手柄。","首先用脚向下压，然后将手柄拉向身体。","继续这个动作，交替推和拉，以模拟行走或跑步动作。","在整个练习过程中保持稳定的步伐并保持核心参与。"]},
{"id":"3655","n":"行走高膝弓步","en":"walking high knees lunge","p":"有氧","e":"自重","t":"心肺","g":"3655-J9zIWig.gif","s":["双脚分开与臀部同宽站立。","将右膝尽可能高地抬向胸部，同时用左腿保持平衡。","右脚向前迈出一步，身体降低成弓步姿势，双膝弯曲成 90 度角。","用右脚推出，并将左膝抬向胸部。","左脚向前迈出一步，将身体降低至弓步位置。"]},
{"id":"1460","n":"行进弓步","en":"walking lunge","p":"上腿","e":"自重","t":"臀大肌","g":"1460-IZVHb27.gif","s":["双脚分开与肩同宽站立。","右腿向前迈出一步，将身体降低至弓步位置。","保持躯干直立，前膝与脚踝对齐。","右脚蹬地，左脚向前，左腿呈弓步姿势。","继续交替双腿向前行走，保持受控且稳定的步伐。"]},
{"id":"3666","n":"行走上斜跑步机","en":"walking on incline treadmill","p":"有氧","e":"器械","t":"心肺","g":"3666-rjiM4L3.gif","s":["将跑步机的倾斜度调整到您想要的强度。","站在跑步机上，双脚分开与肩同宽。","开始以舒适的步伐行走，确保保持正确的姿势。","在整个练习过程中，调动核心肌肉并保持背部挺直。","继续在倾斜跑步机上行走，完成有氧运动所需的时间。"]},
{"id":"2311","n":"行走台阶机","en":"walking on stepmill","p":"有氧","e":"台阶机","t":"心肺","g":"2311-j9Q5crt.gif","s":["将步进机调整到舒适的水平。","走上机器，将双手放在扶手上以获得支撑。","开始行走时，将一只脚放在台阶上，然后将另一只脚放在台阶上，双腿交替。","保持直立姿势并锻炼核心肌肉。","继续步行所需的时间或距离。"]},
{"id":"0830","n":"负重凳上臂屈伸","en":"weighted bench dip","p":"上臂","e":"负重","t":"三头肌","g":"0830-MU9HnE7.gif","s":["坐在长凳上，双手抓住边缘，手指指向前方。","将臀部滑离长凳，用手支撑体重。","弯曲肘部降低身体，直到上臂与地板平行。","伸直手臂，将自己推回起始位置。"]},
{"id":"2987","n":"负重窄距反手引体向上臂屈伸架","en":"weighted close grip chin-up on dip cage","p":"背","e":"负重","t":"背阔肌","g":"2987-Gk1r408.gif","s":["站在俯卧撑前面，用反握抓住双杠，双手与肩同宽。","悬挂在杠上，双臂完全伸展，双脚离开地面，身体伸直。","收紧背部肌肉，将身体拉向杠铃，保持肘部靠近身体两侧。","继续拉，直到下巴高于杠铃，然后暂停片刻。","慢慢地将身体放回起始位置，充分伸展双臂。"]},
{"id":"3643","n":"负重哥萨克深蹲","en":"weighted cossack squats (male)","p":"上腿","e":"负重","t":"臀大肌","g":"3643-GWoKnIm.gif","s":["站立时双脚分开比肩宽，脚趾稍微向外。","用双手将重物放在胸前。","将您的体重转移到一侧，并通过弯曲您转移一侧的膝盖来降低身体，同时保持另一条腿伸直。","尽可能降低身体高度，同时保持平衡并挺胸。","推动弯曲腿的脚跟以返回到起始位置。"]},
{"id":"0832","n":"负重卷腹","en":"weighted crunch","p":"腰腹","e":"负重","t":"腹肌","g":"0832-s8nrDXF.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将杠铃片或哑铃放在胸前。","收紧腹肌，将上半身抬离地面，向前卷曲，直到肩胛骨离开地面。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3670","n":"负重下斜仰卧起坐","en":"weighted decline sit-up","p":"腰腹","e":"负重","t":"腹肌","g":"3670-EZeDVzO.gif","s":["平躺在倾斜的长凳上，双脚固定在脚垫下。","将双手放在脑后或放在胸前。","收紧腹肌，慢慢将上半身抬离长凳，向前卷曲，直到躯干垂直于地面。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"0833","n":"负重驴式提踵","en":"weighted donkey calf raise","p":"小腿","e":"负重","t":"小腿三头肌","g":"0833-LmaFNZS.gif","s":["站在一个升高的平台上，脚趾放在边缘，脚后跟悬垂。","抓住一个稳定的物体作为支撑。","伸展脚踝，将脚后跟尽可能抬高。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},
{"id":"1310","n":"负重递减俯卧撑","en":"weighted drop push up","p":"胸","e":"负重","t":"胸大肌","g":"1310-PSlvNMs.gif","s":["从高位平板支撑开始，双手分开略宽于肩宽，双脚并拢。","将胸部压向地面，保持肘部靠近身体。","一旦你的胸部刚好高于地面，爆发性地把自己推起来，将双手抬离地面。","当你向上推时，快速将双手移至两侧并稍微向前，让你的身体向地面落下。","将双手置于更宽的位置，然后立即再次将胸部降低到地面。"]},
{"id":"2135","n":"负重前平板支撑","en":"weighted front plank","p":"腰腹","e":"负重","t":"腹肌","g":"2135-VBAWRPG.gif","s":["首先脸朝下躺在地板上。","将前臂放在地面上，肘部直接位于肩膀下方。","将双腿伸直在身后，脚趾着地。","启动你的核心并将你的身体抬离地面，用前臂和脚趾保持平衡。","保持身体从头部到脚跟呈一条直线。"]},
{"id":"0834","n":"负重前平举","en":"weighted front raise","p":"肩","e":"负重","t":"三角肌","g":"0834-e4aFmFY.gif","s":["双脚分开与肩同宽站立，双手各握一个哑铃，手掌朝向大腿。","保持双臂伸直，呼气并将哑铃举至身前，直至与肩齐平。","在顶部停顿片刻，然后吸气，慢慢将哑铃放回起始位置。"]},
{"id":"0866","n":"悬垂负重腿抬髋","en":"weighted hanging leg-hip raise","p":"腰腹","e":"负重","t":"腹肌","g":"0866-QOA0FD0.gif","s":["悬挂在引体向上杆上，双臂完全伸展，手掌背向自己。","启动你的核心并将双腿抬起到你面前，保持伸直。","继续抬起，直到双腿与地面平行或稍高。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"0835","n":"负重山羊挺身瑜伽球","en":"weighted hyperextension (on stability ball)","p":"背","e":"负重","t":"竖脊肌","g":"0835-8urJS9b.gif","s":["将自己面朝下放在稳定球上，臀部放在球上，双脚靠在墙上以保持稳定。","将双手放在脑后或交叉放在胸前。","启动你的核心，慢慢地将你的上半身抬离球，伸展你的背部，直到你的身体形成一条直线。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3641","n":"跪姿负重上台阶摆荡","en":"weighted kneeling step with swing","p":"肩","e":"负重","t":"三角肌","g":"3641-7uFJuXp.gif","s":["从跪姿开始，膝盖分开与臀部同宽，背部挺直。","每只手各握一个重物，双臂在身前笔直向下伸展。","启动你的核心肌群，将重物向上举过头顶，保持手臂伸直。","将重量放回起始位置，然后重复所需的重复次数。"]},
{"id":"3644","n":"负重弓步摆荡","en":"weighted lunge with swing","p":"上腿","e":"负重","t":"臀大肌","g":"3644-5WiFcYk.gif","s":["双脚分开与肩同宽站立，每只手各握一个重物。","右脚向前迈出一步，将身体降低至弓步位置。","当你向前冲时，向前和向上摆动重物，保持手臂伸直。","用右脚推出并返回到起始位置，将重物向下摆动。","用左脚重复上述动作，并继续交替双腿，完成所需的重复次数。"]},
{"id":"3286","n":"负重双力臂","en":"weighted muscle up","p":"背","e":"负重","t":"背阔肌","g":"3286-JsOV1SU.gif","s":["首先悬挂在引体向上杆上，手掌背向自己，双手之间的距离略大于肩宽。","启动核心肌群，将身体拉向杠铃杆，以胸部为主导。","当你到达动作的最高点时，改变你的握力，使你的手掌朝向你。","继续拉起自己，直到胸部到达杠铃，然后暂停片刻。","慢慢地将自己放回到起始位置，在整个运动过程中保持控制。"]},
{"id":"3312","n":"负重双力臂杠","en":"weighted muscle up (on bar)","p":"背","e":"负重","t":"背阔肌","g":"3312-MCkqdKE.gif","s":["首先悬挂在引体向上杆上，手掌背向自己，双手之间的距离略大于肩宽。","启动你的核心并将肩胛骨向下拉和向后拉。","弯曲肘部，将胸部拉向杠铃杆，保持身体挺直。","当你的胸部到达杠铃时，用手向下推并将肘部向后推，将身体提升到杠铃上方。","在动作的最高点暂停，然后慢慢降低回到起始位置。"]},
{"id":"3290","n":"负重单手引体向上","en":"weighted one hand pull up","p":"背","e":"负重","t":"背阔肌","g":"3290-fXfqg1E.gif","s":["正手握住引体向上杆，握距略宽于肩宽。","悬挂在杠上，手臂完全伸展，身体伸直。","弯曲肘部并挤压背部肌肉，调动核心力量，将身体拉向杠铃杆。","继续拉，直到下巴位于杠铃上方。","有控制地降低身体回到起始位置。"]},
{"id":"0840","n":"负重过头卷腹瑜伽球","en":"weighted overhead crunch (on stability ball)","p":"腰腹","e":"负重","t":"腹肌","g":"0840-xmM75XG.gif","s":["坐在稳定球上，双脚平放在地面上，膝盖弯曲成 90 度角。","双手握住杠铃片或哑铃，并将手臂伸过头顶。","收紧腹肌，慢慢向前弯曲躯干，使胸部靠近膝盖。","在顶部暂停片刻，然后慢慢将躯干放回起始位置。"]},
{"id":"0841","n":"负重引体向上","en":"weighted pull-up","p":"背","e":"负重","t":"背阔肌","g":"0841-HMzLjXx.gif","s":["正手握住引体向上杆，握距略宽于肩宽。","悬挂在杠上，双臂完全伸展，身体伸直。","收紧背部肌肉，将身体拉向杠铃杆，保持肘部靠近身体。","继续拉，直到下巴位于杠铃上方。","在顶部停顿片刻，然后慢慢将身体放回起始位置。"]},

        if(l.kind!=='train') return;

        if(!dk && l.time){ const d=new Date(l.time); const p=n=>String(n).padStart(2,'0'); dk=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }

          const pk=(k)=>{ const v=gs.filter(g=>(g[k]||0)>0 && !g.warmup).slice(-1)[0] || gs.filter(g=>(g[k]||0)>0).slice(-1)[0]; return v?v[k]:0; };

  function bindSteppers(){
    document.querySelectorAll('.train-side .stepper').forEach(sp=>{
      if(sp.dataset.bound) return; sp.dataset.bound='1';
      const inp=sp.querySelector('input'); if(!inp) return;
      const delta=()=>parseFloat(inp.dataset.delta||sp.dataset.delta||'1');
      const apply=k=>{
        const d=delta()*k;
        let v=(parseFloat(inp.value)||0)+d;
        const min=inp.min===''?-Infinity:parseFloat(inp.min||'0');
        const max=inp.max===''?Infinity:parseFloat(inp.max||'999');
        v=Math.min(max,Math.max(min,Math.round(v*10)/10));
        inp.value=String(v); inp.dispatchEvent(new Event('change',{bubbles:true}));
      };
      sp.querySelectorAll('button').forEach(btn=>{
        const k=btn.dataset.step||btn.dataset.w; if(!k) return;
        let timer=null, hold=null;
        const start=()=>{
          apply(parseFloat(k));
          hold=setTimeout(()=>{ timer=setInterval(()=>apply(parseFloat(k)),110); },420);
        };
        const stop=()=>{ clearTimeout(hold); clearInterval(timer); };
        btn.addEventListener('pointerdown',e=>{ e.preventDefault(); start(); });
        btn.addEventListener('pointerup',stop);
        btn.addEventListener('pointerleave',stop);
        btn.addEventListener('pointercancel',stop);
      });
    });
  }

    }catch(e){}
  }

  function bindCuSwipe(rows){
    const closeAll=except=>{ rows.querySelectorAll('.cu-row.open').forEach(r=>{ if(r!==except) r.classList.remove('open'); }); };
    rows.querySelectorAll('.cu-row').forEach(row=>{
      const id=row.dataset.curow;
      let x0=null, y0=0, swiped=false;
      const skip=ev=>!!(ev.target.closest && ev.target.closest('.cu-side'));
      const begin=(x,y)=>{ x0=x; y0=y; swiped=false; };
      const moveTo=(x,y)=>{
        if(x0==null) return;
        const dx=x-x0, dy=y-y0;
        if(Math.abs(dx) < Math.abs(dy)*1.2) return;
        if(dx<-28 && !row.classList.contains('open')){ closeAll(row); row.classList.add('open'); swiped=true; }
        else if(dx>22 && row.classList.contains('open')){ row.classList.remove('open'); swiped=true; }
      };
      const endTap=()=>{ if(x0==null) return; x0=null; };
      const TOUCHED=('ontouchstart' in window) && navigator.maxTouchPoints>0;
      if(TOUCHED){
        row.addEventListener('touchstart',ev=>{
          if(ev.touches.length!==1 || skip(ev)){ x0=null; return; }
          begin(ev.touches[0].clientX, ev.touches[0].clientY);
        },{passive:true});
        row.addEventListener('touchmove',ev=>{
          if(x0==null || ev.touches.length!==1) return;
          const dx=ev.touches[0].clientX-x0, dy=ev.touches[0].clientY-y0;
          if(Math.abs(dx) >= Math.abs(dy)*1.2){ try{ ev.preventDefault(); }catch(e){} }
          moveTo(ev.touches[0].clientX, ev.touches[0].clientY);
        },{passive:false});
        row.addEventListener('touchend',()=>{ endTap(); },{passive:true});
        row.addEventListener('touchcancel',()=>{ x0=null; },{passive:true});
      } else {
        row.addEventListener('mousedown',ev=>{ if(skip(ev)) return; begin(ev.clientX, ev.clientY); });
        row.addEventListener('mousemove',ev=>{ if(x0!=null) moveTo(ev.clientX, ev.clientY); });
        row.addEventListener('mouseup',()=>{ endTap(); });
      }
      const body=row.querySelector('.cu-main');
      body.addEventListener('click',ev=>{
        if(skip(ev)) return;
        if(swiped){ swiped=false; return; }
        if(x0!=null){ x0=null; return; }
        if(row.classList.contains('open')){ row.classList.remove('open'); return; }
        try{ trSelect(id); }catch(e){}
      });
    });
  }

  function trSyncStrips(){
    const day=trDateVal();
    const items=(train.records||[]).filter(r=>r.date===day);
    let total=0, done=0;
    items.forEach(r=>{ const gs=ensureGroups(r); total+=gs.length; done+=gs.filter(g=>g.done).length; });
    const cds=trCardioFor(day);
    const cdDone=cds.filter(c=>c.done).reduce((a,c)=>a+(c.dur||0),0);
    const cdPlan=cds.reduce((a,c)=>a+(c.dur||0),0);
    if($('todayStat')){
      const vol=items.flatMap(r=>ensureGroups(r)).reduce((a,g)=>a+(g.warmup?0:(g.reps||0)*(g.weight||0)),0);
      $('todayStat').innerHTML = (items.length||cds.length)
        ? `<span class="tc-cell"><b>${items.length}</b>动作</span><span class="tc-cell"><b>${done}/${total}</b>组</span><span class="tc-cell"><b>${Math.round(vol)}</b>kg</span><span class="tc-cell cd"><b>${cdDone||cdPlan}</b>′有氧</span>`
        : '还没有排动作';
    }
    if($('trEmpty')) $('trEmpty').hidden = !!(items.length||cds.length);
    if($('trEmptyHead')) $('trEmptyHead').hidden = !!(items.length||cds.length);
    const go=$('trStart');
    if(go){
      let act='start', txt='▶ 开始训练';
      if(items.length){
        if(total && done>=total){ act='summary'; txt='看小结 ✓'; }
        else if(done>0){ act='continue'; txt='继续训练 ▶'; }
      }
      go.dataset.act=act; go.textContent=txt;
    }
    const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const now=new Date(); const dow=(now.getDay()+6)%7;
    const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);
    const kMon=fmt(mon), kNow=fmt(now);
    const pMon=new Date(mon.getTime()-7*864e5), pEnd=new Date(mon.getTime()-864e5);
    const thisW=(train.records||[]).filter(r=>r.date>=kMon && r.date<=kNow).reduce((a,r)=>a+(r.sets||0),0);
    const lastW=(train.records||[]).filter(r=>r.date>=fmt(pMon) && r.date<=fmt(pEnd)).reduce((a,r)=>a+(r.sets||0),0);
    const cdW=(train.cardio||[]).filter(c=>c.date>=kMon&&c.date<=kNow&&c.done).reduce((a,c)=>a+(c.dur||0),0);
    let wk='本周 '+thisW+' 组'+(cdW?(' · 有氧 '+cdW+' 分钟'):'');
    if(lastW>0){ const dd=Math.round((thisW-lastW)/lastW*100); wk+=' · 比上周 '+(dd>0?'+':'')+dd+'%'; }
    if($('weekSum')) $('weekSum').textContent=wk;
    try{
      const wkCd=(train.cardio||[]).filter(c=>c.date>=kMon&&c.date<=kNow&&c.done);
      const by={};
      wkCd.forEach(c=>{ const m=c.modal||'有氧'; (by[m]=by[m]||{n:0,d:0}); by[m].n++; by[m].d+=c.dur||0; });
      const txt=Object.keys(by).slice(0,3).map(m=>m+' '+by[m].n+' 次 · '+by[m].d+'′').join(' / ');
      if($('cdWeekDist')) $('cdWeekDist').textContent=txt;
    }catch(e){}
    let pl='AI 计划 · 点此生成';
    try{
      if(trPlan && trPlan.length){
        const label=(trPlan[0]&&trPlan[0].part)||'';
        const sets=trPlan.reduce((a,i)=>a+(i.dur?0:(i.sets||0)),0);
        pl='AI 计划 · '+(label?label+'日 · ':'')+trPlan.length+' 个动作'+(sets?(' · '+sets+' 组'):'')+(trPlan.every(i=>trPlanJoined(i.exId))?' · 已导入 ✓':'');
      }
    }catch(e){}
    if($('planStripSum')) $('planStripSum').textContent=pl;
    try{
      const h=(train.cardioHabit)||{};
      if(h.post && total>0 && done>=total){
        const dKey='selfagent_cd_remind_v1';
        const todayKey=day;
        if(localStorage.getItem(dKey)!==todayKey && cds.every(c=>c.role!=='post' || !c.done)){
          localStorage.setItem(dKey, todayKey);
          setTimeout(()=>trToast('别忘了你的 '+((h.dur)||10)+' 分钟'+(h.modal||'快走')), 400);
        }
      }
    }catch(e){}
    const sb=$('segToday');
    if(sb){ const has=items.length>0; sb.textContent=has?(done+'/'+total):''; sb.classList.toggle('on', has); }
    const pb2=$('segPlan');

      pb2.textContent=pend?String(pend):''; pb2.classList.toggle('on', !!pend);
    }
  }

  function trExpand(t){
    const out=[t];
    TR_SYN.forEach(g=>{
      if(g.some(x=>x===t || (t.length>1 && x.includes(t)) || (x.length>1 && t.includes(x)))){
        g.forEach(x=>{ if(out.indexOf(x)<0) out.push(x); });
      }
    });
    Object.keys(CN2EN).forEach(k=>{ if(t.includes(k)){ const v=CN2EN[k].toLowerCase().replace(/\s+/g,''); if(out.indexOf(v)<0) out.push(v); } });
    return out;
  }
  function trFiltered(){
    const q=trState.q.toLowerCase().trim();
    const base=allExercises().filter(e=>{
      if(trState.part && !partHit(trState.part,e.p)) return false;
      if((trState.eqs||[]).length && trState.eqs.indexOf(e.e)<0) return false;
      return true;
    });
    if(!q){
      const seen=new Set(); const uni=base.filter(e=>{ const k=(e.n||'').trim().toLowerCase(); if(!k||seen.has(k)) return false; seen.add(k); return true; });
      if(trState.sort==='name') return uni.slice().sort((a,b)=>String(a.n).localeCompare(String(b.n),'zh'));
      return uni.slice().sort((a,b)=>(freqScore(b.id)-freqScore(a.id))||(a.n.length-b.n.length));
    }
    const rawToks=q.split(/[\s,，、;；+\/]+/).filter(Boolean);
    const toks=[];
    for(let i=0;i<rawToks.length;i++){
      let t=rawToks[i];
      if(t.length===1 && /[a-z0-9]/.test(t) && i+1<rawToks.length){ t=t+rawToks[++i]; }
      toks.push(t);
    }
    const lists=[];
    const scored=[];
    const norm=v=>v.toLowerCase().replace(/\s+/g,'');
    base.forEach(e=>{
      const name=norm(e.n+' '+(e.en||''));
      const meta=norm(e.p+' '+(e.e||'')+' '+(e.t||''));
      const steps=norm((e.s||[]).join(' '));
      let score=0, misses=0, allName=true;
      toks.forEach(t=>{
        const ex=trExpand(norm(t));
        const inName=ex.some(x=>name.includes(x));
        const inMeta=ex.some(x=>meta.includes(x));
        const inSteps=ex.some(x=>steps.includes(x));
        if(!inName) allName=false;
        if(name.includes(norm(t))) score+=20;
        else if(inName) score+=8;
        else if(inMeta) score+=4;
        else if(inSteps) score+=2;
        else { misses++; score-=1; }
      });
      if(allName && toks.length>1) score+=3;
      if(misses===0){ scored.push({e,score}); return; }
      if(misses===toks.length) return;
      lists.push({e,score});
    });
    const byScore=(a,b)=>(b.score-a.score)||(a.e.n.length-b.e.n.length);
    const dedupe=arr=>{ const seen=new Set(); return arr.filter(e=>{ const k=(e.n||'').trim().toLowerCase(); if(!k||seen.has(k)) return false; seen.add(k); return true; }); };
    if(scored.length) return dedupe(scored.sort(byScore).map(x=>x.e));
    return dedupe(lists.sort(byScore).map(x=>x.e));
  }
  let _useStat=null;
  function useStat(){
    if(_useStat) return _useStat;
    const st={};
    (train.records||[]).forEach(r=>{
      const s=st[r.exId]||(st[r.exId]={c:0,t:''});
      s.c++; if((r.date||'')>s.t) s.t=r.date||'';
    });
    _useStat=st; return st;
  }
  function freqScore(id){
    const s=useStat()[id]; if(!s) return 0;
    const age=s.t?Math.max(0,(Date.now()-new Date(s.t+'T00:00:00').getTime())/864e5):400;
    return s.c*10 + Math.max(0,60-age*2);
  }
  /* 组摘要：全组相同时合并，不同则逐组（金字塔/递减组不失真） */
  function groupsDigest(groups, opts){
    opts=opts||{}; const lim=opts.lim||3;
    const arr=(groups||[]).filter(g=>g && !g.warmup);
    if(!arr.length) return '';
    const f=g=>(((g.weight||0)>0)?(g.weight+'kg'):'自重')+'×'+(g.reps||0);
    const same=arr.every(g=>(g.weight||0)===(arr[0].weight||0)&&(g.reps||0)===(arr[0].reps||0));
    if(same) return (opts.bare?'':arr.length+' 组 · ')+f(arr[0]);
    return arr.length>lim ? (arr.slice(0,lim).map(f).join(' · ')+' · +'+(arr.length-lim)+' 组') : arr.map(f).join(' · ');
  }

  function trAgo(dateStr){
    if(!dateStr) return '';
    const d=new Date(dateStr+'T00:00:00');
    const diff=Math.floor((Date.now()-d.getTime())/864e5);
    if(diff<=0) return '今天';
    if(diff===1) return '昨天';
    if(diff<7) return diff+' 天前';
    if(diff<30) return Math.floor(diff/7)+' 周前';
    return Math.floor(diff/30)+' 个月前';
  }

  const GIF_ALT=['https://gcore.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@main/videos/','https://testingcf.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@main/videos/','https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/videos/'];
  const GIF_OK={};
  function trLoadGif(el,file,placeholder,force){
    const ph=placeholder || $('exGifPh');
    if(!force && GIF_OK[file]){ if(ph) ph.remove(); el.src=GIF_OK[file]; el.style.opacity='1'; return; }
    const bases=GIF_PRI.concat(GIF_ALT);
    if(ph){ ph.textContent='动画加载中…'; ph.style.display=''; }
    el.style.display=''; el.style.opacity='0';
    let i=0, done=false, timer=null;
    const fail=()=>{
      if(done) return; done=true; clearTimeout(timer);
      if(ph) ph.remove();
      const m=el.parentElement; if(!m) return;
      el.style.display='none';
      let box=m.querySelector('.gif-fail');
      if(!box){ m.insertAdjacentHTML('beforeend','<div class="gif-fail"><span>动图加载失败，多为网络问题</span><button type="button" class="gif-retry">重试</button></div>'); box=m.querySelector('.gif-fail'); }
      const rb=box.querySelector('.gif-retry');
      if(rb) rb.onclick=()=>{ box.remove(); trLoadGif(el,file,placeholder,true); };
    };
    const next=()=>{
      if(done) return;
      if(i>=bases.length){ fail(); return; }
      const url=bases[i++]+file;
      clearTimeout(timer);
      timer=setTimeout(()=>{ el.onload=null; el.onerror=null; next(); }, 8000);
      el.onload=()=>{ if(done) return; done=true; clearTimeout(timer); el.onload=null; el.onerror=null; GIF_OK[file]=url; el.style.opacity='1'; if(ph) ph.remove(); };
      el.onerror=()=>{ el.onload=null; el.onerror=null; next(); };
      el.referrerPolicy='no-referrer';
      el.src=url;
    };
    next();
  }

  /* ---------- 拍照识别器械：多模态 → 库内匹配 → 直接加今日 ---------- */
  function gifNorm(t){ return String(t||'').toLowerCase().replace(/[\s（）()·\-—_、，,。.]/g,''); }
  function gifCJK(t){
    const s=gifNorm(t);
    const c=s.replace(/[a-z0-9]/g,'');
    return c||s;
  }
  function gifLCS(a, b){
    let best=0;
    for(let i=0;i<a.length;i++){
      for(let j=i+1;j<=a.length;j++){
        const seg=a.slice(i,j);
        if(b.indexOf(seg)>=0) best=Math.max(best, seg.length); else break;
      }
    }
    return best;
  }
  function gifScore(name, e){
    const a=gifCJK(name), b=gifCJK(e.n);
    if(!a||!b) return 0;
    if(a===b) return 130;
    const mn=Math.min(a.length, b.length)||1;
    let sc=Math.round(gifLCS(a,b)/mn*45);
    const set={}; a.split('').forEach(c=>{ set[c]=1; });
    let hit=0; b.split('').forEach(c=>{ if(set[c]) hit++; });
    sc += Math.round(hit/mn*30);
    if(b.indexOf(a)>=0 || a.indexOf(b)>=0) sc+=20;
    const ea=gifCJK(e.e);
    if(ea && (a.indexOf(ea)>=0 || ea.indexOf(a)>=0)) sc+=10;
    return sc;
  }
  function gifFindLocal(name, part, equip){
    let best=null, bs=0;
    allExercises().forEach(e=>{
      if(!e.g) return;
      let sc=gifScore(name, e);
      if(part && e.p===part) sc+=8;
      const ee=gifNorm(e.e), qq=gifNorm(equip);
      if(ee && qq && (ee.indexOf(qq)>=0 || qq.indexOf(ee)>=0)) sc+=6;
      if(sc>bs){ bs=sc; best=e; }
    });
    return (best && bs>=50) ? {ex:best, score:bs} : null;
  }

  function camCompress(file, cb){
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const max=1024, sc=Math.min(1, max/Math.max(img.width,img.height));
          const w=Math.round(img.width*sc), h=Math.round(img.height*sc);
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cb(cv.toDataURL('image/jpeg',0.72));
        }catch(e){ cb(null); }
      };
      img.onerror=()=>cb(null);
      img.src=fr.result;
    };
    fr.onerror=()=>cb(null);
    fr.readAsDataURL(file);
  }

  let trPlan=null, trPlanOrig=null;
  function partLastDate(part){
    return train.records.filter(r=>r.part===part).reduce((a,b)=>(a>b.date?a:b.date),'');
  }
  function partRecovery(part){
    const last=partLastDate(part);
    if(!last) return {h:999,text:'',warn:false};
    const h=Math.round((new Date(trToday()+'T00:00:00').getTime()-new Date(last+'T00:00:00').getTime())/36e5);
    if(h<24) return {h,text:part+' 今日已练 · 建议换部位或降低强度',warn:true};
    if(h<48) return {h,text:part+' 恢复中（'+h+' 小时）· 建议换部位',warn:true};
    return {h,text:part+' 已恢复 '+Math.floor(h/24)+' 天 · 可以练',warn:false};
  }
  function genPlan(part){
    const recs=(train.records||[]).filter(r=>r.part===part);
    const stat={};
    recs.forEach(r=>{ const k=r.exId||r.name; if(!stat[k]) stat[k]={exId:r.exId, name:r.name, n:0, last:r};
      stat[k].n++; stat[k].last=r; });
    const used=Object.values(stat).sort((a,b)=>b.n-a.n);
    const favs=(train.favs||[]).map(findEx).filter(e=>e&&e.p===part);
    const picked=[], seen=new Set();
    used.slice(0,3).forEach(u=>{ const e=findEx(u.exId); if(e&&!seen.has(e.id)){ seen.add(e.id); picked.push({e,src:'hist',u}); } });
    favs.forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); picked.push({e,src:'fav'}); } });
    const PART_KW={
      '胸':/卧推|飞鸟|夹胸|俯卧撑|推胸|臂屈伸|推/,
      '背':/划船|下拉|引体|上拉|直臂|面拉|硬拉/,
      '上腿':/深蹲|硬拉|弓步|腿举|腿屈伸|腿弯举|分腿|臀推|提踵/,
      '小腿':/提踵|小腿/,
      '腰腹':/卷腹|仰卧起坐|平板|抬腿|举腿|转体|侧屈|收腹|腹|屈膝/,
      '上臂':/弯举|臂屈伸|三头|二头|屈伸/,
      '前臂':/弯举|腕|握|前臂/,
      '肩':/推举|平举|耸肩|面拉|侧平|前平|肩/,
      '颈':/颈|桥/,
      '有氧':/跑|跳|单车|划船机|跳绳|登山|开合|波比/
    };
    const kw=PART_KW[part];
    const score=e=>{
      let v=0;
      if(/杠铃|哑铃|绳索|器械|史密斯|壶铃/.test(e.e||'')) v+=4;
      if(kw && kw.test(e.n)) v+=8;
      if(kw && !kw.test(e.n)) v-=4;
      if(/辅助/.test(e.n)) v-=8;
      if(/弹力带/.test(e.e||'')) v-=3;
      if(/跪姿|俯卧|瑜伽球|平衡/.test(e.n)) v-=1;
      return v-e.n.length*0.06;
    };
    const pool=allExercises().filter(e=>e.p===part&&!seen.has(e.id))
      .sort((a,b)=>score(b)-score(a));
    const coreOf=n=>{
      const m=n.match(/硬拉|深蹲|弓步|卧推|推胸|划船|下拉|肩推|推举|弯举|飞鸟|夹胸|臂屈伸|伸展|提踵|卷腹|仰卧起坐|平板支撑|引体向上|俯卧撑|臀推|抬腿|举腿|转体|侧屈|平举|耸肩|上拉|跑|单车|跳/);
      return m?m[0]:n.slice(-3);
    };
    const eqCount={}, coreCount={};
    for(const e of pool){
      if(picked.length>=4) break;
      const eq=e.e||'自重', core=coreOf(e.n);
      if((eqCount[eq]||0)>=2) continue;
      if((coreCount[core]||0)>=1) continue;
      if(seen.has(e.id)) continue;
      seen.add(e.id); eqCount[eq]=(eqCount[eq]||0)+1; coreCount[core]=(coreCount[core]||0)+1;
      picked.push({e,src:'lib'});
    }
    return picked.map(p=>{
      const u=p.u; let sets=3, reps=12, weight=0, note='';
      if(u){
        const last=u.last;
        sets=last.sets>=4?4:3;
        reps=Math.max(last.reps||10,8)+1;
        weight=last.weight||0;
        note=weight>0
          ? `上次 ${last.weight}kg × ${last.reps} 次（该动作 ${u.n} 次记录）· 重量保持，每组多做 1-2 次`
          : `上次 ${last.sets}×${last.reps} 自重（该动作 ${u.n} 次记录）· 加 1 组或放慢离心`;
      } else if(p.src==='fav'){
        note='你收藏的常用动作 · 按 3×12 起步';
      } else {
        note='同部位动作库补充 · 按 3×12 起步，重量自选';
      }
      if(part==='有氧' && /单车|跑|走|游泳|椭圆|登山|跳|划船机/.test(p.e.n)){
        return {exId:p.e.id, name:p.e.n, part:p.e.p, eq:p.e.e, sets:1, reps:1, weight:0, dur:20,
          note:'有氧以时长为准 · 建议 20-30 分钟中等强度', src:p.src};
      }
      return {exId:p.e.id, name:p.e.n, part:p.e.p, eq:p.e.e, sets, reps, weight, note, src:p.src};
    });
  }

      const sug=suggestWeight(r);
      const w0=gs[0]?(gs[0].weight||0):(r.weight||0);

        return `<div class="tc-row pl-row tr-fade ${isNext?'on':''}${doneN?' run':''}" style="--i:${items.indexOf(r)}" data-topen="${r.uid}" data-urow="r:${r.uid}">

          <span class="pl-nm"><i class="pl-no">${items.indexOf(r)+1}</i><b>${ENGINE.esc(r.name)}</b></span>
          <span class="tc-prog">${doneN?doneN+'/'+gs.length:''}</span>
          <button class="pl-rowmore" data-rmore="${r.uid}" type="button" aria-label="更多操作">⋯</button>
        </div>`;
      }

      const rows=gs.map(g=>`
        <div class="set-row ${g.done?'done':''}" data-srow="${r.uid}:${g.no}">
          <span class="set-no ${g.done?'done':''} ${g.warmup?'warm':''}" aria-hidden="true">${g.warmup?'W':(g.done?'✓':g.no)}</span>
          <button class="set-val" data-setopen="${r.uid}:${g.no}" type="button" title="点击修改重量与次数">${g.weight>0?g.weight+' kg':'自重'} × ${g.reps}</button>
          ${(g.rpe||(window.__rpeAsk&&window.__rpeAsk[r.uid+':'+g.no]))?`<span class="rpe-set">

          </span>`:''}

      const hist=(train.records||[]).filter(x=>x.exId===r.exId).map(x=>x.weight||0);
      const wchips=[...new Set(gs.map(g=>g.weight).concat(hist))].filter(w=>w>0).sort((a,b)=>b-a).slice(0,4);

      : '';
    const cds=trCardioFor(d);

    // 统一顺序：train.order[date] 保存 r:/c: 键序列

    // 有氧：开始 / 暂停 / 完成 / 移除 / 快速补录
    box.querySelectorAll('[data-cdrun]').forEach(b=>b.onclick=ev=>{

    box.querySelectorAll('[data-cdfin]').forEach(b=>b.onclick=ev=>{

    box.querySelectorAll('[data-cddist2]').forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();
      const uid=b.dataset.cddist2, r=(train.cardio||[]).find(x=>x.uid===uid); if(!r) return;

      trToast('距离 +0.5 km，共 '+r.dist+' km');
    });
    box.querySelectorAll('[data-cddist3]').forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();
      const uid=b.dataset.cddist3, r=(train.cardio||[]).find(x=>x.uid===uid); if(!r) return;

    box.querySelectorAll('[data-cddel]').forEach(b=>b.onclick=ev=>{

      box.addEventListener('pointerdown',ev=>{

        if(ev.pointerType==='mouse' && ev.button!==0) return;
        const rr=row.getBoundingClientRect();
        drag={row,h,startY:ev.clientY,lastY:ev.clientY,moved:false,
              boxTop:box.getBoundingClientRect().top,

      const paint=()=>{
        rafId=0;
        if(!drag) return;
        const dt=drag.lastY-drag.startY;
        if(!drag.moved && Math.abs(dt)>4) drag.moved=true;
        const wantTop=drag.startTop+dt;
        const bTop=box.getBoundingClientRect().top;
        const curTop=drag.row.getBoundingClientRect().top-bTop;
        drag.row.style.transform='translateY('+(wantTop-curTop)+'px)';
        // 按累计位移判定目标位（含跨多行），换位后 transform 自动补偿
        const center=wantTop+drag.h0/2;
        const list=[...box.children].filter(n=>nodeKey(n));
        let idx=0;
        list.forEach(n=>{
          if(n===drag.row) return;
          const r=n.getBoundingClientRect();
          if(center > (r.top-bTop)+r.height/2) idx++;
        });
        const cur=list.indexOf(drag.row);
        if(idx!==cur){
          const target=list[idx];
          if(target && target!==drag.row){ box.insertBefore(drag.row, target); try{ haptic('light'); }catch(e){} }
          else if(!target){ /* 已在末尾 */ }
        }
      };
      const apply=(ev)=>{
        if(!drag) return;
        drag.lastY=ev.clientY;
        if(!rafId) rafId=requestAnimationFrame(paint);
        ev.preventDefault();
      };
      const finish=()=>{
        if(!drag) return;
        const d=drag; drag=null;
        if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
        d.row.classList.remove('dragging'); d.row.style.transform='';
        box.classList.remove('drag-on');
        try{ d.h.releasePointerCapture(d.id); }catch(e){}
        if(!d.moved) return;
        saveOrder();
        trOpenUid=''; trRenderToday();
        try{ haptic('core'); }catch(e){}
      };
      box.addEventListener('pointermove',apply);
      box.addEventListener('pointerup',finish);
      box.addEventListener('pointercancel',finish);
      box.addEventListener('lostpointercapture',finish);
    }

    if(!box.__swipeBound){

      },{passive:true});

    // 近7日

          animation:false,

          tooltip:{trigger:'axis'},
          xAxis:{type:'category',data:labels,axisLine:{lineStyle:{color:'#3a3d44'}},axisLabel:{color:'#8b8e97',fontSize:10,interval:0}},
          yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#2a2d33'}},axisLabel:{color:'#8b8e97',fontSize:10}},
          series:[{type:'bar',data:vals,barWidth:'52%',itemStyle:{color:'#3DDCBF',borderRadius:[4,4,0,0]}}]
        });
        if(ci) ci.on('click', p=>showDayDetail(keys[p.dataIndex]));
      }
    }
    if($('trStat')){
      const recTodayW=train.records.filter(r=>keys.includes(r.date));
      const days7=new Set(recTodayW.map(r=>r.date)).size;
      const parts={}; train.records.forEach(r=>{ parts[r.part]=(parts[r.part]||0)+(r.sets||0); });
      const topPart=Object.keys(parts).sort((a,b)=>parts[b]-parts[a])[0]||'—';
      const totalSets=train.records.reduce((a,b)=>a+(b.sets||0),0);
      let stale='';
      const lastByPart={};
      (train.records||[]).forEach(r=>{ if(!lastByPart[r.part]||r.date>lastByPart[r.part]) lastByPart[r.part]=r.date; });
      Object.keys(lastByPart).forEach(pt=>{
        const gap=Math.floor((Date.now()-new Date(lastByPart[pt]+'T00:00:00').getTime())/864e5);
        if(gap>=12 && (!stale || gap>stale.gap)) stale={pt, gap};

        + (stale?`<span class="stale"><b>${ENGINE.esc(stale.pt)}</b>已 ${stale.gap} 天没练</span>`:'');
    }
  }

  function dedupeLib(){
    const key=e=>(e.n||'').trim();
    const first={}, firstEx={};
    allExercises().forEach(e=>{ const k=key(e); if(!first[k]){ first[k]=e.id; firstEx[k]=e; } });
    let changed=false;
    (train.records||[]).forEach(r=>{
      const k=(r.name||'').trim();
      const id=first[k];
      if(id && r.exId!==id){ r.exId=id; changed=true; }
      const e=firstEx[k];
      if(e){
        if(e.p && r.part!==e.p){ r.part=e.p; changed=true; }
        if(e.n && r.name!==e.n){ r.name=e.n; changed=true; }
      }
    });
    // 同日同动作重复记录合并
    if(train.records && train.records.length){
      const by={}; const out=[];
      train.records.forEach(r=>{
        const k=r.date+'|'+r.exId;
        if(by[k]){
          const host=by[k];
          host.groups=ensureGroups(host).concat(ensureGroups(r));
          host.sets=host.groups.length;
          changed=true;
        } else { by[k]=r; out.push(r); }
      });
      if(out.length!==train.records.length) train.records=out;
    }
    (train.favs||[]).forEach((id,i)=>{
      const e=findEx(id); if(!e) return;
      const k=key(e); const fid=first[k];
      if(fid && id!==fid){ train.favs[i]=fid; changed=true; }
    });
    const seen=new Set(); train.favs=(train.favs||[]).filter(id=>{ if(seen.has(id)) return false; seen.add(id); return true; });
    if(changed){ _useStat=null; saveTrain(); }
  }

    function parseQuickTrain(txt){
      let s=(txt||'').trim(); if(!s) return null;
      let sets=3, reps=10, weight=0;
      const sm=s.match(/(\d+)\s*[x×*]\s*(\d+)/i);
      if(sm){ sets=Math.max(1,Math.min(20,+sm[1])); reps=Math.max(1,Math.min(100,+sm[2])); s=s.replace(sm[0],' '); }
      const wm=s.match(/(\d+(?:\.\d+)?)\s*(?:kg|公斤)?\s*$/i);
      let name=s.trim();
      if(wm){ weight=parseFloat(wm[1])||0; name=s.replace(wm[0],'').trim(); }
      name=name.replace(/[，,。;；:：]+/g,' ').trim();
      if(!name) return null;
      const cand=allExercises().filter(e=>e.n.includes(name) || e.en.toLowerCase().includes(name.toLowerCase())).sort((a,b)=>a.n.length-b.n.length)[0];
      return { name:cand?cand.n:name, part:cand?cand.p:'其他', sets, reps, weight, exId:cand?cand.id:('cuq'+Date.now().toString(36)) };

      const fitType=settings.types.find(t=>t.key==='fit') || settings.types.find(t=>/健身|运动/.test(t.label)) || settings.types[0];
      const txt='今日训练：'+list.map(i=>i.dur?(i.name+' '+i.dur+'分钟'):(i.name+' '+i.sets+'×'+i.reps+(i.weight>0?'@'+i.weight+'kg':'（自重）'))).join('、');
      const fitTag=(typeTags(fitType.key)||[]).find(t=>/力量|训练|健身/.test(t)) || '';
      const dtm=new Date(); const p3=n=>String(n).padStart(2,'0');
      const dk3=`${dtm.getFullYear()}-${p3(dtm.getMonth()+1)}-${p3(dtm.getDate())}`;
      logs.push({id:'tr'+Date.now(), kind:'train', source:'manual', type:fitType.key, tags:fitTag,
        score:null, mood:null, content:txt, time:dtm.toISOString(), date:dk3,

          const gs=ensureGroups(r); const pk=k=>{const v=gs.filter(g=>(g[k]||0)>0).slice(-1)[0];return v?v[k]:0;};
          const dn=gs.filter(g=>g.done).length;
          const iv=gs.filter(g=>g.done&&!g.warmup).reduce((a,g)=>a+(g.reps||0)*(g.weight||0),0);
          return {exId:r.exId,name:r.name,part:r.part,sets:gs.length,reps:pk('reps'),weight:pk('weight'),
            done:dn,volume:Math.round(iv),groups:gs.map(g=>({no:g.no,reps:g.reps,weight:g.weight,done:!!g.done,rpe:g.rpe||0,sec:g.sec||0}))};
        }), volume:0}});

  /* ---------- 日志面板 ---------- */
  function filterLogs(){
    const d0=new Date(); d0.setDate(d0.getDate()-logFilter.range);
    return logs.filter(l=>{
      if(logFilter.type!=='all' && l.type!==logFilter.type) return false;
      if(logFilter.tag && !((l.tags||'')+' '+(l.content||'')).toLowerCase().includes(logFilter.tag.toLowerCase())) return false;
      if(logFilter.range>0 && new Date(l.time)<d0) return false;
      return true;
    });
  }
  function trainCard(l){
    const m=l.meta||{}; const items=m.items||[];
    const allG=items.reduce((a,i)=>a.concat(i.groups||[]),[]);
    const totalSets=items.reduce((a,i)=>a+((i.groups&&i.groups.length)?i.groups.length:(i.sets||0)),0);
    const doneSets=items.reduce((a,i)=>a+((i.groups||[]).filter(g=>g.done).length),0);
    const vol=items.reduce((a,i)=>a+((i.groups||[]).reduce((x,g)=>x+((g.done&&!g.warmup)?(g.reps||0)*(g.weight||0):0),0)),0);
    const prs=prOfItems(items,l.date);
    const prSet=prs.set;
    const dots=(n,done)=>Array.from({length:Math.min(n,6)},(_,k)=>`<span class="lg-dot${k<done?' on':''}"></span>`).join('')
      + (n>6?`<span class="lg-dotx">${done}/${n}</span>`:'');
    const lgd=gs=>{
      const a=(gs||[]).filter(g=>!g.warmup); if(!a.length) return '';
      const f=g=>((g.weight>0)?(g.weight+'kg'):'自重')+'×'+(g.reps||0);
      const same=a.every(g=>(g.weight||0)===(a[0].weight||0)&&(g.reps||0)===(a[0].reps||0));
      if(same) return ((a[0].weight>0)?(a[0].weight+'kg'):'自重')+' '+a.length+'×'+(a[0].reps||0);
      const parts=a.map(f);
      return parts.length>3 ? (parts.slice(0,3).join(' · ')+' · +'+(parts.length-3)) : parts.join(' · ');
    };
    const rows=items.map((i,ii)=>{
      const gs=(i.groups||[]);
      const sets = gs.length
        ? gs.map(g=>`<div class="lg-set"><span class="lg-no${g.warmup?' warm':''}">${g.warmup?'W':g.no}</span><em>${g.weight>0?(g.weight+'kg'):'自重'} × ${g.reps}</em>${g.done?'<s>✓</s>':''}${g.rpe?`<i>${['','轻松','刚好','力竭'][g.rpe]||''}</i>`:''}${g.sec?`<i>${g.sec}s</i>`:''}</div>`).join('')
        : `<div class="lg-set"><span class="lg-no">1</span><em>${i.weight>0?(i.weight+'kg'):'自重'} × ${i.reps}</em></div>`;
      const doneN=gs.filter(g=>g.done).length;
      const setsN=gs.length||i.sets||0;
      const allDone=setsN>0&&doneN===setsN;
      return `<div class="lg-ex${allDone?' fin':''}" data-lgx="${l.id}:${ii}">
        <div class="lg-h">
          <b>${ENGINE.esc(i.name)}</b>
          <em>${lgd(gs)}</em>
          <span class="lg-dots">${dots(setsN,doneN)}</span>
          ${prSet.has(String(i.exId))?'<span class="lg-prch">PR</span>':''}
          <span class="lg-ar">▸</span>
        </div>
        <div class="lg-sets">${sets}</div>
      </div>`;
    }).join('');
    return `
      <div class="log-item tcard">
        <div class="log-head">
          <span class="log-type fit" style="color:#3DDCBF;border-color:#3DDCBF">训练</span>
          <span class="tag">${l.source==='auto'?'自动同步':'手动'}</span>
          <span class="log-time">${fmtTime(l.time)}</span>
          <button class="lg-more" data-lmenu="${l.id}" aria-label="更多" type="button">⋯</button>
        </div>
        <div class="lg-sum">${items.length} 动作 · ${doneSets}/${totalSets} 组 · ${vol?Math.round(vol).toLocaleString()+' kg':'—'}${prs.n?` · <b class="lg-pr">${prs.n} PR</b>`:''}</div>
        ${m.checkin?`<div class="tc-feel"><span>情绪 ${m.checkin.mood}/5 ${FEEL_MOOD[(m.checkin.mood||1)-1]||''}</span><span>状态 ${m.checkin.energy}/5 ${FEEL_ENERGY[(m.checkin.energy||1)-1]||''}</span>${m.checkin.note?`<em>“${ENGINE.esc(m.checkin.note)}”</em>`:''}</div>`:''}
        <div class="lg-list">${rows||'<div class="tc-empty">暂无明细</div>'}</div>
      </div>`;
  }
  function prOfItems(items,date){
    const set={}; let n=0;
    (items||[]).forEach(i=>{
      const a=(i.groups||[]).filter(g=>!g.warmup);
      const best=a.reduce((x,g)=>Math.max(x,g.weight||0),0);
      if(best<=0) return;
      let hist=0;
      (train.records||[]).forEach(r=>{
        if(r.exId!==i.exId || r.date>=date) return;
        (r.groups||[]).forEach(g=>{ if(!g.warmup) hist=Math.max(hist,g.weight||0); });
      });
      if(hist>0 && best>hist){ set[String(i.exId)]=1; n++; }
    });
    return {n:n,set:new Set(Object.keys(set))};
  }
  function logCard(l){
    if(l.kind==='train') return trainCard(l);
    return `
      <div class="log-item">
        <div class="log-head">
          <span class="log-type ${typeCls(l.type)}" style="color:${colorFor(l.type)};border-color:${colorFor(l.type)}">${ENGINE.esc(typeLabel(l.type))}</span>
          ${l.tags?`<span class="tag">${ENGINE.esc(l.tags)}</span>`:''}
          <span class="log-score ${moodClass(l.mood)}">精力 ${'●'.repeat(l.score||3)}${'○'.repeat(5-(l.score||3))} · 情绪 ${moodText(l.mood)}</span>
          <span class="log-time" data-lid="${l.id}" title="点击修改日期，可补记昨天">${fmtTime(l.time)}<i>改</i></span>
          <button class="lg-more" data-lmenu="${l.id}" aria-label="更多" type="button">⋯</button>
        </div>
        <div class="log-body">${ENGINE.esc(l.content)}</div>
      </div>`;
  }
  function dayLabel(ds){
    const d=new Date(ds+'T00:00:00');
    const p=n=>String(n).padStart(2,'0');
    const now=new Date();
    const tk=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;
    const y=new Date(now); y.setDate(y.getDate()-1);
    const yk=`${y.getFullYear()}-${p(y.getMonth()+1)}-${p(y.getDate())}`;
    const wd='日一二三四五六'[d.getDay()];
    const core=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd;
    if(ds===tk) return '今天 · '+core;
    if(ds===yk) return '昨天 · '+core;
    return core+(d.getFullYear()!==now.getFullYear()?(' · '+d.getFullYear()):'');
  }
  function groupByDay(list){
    const order=[], map={};
    list.forEach(l=>{
      const d=l.date||dayKey(l.time);
      if(!map[d]){ map[d]=[]; order.push(d); }
      map[d].push(l);
    });
    order.sort((a,b)=> a<b?1:-1);
    return order.map(d=>`<div class="day-block" data-daygrp="${d}">
        <button class="day-tog" type="button" data-daytog="${d}" aria-expanded="false">
          <span>${dayLabel(d)}</span><em>${map[d].length} 条</em><i class="day-ar">▸</i>
        </button>
        <div class="day-body" hidden>${map[d].map(logCard).join('')}</div>
      </div>`).join('');
  }
  function renderLogsPanel(){
    const body=$('reportBody');
    const list=[...filterLogs()].reverse();
    const typeOpts=`<option value="all">全部类型</option>`+settings.types.map(t=>`<option value="${t.key}" ${logFilter.type===t.key?'selected':''}>${ENGINE.esc(t.label)}</option>`).join('');
    body.innerHTML=`
      <div class="filter-bar">
        <select id="fType">${typeOpts}</select>
        <input type="text" id="fTag" placeholder="搜索标签或内容" value="${ENGINE.esc(logFilter.tag)}">
        <select id="fRange"><option value="0">全部时间</option><option value="7">近7天</option><option value="30">近30天</option><option value="90">近90天</option></select>
        <span class="fcount">共 ${list.length} 条</span>
      </div>
      <div class="log-panel">${ list.length ? groupByDay(list) : '<div class="empty">没有符合条件的日志。</div>' }</div>`;
    $('fRange').value=String(logFilter.range);
    $('fType').onchange=e=>{logFilter.type=e.target.value;renderLogsPanel();};
    $('fRange').onchange=e=>{logFilter.range=parseInt(e.target.value,10);renderLogsPanel();};
    let tmr;
    $('fTag').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{logFilter.tag=e.target.value.trim();renderLogsPanel();},250);};
    bindLogActions();
  }
  function openLogMenu(id,anchor){
    document.querySelectorAll('.lg-menu').forEach(x=>x.remove());
    const r=anchor.getBoundingClientRect();
    const el=document.createElement('div'); el.className='lg-menu';
    el.innerHTML='<button type="button" data-mact="edit">编辑</button><button type="button" data-mact="del">删除</button>';
    document.body.appendChild(el);
    el.style.top=Math.round(Math.max(8, Math.min(r.bottom+6, window.innerHeight-96)))+'px';
    el.style.left=Math.max(12, Math.round(Math.min(r.right-120, window.innerWidth-132)))+'px';
    el.querySelector('[data-mact="edit"]').onclick=()=>{
      el.remove();
      const l=logs.find(x=>String(x.id)===String(id)); if(!l) return;
      if(l.kind==='train') openTrainSheet(id); else openLogSheet(id);
    };
    el.querySelector('[data-mact="del"]').onclick=()=>{
      el.remove();
      if(!confirm('删除这条记录？删掉后不能恢复。')) return;
      const rowEl=anchor.closest('.log-item');
      collapseRemove(rowEl,()=>{ logs=logs.filter(x=>String(x.id)!==String(id)); save(); renderLogs(); renderLogsPanel(); });
    };
    setTimeout(()=>{
      const h=e=>{ if(!el.contains(e.target)){ el.remove(); document.removeEventListener('click',h); } };
      document.addEventListener('click',h);
    },0);
  }
  function bindLogActions(){
    document.querySelectorAll('#reportBody [data-daytog]').forEach(b=>{
      b.addEventListener('click',()=>{
        const g=b.closest('.day-block'); if(!g) return;
        const body=g.querySelector('.day-body'); if(!body) return;
        const open=g.classList.contains('open');
        g.classList.toggle('open', !open);
        body.hidden = open;
        b.setAttribute('aria-expanded', open?'false':'true');
      });
    });
    document.querySelectorAll('#reportBody [data-del]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(!confirm('删除这条记录？删掉后不能恢复。')) return;
        collapseRemove(b.closest('.lg-item,.day-row,.log-item')||b.parentElement,()=>{
          logs=logs.filter(x=>String(x.id)!==String(b.dataset.del)); save(); renderLogs(); renderLogsPanel();
        });
      });
    });
    document.querySelectorAll('#reportBody [data-edit]').forEach(b=>{
      b.addEventListener('click',()=>openLogSheet(b.dataset.edit));
    });
    document.querySelectorAll('#reportBody [data-tedit]').forEach(b=>{
      b.addEventListener('click',()=>openTrainSheet(b.dataset.tedit));
    });
    document.querySelectorAll('#reportBody [data-lgx]').forEach(ex=>{
      const h=ex.querySelector('.lg-h'); if(!h) return;
      h.addEventListener('click',()=>{
        const open=ex.classList.contains('open');
        const list=ex.parentElement;
        list.querySelectorAll('.lg-ex.open').forEach(o=>o.classList.remove('open'));
        if(!open) ex.classList.add('open');
      });
    });
    document.querySelectorAll('#reportBody [data-lmenu]').forEach(b=>{
      b.addEventListener('click',ev=>{ ev.stopPropagation(); openLogMenu(b.dataset.lmenu, b); });
    });
  }


  /* ---------- 底部 sheet 编辑 ---------- */
  function ensureLogSheet(){
    let sh=$('logSheet');
    if(sh) return sh;
    sh=document.createElement('div'); sh.id='logSheet'; sh.className='log-sheet'; sh.hidden=true;
    sh.innerHTML='<div class="ls-mask" data-close="1"></div>'+
      '<div class="ls-card" role="dialog" aria-modal="true" aria-label="编辑记录">'+
      '<div class="ls-grab"></div>'+
      '<div class="ls-head"><b>编辑这条记录</b><button class="ls-x" type="button" data-close="1">×</button></div>'+
      '<div class="ls-body" id="lsBody"></div></div>';
    document.body.appendChild(sh);
    sh.addEventListener('click',e=>{ if(e.target.dataset && e.target.dataset.close) sh.hidden=true; });
    return sh;
  }
  let lsTags=[];
  function openLogSheet(id){
    const l=logs.find(x=>String(x.id)===String(id)); if(!l) return;
    const sh=ensureLogSheet(); const body=$('lsBody');
    const hd=sh.querySelector('.ls-head b'); if(hd) hd.textContent='编辑这条记录';
    lsTags=String(l.tags||'').split(',').filter(t=>t && typeTags(l.type).includes(t));
    const typeOpts=settings.types.map(t=>`<option value="${t.key}" ${l.type===t.key?'selected':''}>${ENGINE.esc(t.label)}</option>`).join('');
    const chipsHtml=()=>lsTags.map(t=>`<span class="tag">${ENGINE.esc(t)}<button type="button" data-chip="${ENGINE.esc(t)}">×</button></span>`).join('');
    const paintTags=(tk)=>{
      body.querySelector('#lsTags').innerHTML=typeTags(tk).map(t=>`<option value="${ENGINE.esc(t)}">${ENGINE.esc(t)}</option>`).join('');
      body.querySelector('#lsChips').innerHTML=chipsHtml();
      body.querySelectorAll('#lsChips [data-chip]').forEach(b=>b.onclick=()=>{ lsTags=lsTags.filter(x=>x!==b.dataset.chip); paintTags(body.querySelector('#lsType').value); });
    };
    body.innerHTML=`
      <div class="f-row"><div class="f-field"><label class="f-label">类型</label><select id="lsType">${typeOpts}</select></div>
        <div class="f-field"><label class="f-label">标签</label><select id="lsTags"></select><div class="tag-list" id="lsChips"></div></div></div>
      <div class="f-row">
        <div class="f-field"><label class="f-label">精力</label><input type="range" id="lsScore" min="1" max="5" value="${l.score||3}"></div>
        <div class="f-field"><label class="f-label">情绪</label><input type="range" id="lsMood" min="1" max="5" value="${moodNorm(l.mood)||3}"></div>
      </div>
      <textarea id="lsContent" style="min-height:90px">${ENGINE.esc(l.content)}</textarea>
      <div class="ls-actions">
        <button class="btn ghost sm" type="button" data-close="1">取消</button>
        <button class="btn sm" type="button" id="lsSave">保存</button>
      </div>`;
    paintTags(l.type);
    body.querySelector('#lsType').onchange=e=>{ lsTags=[]; paintTags(e.target.value); };
    body.querySelector('#lsTags').onchange=e=>{ const v=e.target.value; if(v && !lsTags.includes(v)){ lsTags.push(v); paintTags(body.querySelector('#lsType').value); } e.target.value=''; };
    body.querySelector('#lsSave').onclick=()=>{
      l.type=body.querySelector('#lsType').value;
      l.tags=lsTags.join(',');
      l.score=Math.max(1,Math.min(5,parseInt(body.querySelector('#lsScore').value,10)||3));
      l.mood=Math.max(1,Math.min(5,parseInt(body.querySelector('#lsMood').value,10)||3));
      l.content=body.querySelector('#lsContent').value.trim();
      save(); sh.hidden=true; renderLogs(); renderLogsPanel();
    };
    sh.hidden=false;
  }

  /* ---------- 训练日志编辑 sheet ---------- */
  function openTrainSheet(id){
    const l=logs.find(x=>String(x.id)===String(id)); if(!l || l.kind!=='train') return;
    const sh=ensureLogSheet(); const body=$('lsBody');
    const hd=sh.querySelector('.ls-head b'); if(hd) hd.textContent='编辑练后感受';
    const ck=(l.meta&&l.meta.checkin)||{};
    const mood=ck.mood||3, energy=ck.energy||3;
    body.innerHTML=`
      <div class="f-row">
        <div class="f-field"><label class="f-label">情绪 <b id="tvMood">${mood}/5</b></label>
          <input type="range" id="tsMood" min="1" max="5" value="${mood}"></div>
        <div class="f-field"><label class="f-label">状态 <b id="tvEnergy">${energy}/5</b></label>
          <input type="range" id="tsEnergy" min="1" max="5" value="${energy}"></div>
      </div>
      <label class="f-label" style="margin-top:10px">练后感受</label>
      <textarea id="tsNote" style="min-height:80px" placeholder="今天练得怎么样？">${ENGINE.esc(ck.note||'')}</textarea>
      <p style="margin:8px 0 0;font-size:11.5px;color:var(--tx3);line-height:1.5">组数、重量、次数由专注模式自动同步，不能在这里改。</p>
      <div class="ls-actions">
        <button class="btn ghost sm" type="button" data-close="1">取消</button>
        <button class="btn sm" type="button" id="tsSave">保存</button>
      </div>`;
    const mv=body.querySelector('#tsMood'), ev=body.querySelector('#tsEnergy');
    mv.oninput=()=>{ body.querySelector('#tvMood').textContent=mv.value+'/5'; };
    ev.oninput=()=>{ body.querySelector('#tvEnergy').textContent=ev.value+'/5'; };
    body.querySelector('#tsSave').onclick=()=>{
      const mood2=parseInt(mv.value,10)||3, energy2=parseInt(ev.value,10)||3;
      const note=String(body.querySelector('#tsNote').value||'').trim();
      l.meta=l.meta||{};
      l.meta.checkin={mood:mood2, energy:energy2, note:note, at:Date.now()};
      if(l.date){ train.checkins=train.checkins||{}; train.checkins[l.date]={mood:mood2,energy:energy2,note:note,at:Date.now()}; }
      save(); saveTrain();
      sh.hidden=true; renderLogsPanel();
      trToast&&trToast('感受已保存');
    };
    sh.hidden=false;
  }
  /* ---------- 统计面板 ---------- */
  function renderStatsPanel(){
    const body=$('reportBody');

    if(typeof echarts==='undefined'){
      body.innerHTML=`<div class="intro-empty"><div class="big">图表库未加载</div><p>统计图需要联网加载 ECharts，请检查网络后刷新。</p></div>`;
      return;
    }
    const d30=new Date(); d30.setDate(d30.getDate()-29);
    gantt.start = gantt.start || dayKey(d30);
    gantt.end   = gantt.end   || dayKey(new Date());
    body.innerHTML=`
      <div class="filter-bar">
        <span class="tag">甘特区间</span>
        <input type="date" id="gStart" value="${gantt.start}">
        <span style="color:var(--tx3)">至</span>

        <div class="chart-box"><h3>每日平均精力（近30天）</h3><div class="chart-canvas" id="cScore"></div></div>
        <div class="chart-box"><h3>每日记录数（近30天）</h3><div class="chart-canvas" id="cCount"></div></div>

    $('gStart').onchange=e=>{gantt.start=e.target.value; if(gantt.start>gantt.end) gantt.start=gantt.end; $('gStart').value=gantt.start; renderGantt();};
    $('gEnd').onchange=e=>{gantt.end=e.target.value; if(gantt.end<gantt.start) gantt.end=gantt.start; $('gEnd').value=gantt.end; renderGantt();};
    $('gToday').onclick=()=>{ const t=dayKey(new Date()); gantt.start=t; gantt.end=t; $('gStart').value=t; $('gEnd').value=t; renderGantt(); };
    $('gWeek').onclick=()=>{ const t=dayKey(new Date()); const s=new Date(); s.setDate(s.getDate()-6); gantt.start=dayKey(s); gantt.end=t; $('gStart').value=gantt.start; $('gEnd').value=gantt.end; renderGantt(); };
    const typeData = settings.types.map(t=>({name:t.label, value:logs.filter(l=>l.type===t.key).length, itemStyle:{color:colorFor(t.key)}})).filter(x=>x.value>0);
    makeChart('cType',{
      tooltip:{trigger:'item',formatter:'{b}: {c} 条 ({d}%)'},
      legend:{bottom:0,textStyle:{color:'#8695A5'}},
      series:[{type:'pie',radius:['42%','68%'],center:['50%','44%'], data:typeData.length?typeData:[{name:'暂无数据',value:1,itemStyle:{color:'#26323F'}}], label:{color:'#E4EDF4'}}]
    });
    const tagCount={};
    logs.forEach(l=>{ (l.tags||'').split(/[,，、\s]+/).filter(Boolean).forEach(t=>{tagCount[t]=(tagCount[t]||0)+1;}); });
    const top=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,10).reverse();
    makeChart('cTag',{
      tooltip:{trigger:'axis'},grid:{left:70,right:20,top:10,bottom:20},
      xAxis:{type:'value',splitLine:{lineStyle:{color:'#1A2431'}}},
      yAxis:{type:'category',data:top.map(x=>x[0]),axisLabel:{color:'#E4EDF4'}},
      series:[{type:'bar',data:top.map(x=>x[1]),itemStyle:{color:'#3DDCBF'},barWidth:14}]
    });
    const d0=new Date(); d0.setDate(d0.getDate()-29);

    const byDay={}; days.forEach(k=>byDay[k]=[]);
    logs.forEach(l=>{ if(dayKey(l.time) in byDay) byDay[dayKey(l.time)].push(l.score); });
    const scores=days.map(k=>{const a=byDay[k];return a.length?+(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1):null;});
    const counts=days.map(k=>byDay[k].length);
    makeChart('cScore',{
      tooltip:{trigger:'axis'},grid:{left:40,right:16,top:16,bottom:60},
      xAxis:{type:'category',data:days.map(k=>k.slice(5)),axisLabel:{color:'#8695A5',interval:4}},
      yAxis:{type:'value',min:1,max:5,splitLine:{lineStyle:{color:'#1A2431'}}},
      series:[{type:'line',data:scores,smooth:true,symbol:'circle',symbolSize:5,connectNulls:false,lineStyle:{color:'#5FD3A0',width:2},itemStyle:{color:'#5FD3A0'},areaStyle:{color:'rgba(95,211,160,.14)'}}]
    });
    makeChart('cCount',{
      tooltip:{trigger:'axis'},grid:{left:40,right:16,top:16,bottom:60},
      xAxis:{type:'category',data:days.map(k=>k.slice(5)),axisLabel:{color:'#8695A5',interval:4}},
      yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#1A2431'}}},
      series:[{type:'bar',data:counts,itemStyle:{color:'#6D8CFF'},barWidth:'55%'}]
    });
    renderGantt();
  }
  function renderGantt(){
    if(typeof echarts==='undefined') return;
    const el=document.getElementById('cGantt'); if(!el) return;
    const s=new Date(gantt.start+'T00:00:00');
    const e=new Date(gantt.end+'T00:00:00');
    if(isNaN(s)||isNaN(e)||s>e) return;
    const days=[];
    for(const dt=new Date(s); dt<=e; dt.setDate(dt.getDate()+1)) days.push(dayKey(dt));
    if(days.length>120){ days.length=120; }
    const byDay={}; days.forEach(k=>byDay[k]=[]);
    logs.forEach(l=>{ const k=dayKey(l.time); if(byDay[k]){ const d=new Date(l.time); byDay[k].push({x:d.getHours()+d.getMinutes()/60, type:l.type}); } });
    const dates=[...days].reverse();
    const data=dates.map(d=>({ records: byDay[d].sort((a,b)=>a.x-b.x) }));
    const gData=data;
    const total=days.reduce((acc,d)=>acc+byDay[d].length,0);
    const gc=$('gCount'); if(gc) gc.textContent = `区间 ${days.length} 天 · ${total} 条记录`;
    if(ganttChart){ try{ ganttChart.dispose(); }catch(e){} }
    ganttChart=echarts.init(el);
    ganttChart.setOption({
      tooltip:{trigger:'item',formatter:p=>{
        const rec=(gData[p.dataIndex]||{}).records||[];
        if(!rec.length) return `${dates[p.dataIndex] || ''}<br/>无记录`;
        return `${dates[p.dataIndex]} · ${rec.length} 条<br/>${rec.map(r=>typeLabel(r.type)+' @ '+String(Math.floor(r.x)).padStart(2,'0')+':'+String(Math.floor((r.x%1)*60)).padStart(2,'0')).join('<br/>')}`;
      }},
      grid:{left:96,right:28,top:18,bottom:36},
      xAxis:{type:'value',min:0,max:24,interval:4,axisLabel:{formatter:v=>`${v}时`,color:'#8695A5'},splitLine:{lineStyle:{color:'#1A2431'}}},
      yAxis:{type:'category',data:dates,axisLabel:{color:'#8695A5',fontSize:11}},
      series:[{
        type:'custom', data:data,
        renderItem:(params,api)=>{
          const rec=(gData[params.dataIndex]||{}).records||[];
          if(!rec.length) return {type:'group',children:[]};
          const topY=api.coord([0,params.dataIndex])[1];
          const botY=api.coord([0,params.dataIndex+1])[1];
          const rowH=Math.abs(botY-topY);
          const n=rec.length, children=[];
          rec.forEach((r,i)=>{
            const px=api.coord([r.x,params.dataIndex]);
            const slotH=Math.max((rowH-4)/n, 2);
            const y=topY + (i+0.5)*rowH/n;
            children.push({type:'rect', shape:{x:px[0]-4, y:y-slotH/2, width:8, height:slotH}, style:{fill:colorFor(r.type), opacity:.85, r:2}});
          });
          return {type:'group',children};
        }
      }]
    });
    chartInsts.push(ganttChart);
  }

    if(model && !model.value) model.value=c.model;

  const BAK_KEYS = {logs:STORE_KEY, settings:SETTINGS_KEY, profile:PROFILE_KEY, training:TRAIN_KEY};
  function collectBackup(){
    const data = {_app:'SelfAgent', _v:1, _at:new Date().toISOString()};
    Object.keys(BAK_KEYS).forEach(k=>{ const raw = localStorage.getItem(BAK_KEYS[k]); if(raw){ try{ data[k] = JSON.parse(raw); }catch(e){} } });
    return data;
  }
  function bakMsg(t){ const el=$('bakMsg'); if(el) el.textContent=t; }
  function bindBackup(){
    const expBtn=$('expBtn'), impBtn=$('impBtn'), impFile=$('impFile'), area=$('impArea'), doRow=$('impDoRow');
    if(!expBtn) return;
    expBtn.addEventListener('click', ()=>{
      const text = JSON.stringify(collectBackup(), null, 2);
      const name = 'SelfAgent备份-'+new Date().toISOString().slice(0,10)+'.json';
      let file = null;
      try{ file = new File([text], name, {type:'application/json'}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'SelfAgent 备份'}).then(()=>bakMsg('已唤起分享，选「存储到文件」即可。')).catch(()=>download());
      } else download();
      function download(){
        const blob=new Blob([text],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 3000);
        bakMsg('已导出 '+name+'（若没反应，可长按下方文本手动复制）。');
        area.hidden=false; area.value=text;
      }
    });
    impBtn.addEventListener('click', ()=>{ impFile.click(); });
    impFile.addEventListener('change', ()=>{
      const f=impFile.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{ 
        try{ const d=JSON.parse(r.result); applyBackup(d); }
        catch(e){ bakMsg('文件不是有效的备份 JSON。'); area.hidden=false; }
      };
      r.readAsText(f);
    });
    $('impDo').addEventListener('click', ()=>{
      try{ applyBackup(JSON.parse(area.value)); }catch(e){ bakMsg('粘贴的内容不是有效 JSON。'); }
    });
    function applyBackup(d){
      if(!d || d._app!=='SelfAgent'){ bakMsg('这不是 SelfAgent 的备份文件。'); return; }
      const n=(d.logs&&d.logs.length)||0;
      if(!confirm('导入会覆盖当前数据，继续？备份含 '+n+' 条记录')) return;
      Object.keys(BAK_KEYS).forEach(k=>{ if(d[k]!==undefined) localStorage.setItem(BAK_KEYS[k], JSON.stringify(d[k])); });
      bakMsg('导入完成，正在重新加载…'); setTimeout(()=>location.reload(), 400);
    }
  }
  window.addEventListener('hashchange',()=>{
    const hm=/#setting\/([a-z]+)/.exec(location.hash||'');
    if(!hm) return;
    try{ if(currentPage!=='setting') openPage('setting'); else openSetPanel(hm[1]); }catch(e){}
  });
  (function bootSettingHash(){
    function start(){
      const h=location.hash||'';
      if(h.indexOf('#setting')!==0) return;
      const k=(h.split('/')[1]||'');
      if(k) window.__setPanel=k;
      try{ openPage('setting'); }catch(e){}
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
    else start();
  })();
  function bindSettingsActions(){
    bindBackup();
    try{ bindAISettings(); }catch(e){}
    const mv=$('memView'); if(mv) mv.value=aiMemList();
    const mc=$('memClear'); if(mc) mc.onclick=()=>{
      try{ localStorage.removeItem('selfagent_agent_memory_v1'); }catch(e){}
      if(mv) mv.value=aiMemList();

    };
    const crb=$('coachReplayBtn'); if(crb) crb.onclick=()=>{ try{ coachReplay(); }catch(e){} };
    const cab=$('coachAutoBtn');
    if(cab){
      const syncAuto=()=>{ cab.textContent = coachAuto() ? '关闭自动提示' : '开启自动提示'; };
      syncAuto();
      cab.onclick=()=>{
        try{ localStorage.setItem('selfagent_coach_auto', coachAuto()?'0':'1'); }catch(e){}
        syncAuto();
        try{ trToast(coachAuto()?'已关闭自动提示':'已开启自动提示'); }catch(e){}
      };
    }
    if(window.__cloudFill) window.__cloudFill();
    const onTypeChange = ()=>{ saveSettings(); renderSettingsPanel(); refreshLogForm(); renderLogs(); };
    $('addType').addEventListener('click',()=>{
      const v=($('newTypeName').value||'').trim(); if(!v) return;
      settings.types.push({key:'t'+Date.now().toString(36), label:v, tags:[]});
      onTypeChange();
    });
    document.querySelectorAll('#reportBody [data-deltype]').forEach(b=>{
      b.addEventListener('click',()=>{ settings.types=settings.types.filter(t=>t.key!==b.dataset.deltype); onTypeChange(); });
    });
    function inputFor(btn,tk){ const card=btn.closest('.type-card'); return card?card.querySelector('[data-add-type-tag="'+tk+'"]'):null; }
    document.querySelectorAll('#reportBody [data-add-type-tag-btn]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const tk=btn.dataset.addTypeTagBtn; const t=settings.types.find(x=>x.key===tk); if(!t) return;
        const inp=inputFor(btn,tk); const v=(inp&&inp.value||'').trim(); if(!v) return;
        t.tags=t.tags||[];
        if(!t.tags.includes(v)){ t.tags.push(v); onTypeChange(); }
      });
    });
    document.querySelectorAll('#reportBody [data-deltype-tag]').forEach(b=>{
      b.addEventListener('click',()=>{
        const t=settings.types.find(x=>x.key===b.dataset.tk); if(!t) return;
        t.tags=(t.tags||[]).filter(x=>x!==b.dataset.deltypeTag);
        onTypeChange();
      });
    });
    $('profileForm').addEventListener('submit',e=>{
      e.preventDefault();
      const np={};
      PROFILE_FIELDS.forEach(f=>{ const v=($('pf_'+f.k)||{}).value; if(v && v.trim()) np[f.k]=v.trim(); });
      profile=np; localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); renderSettingsPanel();
    });
    $('pfClear').addEventListener('click',()=>{ profile={}; localStorage.removeItem(PROFILE_KEY); renderSettingsPanel(); });
  }
  function profileSummaryHtml(){
    const ks=PROFILE_FIELDS.filter(f=>profile[f.k] && String(profile[f.k]).trim());
    if(!ks.length) return '';
    const items=ks.map(f=>`<li><strong>${f.label}：</strong>${ENGINE.esc(profile[f.k])}</li>`).join('');
    return `<div class="profile-summary"><h3>基础档案（分析上下文）</h3><ul>${items}</ul><div class="note">以下为你在「设置 · 人物档案」中填写的基础信息，Agent 将把它作为固定上下文用于本次及后续分析。</div></div>`;
  }

  /* ---------- 首页仪表板 ---------- */
  const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  function renderHome(){
    const t=new Date(), tk=dk(t);
    const tl=logs.filter(l=>dk(new Date(l.time))===tk);
    const tt=train.records.filter(r=>r.date===tk);
    const sets=tt.reduce((a,b)=>a+(b.sets||0),0);
    const avg=(a,k)=>a.length?(a.reduce((x,y)=>x+(k(y)||0),0)/a.length):null;
    const sc=avg(tl,l=>l.score), md=avg(tl,l=>moodNorm(l.mood));
    const f1=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1);
    const mw=md==null?'':(md<=1.5?'很糟':md<=2.5?'低落':md<=3.5?'一般':md<=4.5?'不错':'很好');
    const daySet=new Set(logs.map(l=>dk(new Date(l.time))).concat(train.records.map(r=>r.date||'')));
    const streak=streakDays();
    const anyKeys=Array.from(daySet).filter(Boolean).sort();
    const lastAny=anyKeys.length?anyKeys[anyKeys.length-1]:null;
    const lastGap=lastAny?Math.round((new Date(tk)-new Date(lastAny))/864e5):null;
    if($('homeSub')) $('homeSub').textContent = streak>1
      ? `今天 ${t.getMonth()+1} 月 ${t.getDate()} 日 · 已连续 ${streak} 天有记录`
      : (lastGap!=null ? `${t.getMonth()+1} 月 ${t.getDate()} 日 · 上次记录在 ${lastGap} 天前`
      : `${t.getMonth()+1} 月 ${t.getDate()} 日 · 写下第一条，画像就开始长出来`);
    if($('homeToday')) $('homeToday').innerHTML = `
      <div class="hc"><span class="hc-k">今天记录</span><span class="hc-v">${tl.length}<em>条</em></span></div>
      <div class="hc"><span class="hc-k">今天训练</span><span class="hc-v">${sets}<em>组</em></span></div>
      <div class="hc"><span class="hc-k">精力 / 情绪</span><span class="hc-v">${f1(sc)}<em>${mw?('/ '+mw):'/ —'}</em></span></div>
      <div class="hc"><span class="hc-k">${streak?'连续打卡':'上次记录'}</span><span class="hc-v">${streak?(streak+'<em>天</em>'):(lastGap!=null?(lastGap+'<em>天前</em>'):'<em>还没有</em>')}</span></div>`;
    try{ updateOrb(tt); }catch(e){}
    // 热力图
    const cnt={};
    logs.forEach(l=>{ const k=dk(new Date(l.time)); cnt[k]=(cnt[k]||0)+1; });
    train.records.forEach(r=>{ if(r.date) cnt[r.date]=(cnt[r.date]||0)+(r.sets||1); });
    let cells='';
    for(let i=83;i>=0;i--){
      const d=new Date(); d.setDate(d.getDate()-i); const k=dk(d), c=cnt[k]||0;
      const lv=c===0?0:c<=2?1:c<=5?2:c<=9?3:4;
      cells+=`<i data-l="${lv}" title="${k} · ${c} 项"></i>`;
    }
    if($('homeHm')) $('homeHm').innerHTML=cells;
    // 信号
    const sigs=[];
    const tds=train.records.map(r=>r.date).filter(Boolean).sort();
    const last=tds.length?tds[tds.length-1]:null;
    if(last){
      const gap=Math.round((new Date(tk)-new Date(last))/864e5);
      if(gap===0) sigs.push(['good','今天已经练过了']);
      else if(gap>=3) sigs.push(['warn',`已经 ${gap} 天没训练了`]);
      else sigs.push(['good',`最近一次训练在 ${gap} 天前`]);
    } else sigs.push(['warn','还没有训练记录']);

  function weekRange(off){
    const t=new Date(); const wd=(t.getDay()+6)%7;
    const s=new Date(t); s.setDate(t.getDate()-wd-off*7);
    const e=new Date(s); e.setDate(s.getDate()+6);
    const p=n=>String(n).padStart(2,'0');
    const f=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    const end = new Date(Math.min(e.getTime(), t.getTime()));
    return [f(s), f(end), s, e];
  }
  function reviewData(){
    const [aW,bW] = weekRange(0), [aP,bP] = weekRange(1);
    const inR=(l,a,b)=> (l.date||'')>=a && (l.date||'')<=b;
    const pick=(a,b)=>({
      logs:(logs||[]).filter(l=>l.kind!=='train' && inR(l,a,b)),
      trains:(logs||[]).filter(l=>l.kind==='train' && inR(l,a,b)),
      recs:(train.records||[]).filter(r=>r.date>=a && r.date<=b)
    });
    const cur=pick(aW,bW), prev=pick(aP,bP);
    const avg=(a,k)=>{ const v=a.filter(x=>typeof x[k]==='number'&&x[k]>0).map(x=>k==='mood'?moodNorm(x[k]):x[k]); return v.length?v.reduce((x,y)=>x+y,0)/v.length:null; };
    const sets=o=>o.recs.reduce((a,r)=>a+((r.groups&&r.groups.length)?r.groups.filter(g=>g.done).length:(r.sets||0)),0);
    const vol=o=>o.recs.reduce((a,r)=>a+(((r.groups||[]).filter(g=>g.done&&!g.warmup)).reduce((x,g)=>x+(g.reps||0)*(g.weight||0),0)),0);
    const kw=o=>{ const c={}; o.logs.forEach(l=>String(l.tags||'').split(/[,、，]/).filter(Boolean).forEach(t=>c[t]=(c[t]||0)+1));
      return Object.keys(c).sort((x,y)=>c[y]-c[x]).slice(0,3); };
    const s1={logs:cur.logs.length, sets:sets(cur), vol:Math.round(vol(cur)), sc:avg(cur.logs,'score'), md:avg(cur.logs,'mood'), kw:kw(cur)};
    const s2={logs:prev.logs.length, sets:sets(prev), vol:Math.round(vol(prev)), sc:avg(prev.logs,'score'), md:avg(prev.logs,'mood'), kw:kw(prev)};
    let rise='';
    if(s2.logs>=2 && s1.logs>0){
      if(s1.logs>s2.logs) rise=`记录比上周多 ${s1.logs-s2.logs} 条，节奏稳住了。`;
      else if(s1.logs<s2.logs) rise=`记录比上周少 ${s2.logs-s1.logs} 条，别让记录断掉。`;
      else rise='记录量和上周持平。';
    } else rise='数据还不够两周，下周就能看趋势了。';
    if(s1.md!=null && s2.md!=null && Math.abs(s1.md-s2.md)>=0.4) rise += ` 情绪均值 ${s2.md.toFixed(1)} → ${s1.md.toFixed(1)}。`;
    return {aW,bW,aP,bP,cur:s1,prev:s2,rise};
  }
