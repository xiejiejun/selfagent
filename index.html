  }
  function inferLog(text){
    const t=(' '+text+' ').toLowerCase();
    let best={key:(settings.types[0]||{}).key, sc:0, tags:[]};
    settings.types.forEach(ty=>{
      let sc=0; const hit=[];
      (ty.tags||[]).forEach(tag=>{ if(tag && t.includes(String(tag).toLowerCase())){ sc+=2; hit.push(tag); } });
      if(t.includes(String(ty.label||'').toLowerCase())) sc+=3;
      (INFER_KW[ty.key]||[]).forEach(w=>{ if(t.includes(w)) sc+=3; });
      if(sc>best.sc) best={key:ty.key, sc, tags:hit.slice(0,2)};
    });
    const hint=TAG_HINT.filter(h=>h.re.test(text) && (typeTags(best.key)||[]).includes(h.tag)).map(h=>h.tag);
    if(hint.length) best.tags=hint.slice(0,2);
    return best;
  }

    const wm=s.match(/(\d+(?:\.\d+)?)\s*(?:kg|公斤)?\s*$/i);
    if(wm && wm[0].trim()){ weight=parseFloat(wm[1])||0; s=s.replace(wm[0],' '); }

{"id":"1712","n":"辅助仰卧侧内收肌拉伸","en":"assisted side lying adductor stretch","p":"上腿","e":"辅助器械","t":"内收肌","g":"1712-hC6oYY5.gif","s":["侧躺，双腿伸直并叠放在一起。","稍微弯曲下面的腿以保持稳定。","将上脚放在稳定的表面上，例如长凳或台阶上。","保持上腿伸直，慢慢将其降低到地面，感觉大腿内侧有拉伸感。","保持拉伸 20-30 秒。"]},
{"id":"1758","n":"辅助仰卧起坐","en":"assisted sit-up","p":"腰腹","e":"辅助器械","t":"腹肌","g":"1758-aumB2IV.gif","s":["坐在长凳边缘或让某人按住你的脚。","平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"1431","n":"辅助站姿反手引体向上","en":"assisted standing chin-up","p":"背","e":"器械","t":"背阔肌","g":"1431-7OeHptV.gif","s":["将机器调整至您所需的辅助级别。","站在脚踏板上，正手握住手柄，握距略宽于肩宽。","保持挺胸、肩膀向后，收紧核心肌群，并稍微弯曲膝盖。","弯曲肘部并将肘部向身体两侧压低，将身体向上拉。","继续拉，直到下巴位于杠铃上方。"]},
{"id":"1432","n":"辅助站姿引体向上","en":"assisted standing pull-up","p":"背","e":"器械","t":"背阔肌","g":"1432-f4xtKBj.gif","s":["将机器调整至您所需的体重和高度设置。","面向机器站立，双脚分开与肩同宽。","正手握住手柄，握距略宽于肩宽。","启动你的背阔肌和二头肌，并将自己拉向手柄。","在顶部暂停片刻，挤压背部肌肉。"]},
{"id":"0018","n":"辅助站姿三头肌伸展毛巾","en":"assisted standing triceps extension (with towel)","p":"上臂","e":"辅助器械","t":"三头肌","g":"0018-7HcfMBP.gif","s":["双脚分开与肩同宽站立，双手握住毛巾放在脑后。","保持肘部靠近耳朵，上臂保持静止。","慢慢向上伸展前臂，在顶部挤压三头肌。","暂停片刻，然后慢慢将毛巾放回起始位置。"]},
{"id":"0019","n":"辅助跪姿三头臂屈伸","en":"assisted triceps dip (kneeling)","p":"上臂","e":"器械","t":"三头肌","g":"0019-J60bN17.gif","s":["将机器调整到您想要的重量和高度。","跪在面向机器的垫子上，双手握住手柄。","弯曲肘部降低身体，保持背部挺直并靠近机器。","在底部暂停片刻，然后将自己推回到起始位置。"]},
{"id":"2364","n":"辅助跪姿宽距胸臂屈伸","en":"assisted wide-grip chest dip (kneeling)","p":"胸","e":"器械","t":"胸大肌","g":"2364-PnZJIrk.gif","s":["将机器调整到您想要的高度，并将膝盖固定在垫子上。","宽握手柄并保持肘部稍微弯曲。","弯曲肘部降低身体，直到上臂与地板平行。","伸展双臂，将自己推回到起始位置。"]},
{"id":"3220","n":"分腿跳","en":"astride jumps (male)","p":"有氧","e":"自重","t":"心肺","g":"3220-f9lVSSI.gif","s":["双脚分开与肩同宽站立。","弯曲膝盖并将身体降低至蹲姿。","爆发性向上跳跃，伸展双腿和手臂。","在空中时，将双腿分开，并将双臂向两侧伸出。","双脚分开与肩同宽，轻轻落地，弯曲膝盖以吸收冲击力。"]},
{"id":"3672","n":"前后上台阶","en":"back and forth step","p":"有氧","e":"自重","t":"心肺","g":"3672-fNGumX0.gif","s":["双脚分开与肩同宽站立。","右脚向前迈出一步，弯曲膝盖，将身体降低到弓步位置。","用右脚蹬地，然后回到起始位置。","用左脚重复该动作，每一步交替双腿。","继续来回走动，保持稳定的步伐。"]},
{"id":"1314","n":"背部伸展瑜伽球","en":"back extension on exercise ball","p":"背","e":"瑜伽球","t":"竖脊肌","g":"1314-qLpO4vV.gif","s":["将稳定球放在地面上，面朝下躺在上面，臀部放在球上，双脚靠在墙壁或其他稳定的表面上。","将双手放在脑后或交叉在胸前。","启动你的核心，慢慢地将你的上半身抬离球，伸展你的背部，直到你的身体从头部到脚后跟形成一条直线。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3297","n":"后水平","en":"back lever","p":"背","e":"自重","t":"上背","g":"3297-GaSzzuh.gif","s":["首先，用正手握法悬挂在引体向上杆上，双手分开的距离略大于肩宽。","启动你的核心并将肩胛骨向下拉和向后拉。","弯曲膝盖并将其向胸部靠拢。","慢慢抬起双腿，保持伸直，直到身体与地面平行。","保持这个姿势几秒钟，然后慢慢地将双腿放回起始位置。"]},
{"id":"1405","n":"背胸拉伸","en":"back pec stretch","p":"背","e":"自重","t":"背阔肌","g":"1405-chfnQnM.gif","s":["站直，双脚分开与肩同宽。","将双臂伸直在身前，与地面平行。","双臂交叉在身体前方，右臂放在左臂上方。","手指交叉，手掌旋转远离身体。","慢慢抬起手臂并远离身体，感觉背部和胸部有拉伸感。"]},
{"id":"1473","n":"向后跳","en":"backward jump","p":"上腿","e":"自重","t":"股四头肌","g":"1473-SaDOwk7.gif","s":["双脚分开与肩同宽站立。","稍微弯曲膝盖，向后跳跃，用双脚蹬地。","脚掌轻轻着地，弯曲膝盖以吸收冲击力。"]},
{"id":"0020","n":"平衡板","en":"balance board","p":"上腿","e":"自重","t":"股四头肌","g":"0020-xAySMB0.gif","s":["将平衡板放在平坦的表面上。","用一只脚踩在平衡板上，确保其居中。","慢慢地将体重转移到平衡板上的脚上，保持核心肌群参与。","在保持该姿势所需的时间内保持平衡和稳定。","用另一只脚重复该练习。"]},
{"id":"0968","n":"弹力带交替二头肌弯举","en":"band alternating biceps curl","p":"上臂","e":"弹力带","t":"二头肌","g":"0968-3omWx6P.gif","s":["双脚分开与肩同宽站立，反手握住弹力带，手掌朝上。","保持肘部靠近身体两侧，慢慢地将一只手臂向肩膀弯曲，在顶部挤压二头肌。","将手臂放回起始位置，然后用另一只手臂重复此动作。","继续交替手臂进行所需的重复次数。"]},
{"id":"0969","n":"弹力带交替V字起坐","en":"band alternating v-up","p":"腰腹","e":"弹力带","t":"腹肌","g":"0969-ztAa1RK.gif","s":["平躺，双腿伸直，手臂伸过头顶，握住弹力带。","收紧腹肌，同时将双腿和上半身抬离地面，将双手伸向脚趾。","当你降低双腿和上半身时，交换双腿的位置，将一条腿交叉在另一条腿上。","继续进行所需的重复次数。"]},
{"id":"0970","n":"弹力带辅助引体向上","en":"band assisted pull-up","p":"背","e":"弹力带","t":"背阔肌","g":"0970-r1XNRYB.gif","s":["将弹力带固定在上拉杆或坚固的锚点上。","踏上弹力带，手掌背向自己，握住杠铃，双手之间的距离略宽于肩宽。","双臂完全伸展，保持核心收紧，肩膀向下并向后倾斜。","将肩胛骨挤压在一起并将肘部向下推向臀部，将身体向上拉向杠铃杆。","继续拉，直到下巴高于杠铃，然后慢慢降低回到起始位置。"]},
{"id":"0971","n":"弹力带辅助健腹轮滚轴前推","en":"band assisted wheel rollerout","p":"腰腹","e":"弹力带","t":"腹肌","g":"0971-zhF9lW4.gif","s":["跪在地板上，双手握住弹力带的手柄，手掌朝下。","将弹力带放在您面前的地面上，双手分开与肩同宽。","启动你的核心并缓慢地向前滚动轮子，在保持控制的同时尽可能地伸展你的身体。","在最远点暂停片刻，然后慢慢地将轮子向膝盖方向滚动，回到起始位置。"]},
{"id":"1254","n":"弹力带卧推","en":"band bench press","p":"胸","e":"弹力带","t":"胸大肌","g":"1254-khlHMqs.gif","s":["平躺在长凳上，双脚平放在地上，背部紧贴长凳。","正手握住带子手柄，间距略宽于肩宽。","充分伸展双臂，将弹力带推离胸部。","慢慢将弹力带放回到胸部，保持肘部呈 90 度角。"]},
{"id":"0980","n":"弹力带俯身髋伸展","en":"band bent-over hip extension","p":"上腿","e":"弹力带","t":"臀大肌","g":"0980-wSScovH.gif","s":["将带子固定在脚踝高度的坚固锚点上。","背对锚点站立，双脚与肩同宽。","向后退一步，在弹力带上产生张力，保持膝盖稍微弯曲。","铰接臀部并向前倾斜，保持脊柱中立。","将右腿向后伸直，在顶部挤压臀部。"]},
{"id":"0972","n":"弹力带自行车卷腹","en":"band bicycle crunch","p":"腰腹","e":"弹力带","t":"腹肌","g":"0972-tZkGYZ9.gif","s":["平躺，双手放在脑后，膝盖弯曲。","将脚抬离地面，将右膝盖靠近胸部，同时扭转躯干，将左肘靠近右膝盖。","伸直右腿，同时将左膝靠近胸部，并扭转躯干，使右肘靠近左膝。","继续交替扭转运动，就像踩自行车一样，同时在整个运动过程中保持核心参与。"]},
{"id":"0974","n":"弹力带窄距下拉","en":"band close-grip pulldown","p":"背","e":"弹力带","t":"背阔肌","g":"0974-DptumMx.gif","s":["将弹力带固定在较高的锚点上，例如上拉杆或坚固的横梁。","面向锚点站立，用反手抓住弹力带，双手与肩同宽。","后退一步，在弹力带上产生张力，双脚分开与臀部同宽。","当你将弹力带向下拉向胸部时，收紧你的核心并保持背部挺直，将肩胛骨挤压在一起。","在动作底部暂停片刻，然后慢慢松开弹力带回到起始位置。"]},
{"id":"0975","n":"弹力带窄距俯卧撑","en":"band close-grip push-up","p":"上臂","e":"弹力带","t":"三头肌","g":"0975-ufaxB52.gif","s":["将一条带子绕在你的上臂上，就在肘部上方。","采取俯卧撑姿势，双手直接放在肩膀下方，身体从头到脚跟呈一条直线。","弯曲肘部，将胸部降低到地面，保持肘部靠近身体两侧。","推动手掌以伸展手臂并返回到起始位置。"]},
{"id":"0976","n":"弹力带集中弯举","en":"band concentration curl","p":"上臂","e":"弹力带","t":"二头肌","g":"0976-kmVVAfu.gif","s":["坐在长凳或椅子上，双腿分开，双脚平放在地上。","用手握住带子的一端，用脚踩在另一端上，同时将脚放在同一侧。","稍微向前倾，将肘部放在大腿内侧，膝盖上方。","手掌朝上，慢慢地将手向肩膀弯曲，保持上臂静止。","在顶部暂停片刻，然后慢慢将手放回起始位置。"]},
{"id":"3117","n":"弹力带固定背窄距下拉","en":"band fixed back close grip pulldown","p":"背","e":"弹力带","t":"背阔肌","g":"3117-4LoWllp.gif","s":["将弹力带固定在您上方的固定点上，例如上拉杆或坚固的横梁。","坐在面向乐队的长凳或椅子上，双脚平放在地上，膝盖弯曲。","紧紧握住弹力带，手掌朝向您。","保持背部挺直并启动核心肌群。","将弹力带向下拉向胸部，将肩胛骨挤压在一起。"]},
{"id":"3116","n":"弹力带固定背反手下拉","en":"band fixed back underhand pulldown","p":"背","e":"弹力带","t":"背阔肌","g":"3116-ZH68exZ.gif","s":["将带子固定在头顶上方坚固的锚点上。","面向锚点站立，双脚分开与肩同宽。","反手握住弹力带，双手间距略宽于肩宽。","后退一步，在弹力带上产生张力，保持手臂完全伸展。","启动你的核心并将肩胛骨挤压在一起。"]},
{"id":"0977","n":"弹力带前侧平举","en":"band front lateral raise","p":"肩","e":"弹力带","t":"三角肌","g":"0977-sTg7iys.gif","s":["双脚分开与肩同宽站立，将弹力带放在大腿前面，手掌朝下。","保持双臂伸直，将弹力带举到身前，直到双臂与地面平行。","在顶部暂停片刻，然后慢慢将弹力带放回起始位置。"]},
{"id":"0978","n":"弹力带前平举","en":"band front raise","p":"肩","e":"弹力带","t":"三角肌","g":"0978-TFA88iB.gif","s":["双脚分开与肩同宽站立，将弹力带放在大腿前面，手掌朝下。","保持手臂伸直，慢慢向前举起，直到与地面平行。","在顶部暂停片刻，然后慢慢将手臂放回起始位置。"]},
{"id":"1408","n":"弹力带髋上举","en":"band hip lift","p":"上腿","e":"弹力带","t":"臀大肌","g":"1408-E4R8Hz1.gif","s":["仰卧，膝盖弯曲，双脚平放在地上。","将阻力带放在膝盖上方。","调动你的臀肌和核心肌肉。","将脚后跟压入地面，将臀部抬离地板，在顶部挤压臀部。","在顶部暂停片刻，然后慢慢将臀部放回起始位置。"]},
{"id":"0979","n":"弹力带水平帕洛夫推","en":"band horizontal pallof press","p":"腰腹","e":"弹力带","t":"腹肌","g":"0979-9pa4H5m.gif","s":["将带子固定在腰部高度的坚固锚点上。","垂直于锚点站立，双脚分开与肩同宽。","用双手抓住带子手柄并远离锚点以在带子中产生张力。","将双手放在胸前，保持肘部弯曲并靠近身体。","调动你的核心并保持稳定的姿势。"]},
{"id":"0981","n":"弹力带开合刀仰卧起坐","en":"band jack knife sit-up","p":"腰腹","e":"弹力带","t":"腹肌","g":"0981-KCBKjma.gif","s":["平躺，双腿伸直，手臂伸过头顶，握住弹力带。","收紧腹肌，同时抬起双腿和上半身，将双手移向脚部。","在顶部停顿片刻，然后慢慢放下双腿和上半身回到起始位置。"]},
{"id":"0983","n":"跪姿弹力带单臂下拉","en":"band kneeling one arm pulldown","p":"背","e":"弹力带","t":"背阔肌","g":"0983-pmnrOp0.gif","s":["将带子固定在头顶上方坚固的锚点上。","跪下，用一只手握住弹力带，手掌朝下。","将手臂完全伸过头顶，保持肘部稍微弯曲。","调动你的背阔肌，将弹力带拉向你的一侧，使你的肘部靠近你的胸腔。","在底部停顿片刻，然后慢慢释放张力，回到起始位置。"]},
{"id":"0985","n":"跪姿弹力带转体卷腹","en":"band kneeling twisting crunch","p":"腰腹","e":"弹力带","t":"腹肌","g":"0985-225x2Vd.gif","s":["将带子固定在腰部高度的坚固锚点上。","面向远离锚点的方向跪下，用双手握住弹力带，保持肘部弯曲并靠近身体两侧。","收紧腹肌，慢慢地将躯干扭向一侧，将双手移向另一侧的臀部。","暂停片刻，然后慢慢回到起始位置。","在另一侧重复。"]},
{"id":"0984","n":"仰卧弹力带髋内侧旋转","en":"band lying hip internal rotation","p":"上腿","e":"弹力带","t":"臀大肌","g":"0984-vIICElP.gif","s":["仰卧，双腿伸直，将阻力带绕在脚上。","弯曲膝盖并将其靠近胸部，双脚并拢。","慢慢向外旋转膝盖，使膝盖彼此远离，同时保持双脚并拢。","旋转结束时暂停片刻，然后慢慢回到起始位置。"]},
{"id":"1002","n":"仰卧弹力带直举腿","en":"band lying straight leg raise","p":"腰腹","e":"弹力带","t":"腹肌","g":"1002-bbLR7fB.gif","s":["平躺，双腿伸直，双脚并拢。","将带子放在脚弓周围，并用手握住带子的末端。","收紧腹肌，将双腿抬离地面，直到它们垂直于地板。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"0986","n":"弹力带单臂过头二头肌弯举","en":"band one arm overhead biceps curl","p":"上臂","e":"弹力带","t":"二头肌","g":"0986-UNAB8ak.gif","s":["双脚分开与肩同宽站立，将弹力带的一端放在脚下。","握住弹力带的另一端，手臂完全伸过头顶，手掌朝前。","保持上臂静止，将前臂向肩膀弯曲，挤压二头肌。","在顶部停顿片刻，然后慢慢将前臂放回起始位置。"]},
{"id":"0987","n":"弹力带单臂单腿分腿蹲","en":"band one arm single leg split squat","p":"上腿","e":"弹力带","t":"股四头肌","g":"0987-arsYEd3.gif","s":["双脚分开站立，与臀部同宽，将阻力带绕在脚踝上。","向前伸出一条腿，将脚尖放在长凳上或身后的一步上。","用一只手握住支撑物以保持平衡。","弯曲站立的腿，将身体降低到蹲姿，保持膝盖与脚趾在一条直线上。","推动脚后跟返回到起始位置。"]},
{"id":"0988","n":"站姿弹力带单臂低划船","en":"band one arm standing low row","p":"背","e":"弹力带","t":"上背","g":"0988-km0sQC0.gif","s":["将带子固定在腰部高度的稳定锚点上。","面向锚点站立，双脚分开与肩同宽。","用一只手握住弹力带，手掌朝内，然后后退以在弹力带中产生张力。","稍微弯曲膝盖，髋部向前转动，保持背部挺直。","将带子拉向腰部，将肩胛骨挤压在一起。"]},
{"id":"0989","n":"弹力带单臂转体胸推","en":"band one arm twisting chest press","p":"胸","e":"弹力带","t":"胸大肌","g":"0989-c16nYGA.gif","s":["将带子固定在胸部高度的坚固锚点上。","站立，一侧面向锚点，用一只手抓住带子。","远离锚点以在带子中产生张力。","将双脚分开与肩同宽，并稍微弯曲膝盖。","将握住弹力带的手穿过身体，朝向对侧的肩膀。"]},
{"id":"0990","n":"坐姿弹力带单臂转体划船","en":"band one arm twisting seated row","p":"背","e":"弹力带","t":"上背","g":"0990-DKBwJrL.gif","s":["坐在长凳或椅子上，双脚平放在地上，背部挺直。","用一只手握住弹力带，并将手臂完全伸到身前。","保持背部挺直，弯曲肘部并将肩胛骨挤压在一起，将弹力带拉向身体。","同时，将躯干向拉动手臂的一侧扭转。","在顶部暂停片刻，然后慢慢释放弹力带的张力并返回到起始位置。"]},
{"id":"0991","n":"弹力带拉贯穿","en":"band pull through","p":"上腿","e":"弹力带","t":"臀大肌","g":"0991-VtTbiP3.gif","s":["将阻力带连接到地面上坚固的锚点上。","背对锚点站立，双脚与肩同宽。","向前迈一步，在弹力带中产生张力，保持膝盖稍微弯曲。","铰接臀部并将臀部向后推，保持膝盖轻微弯曲。","降低躯干直到与地面平行，感觉腿筋被拉伸。"]},
{"id":"0992","n":"弹力带推仰卧起坐","en":"band push sit-up","p":"腰腹","e":"弹力带","t":"腹肌","g":"0992-zFzbBfL.gif","s":["将带子牢固地固定在稳定的锚点上。","平躺，膝盖弯曲，双脚平放在地上。","用双手握住弹力带，并将双臂伸向天花板。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"0993","n":"弹力带反向飞鸟","en":"band reverse fly","p":"肩","e":"弹力带","t":"三角肌","g":"0993-sTfvVsG.gif","s":["将带子固定在胸部高度的固定物体上。","双脚分开与肩同宽站立，双手握住弹力带放在身前。","保持手臂伸直并将其向两侧抬起，直到与地面平行。","在动作的最高点将肩胛骨挤压在一起。","慢慢地将手臂放回起始位置。"]},
{"id":"0994","n":"弹力带反握腕弯举","en":"band reverse wrist curl","p":"前臂","e":"弹力带","t":"前臂","g":"0994-Ezpnw9d.gif","s":["坐在长凳或椅子上，双脚平放在地面上。","正手握住弹力带，手掌朝下，然后将其缠绕在手指上。","将前臂放在大腿上，手腕悬在边缘上。","慢慢向上弯曲手腕，挤压前臂。","在顶部暂停片刻，然后慢慢将手腕放回起始位置。"]},
{"id":"0996","n":"坐姿弹力带髋内侧旋转","en":"band seated hip internal rotation","p":"上腿","e":"弹力带","t":"臀大肌","g":"0996-9gbyYKk.gif","s":["坐在椅子或长凳上，背部挺直，双脚平放在地面上。","在大腿周围、膝盖上方放置一条阻力带。","保持膝盖弯曲 90 度，双脚分开与肩同宽。","收紧臀肌，慢慢向外旋转膝盖，克服弹力带的阻力。","动作结束时暂停片刻，然后慢慢回到起始位置。"]},
{"id":"1011","n":"坐姿弹力带转体","en":"band seated twist","p":"腰腹","e":"弹力带","t":"腹肌","g":"1011-S1JXDAG.gif","s":["坐在地上，双腿向前伸展，背部挺直。","将带子绕在腰上，并用双手握住两端。","收紧腹肌，慢慢将躯干扭向一侧，保持背部挺直，双脚着地。","扭转结束时暂停片刻，然后慢慢回到起始位置。","重复扭转到另一侧。"]},
{"id":"0997","n":"弹力带肩推","en":"band shoulder press","p":"肩","e":"弹力带","t":"三角肌","g":"0997-peAeMR3.gif","s":["双脚分开与肩同宽站立，将弹力带放在脚下。","手掌朝前握住弹力带，将双手举至肩高，肘部弯曲。","将弹力带压过头顶，充分伸展双臂。","在顶部暂停片刻，然后慢慢将阻力带降低至肩部高度。"]},
{"id":"1018","n":"弹力带耸肩","en":"band shrug","p":"背","e":"弹力带","t":"斜方肌","g":"1018-trmte8s.gif","s":["双脚分开与肩同宽站立，将弹力带放在脚下，用手握住两端。","保持手臂伸直并放松，让弹力带悬挂在大腿前面。","向上耸肩，尽可能高地举起弹力带，以启动斜方肌。","保持收缩一会儿，然后慢慢将肩膀放回起始位置。"]},
{"id":"0998","n":"弹力带侧三头肌伸展","en":"band side triceps extension","p":"上臂","e":"弹力带","t":"三头肌","g":"0998-obe5LMq.gif","s":["双脚分开与肩同宽站立，双手握住弹力带，掌心朝下。","将手臂伸直至两侧，保持与地面平行。","慢慢弯曲肘部，将双手放在肩膀上，保持上臂不动。","暂停片刻，然后慢慢将手臂伸回起始位置。"]},
{"id":"0999","n":"弹力带单腿小腿举","en":"band single leg calf raise","p":"小腿","e":"弹力带","t":"小腿三头肌","g":"0999-9JprnPh.gif","s":["双脚分开站立，与臀部同宽，将弹力带绕在左脚掌上。","如果需要，请抓住一个稳定的物体以保持平衡。","慢慢地将左脚跟抬离地面，将身体重量转移到脚掌上。","在顶部暂停片刻，然后慢慢将左脚跟放回起始位置。"]},
{"id":"1000","n":"弹力带单腿反向小腿举","en":"band single leg reverse calf raise","p":"小腿","e":"弹力带","t":"小腿三头肌","g":"1000-QsSQWbf.gif","s":["双脚分开站立，与臀部同宽，将弹力带放在脚掌周围。","抓住稳定的物体以保持平衡。","慢慢地将脚跟抬离地面，将身体重量转移到脚掌上。","在顶部暂停片刻，然后慢慢将脚跟放回起始位置。"]},
{"id":"1001","n":"弹力带单腿分腿蹲","en":"band single leg split squat","p":"上腿","e":"弹力带","t":"股四头肌","g":"1001-y8bYM8w.gif","s":["双脚分开站立，与臀部同宽，将阻力带绕在脚踝上。","右脚向前迈一大步，左脚向后退一小步。","弯曲膝盖并降低身体，直到右大腿与地面平行，保持左膝盖略高于地面。","推动右脚跟回到起始位置。","在另一侧重复。"]},
{"id":"1004","n":"弹力带深蹲","en":"band squat","p":"上腿","e":"弹力带","t":"臀大肌","g":"1004-TUZLh71.gif","s":["双脚分开站立，与肩同宽，弹力带放在膝盖上方。","保持挺胸、核心收紧，将臀部向后推，弯曲膝盖，形成下蹲姿势。","确保膝盖位于脚趾上方，并且重量位于脚后跟。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"1003","n":"弹力带深蹲划船","en":"band squat row","p":"上腿","e":"弹力带","t":"臀大肌","g":"1003-w1NOByi.gif","s":["将带子固定在腰部高度的坚固锚点上。","面向锚点站立，双脚分开与肩同宽。","双手握住弹力带手柄，手掌相对，双臂向前伸展。","弯曲膝盖并蹲下，保持背部挺直，挺胸。","从蹲姿开始，将弹力带手柄拉向身体，将肩胛骨挤压在一起。"]},
{"id":"1005","n":"站姿弹力带卷腹","en":"band standing crunch","p":"腰腹","e":"弹力带","t":"腹肌","g":"1005-Kzg30R7.gif","s":["将带子固定在腰部高度的坚固锚点上。","背对锚点站立，双脚与肩同宽。","用双手握住弹力带并将其举至胸前，保持肘部弯曲并靠近身体。","收紧腹肌，慢慢向前挺胸，使胸部靠近膝盖。","在卷腹的最高点暂停片刻，然后慢慢回到起始位置。"]},
{"id":"1022","n":"站姿弹力带后三角肌划船","en":"band standing rear delt row","p":"肩","e":"弹力带","t":"三角肌","g":"1022-tc5dYrf.gif","s":["双脚分开与肩同宽站立，将弹力带放在脚下。","双手握住弹力带手柄，手掌相对，双臂向前伸展。","稍微弯曲膝盖，髋部向前转动，保持背部挺直。","将弹力带拉向胸部，将肩胛骨挤压在一起。","在最高点停顿片刻，然后慢慢释放张力，回到起始位置。"]},
{"id":"1007","n":"站姿弹力带转体卷腹","en":"band standing twisting crunch","p":"腰腹","e":"弹力带","t":"腹肌","g":"1007-euq4pwp.gif","s":["双脚分开与肩同宽站立，将弹力带绕在上背部，穿过胸前。","用手握住带子的末端，保持肘部弯曲并靠近身体两侧。","收紧腹肌并将躯干向一侧扭转，将肘部移向另一侧的膝盖。","暂停片刻，然后回到起始位置。","在另一侧重复。"]},
{"id":"1008","n":"弹力带上台阶","en":"band step-up","p":"上腿","e":"弹力带","t":"臀大肌","g":"1008-d5bTEPV.gif","s":["将一条带子绕在大腿上，就在膝盖上方。","面向台阶或平台站立，双脚分开与臀部同宽。","用右脚踩上平台，用脚后跟推动。","将左腿伸到身后，保持伸直。","将左脚放回地面。"]},
{"id":"1009","n":"弹力带直腿硬拉","en":"band stiff leg deadlift","p":"上腿","e":"弹力带","t":"臀大肌","g":"1009-kuMiR2T.gif","s":["双脚分开站立，与肩同宽，将弹力带绕在脚踝上。","用双手将弹力带放在大腿前面，手掌朝向身体。","保持背部挺直，核心收紧，铰接臀部，慢慢将上半身降低到地面。","当你降低时，将臀部向后推，并让膝盖稍微弯曲。","将弹力带降低至地面，感受腿筋的拉伸。"]},
{"id":"1023","n":"弹力带直背直腿硬拉","en":"band straight back stiff leg deadlift","p":"上腿","e":"弹力带","t":"臀大肌","g":"1023-lHeUULr.gif","s":["双脚分开与肩同宽站立，将弹力带绕在大腿上。","用双手将弹力带放在大腿前面，手掌朝向身体。","保持背部挺直，膝盖稍微弯曲，铰接臀部并将弹力带降低到地面。","当你降低弹力带时，感受腿筋的拉伸。","启动臀肌和腿筋，将身体抬回到起始位置。"]},
{"id":"1010","n":"弹力带直腿硬拉","en":"band straight leg deadlift","p":"背","e":"弹力带","t":"竖脊肌","g":"1010-KUaoUV8.gif","s":["双脚分开与肩同宽站立，将弹力带绕在脚上。","双手握住弹力带，手掌朝向身体，手臂伸直。","收紧核心并保持膝盖轻微弯曲。","慢慢地以臀部为中心向前转动，保持背部挺直，挺胸。","将弹力带降低至地面，同时保持双腿伸直。"]},
{"id":"1012","n":"弹力带转体过头推举","en":"band twisting overhead press","p":"肩","e":"弹力带","t":"三角肌","g":"1012-u4bAmKp.gif","s":["双脚分开与肩同宽站立，将弹力带放在脚下。","将弹力带手柄保持在与肩同高的位置，手掌朝前。","启动你的核心并将弹力带压过头顶，充分伸展你的手臂。","当你按压时，将你的躯干扭转到一侧，保持臀部稳定。","在顶部暂停片刻，然后回到起始位置。"]},
{"id":"1369","n":"弹力带双腿小腿举弹力带下腿第二式","en":"band two legs calf raise - (band under both legs) v. 2","p":"小腿","e":"弹力带","t":"小腿三头肌","g":"1369-jl6uxZV.gif","s":["双脚分开与肩同宽站立，并将阻力带放在双脚下方。","用手握住带子的末端以保持稳定。","用小腿将脚跟抬离地面，尽可能高。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},
{"id":"1013","n":"弹力带反手下拉","en":"band underhand pulldown","p":"背","e":"弹力带","t":"背阔肌","g":"1013-k6tUeqS.gif","s":["将弹力带固定在较高的锚点上，例如上拉杆或坚固的横梁。","面向锚点站立，双脚分开与肩同宽。","反手握住弹力带，双手间距略宽于肩宽。","将手臂完全伸过头顶，保持肘部稍微弯曲。","收紧背阔肌，将弹力带向下拉向胸部，将肩胛骨挤压在一起。"]},
{"id":"1014","n":"弹力带V字起坐","en":"band v-up","p":"腰腹","e":"弹力带","t":"腹肌","g":"1014-H6ETwO9.gif","s":["平躺，双腿伸直，手臂伸过头顶，握住弹力带。","收紧腹肌，同时将双腿和上半身抬离地面，双手伸向脚趾。","在顶部停顿片刻，然后慢慢放下双腿和上半身回到起始位置。"]},
{"id":"1015","n":"弹力带垂直帕洛夫推","en":"band vertical pallof press","p":"腰腹","e":"弹力带","t":"腹肌","g":"1015-G7PXMlT.gif","s":["双脚分开与肩同宽站立，将弹力带缠绕在胸部高度的坚固物体上。","用双手握住弹力带并远离锚点，在弹力带中产生张力。","使自己垂直于锚点，一侧面向弹力带。","将双臂伸直在身前，保持双手与胸同高。","收紧核心肌群，将弹力带压离胸部，充分伸展手臂。"]},
{"id":"1016","n":"弹力带腕弯举","en":"band wrist curl","p":"前臂","e":"弹力带","t":"前臂","g":"1016-vUTfFHw.gif","s":["坐在长凳或椅子上，双脚平放在地面上。","双手握住弹力带，手掌朝上，前臂放在大腿上。","慢慢向上弯曲手腕，挤压前臂。","在顶部暂停片刻，然后慢慢将手腕放回起始位置。"]},
{"id":"1017","n":"弹力带Y字举","en":"band y-raise","p":"肩","e":"弹力带","t":"三角肌","g":"1017-aHDy5O5.gif","s":["双脚分开与肩同宽站立，将弹力带放在大腿前面，手掌朝内。","保持双臂伸直，将其向上举至两侧，与身体形成“Y”形。","在动作的最高点将肩胛骨挤压在一起。","慢慢地将手臂放回起始位置。"]},
{"id":"0023","n":"杠铃交替二头肌弯举","en":"barbell alternate biceps curl","p":"上臂","e":"杠铃","t":"二头肌","g":"0023-Yza7XrQ.gif","s":["站直，双脚分开与肩同宽，每只手握住一个杠铃，手掌朝前。","保持上臂静止，在弯举哑铃时呼气，同时收缩二头肌。","继续举起杠铃，直到二头肌完全收缩并且杠铃与肩部齐平。","挤压二头肌时，保持收缩位置短暂停顿。","吸气，慢慢开始将杠铃放回起始位置。"]},
{"id":"0024","n":"杠铃凳前深蹲","en":"barbell bench front squat","p":"上腿","e":"杠铃","t":"股四头肌","g":"0024-Y7YcmIJ.gif","s":["首先站立，双脚分开与肩同宽，将杠铃放在上胸部，锁骨下方。","正手握住杠铃，保持肘部向上，上臂与地面平行。","弯曲膝盖和臀部，将身体降低到蹲姿，保持背部挺直，挺胸。","在深蹲底部暂停片刻，然后用脚后跟恢复到起始位置。"]},
{"id":"0025","n":"杠铃卧推","en":"barbell bench press","p":"胸","e":"杠铃","t":"胸大肌","g":"0025-EIeI8Vf.gif","s":["平躺在长凳上，双脚平放在地上，背部紧贴长凳。","正手握住杠铃，握距略宽于肩宽。","将杠铃从架子上提起，并将其直接放在胸部上方，双臂完全伸展。","将杠铃慢慢降低到胸部，保持肘部内收。","当杠铃触及胸部时暂停片刻。"]},
{"id":"0026","n":"杠铃凳深蹲","en":"barbell bench squat","p":"上腿","e":"杠铃","t":"股四头肌","g":"0026-W9pFVv1.gif","s":["将杠铃放在深蹲架上，与胸部同高。","背对架子站立，双脚与肩同宽。","弯曲膝盖，将身体降低至蹲姿，保持背部挺直，挺胸。","正手握住杠铃，握距略宽于肩宽。","将杠铃从架子上提起并向后退一步，确保双脚仍与肩同宽。"]},
{"id":"1316","n":"杠铃屈臂上拉","en":"barbell bent arm pullover","p":"背","e":"杠铃","t":"背阔肌","g":"1316-cA9FuWG.gif","s":["平躺在长凳上，头放在一端，双脚放在地板上。","握距与肩同宽，握住杠铃，将手臂伸直至胸部上方。","将杠铃放在脑后，同时保持手臂稍微弯曲。","暂停片刻，然后将杠铃举回起始位置。"]},
{"id":"0027","n":"杠铃俯身划船","en":"barbell bent over row","p":"背","e":"杠铃","t":"上背","g":"0027-eZyBC3j.gif","s":["站立，双脚分开与肩同宽，膝盖稍微弯曲。","臀部向前弯曲，同时保持背部挺直、挺胸。","正手握住杠铃，双手间距略宽于肩宽。","通过收缩肩胛骨并挤压背部肌肉，将杠铃拉向下胸部。","在顶部停顿片刻，然后慢慢将杠铃放回起始位置。"]},
{"id":"2407","n":"杠铃二头肌弯举臂增肌器","en":"barbell biceps curl (with arm blaster)","p":"上臂","e":"杠铃","t":"二头肌","g":"2407-aee2Fcj.gif","s":["站直，双脚分开与肩同宽，反手握住杠铃，手掌朝上。","将上臂靠在手臂冲击波上，保持肘部靠近躯干。","保持上臂静止，呼气并弯举哑铃，同时收缩二头肌。","继续举起杠铃，直到二头肌完全收缩并且杠铃与肩部齐平。","挤压二头肌时，保持收缩位置短暂停顿。"]},
{"id":"0028","n":"杠铃高翻推举","en":"barbell clean and press","p":"上腿","e":"杠铃","t":"股四头肌","g":"0028-SGY8Zui.gif","s":["双脚分开与肩同宽站立，杠铃放在你面前的地板上。","弯曲膝盖并以臀部为铰链降低并用正手握住杠铃，双手分开略宽于肩宽。","通过脚后跟发力，伸展臀部和膝盖，将杠铃抬离地板，使其靠近身体。","当杠铃到达大腿时，爆发性伸展臀部，耸肩，并将杠铃拉向胸部。","当杠铃到达胸部高度时，迅速将其降至肩部水平，肘部向前，手掌朝上。"]},
{"id":"0029","n":"杠铃高翻握前深蹲","en":"barbell clean-grip front squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"0029-qi996YS.gif","s":["首先，双脚分开与肩同宽，将杠铃放在上胸部，肘部向前。","弯曲膝盖并将臀部向后推，降低身体，就像坐在椅子上一样。","下降时保持挺胸、背部挺直，确保膝盖不超过脚趾。","继续降低，直到大腿与地面平行，或者尽可能低。","在底部停顿片刻，然后用脚跟推动站起来，伸展臀部和膝盖。"]},
{"id":"0030","n":"杠铃窄距卧推","en":"barbell close-grip bench press","p":"上臂","e":"杠铃","t":"三头肌","g":"0030-J6Dx1Mu.gif","s":["平躺在长凳上，双脚平放在地上，背部紧贴长凳。","紧紧握住杠铃，握距略窄于肩宽。","松开杠铃并将其缓慢降低至胸部，保持肘部靠近身体。","当杠铃触及胸部时暂停片刻。","将杠铃推回到起始位置，完全伸展双臂。"]},
{"id":"0031","n":"杠铃弯举","en":"barbell curl","p":"上臂","e":"杠铃","t":"二头肌","g":"0031-25GPyDY.gif","s":["站直，双脚分开与肩同宽，反手握住杠铃，手掌朝前。","保持肘部靠近躯干，在弯举哑铃时呼气，同时收缩二头肌。","继续抬高杠铃，直到二头肌完全收缩并且杠铃与肩部齐平。","挤压二头肌时，保持收缩位置短暂停顿。","吸气，慢慢开始将杠铃放回起始位置。"]},
{"id":"0032","n":"杠铃硬拉","en":"barbell deadlift","p":"上腿","e":"杠铃","t":"臀大肌","g":"0032-ila4NZS.gif","s":["双脚分开与肩同宽站立，杠铃放在你面前的地面上。","弯曲膝盖并以臀部为铰链，降低躯干，正手握住杠铃，双手分开略宽于肩宽。","当你通过脚后跟将杠铃抬离地面时，保持背部挺直，胸部抬起，伸展臀部和膝盖。","当你站直时，挤压你的臀部并保持你的核心参与。","弯曲臀部和膝盖，将杠铃放回地面，保持背部挺直。"]},
{"id":"0033","n":"杠铃下斜卧推","en":"barbell decline bench press","p":"胸","e":"杠铃","t":"胸大肌","g":"0033-GrO65fd.gif","s":["躺在倾斜的长凳上，双脚固定，头部低于臀部。","正手握住杠铃，握距略宽于肩宽。","松开杠铃，慢慢将其降低到胸部，保持肘部内收。","在底部停顿片刻，然后将杠铃推回到起始位置。"]},
{"id":"0034","n":"杠铃下斜屈臂上拉","en":"barbell decline bent arm pullover","p":"背","e":"杠铃","t":"背阔肌","g":"0034-hMEptv0.gif","s":["躺在倾斜的长凳上，头部低于臀部，双脚固定。","旋前握住杠铃（手掌背向您），并将手臂伸直至胸部上方。","有控制地将杠铃降低到头后，保持手臂稍微弯曲。","暂停片刻，然后收缩背阔肌，将杠铃抬回到起始位置。"]},
{"id":"0035","n":"杠铃下斜窄距颅推举","en":"barbell decline close grip to skull press","p":"上臂","e":"杠铃","t":"三头肌","g":"0035-LMGXZn8.gif","s":["躺在下斜长凳上，头低于脚，紧紧握住杠铃。","弯曲肘部，将杠铃向前额降低，保持上臂静止。","暂停片刻，然后伸展双臂将杠铃推回到起始位置。"]},
{"id":"1255","n":"杠铃下斜上拉","en":"barbell decline pullover","p":"胸","e":"杠铃","t":"胸大肌","g":"1255-9sgNE2O.gif","s":["躺在倾斜的长凳上，头部低于臀部，双脚固定。","旋前握住杠铃（手掌背向自己），双手之间的距离略宽于肩宽。","将手臂伸至胸部上方，保持肘部轻微弯曲。","以弧线动作将杠铃降低到头后，感受胸部和肩膀的伸展。","暂停片刻，然后反向动作将杠铃恢复到起始位置。"]},

{"id":"1370","n":"杠铃地面小腿举","en":"barbell floor calf raise","p":"小腿","e":"杠铃","t":"小腿三头肌","g":"1370-2IHEa2T.gif","s":["将杠铃放在您面前的地板上。","站立，脚掌放在杠铃边缘，脚跟悬垂。","如果需要，请抓住一个稳定的物体以保持平衡。","尽可能高地抬高脚后跟，用小腿来抬起身体。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},
{"id":"0039","n":"杠铃前胸深蹲","en":"barbell front chest squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"0039-IeTIEqg.gif","s":["首先站立，双脚分开与肩同宽，脚趾稍微向外。","将杠铃放在胸前，双手与肩同宽，肘部向前。","当你将身体降低到蹲姿时，收紧核心并保持挺胸，将臀部向后推并弯曲膝盖。","降低直到大腿与地面平行，或者尽可能降低到您能舒服的高度。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"0041","n":"杠铃前平举","en":"barbell front raise","p":"肩","e":"杠铃","t":"三角肌","g":"0041-b2Uoz54.gif","s":["双脚分开与肩同宽站立，正手握住杠铃于大腿前方。","保持手臂伸直，向前向上举起杠铃，直至达到肩部水平。","在顶部停顿片刻，然后慢慢将杠铃放回起始位置。"]},
{"id":"0040","n":"杠铃前平举上拉","en":"barbell front raise and pullover","p":"胸","e":"杠铃","t":"胸大肌","g":"0040-33AzZeV.gif","s":["双脚分开与肩同宽站立，正手握住杠铃，手掌朝下。","保持双臂伸直，将杠铃举至身前，直至达到肩膀高度。","在顶部停顿片刻，然后慢慢将杠铃放回起始位置。","接下来，将杠铃放低到头后，保持手臂伸直。","在底部停顿片刻，然后将杠铃举回起始位置。"]},
{"id":"0042","n":"杠铃前深蹲","en":"barbell front squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"0042-zG0zs85.gif","s":["首先站立，双脚分开与肩同宽，脚趾稍微向外。","将杠铃放在肩膀前面，将其放在锁骨和肩膀上。","当你将身体降低到蹲姿时，收紧核心并保持挺胸，将臀部向后推并弯曲膝盖。","降低直到大腿与地面平行，或者尽可能降低到您能舒服的高度。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"0043","n":"杠铃全程深蹲","en":"barbell full squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"0043-qXTaZnJ.gif","s":["站立，双脚分开与肩同宽，脚趾稍微向外。","将杠铃放在上背部，将其放在斜方肌或三角肌后束上。","当你开始降低身体时，启动你的核心并保持胸部挺直。","弯曲膝盖和臀部，向后和向下推臀部，就像坐在椅子上一样。","放低身体，直到大腿与地面平行或稍低于地面。"]},
{"id":"1461","n":"杠铃全程深蹲背视","en":"barbell full squat (back pov)","p":"上腿","e":"杠铃","t":"臀大肌","g":"1461-DhMl549.gif","s":["站立，双脚分开与肩同宽，脚趾稍微向外。","将杠铃放在上背部，将其放在斜方肌或三角肌后束上。","当你开始降低身体时，启动你的核心并保持胸部挺直。","弯曲膝盖和臀部，向后和向下推臀部，就像坐在椅子上一样。","降低身体，直到大腿与地面平行或稍低于地面。"]},

{"id":"1545","n":"杠铃全程泽奇深蹲","en":"barbell full zercher squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"1545-vR1vold.gif","s":["站立，双脚分开与肩同宽，脚趾稍微外翻。","将杠铃放在肘部的弯曲处，双手握住杠铃以保持稳定。","当你将臀部向后降低到蹲姿时，启动你的核心并保持胸部抬起。","保持膝盖与脚趾对齐，并将重量放在脚后跟上。","降低直到大腿与地面平行，或者尽可能降低到您能舒服的高度。"]},

{"id":"3562","n":"杠铃臀桥双腿凳","en":"barbell glute bridge two legs on bench (male)","p":"上腿","e":"杠铃","t":"臀大肌","g":"3562-qg2PGl6.gif","s":["首先坐在长凳边缘，上背部靠在长凳上，双脚平放在地面上，与臀部同宽。","将杠铃放在臀部上，用双手牢牢握住它。","锻炼臀肌和核心肌肉，然后用脚后跟将臀部抬离长凳，形成从膝盖到肩膀的一条直线。","在顶部暂停片刻，挤压臀部。","慢慢地将臀部放回起始位置。"]},
{"id":"0044","n":"杠铃早安式","en":"barbell good morning","p":"上腿","e":"杠铃","t":"腘绳肌","g":"0044-XlZ4lAC.gif","s":["首先站立，双脚分开与肩同宽，将杠铃放在上背部。","保持背部挺直，核心肌群参与，臀部向前转动，将臀部向后推，就好像你试图用臀部触碰身后的墙壁一样。","降低躯干直到与地面平行，感觉腿筋被拉伸。","暂停片刻，然后通过挤压臀部并将臀部向前推回到起始位置。"]},

{"id":"0077","n":"杠铃后弓步第二式","en":"barbell rear lunge v. 2","p":"上腿","e":"杠铃","t":"臀大肌","g":"0077-62Nw60O.gif","s":["双脚分开与肩同宽站立，将杠铃放在上背部。","右脚向后退一步，用脚掌着地。","弯曲双膝降低身体，直到左大腿与地面平行。","推动左脚跟返回到起始位置。","换另一条腿重复上述步骤。"]},
{"id":"0079","n":"杠铃反向腕弯举第二式","en":"barbell revers wrist curl v. 2","p":"前臂","e":"杠铃","t":"前臂","g":"0079-qDnGfDb.gif","s":["坐在长凳上，双脚平放在地上，膝盖弯曲。","正手握住杠铃，手掌朝下，双手与肩同宽。","将前臂放在大腿上，让手腕悬在边缘。","保持前臂静止，呼气并尽可能向上弯曲手腕。","保持收缩位置短暂停顿，然后吸气并慢慢将杠铃放回起始位置。"]},
{"id":"2187","n":"杠铃反向窄距卧推","en":"barbell reverse close-grip bench press","p":"上臂","e":"杠铃","t":"三头肌","g":"2187-YqJw82s.gif","s":["平躺在长凳上，双脚平放在地上，背部紧贴长凳。","反握抓住杠铃，双手与肩同宽。","将杠铃从架子上提起，并将其直接放在胸部上方，双臂完全伸展。","慢慢地将杠铃向胸部降低，保持肘部靠近身体。","当杠铃位于胸部正上方时，暂停片刻。"]},
{"id":"0080","n":"杠铃反握弯举","en":"barbell reverse curl","p":"上臂","e":"杠铃","t":"二头肌","g":"0080-xNrS20v.gif","s":["站直，双脚分开与肩同宽，正手握住杠铃，手掌朝下。","保持上臂静止，向上弯举杠铃时呼气，收缩二头肌。","继续举起杠铃，直到二头肌完全收缩并且杠铃与肩部齐平。","挤压二头肌时，保持收缩位置短暂停顿。","吸气，慢慢将杠铃放回起始位置，保持上臂静止。"]},
{"id":"0118","n":"杠铃反向握俯身划船","en":"barbell reverse grip bent over row","p":"背","e":"杠铃","t":"上背","g":"0118-SzX3uzM.gif","s":["站立，双脚分开与肩同宽，膝盖稍微弯曲。","正手握住杠铃，手掌朝下，双手分开略宽于肩宽。","臀部向前弯曲，保持背部挺直，挺胸，直到躯干几乎与地板平行。","将杠铃拉向下胸部，将肩胛骨挤压在一起。","在顶部停顿片刻，然后慢慢将杠铃放回起始位置。"]},
{"id":"1256","n":"杠铃反向握下斜卧推","en":"barbell reverse grip decline bench press","p":"胸","e":"杠铃","t":"胸大肌","g":"1256-DotAgEF.gif","s":["躺在倾斜的长凳上，双脚固定，头部低于臀部。","反握抓住杠铃，握距略宽于肩宽。","松开杠铃，慢慢将其降低到胸部，保持肘部内收。","在底部停顿片刻，然后将杠铃推回到起始位置。"]},
{"id":"1257","n":"杠铃反向握上斜卧推","en":"barbell reverse grip incline bench press","p":"胸","e":"杠铃","t":"胸大肌","g":"1257-DU7I633.gif","s":["设置一个 45 度角的上斜凳。","躺在长凳上，双脚平放在地上。","反握抓住杠铃，双手分开略宽于肩宽。","松开杠铃，慢慢将其降低到胸部，保持肘部内收。","当杠铃触及胸部时暂停片刻。"]},
{"id":"1317","n":"杠铃反向握上斜凳划船","en":"barbell reverse grip incline bench row","p":"背","e":"杠铃","t":"上背","g":"1317-8d8qJQI.gif","s":["设置一个 45 度角的上斜凳。","坐在长凳上，面向靠背，胸部靠在靠背上。","反握（手掌朝下）抓住杠铃，双手距离略宽于肩宽。","保持背部挺直，核心参与。","将杠铃拉向上腹部，将肩胛骨挤压在一起。"]},

{"id":"0101","n":"杠铃速度深蹲","en":"barbell speed squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"0101-euI1BwR.gif","s":["站立，双脚分开与肩同宽，脚趾稍微向外。","将杠铃放在上背部，将其放在斜方肌或三角肌后束上。","收紧核心肌群，保持挺胸，同时向后和向下降低臀部，就像坐在椅子上一样。","降低直到大腿与地面平行，或者尽可能降低到您能舒服的高度。","通过脚跟发力站起来，在顶部挤压臀部。"]},
{"id":"2810","n":"杠铃分腿蹲第二式","en":"barbell split squat v. 2","p":"上腿","e":"杠铃","t":"股四头肌","g":"2810-HBYyX94.gif","s":["首先，双脚分开与肩同宽站立，将杠铃放在上背部。","右脚向前迈出一大步，保持躯干直立。","弯曲膝盖和臀部，降低身体，直到右大腿与地面平行。","暂停片刻，然后推动右脚跟回到起始位置。","左腿向前重复此动作，达到所需的重复次数。"]},
{"id":"0102","n":"杠铃深蹲膝","en":"barbell squat (on knees)","p":"上腿","e":"杠铃","t":"股四头肌","g":"0102-oR7O9LW.gif","s":["首先跪在地上，膝盖分开与臀部同宽，脚趾向前。","将杠铃放在肩膀上，正手握住杠铃，双手分开的距离略大于肩宽。","收紧核心并保持胸部抬起，同时弯曲膝盖慢慢降低身体，保持背部挺直。","继续降低，直到大腿与地面平行，或者尽可能低。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"2798","n":"杠铃深蹲跳上台阶后弓步","en":"barbell squat jump step rear lunge","p":"上腿","e":"杠铃","t":"股四头肌","g":"2798-RYcV1kH.gif","s":["首先，双脚分开与肩同宽站立，将杠铃放在上背部。","弯曲膝盖并将臀部向后推，将身体降低至蹲姿。","向上爆炸，尽可能高地跳离地面。","双脚轻轻落地，然后立即单腿向后退一步，形成反向弓步。","降低身体，直到大腿前侧与地面平行，保持背部挺直。"]},
{"id":"0103","n":"站姿杠铃腹滚轴前推","en":"barbell standing ab rollerout","p":"腰腹","e":"杠铃","t":"腹肌","g":"0103-xnInPfE.gif","s":["站直，双脚分开与肩同宽，双手握住杠铃于大腿前方。","启动你的核心肌群，慢慢地将杠铃向地面滚动，保持背部挺直，手臂伸展。","继续向前滚动杠铃，直到身体完全伸展，双手位于头顶正上方。","暂停片刻，然后慢慢地将杠铃向大腿方向滚动，保持控制并保持核心参与。"]},
{"id":"0104","n":"站姿杠铃背腕弯举","en":"barbell standing back wrist curl","p":"前臂","e":"杠铃","t":"前臂","g":"0104-2qTvJAZ.gif","s":["站直，双脚分开与肩同宽，正手握住杠铃。","将杠铃放在手背上，手掌朝下，手指指向身体。","保持上臂静止，呼气并尽可能向上弯曲手腕。","保持收缩位置短暂停顿，然后吸气并慢慢将杠铃放回起始位置。"]},

{"id":"3212","n":"基础触足","en":"basic toe touch (male)","p":"上腿","e":"自重","t":"臀大肌","g":"3212-BbfB8Gb.gif","s":["双脚分开与肩同宽站立，双臂放在身体两侧。","腰部向前弯曲，保持背部挺直，膝盖稍微弯曲。","双手向下伸向脚趾，尽可能保持双腿伸直。","在底部停顿片刻，然后慢慢回到起始位置。"]},
{"id":"0128","n":"战绳","en":"battling ropes","p":"肩","e":"绳","t":"三角肌","g":"0128-RJa4tCo.gif","s":["站立，双脚分开与肩同宽，膝盖稍微弯曲。","双手握住绳子的一端，手掌相对。","将手臂举至肩膀高度，保持肘部稍微弯曲。","快速抬起和放下每只手臂，开始用绳索产生交替的波浪。","继续所需的持续时间或重复次数。"]},
{"id":"3360","n":"熊式爬行","en":"bear crawl","p":"有氧","e":"自重","t":"心肺","g":"3360-0Yz8WdV.gif","s":["从四肢着地开始，双手直接放在肩膀下方，膝盖直接放在臀部下方。","将膝盖稍微抬离地面，保持背部平坦并收紧核心。","同时向前移动右手和左脚，然后是左手和右脚。","继续向前爬行，手脚交替动作。","在整个练习过程中保持稳定的节奏并保持核心紧张。"]},
{"id":"1259","n":"后头胸拉伸","en":"behind head chest stretch","p":"胸","e":"辅助器械","t":"胸大肌","g":"1259-QoHIhPl.gif","s":["站直，双脚分开与肩同宽。","将手指交叉放在脑后，肘部朝外。","慢慢地将肩胛骨挤压在一起，并将胸部向前推。","保持拉伸 15-30 秒。","松开拉伸并根据需要重复。"]},

{"id":"1645","n":"绳索双臂弯举上斜凳","en":"cable two arm curl on incline bench","p":"上臂","e":"绳索","t":"二头肌","g":"1645-H9y3Dkr.gif","s":["坐在倾斜的长凳上，背部靠在垫子上，双脚平放在地面上。","反手握住电缆手柄，手掌朝上，手臂完全伸展。","保持上臂静止，呼气并将手柄向肩膀弯曲，同时收缩二头肌。","在动作的最高点暂停片刻，挤压你的二头肌。","吸气，慢慢将手柄放回起始位置，充分伸展双臂。"]},
{"id":"1728","n":"绳索双臂三头肌臂后踢","en":"cable two arm tricep kickback","p":"上臂","e":"绳索","t":"三头肌","g":"1728-vvNjDJS.gif","s":["站立，双脚分开与肩同宽，膝盖稍微弯曲。","双手握住电缆手柄，手掌朝内，手臂弯曲成 90 度角。","保持上臂静止，向后伸展前臂，直到手臂完全伸展。","暂停片刻，然后慢慢回到起始位置。"]},
{"id":"0245","n":"绳索反手下拉","en":"cable underhand pulldown","p":"背","e":"绳索","t":"背阔肌","g":"0245-xBYcQHj.gif","s":["调整缆绳机，使下拉杆位于您头部上方的高度。","坐在座椅上，用反手抓住下拉杆，双手分开的距离略大于肩宽。","保持背部挺直并稍微向后倾斜。","将杠铃向下拉向胸部，将肩胛骨挤压在一起。","在动作底部暂停片刻，然后慢慢将杠铃释放回起始位置。"]},
{"id":"1270","n":"绳索上胸交叉","en":"cable upper chest crossovers","p":"胸","e":"绳索","t":"胸大肌","g":"1270-j7XMAyn.gif","s":["将手柄连接到胸部高度的电缆上。","站在绳索机的中央，一只脚稍微在另一只脚前面。","手掌朝下抓住手柄，手臂向两侧伸展。","保持肘部轻微弯曲并启动核心肌群。","将电缆在胸前拉到一起，使它们相互交叉。"]},

{"id":"3016","n":"弯举上","en":"curl-up","p":"腰腹","e":"自重","t":"腹肌","g":"3016-g2oKspu.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3769","n":"屈膝礼深蹲","en":"curtsey squat","p":"上腿","e":"自重","t":"臀大肌","g":"3769-gUjqdei.gif","s":["双脚分开与肩同宽站立。","右脚向斜后方跨出一步，跨过身体，交叉在左腿后面。","弯曲双膝，就像行屈膝礼一样，将身体降低到地面。","保持躯干直立，将体重放在前脚上。","推动前脚返回起始位置。"]},

{"id":"0284","n":"驴式提踵","en":"donkey calf raise","p":"小腿","e":"自重","t":"小腿三头肌","g":"0284-u5ESqzH.gif","s":["将脚趾站立在升高的表面上，例如台阶或木块。","将双手放在稳定的支撑物上，例如墙壁或栏杆，以保持平衡。","尽可能高地抬高脚后跟，将身体重量转移到脚掌上。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},

{"id":"2137","n":"哑铃阿诺德推举","en":"dumbbell arnold press","p":"肩","e":"哑铃","t":"三角肌","g":"2137-Xy4jlWA.gif","s":["坐在有背部支撑的长凳上，双手各握一个哑铃，与肩同高，手掌朝向身体，肘部弯曲。","向上推哑铃，直到手臂完全伸展，手掌朝前。","抬起时旋转手腕，使手掌在动作的最高点朝前。","在最高点暂停片刻，然后慢慢将哑铃放回起始位置。"]},

{"id":"1201","n":"哑铃波比跳","en":"dumbbell burpee","p":"有氧","e":"哑铃","t":"心肺","g":"1201-0JtKWum.gif","s":["从站立位置开始，双脚分开与肩同宽，每只手各拿一个哑铃。","将身体降低至蹲姿，将哑铃放在您面前的地面上。","将双脚踢回到俯卧撑位置，保持身体呈一条直线。","进行俯卧撑，弯曲肘部并将胸部降低到地面。","将脚向后跳向双手，以蹲姿着地。"]},

{"id":"1731","n":"哑铃窄距推举","en":"dumbbell close grip press","p":"上臂","e":"哑铃","t":"三头肌","g":"1731-7jGOBF3.gif","s":["坐在平坦的长凳上，每只手各拿一个哑铃，放在大腿上。","用你的大腿帮助举起哑铃，一次举起一个哑铃，这样你就可以将它们保持在与肩同宽的位置。","一旦与肩同宽，向前旋转手腕，使手掌背向自己。这将是您的起始位置。","当你吸气时，慢慢地将哑铃降低到你的身边，直到它们与你的胸部齐平。","呼气时，用三头肌将哑铃举回到起始位置。确保只使用三头肌，不要使用前臂或二头肌来帮助举起哑铃。"]},

{"id":"0334","n":"哑铃侧平举","en":"dumbbell lateral raise","p":"肩","e":"哑铃","t":"三角肌","g":"0334-DsgkuIt.gif","s":["双脚分开与肩同宽站立，双手各握一个哑铃，手掌朝向身体。","保持背部挺直并启动核心肌群。","将手臂向两侧抬起，直到与地板平行，保持肘部稍微弯曲。","在顶部暂停片刻，然后慢慢将手臂放回起始位置。"]},
{"id":"0335","n":"哑铃侧向前平举","en":"dumbbell lateral to front raise","p":"肩","e":"哑铃","t":"三角肌","g":"0335-xMjBKwn.gif","s":["双脚分开与肩同宽站立，双手各握一个哑铃，手掌朝向身体。","保持背部挺直并启动核心肌群。","将手臂向两侧举起，直到与地面平行，保持肘部稍微弯曲。","在顶部暂停片刻，然后慢慢将手臂放回起始位置。","接下来，将手臂举到身前，直到它们与地面平行，再次保持肘部稍微弯曲。"]},
{"id":"0336","n":"哑铃弓步","en":"dumbbell lunge","p":"上腿","e":"哑铃","t":"臀大肌","g":"0336-RRWFUcw.gif","s":["双脚分开与肩同宽站立，每只手各握一个哑铃。","右脚向前迈出一步，将身体降低至弓步位置。","降低身体时保持背部挺直、挺胸。","推动右脚跟回到起始位置。","左腿重复上述动作。"]},
{"id":"1658","n":"哑铃弓步二头肌弯举","en":"dumbbell lunge with bicep curl","p":"上臂","e":"哑铃","t":"二头肌","g":"1658-Mz6lLcW.gif","s":["双脚分开与肩同宽站立，双手各握一个哑铃，手掌朝前。","右脚向前迈出一步，将身体降低至弓步位置。你的右膝应该弯曲成 90 度角，左膝应该悬停在地面上方。","当你向前弓步时，同时将哑铃向肩膀弯曲，保持肘部靠近身体。","在弓步底部停顿片刻，然后通过右脚跟推动回到起始位置，将哑铃放回身体两侧。","在另一侧重复弓步和二头肌弯举，左脚向前迈出。"]},
{"id":"0337","n":"仰卧哑铃伸展横跨面","en":"dumbbell lying extension (across face)","p":"上臂","e":"哑铃","t":"三头肌","g":"0337-L2V5Nan.gif","s":["平躺在长凳上，双脚平放在地上，头放在长凳的末端。","双手握住哑铃，双臂伸直至胸部上方，手掌相对。","保持上臂静止，将哑铃在头后呈弧形缓慢降低，直到前臂与地面平行。","暂停片刻，然后收缩三头肌，将哑铃带回起始位置。"]},
{"id":"1729","n":"仰卧哑铃交替伸展","en":"dumbbell lying alternate extension","p":"上臂","e":"哑铃","t":"三头肌","g":"1729-NfP83rA.gif","s":["平躺在长凳上，双手各握一个哑铃，手掌相对。","将手臂伸直越过胸部，保持肘部轻微弯曲。","将一个哑铃朝头部方向放下，肘部弯曲，同时保持另一只手臂伸展。","在底部停顿片刻，然后将哑铃举回到起始位置。","用另一只手臂重复上述动作，交替进行所需的重复次数。"]},

{"id":"0863","n":"仰卧哑铃外侧肩旋转","en":"dumbbell lying external shoulder rotation","p":"肩","e":"哑铃","t":"三角肌","g":"0863-bmBf7LN.gif","s":["侧躺在平坦的长凳上，上臂靠在身体两侧，肘部弯曲 90 度。","手中握住哑铃，手掌朝下。","保持上臂靠在身体两侧，尽可能缓慢地向上旋转前臂。","在顶部暂停片刻，然后慢慢将前臂放回起始位置。"]},

{"id":"0408","n":"仰卧哑铃侧单手举","en":"dumbbell side lying one hand raise","p":"肩","e":"哑铃","t":"三角肌","g":"0408-fTlkJop.gif","s":["侧躺，双腿伸直，用手臂支撑头部。","用你的上手握住哑铃，手掌朝下。","保持手臂伸直，将哑铃举至肩膀高度。","在顶部停顿片刻，然后慢慢将哑铃放回起始位置。"]},
{"id":"3664","n":"哑铃侧平板后束飞鸟","en":"dumbbell side plank with rear fly","p":"背","e":"哑铃","t":"上背","g":"3664-X6ytgYZ.gif","s":["首先侧躺，双腿伸展并叠放在一起。","将前臂放在肩膀正下方的地面上，保持肘部弯曲成 90 度角。","用你的上手握住哑铃，手臂垂直向下伸向地面。","收紧核心并将臀部抬离地面，从头部到脚后跟形成一条直线。","在保持侧平板支撑位置的同时，将哑铃向天花板方向举起，将肩胛骨挤压在一起。"]},
{"id":"3548","n":"哑铃单臂过头搬运","en":"dumbbell single arm overhead carry","p":"肩","e":"哑铃","t":"三角肌","g":"3548-mWBtgmb.gif","s":["站直，双脚分开与肩同宽，一手握住哑铃。","将哑铃举过头顶，充分伸展手臂。","向前行走时，启动核心肌群并保持背部挺直，将哑铃举过头顶。","继续步行所需的距离或时间。","交换双手并重复练习。"]},
{"id":"0409","n":"哑铃单腿小腿举","en":"dumbbell single leg calf raise","p":"小腿","e":"哑铃","t":"小腿三头肌","g":"0409-1kB3Wmk.gif","s":["站在台阶或平台的边缘，脚后跟悬垂，脚趾放在台阶上。","一手握住哑铃，另一只手放在墙壁或栏杆上以获得支撑。","尽可能高地抬高脚跟，将身体抬起到脚趾上。","在顶部停顿片刻，然后慢慢将脚跟放回到台阶下方。"]},
{"id":"1757","n":"哑铃单腿硬拉","en":"dumbbell single leg deadlift","p":"上腿","e":"哑铃","t":"臀大肌","g":"1757-gKozT8X.gif","s":["双脚分开与臀部同宽站立，右手握住哑铃。","将体重转移到左腿上，并将右脚稍微抬离地面。","保持背部挺直，臀部向前转动，将哑铃放低至地面。","同时，将右腿伸直在身后，保持左膝轻微弯曲。","降低哑铃，直到躯干和右腿与地面平行。"]},
{"id":"2805","n":"哑铃单腿硬拉踏板支撑","en":"dumbbell single leg deadlift with stepbox support","p":"上腿","e":"哑铃","t":"臀大肌","g":"2805-daBmy1Y.gif","s":["双脚分开与臀部同宽站立，右手握住哑铃。","将左脚放在身后的台阶或高架表面上。","保持背部挺直，核心收紧，髋部向前转动，将哑铃放低至地面。","当你放下哑铃时，同时将左腿抬起到身后，从头到脚跟保持一条直线。","降低哑铃，直到感觉到右腿筋拉伸，然后回到起始位置。"]},
{"id":"0410","n":"哑铃单腿分腿蹲","en":"dumbbell single leg split squat","p":"上腿","e":"哑铃","t":"股四头肌","g":"0410-qx4fgX7.gif","s":["双脚分开与肩同宽站立，每只手各握一个哑铃。","一只脚向前迈出一步，调整双脚的位置，使前脚平放在地面上，后脚抬高在长凳或台阶上。","弯曲前膝盖和臀部，降低身体，保持后膝盖稍微弯曲，后脚跟离开地面。","继续降低，直到大腿前部与地面平行，然后通过前脚跟推回到起始位置。"]},
{"id":"0411","n":"哑铃单腿深蹲","en":"dumbbell single leg squat","p":"上腿","e":"哑铃","t":"臀大肌","g":"0411-H6ybluc.gif","s":["双脚分开与肩同宽站立，每只手各握一个哑铃。","向前伸展一条腿，并在整个练习过程中保持其离开地面。","弯曲站立的腿并降低身体，就像坐回椅子上一样。","保持挺胸、背部挺直。","在底部停顿片刻，然后用脚跟推动回到起始位置。"]},
{"id":"0413","n":"哑铃深蹲","en":"dumbbell squat","p":"上腿","e":"哑铃","t":"臀大肌","g":"0413-HsvHqgf.gif","s":["双脚分开与肩同宽站立，双手各握一个哑铃放在身体两侧。","保持胸部挺直，核心收紧，弯曲膝盖和臀部，降低身体，就像坐回椅子上一样。","继续降低，直到大腿与地面平行，或者尽可能低。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"3560","n":"站姿哑铃交替锤式弯举推举","en":"dumbbell standing alternate hammer curl and press","p":"上臂","e":"哑铃","t":"二头肌","g":"3560-LeaZOIz.gif","s":["站直，双手各持一个哑铃，手掌朝向身体。","保持肘部靠近躯干，背部挺直。","呼气，将右手的哑铃向肩膀弯曲，保持上臂静止。","继续举起哑铃，直到二头肌完全收缩并且哑铃与肩部齐平。","吸气，慢慢将哑铃放回起始位置。"]},

{"id":"1342","n":"仰卧瑜伽球侧背阔肌拉伸","en":"exercise ball lying side lat stretch","p":"背","e":"瑜伽球","t":"背阔肌","g":"1342-rTbyBYV.gif","s":["侧躺，双腿伸展，头部由稳定球支撑。","将上臂放在球上以保持稳定性。","将上臂举过头顶，让躯干稍微旋转。","感受身体一侧背阔肌的拉伸。","保持拉伸 20-30 秒，然后换边重复。"]},
{"id":"1382","n":"瑜伽球墙小腿举","en":"exercise ball on the wall calf raise","p":"小腿","e":"哑铃","t":"小腿三头肌","g":"1382-xo6sENf.gif","s":["背靠墙站立，将健身球放在下背部和墙壁之间。","双脚分开与肩同宽，脚趾指向前方。","每只手握住一个哑铃，双臂伸向身体两侧。","将脚跟抬离地面，将身体重量转移到脚掌上。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},

{"id":"1416","n":"俯卧瑜伽球单腿下身体旋转","en":"exercise ball one leg prone lower body rotation","p":"上腿","e":"瑜伽球","t":"臀大肌","g":"1416-M72BExt.gif","s":["面朝下躺在稳定球上，臀部放在球上，双腿伸直在身后。","将双手放在身前的地面上以获得支撑。","调动你的臀肌和核心肌肉来稳定你的身体。","慢慢地将一条腿抬离地面，保持笔直并与地板平行。","向外旋转腿部，远离身体，同时保持臀部和上半身稳定。"]},

{"id":"2133","n":"农夫行走","en":"farmers walk","p":"上腿","e":"哑铃","t":"股四头肌","g":"2133-qPEzJjA.gif","s":["站直，双手各握一个哑铃，手掌朝向身体两侧。","保持背部挺直，肩膀向后。","向前迈出小步，控制住，保持直立姿势。","继续步行所需的距离或时间。","最后，停止行走并小心地将哑铃降低到身体两侧。"]},
{"id":"0455","n":"手指弯举","en":"finger curls","p":"前臂","e":"杠铃","t":"前臂","g":"0455-awG04cF.gif","s":["坐在长凳上，双脚平放在地面上，反手握住杠铃，手掌朝上。","将前臂放在大腿上，让手腕悬在边缘。","慢慢地将手指向手掌弯曲，紧紧挤压杠铃。","保持收缩一会儿，然后慢慢松开手指回到起始位置。"]},
{"id":"3303","n":"旗式","en":"flag","p":"腰腹","e":"自重","t":"腹肌","g":"3303-pQ0Mx1Z.gif","s":["首先，双手握住一根垂直杆，手掌相对，双臂完全伸展。","启动你的核心并将双腿抬离地面，保持伸直。","利用核心和上半身的力量，抬起双腿，直到它们与地面平行。","尽可能长时间地保持这个姿势，保持身体线条笔直。","慢慢地将双腿放回起始位置。"]},
{"id":"0456","n":"屈曲腿仰卧起坐屈膝","en":"flexion leg sit up (bent knee)","p":"腰腹","e":"自重","t":"腹肌","g":"0456-AR0ig3o.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","同时，将双腿抬离地面，弯曲膝盖并将其拉向胸部。","在顶部停顿片刻，然后慢慢降低上半身和双腿回到起始位置。"]},
{"id":"0457","n":"屈曲腿仰卧起坐直臂","en":"flexion leg sit up (straight arm)","p":"腰腹","e":"自重","t":"腹肌","g":"0457-KZn52RC.gif","s":["平躺，双腿伸直，双臂伸直至头顶上方。","收紧腹肌，将上半身抬离地面，同时将双腿抬向胸部。","抬起上半身和腿部时，将双手伸向脚趾。","在顶部停顿片刻，然后慢慢降低上半身和双腿回到起始位置。"]},
{"id":"0458","n":"地面飞鸟杠铃","en":"floor fly (with barbell)","p":"胸","e":"杠铃","t":"胸大肌","g":"0458-neonEDL.gif","s":["仰卧在地板上，膝盖弯曲，双脚平放在地面上。","正手握住杠铃，双臂伸直越过胸部。","慢慢地将杠铃向两侧放低，保持肘部轻微弯曲。","降低杠铃，直到手臂与地板平行，感觉胸部有拉伸感。","暂停片刻，然后挤压胸部肌肉，使杠铃回到起始位置。"]},
{"id":"0459","n":"打水踢","en":"flutter kicks","p":"上腿","e":"自重","t":"臀大肌","g":"0459-UVo2Qs2.gif","s":["平躺，双腿伸展，双手放在身体两侧。","收紧核心肌群并将双腿抬离地面约 6 英寸。","保持双腿伸直，交替将一条腿抬得比另一条腿稍高。","继续这个颤动动作达到所需的重复次数。"]},
{"id":"1472","n":"向前跳","en":"forward jump","p":"上腿","e":"自重","t":"股四头肌","g":"1472-uZKq7lo.gif","s":["双脚分开与肩同宽站立。","弯曲膝盖并将身体降低至蹲姿。","向后摆动手臂以获得动力。","爆发性地向前跳跃，伸展臀部、膝盖和脚踝。","脚掌轻轻落地，然后立即进入下一个跳跃。"]},
{"id":"3470","n":"向前弓步","en":"forward lunge (male)","p":"上腿","e":"自重","t":"臀大肌","g":"3470-kMzUs9Y.gif","s":["站立，双脚分开与臀部同宽，双手放在臀部。","右脚向前迈出一大步，将身体降低到弓步位置。","将右膝盖弯曲约 90 度，保持膝盖与脚踝对齐。","用右脚推出并返回到起始位置。","用左腿重复上述动作，交替进行所需的重复次数。"]},
{"id":"3194","n":"弗兰肯斯坦深蹲","en":"frankenstein squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"3194-bdWcbaU.gif","s":["双脚分开与肩同宽站立，双臂伸直将杠铃举在身体前方。","保持背部挺直，弯曲膝盖和臀部，降低身体，就像坐回椅子上一样。","继续降低，直到大腿与地面平行，或者尽可能低。","暂停片刻，然后用力推动脚后跟，回到起始位置。"]},
{"id":"2429","n":"蛙式卷腹","en":"frog crunch","p":"腰腹","e":"自重","t":"腹肌","g":"2429-FFRP97T.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，将上半身抬离地面，向前卷曲直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3301","n":"蛙式俄挺","en":"frog planche","p":"腰腹","e":"自重","t":"腹肌","g":"3301-rQhGcin.gif","s":["从俯卧撑位置开始，双手与肩同宽，双脚并拢。","弯曲肘部，将身体放低至地面，保持背部挺直。","当你降低身体时，将双脚抬离地面，并将膝盖靠近胸部。","保持这个姿势几秒钟，然后向后伸展双腿，并将自己推回到起始位置。"]},
{"id":"3296","n":"前水平","en":"front lever","p":"腰腹","e":"自重","t":"腹肌","g":"3296-PkCN2lv.gif","s":["首先，用正手握法悬挂在引体向上杆上，双手与肩同宽。","启动你的核心并将肩胛骨向下拉和向后拉。","弯曲膝盖并将其向胸部靠拢。","同时，抬起双腿并将其伸直在您面前，保持身体与地面平行。","尽可能长时间地保持此位置，以达到完全前杆位置。"]},
{"id":"3295","n":"前水平","en":"front lever reps","p":"背","e":"自重","t":"上背","g":"3295-hbY9wqG.gif","s":["正手握住引体向上杆，手掌背向自己。","启动你的核心并将肩胛骨向下拉和向后拉。","保持身体挺直，抬起双腿直至与地面平行。","尽可能长时间地保持这个姿势，目标是 10-20 秒。","慢慢地将双腿放回起始位置。"]},
{"id":"0464","n":"前平板支撑转体","en":"front plank with twist","p":"腰腹","e":"自重","t":"腹肌","g":"0464-CosupLu.gif","s":["从高平板支撑位置开始，双手直接放在肩膀下方，身体从头到脚成一条直线。","调动你的核心和臀部以保持稳定的位置。","将躯干向右旋转，抬起右臂并向天花板延伸。","扭转时保持臀部和腿部稳定。","保持片刻，然后回到起始位置。"]},
{"id":"3315","n":"全程马耳他","en":"full maltese","p":"腰腹","e":"自重","t":"腹肌","g":"3315-YRaCa5Y.gif","s":["首先站立，双脚分开与肩同宽，双臂伸直至两侧。","慢慢向前倾斜，保持手臂伸直，直到上半身与地面平行。","启动你的核心并保持这个姿势几秒钟。","通过双脚推动并站起来，回到起始位置。"]},
{"id":"3299","n":"全程俄挺","en":"full planche","p":"腰腹","e":"自重","t":"腹肌","g":"3299-YZ4961r.gif","s":["从俯卧撑位置开始，双手与肩同宽，手指指向前方。","启动你的核心并缓慢地将你的重心向前移动，将你的脚抬离地面。","继续向前移动体重，直到身体与地面平行，并用双手保持平衡。","尽可能长时间地保持这个姿势，保持身体线条笔直。","慢慢地将双脚放回地面，然后回到起始位置。"]},
{"id":"3327","n":"全程俄挺俯卧撑","en":"full planche push-up","p":"胸","e":"自重","t":"胸大肌","g":"3327-gw9PqGk.gif","s":["从俯卧撑位置开始，双手分开略宽于肩宽。","收紧核心肌群，将身体放低至地面，保持肘部靠近身体两侧。","当你降低身体高度时，身体向前倾斜，双脚离开地面，用双手保持平衡。","继续降低身体，直到胸部略高于地面。","用手推动并伸展双臂，将身体抬回到起始位置。"]},
{"id":"0466","n":"吉龙达胸骨下巴","en":"gironda sternum chin","p":"背","e":"自重","t":"背阔肌","g":"0466-IL0JUxR.gif","s":["面向高杠站立，双脚分开与肩同宽。","向上伸手，正手握住杠铃，握距略宽于肩宽。","悬挂在杠上，双臂完全伸展，身体伸直。","用你的背阔肌和二头肌将你的胸部拉向杠铃杆，以胸骨为主导。","在最高点暂停片刻，然后慢慢降低回到起始位置。"]},
{"id":"3561","n":"臀桥高抬腿","en":"glute bridge march","p":"上腿","e":"自重","t":"臀大肌","g":"3561-GibBPPg.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","收紧臀部并将臀部抬离地面，从膝盖到肩膀形成一条直线。","在保持臀部抬起的同时，将一只脚抬离地面，并将膝盖靠近胸部。","将脚放回地面，然后用另一条腿重复该动作。","继续交替双腿进行行进动作，同时保持桥式姿势。"]},
{"id":"3523","n":"臀桥双腿凳","en":"glute bridge two legs on bench (male)","p":"上腿","e":"自重","t":"臀大肌","g":"3523-aWedzZX.gif","s":["坐在长凳边缘，背靠着长凳，双脚平放在地上。","将双手放在臀部旁边的长凳上以获得支撑。","收紧臀肌和腿筋，然后将臀部抬离长凳，直到身体从膝盖到肩膀形成一条直线。","在顶部暂停片刻，然后慢慢将臀部放回起始位置。"]},
{"id":"3193","n":"臀腘绳肌举","en":"glute-ham raise","p":"上腿","e":"自重","t":"腘绳肌","g":"3193-Vvwjz6N.gif","s":["调整臀肌提升机以适合您的身体。","将自己面朝下放在机器上，固定脚踝。","将双手放在胸前或交叉在胸前。","调动腿筋和臀肌，将上半身抬向天花板。","继续抬起，直到身体从头部到脚后跟成一条直线。"]},
{"id":"0467","n":"猩猩下巴","en":"gorilla chin","p":"腰腹","e":"自重","t":"腹肌","g":"0467-bmwlYvD.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","正手握住引体向上杆，握距略宽于肩宽。","悬挂在杠上，双臂完全伸展，手掌背向自己。","收紧核心肌群，将身体拉向杠铃杆，将下巴置于杠铃上方。","在顶部停顿片刻，然后慢慢将身体放回起始位置。"]},
{"id":"0469","n":"腹股沟卷腹","en":"groin crunch","p":"腰腹","e":"自重","t":"腹肌","g":"0469-mWppALS.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，将双腿抬离地面，将膝盖靠近胸部。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"1383","n":"哈克小腿举","en":"hack calf raise","p":"小腿","e":"雪橇机","t":"小腿三头肌","g":"1383-2ORFMoR.gif","s":["将雪橇机调整至舒适的重量。","站在雪橇机上，脚趾放在平台上，脚后跟悬空。","握住手柄以保持稳定性。","通过推动脚掌将脚后跟尽可能抬高。","在顶部停顿片刻，然后慢慢降低脚后跟回到起始位置。"]},
{"id":"1384","n":"哈克单腿小腿举","en":"hack one leg calf raise","p":"小腿","e":"雪橇机","t":"小腿三头肌","g":"1384-AxFoqAD.gif","s":["将雪橇机调整到合适的重量。","一脚站在雪橇机上，另一只脚离开地面。","握住手柄以保持稳定性。","尽可能高地抬高脚跟，用脚掌抬起身体。","在顶部暂停片刻，然后慢慢将脚跟放回起始位置。"]},
{"id":"3221","n":"半膝屈","en":"half knee bends (male)","p":"有氧","e":"自重","t":"心肺","g":"3221-ia6kIIl.gif","s":["双脚分开与肩同宽站立。","弯曲膝盖并降低身体，就像坐回椅子上一样。","保持挺胸，将体重放在脚后跟上。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"3202","n":"半仰卧起坐","en":"half sit-up (male)","p":"腰腹","e":"自重","t":"腹肌","g":"3202-iQ241UP.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"1511","n":"腘绳肌拉伸","en":"hamstring stretch","p":"上腿","e":"自重","t":"腘绳肌","g":"1511-99rWm7w.gif","s":["双脚分开与肩同宽站立。","右脚向前迈出一步，将重心转移到右腿上。","保持背部挺直，臀部慢慢向前弯曲，双手伸向右脚。","保持伸展动作 20-30 秒，然后回到起始位置。","在另一侧重复。"]},
{"id":"2139","n":"双手单车","en":"hands bike","p":"胸","e":"上肢功率车","t":"胸大肌","g":"2139-pAIWRGu.gif","s":["将座椅高度和车把位置调整至舒适的水平。","坐在测力计上，背部挺直，双脚放在踏板上。","双手抓住手柄，并将手臂呈 90 度角。","开始用手踩踏板，以受控的动作推拉手柄。","继续踩踏所需的持续时间或重复次数。"]},
{"id":"3218","n":"双手交叉握画圈触足","en":"hands clasped circular toe touch (male)","p":"上腿","e":"自重","t":"臀大肌","g":"3218-B5xca8s.gif","s":["双脚分开与肩同宽站立，双手合十放在胸前。","稍微弯曲膝盖，髋部向前转动，保持背部挺直。","将双手向脚趾方向以打圈的方式降低，尽量伸得尽可能远，但不要用力。","在底部停顿片刻，然后慢慢回到起始位置。"]},
{"id":"3215","n":"双手反向交叉握画圈触足","en":"hands reversed clasped circular toe touch (male)","p":"上腿","e":"自重","t":"臀大肌","g":"3215-yq3GAJX.gif","s":["双脚分开与肩同宽站立，双臂向两侧伸展。","腰部向前弯曲，保持背部挺直，膝盖稍微弯曲。","双手向下伸，并在腿后将它们握在一起。","慢慢地将双手举过头顶，做圆周运动，保持双腿伸直。","继续圆周运动，直到双手触及脚趾。"]},
{"id":"3302","n":"手倒立","en":"handstand","p":"上臂","e":"自重","t":"三头肌","g":"3302-XooAdhl.gif","s":["找到一个有足够空间的空地来进行倒立。","将双手放在地上，与肩同宽，手指指向前方。","将双腿向上踢向墙壁，用核心和肩膀保持平衡。","处于倒立位置后，用三头肌来支撑体重。","只要能保持平衡，就保持倒立。"]},
{"id":"0471","n":"手倒立俯卧撑","en":"handstand push-up","p":"上臂","e":"自重","t":"三头肌","g":"0471-rQxwMxO.gif","s":["找到一堵墙，背对墙，站在几英尺远的地方。","将双手放在地面上，与肩同宽，然后将脚踢到墙上，形成倒立姿势。","弯曲肘部，将头低向地面，保持身体呈一条直线。","用手推动并伸展双臂以返回到起始位置。"]},
{"id":"1764","n":"悬垂腿抬髋","en":"hanging leg hip raise","p":"腰腹","e":"自重","t":"腹肌","g":"1764-VEcJRo2.gif","s":["悬挂在引体向上杆上，双臂完全伸展，手掌背向自己。","弯曲臀部和膝盖，收紧核心并抬起双腿，直到大腿与地面平行。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"0472","n":"悬垂举腿","en":"hanging leg raise","p":"腰腹","e":"自重","t":"腹肌","g":"0472-I3tsCnC.gif","s":["悬挂在引体向上杆上，双臂完全伸展，手掌背向自己。","启动你的核心并将双腿抬起到你面前，保持伸直。","继续抬起，直到双腿与地面平行或达到您可以舒适地达到的高度。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"1761","n":"悬垂腹斜肌抬膝","en":"hanging oblique knee raise","p":"腰腹","e":"自重","t":"腹肌","g":"1761-BaE7O6U.gif","s":["悬挂在引体向上杆上，双臂完全伸展，手掌背向自己。","收紧核心并将膝盖抬向胸部，同时将躯干扭转到一侧。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。","在另一侧重复上述步骤，向相反方向扭转躯干。","继续交替进行所需的重复次数。"]},

{"id":"0517","n":"壶铃进阶风车式","en":"kettlebell advanced windmill","p":"腰腹","e":"壶铃","t":"腹肌","g":"0517-Kal9cQQ.gif","s":["站立，双脚分开比肩宽，脚趾稍微向外。","右手握住壶铃，手臂伸过头顶，手掌朝前。","将左脚稍微向右旋转，并将重量转移到左腿上。","弯曲左膝并铰接在臀部，将躯干向左侧降低。","保持右臂伸过头顶，眼睛盯着壶铃。"]},
{"id":"0518","n":"壶铃交替悬垂高翻","en":"kettlebell alternating hang clean","p":"前臂","e":"壶铃","t":"前臂","g":"0518-I4tibZG.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，正手握住。","稍微弯曲膝盖，臀部向前转动，保持背部挺直，挺胸。","让壶铃悬挂在身体前方，双臂完全伸展。","以一种流畅的动作，爆发性地伸展臀部，耸肩，并将壶铃拉向肩膀。","当壶铃到达肩膀高度时，旋转手腕并将壶铃抓住在架子位置，手掌朝内，壶铃放在前臂外侧。"]},
{"id":"0520","n":"壶铃交替推举","en":"kettlebell alternating press","p":"肩","e":"壶铃","t":"三角肌","g":"0520-5KLbZWx.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高。","将一只壶铃按过头顶，完全伸展手臂。","将壶铃降低至肩膀高度。","用另一只手臂重复上述步骤。","继续交替手臂进行所需的重复次数。"]},
{"id":"0519","n":"壶铃交替推举地面","en":"kettlebell alternating press on floor","p":"胸","e":"壶铃","t":"胸大肌","g":"0519-7w6i0vE.gif","s":["首先仰卧在地板上，膝盖弯曲，双脚平放在地面上。","每只手握住一个壶铃，手掌朝向脚部，手臂伸直向天花板。","将一个壶铃向肩膀方向降低，同时保持另一个壶铃向上伸直。","将降低的壶铃按回到起始位置，同时将另一个壶铃向肩膀方向降低。","继续用每个壶铃交替进行推举动作，达到所需的重复次数。"]},
{"id":"0521","n":"壶铃交替叛徒划船","en":"kettlebell alternating renegade row","p":"背","e":"壶铃","t":"上背","g":"0521-b9kqlBy.gif","s":["从高平板支撑位置开始，双手握住壶铃，双脚分开与臀部同宽。","收紧核心肌群，保持身体从头到脚跟呈一条直线。","将一个壶铃向上拉向胸部，保持肘部靠近身体。","将壶铃放回起始位置，然后用另一只手臂重复该动作。","继续交替手臂进行所需的重复次数。"]},
{"id":"0522","n":"壶铃交替划船","en":"kettlebell alternating row","p":"背","e":"壶铃","t":"上背","g":"0522-Ca76jUE.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲，双手各握一个壶铃，手掌朝向身体。","臀部向前弯曲，保持背部挺直，核心肌群参与。","将一个壶铃向上拉向胸部，保持肘部靠近身体并将肩胛骨挤压在一起。","将壶铃放回起始位置，然后用另一只手臂重复该动作。","继续交替手臂进行所需的重复次数。"]},
{"id":"0523","n":"壶铃阿诺德推举","en":"kettlebell arnold press","p":"肩","e":"壶铃","t":"三角肌","g":"0523-UM8mgyG.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高，手掌朝向自己。","启动你的核心并将壶铃压过头顶，在伸展手臂时旋转手掌以面向前方。","在动作的最高点暂停，然后慢慢将壶铃放回起始位置。"]},
{"id":"0524","n":"壶铃屈推举","en":"kettlebell bent press","p":"腰腹","e":"壶铃","t":"腹肌","g":"0524-kjE55n5.gif","s":["双脚分开与肩同宽站立，右手握住壶铃。","稍微弯曲膝盖，用右臂将壶铃压过头顶，保持肘部锁定。","将躯干向左旋转，将重量转移到左脚上。","弯曲左膝，将躯干压向地面，保持右臂伸过头顶。","当你下降时，眼睛盯着壶铃，胸部抬起。"]},
{"id":"0525","n":"悬垂壶铃底部向上高翻","en":"kettlebell bottoms up clean from the hang position","p":"上臂","e":"壶铃","t":"二头肌","g":"0525-4KJEpzb.gif","s":["双脚分开与肩同宽站立，一只手握住壶铃，正手握住。","稍微弯曲膝盖，臀部向前转动，保持背部挺直，挺胸。","让壶铃垂在双腿之间，手臂完全伸展。","以一种流畅的动作，爆发性地伸展你的臀部和膝盖，同时将壶铃拉向你的肩膀。","当壶铃到达肩膀高度时，旋转手腕，使壶铃底部朝上。"]},
{"id":"0526","n":"壶铃双交替悬垂高翻","en":"kettlebell double alternating hang clean","p":"上臂","e":"壶铃","t":"二头肌","g":"0526-a4F9Oyc.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，正手握住。","稍微弯曲膝盖，臀部向前转动，保持背部挺直，挺胸。","让壶铃垂直悬挂在身体前方。","以一种流畅的动作，爆发性地伸展臀部和膝盖，同时耸肩。","当壶铃上升时，将其拉向肩膀，保持肘部高且向两侧伸展。"]},
{"id":"0527","n":"壶铃双挺举","en":"kettlebell double jerk","p":"肩","e":"壶铃","t":"三角肌","g":"0527-tznL2Ad.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高。","稍微弯曲膝盖并启动核心。","将壶铃压过头顶，充分伸展手臂。","弯曲膝盖并快速半蹲。","爆发性地伸展臀部和膝盖，将壶铃举过头顶。"]},
{"id":"0528","n":"壶铃双推推举","en":"kettlebell double push press","p":"肩","e":"壶铃","t":"三角肌","g":"0528-I4KkPdl.gif","s":["首先，双脚分开与肩同宽，每只手握住一个壶铃，与肩同高。","稍微弯曲膝盖并启动核心。","通过爆发性伸展臀部、膝盖和脚踝来开始运动，将壶铃举过头顶。","当壶铃到达顶部时，将它们完全压过头顶，锁定手臂。","弯曲肘部并将壶铃放回至肩膀高度，将壶铃放回起始位置。"]},
{"id":"0529","n":"壶铃双抓举","en":"kettlebell double snatch","p":"肩","e":"壶铃","t":"三角肌","g":"0529-M74kdvm.gif","s":["双脚分开与肩同宽站立，每只手各握一个壶铃，放在大腿前面，与手臂保持一定距离。","稍微弯曲膝盖，臀部向前转动，保持背部平坦，挺胸。","以一种爆发力动作，伸展臀部、膝盖和脚踝，同时将壶铃拉向肩膀。","当壶铃达到肩膀水平时，旋转手腕并将壶铃击过头顶，充分伸展手臂。","将壶铃放回起始位置，然后重复所需的重复次数。"]},
{"id":"0530","n":"壶铃双风车式","en":"kettlebell double windmill","p":"腰腹","e":"壶铃","t":"腹肌","g":"0530-OaE7CpD.gif","s":["双脚分开与肩同宽站立，右手握住壶铃。","将右臂伸过头顶，眼睛盯着壶铃。","左脚向左旋转 45 度，右脚向右旋转 90 度。","腰部向左弯曲，保持右臂伸过头顶。","将壶铃向地面降低，伸向左脚。"]},
{"id":"0531","n":"壶铃全程单臂推举地面","en":"kettlebell extended range one arm press on floor","p":"胸","e":"壶铃","t":"胸大肌","g":"0531-rseLfH3.gif","s":["首先仰卧在地板上，膝盖弯曲，双脚平放在地面上。","一只手握住壶铃，手掌朝向脚部。","将手臂伸直向上伸向天花板，保持肘部锁定且手腕伸直。","慢慢地将壶铃放回起始位置，在整个运动过程中保持控制。"]},
{"id":"0532","n":"壶铃八字","en":"kettlebell figure 8","p":"腰腹","e":"壶铃","t":"腹肌","g":"0532-L4ay0PW.gif","s":["双脚分开与肩同宽站立，一只手握住壶铃。","稍微弯曲膝盖，髋部向前转动，保持背部挺直。","将壶铃放在双腿之间，当壶铃到达双腿后部时交换双手。","当壶铃向前移动时，将其传递到两腿之间的另一只手。","继续以 8 字形动作将壶铃传递到双腿之间。"]},
{"id":"0533","n":"壶铃前深蹲","en":"kettlebell front squat","p":"上腿","e":"壶铃","t":"臀大肌","g":"0533-DB0n8AG.gif","s":["站立，双脚分开与肩同宽，脚趾稍微向外。","双手将壶铃放在胸前，靠近身体。","收紧核心并保持挺胸，同时降低臀部和向后倾斜，就像坐在椅子上一样。","降低直到大腿与地面平行，或者尽可能降低到您能舒服的高度。","通过脚跟发力站起来，在顶部挤压臀部。"]},
{"id":"0534","n":"壶铃高脚杯深蹲","en":"kettlebell goblet squat","p":"上腿","e":"壶铃","t":"臀大肌","g":"0534-ZA8b5hc.gif","s":["双脚分开与肩同宽站立，双手握住壶铃靠近胸部。","保持胸部挺直，核心收紧，弯曲膝盖和臀部，将身体降低至蹲姿。","继续降低，直到大腿与地面平行，或者尽可能低。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"0535","n":"壶铃悬垂高翻","en":"kettlebell hang clean","p":"上腿","e":"壶铃","t":"腘绳肌","g":"0535-LHWF7us.gif","s":["双脚分开与肩同宽站立，将壶铃放在大腿前面。","稍微弯曲膝盖，髋部向前转动，保持背部挺直。","将壶铃放低至地面，使其在双腿之间摆动。","快速伸展臀部和膝盖，利用动量将壶铃摆动到肩膀高度。","当壶铃达到肩膀高度时，旋转手腕，将壶铃置于架子位置，肘部内收，壶铃靠在前臂上。"]},
{"id":"0536","n":"壶铃弓步传递贯穿","en":"kettlebell lunge pass through","p":"上腿","e":"壶铃","t":"臀大肌","g":"0536-WKMQzCD.gif","s":["双脚分开与肩同宽站立，双手握住壶铃放在胸前。","右脚向前迈出一步，将身体降低至弓步位置。","当你向前弓步时，将壶铃传递到右大腿下方，然后将其转移到左手。","用右脚蹬地回到起始位置，同时将壶铃传回右手。","在另一侧重复弓步，将壶铃传递到左大腿下方。"]},
{"id":"0537","n":"壶铃单臂高翻挺举","en":"kettlebell one arm clean and jerk","p":"肩","e":"壶铃","t":"三角肌","g":"0537-vzAxBtt.gif","s":["双脚分开与肩同宽站立，一只手握住壶铃，正手握住。","稍微弯曲膝盖并以臀部为铰链，将壶铃放在两腿之间。","爆发性地伸展你的臀部、膝盖和脚踝，利用动量将壶铃摆动到肩膀的高度。","当壶铃到达肩膀高度时，旋转手腕并向上挥拳，将手臂锁定在头顶上方。","将壶铃放回起始位置，然后重复所需的重复次数。"]},

{"id":"0547","n":"壶铃跷跷板推举","en":"kettlebell seesaw press","p":"肩","e":"壶铃","t":"三角肌","g":"0547-UDm6cGl.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高。","将一个壶铃压过头顶，同时将另一个壶铃保持在肩膀高度。","将按下的壶铃降低至肩膀高度，同时将另一个壶铃压过头顶。","继续交替按压动作，形成跷跷板状的运动。"]},
{"id":"0548","n":"壶铃相扑高翻拉","en":"kettlebell sumo high pull","p":"背","e":"壶铃","t":"斜方肌","g":"0548-8ARQ9Hw.gif","s":["站立，双脚分开比肩宽，脚趾朝外。","双手握住壶铃放在身体前方，手臂向下伸展。","弯曲膝盖，降低臀部至下蹲位置，保持背部挺直。","脚后跟发力，爆发性伸展臀部和膝盖，将壶铃拉向下巴。","当你向上拉壶铃时，保持肘部高且宽，并将肩胛骨挤压在一起。"]},
{"id":"0549","n":"壶铃摆荡","en":"kettlebell swing","p":"上腿","e":"壶铃","t":"臀大肌","g":"0549-UHJlbu3.gif","s":["双脚分开与肩同宽站立，脚趾稍微向外。","双手握住壶铃放在身体前方，双臂伸展。","稍微弯曲膝盖并铰接臀部，将臀部向后推。","将壶铃在两腿之间向后摆动，保持手臂伸直并保持背部平坦。","利用臀部产生的动量，向前推动臀部并将壶铃摆动到肩膀高度。"]},
{"id":"0550","n":"壶铃推力深蹲","en":"kettlebell thruster","p":"肩","e":"壶铃","t":"三角肌","g":"0550-yWxMvB5.gif","s":["首先，双脚分开与肩同宽站立，双手将壶铃放在胸前，手掌相对。","弯曲膝盖并将臀部向后推，保持挺胸、背部挺直，进入蹲姿。","当你到达深蹲底部时，爆发性地通过脚后跟站起来，同时将壶铃压过头顶。","在动作的最高点锁定你的手臂，完全伸展你的肘部。","通过反转动作，弯曲肘部并将重量放回胸部，将壶铃放回起始位置。"]},
{"id":"0551","n":"壶铃土耳其起立深蹲","en":"kettlebell turkish get up (squat style)","p":"上腿","e":"壶铃","t":"臀大肌","g":"0551-Ha7SZ3y.gif","s":["首先仰卧，双腿伸展，右手握住壶铃，手臂完全伸展到肩膀上方。","弯曲右膝，将右脚平放在地面上，保持左腿伸展。","压右脚，将臀部抬离地面，进入桥位。","将左腿滑到身体下方，弯曲左膝并将左脚平放在地面上。","将躯干向左旋转，将左手放在地面上以获得支撑。"]},
{"id":"0552","n":"壶铃双臂高翻","en":"kettlebell two arm clean","p":"肩","e":"壶铃","t":"三角肌","g":"0552-7Ba7bQ2.gif","s":["双脚分开与肩同宽站立，双手握住壶铃放在大腿前，手掌朝向自己。","稍微弯曲膝盖并铰接臀部，将壶铃降低到地面。","爆发性伸展臀部和膝盖，利用动量将壶铃拉向肩膀。","当壶铃达到肩膀高度时，旋转手腕，将壶铃放在架子上，肘部内收，壶铃放在前臂背面。","将壶铃放回起始位置，然后重复所需的重复次数。"]},
{"id":"0553","n":"壶铃双臂军事推举","en":"kettlebell two arm military press","p":"肩","e":"壶铃","t":"三角肌","g":"0553-blBXysN.gif","s":["双脚分开与肩同宽站立，双手各握一个壶铃，与肩同高，手掌朝前。","启动你的核心并将壶铃压过头顶，充分伸展你的手臂。","在顶部暂停片刻，然后慢慢将壶铃放回起始位置。"]},
{"id":"1345","n":"壶铃双臂划船","en":"kettlebell two arm row","p":"背","e":"壶铃","t":"上背","g":"1345-wf24o8S.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲，双手各握一个壶铃，手掌朝向身体。","臀部向前弯曲，保持背部挺直，核心肌群参与。","将壶铃拉向胸部，将肩胛骨挤压在一起。","在顶部暂停片刻，然后慢慢将壶铃放回起始位置。"]},
{"id":"0554","n":"壶铃风车式","en":"kettlebell windmill","p":"腰腹","e":"壶铃","t":"腹肌","g":"0554-9Tkqa9O.gif","s":["双脚分开与肩同宽站立，右手握住壶铃举过头顶。","将左脚向外旋转约 45 度，并保持右脚指向前方。","将你的躯干向左侧弯曲，保持右臂伸过头顶，眼睛盯着壶铃。","尽可能降低躯干，同时保持右臂伸直，左臂向一侧伸展。","暂停片刻，然后通过推动右脚并接合斜肌返回到起始位置。"]},
{"id":"0555","n":"踢外坐","en":"kick out sit","p":"上腿","e":"自重","t":"腘绳肌","g":"0555-v7p5bYl.gif","s":["坐在长凳或椅子的边缘，双脚平放在地上，膝盖弯曲成 90 度角。","稍微向后倾斜，将双手放在长凳或椅子的边缘以获得支撑。","启动腿筋，将脚抬离地面，并将双腿伸直到身前。","在顶部停顿片刻，然后慢慢弯曲膝盖，将脚放回身体。"]},
{"id":"0558","n":"摆动双力臂","en":"kipping muscle up","p":"背","e":"自重","t":"背阔肌","g":"0558-pM07UxU.gif","s":["首先，用正手握法悬挂在引体向上杆上，双手分开的距离略大于肩宽。","启动你的核心并使用摆动动作来产生动力。","当你向前挥杆时，将胸部拉向杠铃，用背阔肌和二头肌开始动作。","继续向上运动，直到胸部到达杠铃，然后向下推杠铃并伸展手臂，过渡到双臂屈伸姿势。","弯曲手臂并控制下降，将自己放回到起始位置。"]},
{"id":"3640","n":"膝触碰卷腹","en":"knee touch crunch","p":"腰腹","e":"自重","t":"腹肌","g":"3640-dTg95eZ.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，将肩胛骨抬离地面，并将右手伸向左膝盖。","返回起始位置并重复，这次将左手伸向右膝盖。","继续交替进行所需的重复次数。"]},
{"id":"1420","n":"跪姿跳蹲","en":"kneeling jump squat","p":"上腿","e":"杠铃","t":"臀大肌","g":"1420-UgDm3oy.gif","s":["首先跪在地上，双脚分开与臀部同宽，脚趾向前。","将杠铃放在上背部，将其放在肩膀上。","启动你的核心和臀部，然后爆发性地跳到空中，伸展你的臀部和膝盖。","跳跃时，用脚趾推动并充分伸展脚踝、膝盖和臀部。","轻轻地回到地面，弯曲膝盖以吸收冲击力。"]},
{"id":"1346","n":"跪姿背阔肌拉伸","en":"kneeling lat stretch","p":"背","e":"自重","t":"背阔肌","g":"1346-f38OEuO.gif","s":["跪在地上，膝盖分开与臀部同宽，脚趾向后。","将双臂伸过头顶，手指交叉。","保持背部挺直，慢慢向右侧倾斜，感受左侧背阔肌的拉伸。","保持伸展动作 20-30 秒，然后回到起始位置。","在左侧重复该拉伸动作，向左侧倾斜，感受右侧背阔肌的拉伸。"]},
{"id":"3239","n":"跪姿平板支撑轻点肩","en":"kneeling plank tap shoulder (male)","p":"腰腹","e":"自重","t":"腹肌","g":"3239-h1ezqSu.gif","s":["从跪姿开始，双手放在地上，与肩同宽。","将双腿伸到身后，用脚趾支撑，将身体抬起成平板支撑姿势。","保持核心参与并保持臀部稳定，将一只手抬离地面并拍打另一侧的肩膀。","将手放回地面并用另一只手重复此操作。","继续交替进行所需的重复次数。"]},
{"id":"3211","n":"跪姿俯卧撑","en":"kneeling push-up (male)","p":"胸","e":"自重","t":"胸大肌","g":"3211-ZOuKWir.gif","s":["首先跪在地上，双手与肩同宽，手指指向前方。","将双腿伸到身后，放在脚掌上，使身体从头到脚跟形成一条直线。","弯曲肘部，保持核心靠近身体两侧，将身体压向地面。","继续降低，直到胸部刚好高于地面，然后伸直手臂，将其推回起始位置。"]},
{"id":"3288","n":"韩国臂屈伸","en":"korean dips","p":"胸","e":"自重","t":"胸大肌","g":"3288-rWoBmi5.gif","s":["将自己定位在两个双杠之间，双臂伸展并支撑体重。","弯曲肘部降低身体，直到上臂与地面平行。","暂停片刻，然后伸直手臂，将自己推回起始位置。"]},
{"id":"3418","n":"L字引体向上","en":"l-pull-up","p":"背","e":"自重","t":"背阔肌","g":"3418-d1GgzTU.gif","s":["正手握住引体向上杆，握距略宽于肩宽。","双臂完全伸展，身体伸直。","收紧背阔肌和二头肌，将身体拉向杠铃杆，保持肘部靠近身体。","继续拉，直到下巴位于杠铃上方。","在顶部停顿片刻，然后慢慢将身体放回起始位置。"]},
{"id":"3419","n":"L字坐地面","en":"l-sit on floor","p":"腰腹","e":"自重","t":"腹肌","g":"3419-UpWmA5E.gif","s":["坐在地板上，双腿伸到身前。","将双手放在臀部旁边的地板上，手指指向前方。","启动你的核心并将双腿抬离地面，保持伸直。","尝试使双腿与地面平行，与身体形成“L”形。","尽可能长时间地保持这个姿势。"]},
{"id":"0562","n":"地雷管180度","en":"landmine 180","p":"腰腹","e":"杠铃","t":"腹肌","g":"0562-QYysSLV.gif","s":["双脚分开与肩同宽站立，双手握住杠铃于胸前。","稍微弯曲膝盖并将躯干向右旋转，将杠铃向下朝右臀部摆动。","当你到达动作的底部时，快速反向运动并向左旋转你的躯干，向上摆动杠铃并穿过你的身体朝向左肩。","继续这个扭转动作，两侧交替，达到所需的重复次数。"]},
{"id":"3237","n":"地雷管侧平举","en":"landmine lateral raise","p":"肩","e":"杠铃","t":"三角肌","g":"3237-eXMFHww.gif","s":["站立，双脚分开与肩同宽，膝盖稍微弯曲。","正手握住杠铃，将其放在肩膀前面。","保持核心收紧并保持背部挺直，将杠铃向上举起并远离身体，将其提升至肩膀高度。","在顶部停顿片刻，然后慢慢将杠铃放回起始位置。"]},
{"id":"3300","n":"倾斜俄挺","en":"lean planche","p":"腰腹","e":"自重","t":"腹肌","g":"3300-LYJodFS.gif","s":["从俯卧撑位置开始，双手分开与肩同宽，身体伸直。","启动你的核心，慢慢地将你的重心向前移动，让你的肩膀越过你的手。","向前倾时，保持肘部稍微弯曲，身体伸直。","保持这个姿势几秒钟，然后慢慢回到起始位置。"]},
{"id":"2271","n":"左勾手拳击","en":"left hook. boxing","p":"肩","e":"自重","t":"三角肌","g":"2271-hoXt6wv.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","左手举起以保护脸部，右手握住下巴。","旋转臀部并以左脚为轴心，同时以出拳动作向前伸展左臂。","扭转你的躯干并调动你的核心肌肉以产生出拳的力量。","将手臂拉回到起始位置，然后重复所需的重复次数。"]},

{"id":"1576","n":"腿上腘绳肌拉伸","en":"leg up hamstring stretch","p":"上腿","e":"自重","t":"腘绳肌","g":"1576-sU5BrfP.gif","s":["平躺，双腿伸展。","弯曲一侧膝盖，将其靠近胸部，握住大腿或小腿。","尽可能伸直腿，同时保持腿抬高。","保持拉伸 20-30 秒。","换另一条腿重复上述步骤。"]},
{"id":"2287","n":"器械交替腿举","en":"lever alternate leg press","p":"上腿","e":"器械","t":"股四头肌","g":"2287-V07qpXy.gif","s":["将杠杆机的座椅和脚踏平台调整到您想要的位置。","坐在机器上，背部靠在靠背上，双脚放在脚踏板上。","将手放在机器的手柄或侧面以保持稳定性。","将一只脚推到脚平台上，伸展腿直到几乎完全伸直。","暂停片刻，然后慢慢弯曲腿，回到起始位置。"]},
{"id":"0571","n":"坐姿器械交替窄距划船","en":"lever alternating narrow grip seated row","p":"背","e":"器械","t":"上背","g":"0571-w2oRpuH.gif","s":["调整座椅高度和踏板位置以确保正确对齐。","坐在机器上，背部挺直，双脚平放在踏板上。","紧紧握住手柄，手掌相对。","在整个练习过程中保持挺胸、肩膀向后。","将一个手柄拉向您的躯干，同时保持另一个手柄静止。"]},
{"id":"0572","n":"器械辅助反手引体向上","en":"lever assisted chin-up","p":"背","e":"器械","t":"背阔肌","g":"0572-MaMuGH6.gif","s":["将杠杆机调整至您想要的阻力水平。","站在脚踏板上，正手握住手柄，握距略宽于肩宽。","双臂完全伸展，保持身体挺直。","收紧背部肌肉，将身体拉向手柄，以胸部为主导。","继续拉，直到下巴位于手柄上方。"]},

{"id":"0624","n":"高抬腿坐墙","en":"march sit (wall)","p":"上腿","e":"自重","t":"臀大肌","g":"0624-sVQCCeG.gif","s":["背靠墙站立，双脚分开与臀部同宽。","慢慢地将背部滑下墙壁，直到膝盖弯曲成 90 度角。","将右脚抬离地面，并将膝盖靠近胸部。","将右脚放低，将左脚抬离地面，将膝盖靠近胸部。","继续交替抬起右脚和左脚，达到所需的重复次数。"]},
{"id":"1353","n":"药球接过头抛掷","en":"medicine ball catch and overhead throw","p":"背","e":"药球","t":"背阔肌","g":"1353-PsVS1QP.gif","s":["双脚分开与肩同宽站立，双手握住健身球，与胸部齐平。","稍微弯曲膝盖并启动核心。","将身体降低至蹲姿，保持背部挺直、挺胸。","爆发性伸展臀部和腿部，同时将药球扔过头顶。","在动作的最高点释放球并在下降的过程中接住它。"]},
{"id":"1302","n":"药球胸传递","en":"medicine ball chest pass","p":"胸","e":"药球","t":"胸大肌","g":"1302-aDoFKrE.gif","s":["双脚分开与肩同宽站立，将健身球保持在胸部水平。","向前伸展双臂，用力将药球推离胸部。","当你释放球时，用你的手臂和躯干将球从后脚转移到前脚。","当球从墙壁或伙伴身上反弹时接住球，并立即重复该动作。","继续进行所需的重复次数。"]},
{"id":"1303","n":"药球胸推站距","en":"medicine ball chest push from 3 point stance","p":"胸","e":"药球","t":"胸大肌","g":"1303-dCJnuVq.gif","s":["以三点姿势开始，一只手放在健身球上，另一只手放在地上。","伸展双腿并将身体摆成一条直线。","将胸部压向地面，同时保持背部挺直。","将药球推离身体，完全伸展手臂。","返回起始位置并重复所需的重复次数。"]},
{"id":"1304","n":"药球胸推","en":"medicine ball chest push multiple response","p":"胸","e":"药球","t":"胸大肌","g":"1304-7aolH9D.gif","s":["双脚分开与肩同宽站立，将药球举至胸部水平。","向前伸展双臂，将药球推离胸部。","暂停片刻，然后慢慢地将健身球放回胸前。"]},
{"id":"1305","n":"药球胸推单","en":"medicine ball chest push single response","p":"胸","e":"药球","t":"胸大肌","g":"1305-jeHtrlO.gif","s":["双脚分开与肩同宽站立，将健身球保持在胸部水平。","向前伸展双臂，将药球推离胸部。","暂停片刻，然后慢慢地将健身球放回胸前。"]},
{"id":"1312","n":"药球胸推跑释放","en":"medicine ball chest push with run release","p":"胸","e":"药球","t":"胸大肌","g":"1312-pX9Elbe.gif","s":["双脚分开与肩同宽站立，将药球举至胸部水平。","右脚向前迈出一步，同时向前推动药球，充分伸展双臂。","当你向前推动球时，松开它并让它向前滚动。","快速向前跑，在球落地之前接住球。","接住球后，将其放回胸前，左脚向前重复该动作。"]},
{"id":"1701","n":"药球窄距俯卧撑","en":"medicine ball close grip push up","p":"上臂","e":"药球","t":"三头肌","g":"1701-8K7m2SS.gif","s":["从高平板支撑位置开始，双手放在健身球上，距离与肩同宽。","弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。","推回起始位置，完全伸展双臂。"]},
{"id":"1354","n":"药球过头猛砸","en":"medicine ball overhead slam","p":"背","e":"药球","t":"上背","g":"1354-oHg8eop.gif","s":["双脚分开与肩同宽站立，双手握住药球举过头顶。","启动你的核心并保持背部挺直。","稍微弯曲膝盖，用力将药球摔到你面前的地面上。","当你击球时，用你的整个身体来产生力量，包括你的肩膀和核心。","接住球的弹跳并重复所需的重复次数。"]},
{"id":"1750","n":"仰卧药球胸抛掷","en":"medicine ball supine chest throw","p":"上臂","e":"药球","t":"三头肌","g":"1750-Al3tP0D.gif","s":["平躺在长凳上，膝盖弯曲，双脚平放在地上。","双手握住药球，将手臂伸直至胸部上方。","将健身球降低到胸部，保持肘部靠近身体。","爆发性地将药球向上推，充分伸展双臂并将球扔得尽可能高。","接住药球并重复所需的重复次数。"]},
{"id":"0627","n":"混合反手引体向上","en":"mixed grip chin-up","p":"背","e":"自重","t":"背阔肌","g":"0627-T8UpLkb.gif","s":["反握（手掌朝向自己）抓住引体向上杆，双手之间的距离略大于肩宽。","悬挂在杠上，双臂完全伸展，双脚离开地面。","调动背部肌肉，将身体拉向杠铃杆，以胸部为主导。","继续拉，直到下巴位于杠铃上方。","在顶部停顿片刻，然后有控制地慢慢将身体放回起始位置。"]},
{"id":"3217","n":"改良印度俯卧撑","en":"modified hindu push-up (male)","p":"胸","e":"自重","t":"胸大肌","g":"3217-epOSYUZ.gif","s":["从俯卧撑位置开始，双手分开略宽于肩宽，双脚分开与臀部同宽。","将身体向地面降低，弯曲肘部并保持核心参与。","当你降低身体时，将你的重心向后转移，并将臀部向上抬向天花板，与你的身体形成一个倒V形。","继续降低身体，直到胸部刚好高于地面，然后反向运动，将臀部向下推，并伸展手臂回到起始位置。"]},
{"id":"1421","n":"改良俯卧撑下臂","en":"modified push up to lower arms","p":"前臂","e":"自重","t":"前臂","g":"1421-arvaszz.gif","s":["从俯卧撑位置开始，双手直接放在肩膀下方，身体呈一条直线。","弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。","一旦肘部成 90 度角，将前臂放低至地面，将肘部保持在肩膀正下方。","暂停片刻，然后用手掌推动前臂，使其回到起始位置。"]},
{"id":"0628","n":"怪兽走","en":"monster walk","p":"上腿","e":"自重","t":"臀大肌","g":"0628-O95afRA.gif","s":["在脚踝周围放置一根阻力带。","双脚分开与肩同宽站立，稍微弯曲膝盖。","右脚向一侧迈出一步，保持阻力带的张力。","左脚跟随，向一侧迈步以返回起始位置。"]},
{"id":"0630","n":"登山跑","en":"mountain climber","p":"有氧","e":"自重","t":"心肺","g":"0630-RJgzwny.gif","s":["从高平板支撑位置开始，双手直接放在肩膀下方，身体呈一条直线。","启动你的核心并将你的右膝盖靠近你的胸部，然后快速切换并将你的左膝盖靠近你的胸部。","继续以跑步动作交替双腿，保持臀部较低，核心肌群参与。","在整个练习过程中保持稳定的节奏和均匀的呼吸。"]},
{"id":"0631","n":"双力臂","en":"muscle up","p":"背","e":"自重","t":"背阔肌","g":"0631-yJUHKTn.gif","s":["首先悬挂在引体向上杆上，手掌背向自己，手臂完全伸展。","启动核心肌群，将身体拉向杠铃杆，以胸部为主导。","当你到达动作的最高点时，改变你的握力，使你的手掌朝向你。","继续将自己向上拉，直到胸部位于杠铃上方并且手臂完全弯曲。","通过慢慢降低自己回到起始位置来反转动作。"]},
{"id":"1401","n":"双力臂垂直杠","en":"muscle-up (on vertical bar)","p":"背","e":"自重","t":"背阔肌","g":"1401-Af0EW2I.gif","s":["首先悬挂在垂直杆上，手掌背对自己，手臂完全伸展。","启动核心肌群，将身体拉向杠铃杆，以胸部为主导。","当你站起来时，稍微向后倾斜，并将肘部移向身体两侧。","继续拉，直到胸部到达杠铃并且肘部完全弯曲。","在最高点暂停片刻，然后慢慢降低回到起始位置。"]},
{"id":"2328","n":"窄距俯卧撑瑜伽球","en":"narrow push-up on exercise ball","p":"上臂","e":"瑜伽球","t":"三头肌","g":"2328-4cWjYEN.gif","s":["将稳定球放在地面上，将自己置于俯卧撑位置，双手放在球上，距离略窄于肩宽。","调动你的核心力量，让你的身体从头到脚保持在一条直线上。","弯曲肘部，使胸部靠近球，使胸部靠近球。","在底部暂停片刻，然后伸直手臂将自己推回起始位置。"]},
{"id":"1403","n":"颈侧拉伸","en":"neck side stretch","p":"颈","e":"自重","t":"肩胛提肌","g":"1403-x2chWLO.gif","s":["站直或坐直，肩膀放松。","将头向一侧倾斜，将耳朵靠近肩膀。","保持拉伸 15-30 秒。","在另一侧重复。","每侧进行 2-4 组。"]},

{"id":"1495","n":"腹斜肌卷腹第二式","en":"oblique crunch v. 2","p":"腰腹","e":"自重","t":"腹肌","g":"1495-cJgSTmh.gif","s":["仰卧，膝盖弯曲，双脚平放在地上。","将双手放在脑后或交叉放在胸前。","收紧腹肌，将肩胛骨抬离地面，将躯干旋转到一侧。","暂停片刻，然后将肩胛骨放回起始位置。","在另一侧重复。"]},
{"id":"0635","n":"腹斜肌卷腹地面","en":"oblique crunches floor","p":"腰腹","e":"自重","t":"腹肌","g":"0635-QUDd8WS.gif","s":["仰卧，膝盖弯曲，双脚平放在地板上。","将双手放在脑后或交叉放在胸前。","收紧腹肌，将肩胛骨抬离地面，将躯干旋转到一侧。","暂停片刻，然后将肩胛骨放回到地板上。","在另一侧重复，每次重复时交替进行。"]},
{"id":"0636","n":"奥林匹克杠杠铃锤式弯举","en":"olympic barbell hammer curl","p":"上臂","e":"奥林匹克杠","t":"二头肌","g":"0636-o1ntciW.gif","s":["站直，双脚分开与肩同宽，正手握住奥林匹克杠铃。","让杠铃悬挂在大腿前面，手掌与身体保持一臂距离。","保持上臂静止，呼气并弯举哑铃，同时收缩二头肌。","继续举起杠铃，直到二头肌完全收缩并且杠铃与肩部齐平。","挤压二头肌时，保持收缩位置短暂停顿。"]},
{"id":"0637","n":"奥林匹克杠杠铃三头肌伸展","en":"olympic barbell triceps extension","p":"上臂","e":"奥林匹克杠","t":"三头肌","g":"0637-wu5LXwz.gif","s":["首先，双脚分开与肩同宽站立，并用正手握住杠铃。","将杠铃举过头顶，充分伸展双臂。","保持上臂靠近头部，弯曲肘部，慢慢将杠铃降低到脑后。","暂停片刻，然后将手臂伸回到起始位置。"]},
{"id":"1355","n":"单臂靠墙","en":"one arm against wall","p":"背","e":"自重","t":"背阔肌","g":"1355-ZZTGMKh.gif","s":["面向墙壁站立，双脚分开与肩同宽。","将一只手臂伸直到身前，将手掌靠在墙上。","启动你的核心，身体向前倾斜，保持手臂伸直，背部平坦。","用手掌慢慢推向墙壁，激活背阔肌。","保持该姿势几秒钟，然后松开并用另一只手臂重复该动作。"]},
{"id":"0638","n":"单臂反手引体向上","en":"one arm chin-up","p":"背","e":"自重","t":"背阔肌","g":"0638-HjdqmZa.gif","s":["面向引体向上杆站立，双脚分开与肩同宽。","抬起手，用反握方式抓住杠铃，一只手握住杠铃，另一只手握住手腕以提供支撑。","悬挂在杠上，手臂完全伸展，保持身体伸直，核心肌群参与。","弯曲肘部并挤压背部肌肉，将自己拉向杠铃。","继续拉，直到下巴高于杠铃，然后慢慢降低回到起始位置。"]},

{"id":"0640","n":"单臂猛砸药球","en":"one arm slam (with medicine ball)","p":"腰腹","e":"药球","t":"腹肌","g":"0640-jCrtE9b.gif","s":["双脚分开与肩同宽站立，一只手将健身球放在腰前。","稍微弯曲膝盖并启动核心。","将健身球举过头顶，充分伸展手臂。","用力将药球摔到地上，用你的核心和肩膀产生力量。","抓住弹起的实心球，然后重复所需的重复次数。"]},
{"id":"1773","n":"单臂毛巾划船","en":"one arm towel row","p":"背","e":"自重","t":"上背","g":"1773-bKWbrTA.gif","s":["双脚分开与肩同宽站立，膝盖微曲，单手握住毛巾。","腰部向前弯曲，保持背部挺直，核心肌群参与。","完全伸展手臂，让毛巾挂在您面前。","将毛巾拉向胸部，将肩胛骨挤压在一起。","在顶部停顿片刻，然后慢慢将毛巾放回起始位置。"]},

{"id":"1476","n":"单腿深蹲","en":"one leg squat","p":"上腿","e":"自重","t":"臀大肌","g":"1476-C31LMnP.gif","s":["双脚分开与肩同宽站立。","向前伸出一条腿，使其离开地面。","弯曲站立的腿并降低身体，就像坐回椅子上一样。","保持挺胸、背部挺直。","推动脚后跟返回到起始位置。"]},

{"id":"1422","n":"骨盆倾斜进入桥","en":"pelvic tilt into bridge","p":"上腿","e":"自重","t":"臀大肌","g":"1422-D9qe7CM.gif","s":["仰卧，膝盖弯曲，双脚平放在地上。","将手臂放在身体两侧，手掌朝下。","调动你的臀肌和核心肌肉。","向上倾斜骨盆，将臀部抬离地面。","保持桥位置几秒钟。"]},
{"id":"1388","n":"腓骨肌拉伸","en":"peroneals stretch","p":"小腿","e":"绳","t":"小腿三头肌","g":"1388-XhfS1DZ.gif","s":["坐在地上，双腿在身前伸展。","将绳子绕在脚掌上，并用手握住绳子的末端。","轻轻地将绳子拉向自己，弯曲脚并伸展小腿肌肉。","保持拉伸 15-30 秒。","释放绳子上的张力，然后在另一条腿上重复拉伸。"]},
{"id":"3662","n":"派克眼镜蛇式俯卧撑","en":"pike-to-cobra push-up","p":"上腿","e":"自重","t":"臀大肌","g":"3662-XPUDTt7.gif","s":["从俯卧撑位置开始，双手分开略宽于肩宽，双脚并拢。","收紧核心肌群，将臀部抬向天花板，与身体形成倒V字形。","弯曲肘部，使上半身靠近地面，使上半身靠近地面。","当你下降时，将你的重心向前移动，并通过伸直手臂并抬起胸部来过渡到眼镜蛇姿势。","通过弯曲肘部并将胸部放回到地面来扭转运动。"]},
{"id":"1306","n":"增强式俯卧撑","en":"plyo push up","p":"胸","e":"自重","t":"胸大肌","g":"1306-Snj1wSv.gif","s":["从高平板支撑位置开始，双手分开略宽于肩宽。","弯曲肘部，将胸部压向地面，保持身体呈一条直线。","爆发性地推离地面，利用胸部肌肉将上半身推离地面。","双手回到起始位置，轻轻落地。"]},
{"id":"1687","n":"后侧上台阶过头触达","en":"posterior step to overhead reach","p":"腰腹","e":"自重","t":"腹肌","g":"1687-ErqK3UL.gif","s":["站立，双脚分开与臀部同宽，双臂放在身体两侧。","右脚向后退一步，用脚掌着地。","弯曲左膝并将身体降低至弓步位置。","当你降低弓步时，同时将手臂举过头顶。","在弓步底部暂停片刻，然后通过推动左脚跟并将右脚向前拉回到起始位置。"]},
{"id":"1389","n":"后侧胫骨肌拉伸","en":"posterior tibialis stretch","p":"小腿","e":"绳","t":"小腿三头肌","g":"1389-DEEqoI2.gif","s":["坐在地上，双腿在身前伸展。","将绳子绕在脚掌上，并用手握住绳子的末端。","轻轻地将绳子拉向自己，弯曲脚并伸展小腿肌肉。","保持拉伸 20-30 秒。","释放绳子上的张力并放松脚。"]},
{"id":"3119","n":"蹲坐深蹲","en":"potty squat","p":"腰腹","e":"自重","t":"腹肌","g":"3119-75Bgtjy.gif","s":["双脚分开与肩同宽站立，脚趾稍微向外。","弯曲膝盖并将臀部向后推，降低身体，就像坐在椅子上一样。","在整个动作过程中保持挺胸、背部挺直。","降低自己，直到大腿与地面平行或尽可能低。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"3132","n":"蹲坐深蹲支撑","en":"potty squat with support","p":"上腿","e":"自重","t":"臀大肌","g":"3132-b63ZzGe.gif","s":["双脚分开与肩同宽站立，脚趾稍微向外。","抓住稳定的支撑物，例如椅子或墙壁，以保持平衡。","弯曲膝盖并将臀部向后推，将身体降低至蹲姿。","在整个动作过程中保持挺胸、背部挺直。","在底部停顿片刻，然后推动脚后跟回到起始位置。"]},
{"id":"0648","n":"爆发高翻","en":"power clean","p":"上腿","e":"杠铃","t":"腘绳肌","g":"0648-SiWCcTN.gif","s":["首先将杠铃放在你面前的地面上，双脚分开与肩同宽。","弯腰，正手握住杠铃，握距略宽于肩宽。","将杠铃提离地面时，保持背部挺直，挺胸，伸展臀部和膝盖。","当杠铃到达大腿中部时，爆发性地将其向上拉，耸肩并将肘部拉高并向两侧拉。","当杠铃到达最高点时，迅速下降到其下方，旋转肘部，以前蹲姿势将杠铃接在肩膀上。"]},
{"id":"3665","n":"爆发力平板支撑","en":"power point plank","p":"腰腹","e":"自重","t":"腹肌","g":"3665-hCjGsRQ.gif","s":["从高平板支撑位置开始，双手直接放在肩膀下方，身体从头到脚成一条直线。","启动你的核心并挤压你的臀肌以保持稳定的位置。","将身体放低到前臂上，一次一只手臂，从头到脚保持一条直线。","保持这个姿势所需的时间，保持核心肌群和臀肌的参与。","要返回到起始位置，请推动前臂并将身体抬回到高位平板支撑位置。"]},
{"id":"3203","n":"囚徒半仰卧起坐","en":"prisoner half sit-up (male)","p":"腰腹","e":"自重","t":"腹肌","g":"3203-mgejmGP.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"1707","n":"俯卧转体瑜伽球","en":"prone twist on stability ball","p":"腰腹","e":"瑜伽球","t":"腹肌","g":"1707-1IG6gVF.gif","s":["首先，面朝下躺在稳定球上，双脚分开与肩同宽，脚趾接触地面。","将双手放在脑后或交叉放在胸前。","启动核心肌肉，慢慢将上半身抬离球，保持背部挺直。","将躯干旋转到一侧，使肩膀靠近臀部。在整个运动过程中保持臀部和腿部稳定。","暂停片刻，然后回到起始位置。"]},
{"id":"0651","n":"引体向上中立","en":"pull up (neutral grip)","p":"背","e":"自重","t":"背阔肌","g":"0651-0V2YQjW.gif","s":["用中立握法（手掌相对）悬挂在引体向上杆上，双臂完全伸展。","启动你的核心并将肩胛骨挤压在一起。","弯曲肘部并将肘部向下推向臀部，将身体向上拉向杠铃。","继续拉，直到下巴位于杠铃上方。","在顶部停顿片刻，然后有控制地慢慢将身体放回起始位置。"]},
{"id":"0650","n":"拉瑜伽球","en":"pull-in (on stability ball)","p":"腰腹","e":"瑜伽球","t":"腹肌","g":"0650-UQr48Oi.gif","s":["首先坐在稳定球上，双脚平放在地面上，膝盖弯曲成 90 度角。","将双手放在稳定球的两侧以获得支撑。","收紧腹肌，慢慢向前滚动臀部，使膝盖靠近胸部。","在动作的最高点停顿片刻，然后慢慢将双腿伸展回起始位置。"]},
{"id":"0652","n":"引体向上","en":"pull-up","p":"背","e":"自重","t":"背阔肌","g":"0652-lBDjFxJ.gif","s":["悬挂在引体向上杆上，手掌背向自己，手臂完全伸展。","启动你的核心并将肩胛骨挤压在一起。","弯曲肘部并将胸部拉向杠铃杆，将身体向上拉向杠铃杆。","在动作的最高点暂停，然后慢慢降低身体回到起始位置。"]},
{"id":"1689","n":"推拉自重","en":"push and pull bodyweight","p":"胸","e":"自重","t":"胸大肌","g":"1689-wXvUZC8.gif","s":["从俯卧撑位置开始，双手分开略宽于肩宽，身体呈一条直线。","弯曲肘部，将胸部压向地面，保持身体伸直。","推动手掌以伸展手臂并返回到起始位置。","从俯卧撑位置开始，弯曲肘部，将胸部拉向地面，保持身体伸直。","推动手掌以伸展手臂并返回到起始位置。"]},
{"id":"3638","n":"推跑","en":"push to run","p":"有氧","e":"自重","t":"心肺","g":"3638-PrQbjvB.gif","s":["从俯卧撑位置开始，双手分开与肩同宽，身体呈一条直线。","弯曲肘部，将胸部压向地面，保持身体伸直。","用手推动以伸展手臂并返回到起始位置。","快速将一个膝盖靠近胸部，然后快速切换并将另一只膝盖靠近胸部。","继续尽可能快地交替膝盖，同时保持良好的姿势。"]},

{"id":"0660","n":"俯卧撑窄距离哑铃","en":"push-up close-grip off dumbbell","p":"上臂","e":"哑铃","t":"三头肌","g":"0660-KZXAtKQ.gif","s":["从俯卧撑位置开始，双手并拢，直接放在肩膀下方。","每只手握住一个哑铃，将其放在地上。","弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。","推动手掌以伸展手臂并返回到起始位置。"]},
{"id":"0661","n":"俯卧撑内侧腿踢","en":"push-up inside leg kick","p":"上腿","e":"自重","t":"臀大肌","g":"0661-0br45wL.gif","s":["从俯卧撑位置开始，双手分开略宽于肩宽，双脚并拢。","弯曲肘部，将身体降低到地面，保持背部挺直，核心肌群参与。","当你向后推时，将一条腿抬离地面并将其踢向一侧，保持伸直。","将腿放下并重复俯卧撑，然后换另一条腿。","每次重复俯卧撑时继续交替踢腿。"]},

{"id":"1467","n":"俯卧撑下臂","en":"push-up on lower arms","p":"上臂","e":"自重","t":"三头肌","g":"1467-4Jt8QsQ.gif","s":["从平板支撑位置开始，前臂放在地面上，肘部位于肩膀正下方。","调动你的核心力量，让你的身体从头到脚保持在一条直线上。","弯曲肘部，使胸部靠近地面，使胸部靠近地面。","在底部暂停片刻，然后将自己推回到起始位置。"]},
{"id":"3145","n":"俯卧撑","en":"push-up plus","p":"胸","e":"自重","t":"胸大肌","g":"3145-pvBMLHA.gif","s":["从高位平板支撑开始，双手分开略宽于肩宽，身体从头到脚跟呈一条直线。","弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。","一旦你的胸部刚好高于地面，用力推动你的手臂，伸展你的手臂并抬起你的上半身。","在动作的最高点，将上背部推向天花板，从而伸展肩胛骨。","暂停片刻，然后通过缩回肩胛骨并将身体放回起始位置来反转动作。"]},
{"id":"0664","n":"俯卧撑侧平板","en":"push-up to side plank","p":"腰腹","e":"自重","t":"腹肌","g":"0664-KhHJ338.gif","s":["从俯卧撑位置开始，双手分开与肩同宽，身体呈一条直线。","弯曲肘部，将身体降低到地面，保持核心参与。","推回到起始位置。","将体重转移到左手上，然后将身体向右旋转，将右臂举向天花板。","保持侧板姿势几秒钟，然后返回到起始位置。"]},

{"id":"0666","n":"举单臂俯卧撑","en":"raise single arm push-up","p":"胸","e":"自重","t":"胸大肌","g":"0666-13TpY4H.gif","s":["从俯卧撑位置开始，双手分开略宽于肩宽，双脚并拢。","将一只手臂伸直至一侧，与地面平行。","弯曲肘部，将身体降低到地面，保持背部挺直，核心参与。","推回起始位置，使用胸部肌肉抬起身体。","另一只手臂伸出，重复上述动作。"]},

{"id":"3007","n":"弹力带腿屈伸","en":"resistance band leg extension","p":"上腿","e":"弹力带","t":"股四头肌","g":"3007-Y1MsI1l.gif","s":["将阻力带固定在坚固的锚点上，并将其固定在脚踝上。","面向锚点站立，双脚分开与肩同宽。","保持核心参与并保持上半身稳定，将腿伸直到身前。","在顶部暂停片刻，然后慢慢地将腿放回起始位置。"]},
{"id":"3123","n":"坐姿弹力带二头肌弯举","en":"resistance band seated biceps curl","p":"上臂","e":"弹力带","t":"二头肌","g":"3123-XFc3vpY.gif","s":["坐在椅子或长凳上，背部挺直，双脚平放在地面上。","反手握住阻力带，手掌朝上，手臂向下伸展到身体两侧。","保持上臂静止，呼气并将阻力带向上卷向肩膀。","在顶部暂停片刻，挤压你的二头肌。","吸气并慢慢降低阻力带回到起始位置。"]},

{"id":"0691","n":"坐姿侧卷腹墙","en":"seated side crunch (wall)","p":"腰腹","e":"自重","t":"腹肌","g":"0691-Y9hNPcN.gif","s":["坐在地板上，背靠墙，双腿在身前伸展。","弯曲膝盖，将双脚平放在地板上，与臀部同宽。","将双手放在脑后，肘部朝外。","收紧腹肌并向一侧倾斜，将肘部靠近臀部。","暂停片刻，然后回到起始位置。"]},
{"id":"1587","n":"坐姿宽距角度姿势","en":"seated wide angle pose sequence","p":"上腿","e":"自重","t":"腘绳肌","g":"1587-HIgYKAB.gif","s":["坐在地上，双腿大角度伸展。","弯曲你的脚并锻炼你的股四头肌。","将双手放在身后的地面上以获得支撑。","保持背部挺直，从臀部向前倾。","继续向前倾斜，直到感觉到腿筋被拉伸。"]},
{"id":"0697","n":"自我辅助反向腿弯举","en":"self assisted inverse leg curl","p":"上腿","e":"自重","t":"腘绳肌","g":"0697-GwYwElT.gif","s":["平躺在垫子或长凳上，双腿伸展。","将双手放在身体两侧或臀部下方以获得支撑。","弯曲膝盖，将脚抬离地面，将大腿靠近胸部。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"1766","n":"自我辅助反向腿弯举","en":"self assisted inverse leg curl","p":"上腿","e":"自重","t":"腘绳肌","g":"1766-ZSY3MsL.gif","s":["面朝下躺在腿弯举机上，双腿伸展，脚踝钩在带衬垫的杠杆下。","将双手放在机器的侧手柄上以获得支撑。","保持上半身静止，呼气并尽可能向上弯曲双腿。","挤压腿筋时，保持收缩位置短暂停顿。","吸气时慢慢将双腿放回起始位置。"]},
{"id":"0696","n":"自我辅助反向腿弯举地面","en":"self assisted inverse leg curl (on floor)","p":"上腿","e":"自重","t":"腘绳肌","g":"0696-E4PwJqI.gif","s":["平躺，双腿伸展，双臂放在身体两侧。","弯曲膝盖，将双脚平放在地面上，距离与臀部同宽。","将臀部抬离地面，锻炼臀肌和腿筋。","慢慢地将双腿向臀部弯曲，保持臀部抬起。","在顶部停顿片刻，然后慢慢将双腿伸展回起始位置。"]},
{"id":"3222","n":"半深蹲跳","en":"semi squat jump (male)","p":"有氧","e":"自重","t":"心肺","g":"3222-6FMU51h.gif","s":["双脚分开与肩同宽站立。","弯曲膝盖并将身体降低至蹲姿。","爆发性跳跃，伸展臀部和膝盖，同时摆动手臂以获得动力。","脚掌轻轻落地，然后立即进入下一个重复动作。"]},
{"id":"3656","n":"短程跨步跑","en":"short stride run","p":"有氧","e":"自重","t":"心肺","g":"3656-CcWEoWV.gif","s":["找一个空地或跑步机来进行锻炼。","站直，双脚分开与臀部同宽。","开始原地慢跑，抬起膝盖并挥动手臂。","几秒钟后，开始小步前进，保持快速的步伐。","继续小步跑所需的时间或距离。"]},
{"id":"1763","n":"肩握引体向上","en":"shoulder grip pull-up","p":"背","e":"自重","t":"背阔肌","g":"1763-YtgD7Xq.gif","s":["握距与肩同宽，抓住引体向上杆，手掌背向自己。","双臂完全伸展，自由悬挂。","启动背部肌肉，将身体向上拉向杠铃，直到下巴位于杠铃上方。","在顶部停顿片刻，然后慢慢将身体放回起始位置。"]},
{"id":"3699","n":"肩轻点","en":"shoulder tap","p":"腰腹","e":"自重","t":"腹肌","g":"3699-yRpV5TC.gif","s":["从高平板支撑位置开始，双手直接放在肩膀下方，身体呈一条直线。","启动你的核心并将右手抬离地面，伸手拍打你的左肩。","将右手放回地面，然后用左手轻拍右肩，重复此操作。","继续交替轻拍肩膀，同时保持臀部和躯干稳定。"]},
{"id":"0699","n":"肩轻点俯卧撑","en":"shoulder tap push-up","p":"胸","e":"自重","t":"胸大肌","g":"0699-qEse6fe.gif","s":["从高位平板支撑开始，双手分开略宽于肩宽，身体从头到脚跟呈一条直线。","弯曲肘部，使肘部靠近身体两侧，将身体降低到地面。","当你向后推时，将右手抬离地面并轻拍左肩。","将右手放回地面并重复俯卧撑，这次抬起左手并拍打右肩。","每次重复俯卧撑时，继续交替拍肩。"]},
{"id":"1774","n":"侧桥髋外展","en":"side bridge hip abduction","p":"上腿","e":"自重","t":"外展肌","g":"1774-WL4EmxJ.gif","s":["侧躺，双腿伸展并叠放在一起。","用前臂支撑自己，将肘部保持在肩膀正下方。","启动你的核心并将臀部抬离地面，从头到脚形成一条直线。","在保持核心肌群参与的同时，尽可能高地抬起上面的那条腿，但不要旋转臀部。","在顶部停顿片刻，然后将腿放下。"]},
{"id":"0705","n":"侧桥第二式","en":"side bridge v. 2","p":"腰腹","e":"自重","t":"腹肌","g":"0705-RKjH6Lt.gif","s":["侧躺，双腿伸展并叠放在一起。","将前臂放在肩膀正下方的地面上，肘部弯曲成 90 度角。","启动你的核心并将臀部抬离地面，从头到脚形成一条直线。","保持此位置所需的时间。","将臀部放低至起始位置。"]},
{"id":"0709","n":"侧髋平行杠","en":"side hip (on parallel bars)","p":"腰腹","e":"自重","t":"腹肌","g":"0709-jTkSc6o.gif","s":["站在两根平行杠之间，双脚分开与肩同宽。","将双手放在横杆上，将身体抬离地面，用手臂支撑体重。","收紧腹肌，慢慢将双腿向一侧抬起，保持伸直。","在顶部暂停片刻，然后慢慢将双腿放回起始位置。"]},
{"id":"0710","n":"侧髋外展","en":"side hip abduction","p":"上腿","e":"自重","t":"外展肌","g":"0710-7WaDzyL.gif","s":["双脚分开与肩同宽站立，双手放在臀部。","将重心转移到一条腿上，并将另一条腿向一侧抬起，保持伸直。","在顶部暂停片刻，然后慢慢将腿放回起始位置。","在另一侧重复。","继续交替进行所需的重复次数。"]},
{"id":"1358","n":"仰卧侧地面拉伸","en":"side lying floor stretch","p":"背","e":"自重","t":"背阔肌","g":"1358-jDOKRM5.gif","s":["侧躺，双腿伸直，下臂伸直过头顶。","弯曲上面的膝盖，将脚放在下面的腿前面的地面上。","将上臂伸过头顶，抓住稳定的东西，例如墙壁或一件家具。","慢慢地将下面的腿抬离地面，保持伸直，直到感觉到身体一侧有拉伸感。","保持拉伸 20-30 秒，然后慢慢将腿放下。"]},
{"id":"3667","n":"仰卧侧髋内收","en":"side lying hip adduction (male)","p":"上腿","e":"自重","t":"内收肌","g":"3667-c8f5cSY.gif","s":["侧躺，双腿伸直并叠放在一起。","将下臂放在头下方以获得支撑。","启动内收肌并尽可能高地抬起上面的腿，但不要旋转臀部或向后倾斜。","在顶部暂停片刻，然后慢慢将腿放回起始位置。"]},
{"id":"1775","n":"侧平板髋内收","en":"side plank hip adduction","p":"上腿","e":"自重","t":"内收肌","g":"1775-VO2qeJg.gif","s":["首先侧躺，双腿伸展并叠放在一起。","用前臂支撑自己，将肘部保持在肩膀正下方。","启动你的核心并将臀部抬离地面，从头到脚形成一条直线。","在保持侧平板支撑位置的同时，将上面的腿抬向天花板，保持笔直。","慢慢地将腿放回起始位置。"]},
{"id":"0716","n":"侧推颈拉伸","en":"side push neck stretch","p":"颈","e":"自重","t":"肩胛提肌","g":"0716-oQRJYkC.gif","s":["站直或坐直，肩膀放松。","将头向右倾斜，将右耳靠近右肩。","将右手放在头部左侧，轻轻施加压力以增加拉伸。","保持拉伸 15-30 秒。","在另一侧重复，将头向左倾斜并用左手施加压力。"]},
{"id":"0717","n":"侧俯卧撑","en":"side push-up","p":"上臂","e":"自重","t":"三头肌","g":"0717-wpbD28t.gif","s":["首先侧躺，双腿伸展并叠放在一起。","将下面的手放在肩膀正下方的地面上，手指指向前方。","用下面的手将身体抬离地面，保持双腿伸直，核心肌群参与。","将上臂伸向天花板，形成从头部到脚后跟的直线。","有控制地降低身体回到起始位置。"]},
{"id":"0721","n":"侧腕拉拉伸","en":"side wrist pull stretch","p":"前臂","e":"自重","t":"前臂","g":"0721-UtmIqcI.gif","s":["双脚分开与肩同宽站立，双臂在身前伸展。","将右臂向侧面伸出，与地面平行，手掌朝下。","用左手抓住右手，轻轻地将其拉向身体，感觉右前臂有拉伸感。","保持拉伸 15-30 秒，然后放松。","在另一侧重复。"]},
{"id":"0720","n":"侧下巴","en":"side-to-side chin","p":"背","e":"自重","t":"背阔肌","g":"0720-isAAZWA.gif","s":["双脚分开与肩同宽站立，膝盖稍微弯曲。","正手握住引体向上杆，双手之间的距离略大于肩宽。","悬挂在杠上，双臂完全伸展，身体放松。","弯曲肘部并将下巴朝向杠铃杆，将自己拉起，同时保持身体挺直。","一旦你的下巴高于杠铃，就将自己放低回到起始位置。"]},
{"id":"3213","n":"侧触足","en":"side-to-side toe touch (male)","p":"腰腹","e":"自重","t":"腹肌","g":"3213-WCAvOfC.gif","s":["双脚分开与肩同宽站立，双臂向两侧伸展。","腰部向右弯曲，将右手伸向右脚，同时保持左手向一侧延伸。","返回起始位置，然后腰部向左弯曲，将左手伸向左脚，同时保持右手向侧面延伸。","重复左右弯曲动作达到所需的重复次数。"]},
{"id":"0725","n":"单臂俯卧撑","en":"single arm push-up","p":"胸","e":"自重","t":"胸大肌","g":"0725-MUic5zN.gif","s":["从俯卧撑位置开始，双手分开与肩同宽，一只手比另一只手稍宽。","弯曲肘部，保持背部挺直，调动核心力量，将身体降低至地面。","当你降低身体时，将你的重心转移到一侧，并将另一只手臂抬离地面，将其笔直延伸到一侧。","推动胸部和三头肌，将身体抬回到起始位置，同时将伸出的手臂放回地面。"]},
{"id":"3645","n":"单腿桥伸展腿","en":"single leg bridge with outstretched leg","p":"上腿","e":"自重","t":"臀大肌","g":"3645-rmEukuS.gif","s":["仰卧，膝盖弯曲，双脚平放在地上。","将一条腿伸直在您面前。","收紧臀部并将臀部抬离地面，从膝盖到肩膀形成一条直线。","在顶部保持片刻，然后慢慢将臀部放回起始位置。"]},
{"id":"0727","n":"单腿小腿举哑铃","en":"single leg calf raise (on a dumbbell)","p":"小腿","e":"哑铃","t":"小腿三头肌","g":"0727-fKZgDEO.gif","s":["双脚分开与臀部同宽站立，一只手握住哑铃。","将一只脚抬离地面并用另一只脚保持平衡。","使用小腿肌肉，慢慢地将脚跟抬高，尽可能高。","在顶部停顿片刻，然后慢慢降低脚跟。"]},
{"id":"0730","n":"单腿平台滑动","en":"single leg platform slide","p":"上腿","e":"自重","t":"腘绳肌","g":"0730-LNE3wfo.gif","s":["首先将一只脚站在平台或滑板上。","稍微弯曲膝盖，将脚向后滑动到平台上，伸展腿。","在整个运动过程中保持核心参与并保持笔直姿势。","将脚滑回初始位置，慢慢返回起始位置。"]},
{"id":"1759","n":"单腿深蹲手枪","en":"single leg squat (pistol) male","p":"上腿","e":"自重","t":"臀大肌","g":"1759-nqs5HGV.gif","s":["双脚分开与肩同宽站立，双臂在身前伸展。","将右脚抬离地面并向前伸展。","弯曲左膝并将臀部向后推，慢慢降低身体。","降低身体时，保持挺胸、背部挺直。","降低直到左大腿与地面平行，或者尽可能降低到您能舒服的高度。"]},
{"id":"1489","n":"西斯深蹲","en":"sissy squat","p":"上腿","e":"自重","t":"股四头肌","g":"1489-xdYPUtE.gif","s":["双脚分开与肩同宽站立，脚趾稍微向外。","如果需要，请抓住一个稳定的物体以保持平衡。","弯曲膝盖并向后倾斜，慢慢降低身体，保持躯干直立。","继续降低，直到大腿与地面平行或尽可能舒适地下降。","暂停片刻，然后用力推动脚后跟，回到起始位置。"]},
{"id":"0735","n":"仰卧起坐第二式","en":"sit-up v. 2","p":"腰腹","e":"自重","t":"腹肌","g":"0735-Bn6TXyO.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","将双手放在脑后，肘部朝外。","收紧腹肌，慢慢将上半身抬离地面，向前卷曲，直到躯干呈 45 度角。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3679","n":"仰卧起坐臂胸","en":"sit-up with arms on chest","p":"腰腹","e":"自重","t":"腹肌","g":"3679-6ZCiYWQ.gif","s":["平躺，膝盖弯曲，双脚平放在地上。","双臂交叉于胸前。","收紧腹肌，将上半身抬离地面，靠近膝盖。","在顶部停顿片刻，然后慢慢将上半身放回起始位置。"]},
{"id":"3361","n":"滑冰跳动","en":"skater hops","p":"有氧","e":"自重","t":"心肺","g":"3361-zfNHMN9.gif","s":["双脚分开与肩同宽站立。","稍微弯曲膝盖，向右跳，右脚着地。","落地时，将左腿摆动到右腿后面，并用左脚趾敲击地面。","立即向左侧跳跃，左脚着地。","落地时，将右腿摆动到左腿后面，并用右脚趾敲击地面。"]},
{"id":"2142","n":"滑雪功率车","en":"ski ergometer","p":"上臂","e":"滑雪机","t":"三头肌","g":"2142-vpQaQkH.gif","s":["将座椅高度和脚踏板调整到舒适的位置。","正手握住手柄，手掌朝下。","坐直，双脚平放在脚踏板上。","将手臂伸直在身前，保持肘部稍微弯曲。","收紧三头肌并将手柄向下推向大腿。"]},
{"id":"3671","n":"滑雪上台阶","en":"ski step","p":"有氧","e":"自重","t":"心肺","g":"3671-5MRH8H2.gif","s":["双脚分开与肩同宽站立。","稍微弯曲膝盖并保持背部挺直。","跳到右侧，右脚着地，同时将左腿摆动到右腿后面。","立即向左侧跳，左脚着地，同时将右腿摆动到左腿后面。","继续从一侧到另一侧交替跳跃，模仿滑雪动作。"]},
{"id":"3304","n":"猫式翻越","en":"skin the cat","p":"背","e":"自重","t":"上背","g":"3304-MSfvriJ.gif","s":["首先，将双臂完全伸展，身体放松地悬挂在杆上。","收紧核心并抬起双腿，使膝盖靠近胸部。","继续将双腿举过头顶，让身体穿过手臂。","一旦双腿完全伸过头顶，就开始将它们放回起始位置。","当你降低双腿时，让你的身体通过手臂向后移动，直到你再次完全伸展手臂悬挂。"]},
{"id":"1425","n":"雪橇45度单腿举","en":"sled 45 degrees one leg press","p":"上腿","e":"雪橇机","t":"臀大肌","g":"1425-WWD6FzI.gif","s":["将雪橇机调整至 45 度角。","坐在雪橇机上，背部靠在垫子上，双脚放在踏板上。","将一只脚放在踏板上并伸展腿，将雪橇推离您。","慢慢弯曲膝盖，将雪橇放回起始位置。","换另一条腿重复上述步骤。"]},

{"id":"0739","n":"雪橇45度腿举","en":"sled 45в° leg press","p":"上腿","e":"雪橇机","t":"臀大肌","g":"0739-10Z2DXU.gif","s":["将雪橇机的座椅和脚踏板调整到舒适的位置。","坐在雪橇机上，背部靠在靠背上，双脚与肩同宽放在踏板上。","握住座椅两侧的把手以保持稳定性。","伸展双腿，将脚踏板推离身体，脚后跟保持在脚踏板上。","继续推动，直到双腿几乎完全伸展，但不要锁住膝盖。"]},

{"id":"0786","n":"深蹲挺举","en":"squat jerk","p":"上腿","e":"杠铃","t":"股四头肌","g":"0786-IMRsOCn.gif","s":["首先将杠铃放在肩膀上，双脚分开与肩同宽。","将身体降低至蹲姿，保持挺胸，膝盖位于脚趾上方。","当你到达深蹲底部时，爆发性地用腿发力，并将杠铃推过头顶。","当杠铃到达最高点时，迅速落入分体位置，一脚向前，一脚向后。","双臂完全伸展，后膝盖稍微接触地面，将杠铃举过头顶。"]},
