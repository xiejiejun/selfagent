      const d=trToday();
      const list=train.records.filter(r=>r.date===d);
      if(!list.length){ trToast('还没有训练记录'); return; }
      const fitType=settings.types.find(t=>t.key==='fit') || settings.types.find(t=>/健身|运动/.test(t.label)) || settings.types[0];
      const txt='今日训练：'+list.map(i=>i.dur?(i.name+' '+i.dur+'分钟'):(i.name+' '+i.sets+'×'+i.reps+(i.weight>0?'@'+i.weight+'kg':'（自重）'))).join('、');
      const fitTag=(typeTags(fitType.key)||[]).find(t=>/力量|训练|健身/.test(t)) || '';
      const dtm=new Date(); const p3=n=>String(n).padStart(2,'0');
      const dk3=`${dtm.getFullYear()}-${p3(dtm.getMonth()+1)}-${p3(dtm.getDate())}`;
      logs.push({id:'tr'+Date.now(), kind:'train', source:'manual', type:fitType.key, tags:fitTag,
        score:null, mood:null, content:txt, time:dtm.toISOString(), date:dk3,
        meta:{items:(train.records||[]).filter(r=>r.date===dk3).map(r=>{
          const gs=ensureGroups(r); const pk=k=>{const v=gs.filter(g=>(g[k]||0)>0).slice(-1)[0];return v?v[k]:0;};
          const dn=gs.filter(g=>g.done).length;
          const iv=gs.filter(g=>g.done&&!g.warmup).reduce((a,g)=>a+(g.reps||0)*(g.weight||0),0);
          return {exId:r.exId,name:r.name,part:r.part,sets:gs.length,reps:pk('reps'),weight:pk('weight'),
            done:dn,volume:Math.round(iv),groups:gs.map(g=>({no:g.no,reps:g.reps,weight:g.weight,done:!!g.done,rpe:g.rpe||0,sec:g.sec||0}))};
        }), volume:0}});
      save(); renderLogs(); markStepIdx(1); trToast('已生成一条健身日志');
    });
  }

  /* ---------- 日志面板 ---------- */
  function filterLogs(){
    const d0=new Date(); d0.setDate(d0.getDate()-logFilter.range);
    return logs.filter(l=>{
      if(logFilter.type!=='all' && l.type!==logFilter.type) return false;
      if(logFilter.tag && !((l.tags||'')+' '+(l.content||'')).toLowerCase().includes(logFilter.tag.toLowerCase())) return false;
      if(logFilter.range>0 && new Date(l.time)<d0) return false;
      return true;
    });
  }
  function trainCard(l){
    const m=l.meta||{}; const items=m.items||[];
    const allG=items.reduce((a,i)=>a.concat(i.groups||[]),[]);
    const totalSets=items.reduce((a,i)=>a+((i.groups&&i.groups.length)?i.groups.length:(i.sets||0)),0);
    const doneSets=items.reduce((a,i)=>a+((i.groups||[]).filter(g=>g.done).length),0);
    const vol=items.reduce((a,i)=>a+((i.groups||[]).reduce((x,g)=>x+((g.done&&!g.warmup)?(g.reps||0)*(g.weight||0):0),0)),0);
    const prs=prOfItems(items,l.date);
    const prSet=prs.set;
    const dots=(n,done)=>Array.from({length:Math.min(n,6)},(_,k)=>`<span class="lg-dot${k<done?' on':''}"></span>`).join('')
      + (n>6?`<span class="lg-dotx">${done}/${n}</span>`:'');
    const lgd=gs=>{
      const a=(gs||[]).filter(g=>!g.warmup); if(!a.length) return '';
      const f=g=>((g.weight>0)?(g.weight+'kg'):'自重')+'×'+(g.reps||0);
      const same=a.every(g=>(g.weight||0)===(a[0].weight||0)&&(g.reps||0)===(a[0].reps||0));
      if(same) return ((a[0].weight>0)?(a[0].weight+'kg'):'自重')+' '+a.length+'×'+(a[0].reps||0);
      const parts=a.map(f);
      return parts.length>3 ? (parts.slice(0,3).join(' · ')+' · +'+(parts.length-3)) : parts.join(' · ');
    };
    const rows=items.map((i,ii)=>{
      const gs=(i.groups||[]);
      const sets = gs.length
        ? gs.map(g=>`<div class="lg-set"><span class="lg-no${g.warmup?' warm':''}">${g.warmup?'W':g.no}</span><em>${g.weight>0?(g.weight+'kg'):'自重'} × ${g.reps}</em>${g.done?'<s>✓</s>':''}${g.rpe?`<i>${['','轻松','刚好','力竭'][g.rpe]||''}</i>`:''}${g.sec?`<i>${g.sec}s</i>`:''}</div>`).join('')
        : `<div class="lg-set"><span class="lg-no">1</span><em>${i.weight>0?(i.weight+'kg'):'自重'} × ${i.reps}</em></div>`;
      const doneN=gs.filter(g=>g.done).length;
      const setsN=gs.length||i.sets||0;
      const allDone=setsN>0&&doneN===setsN;
      return `<div class="lg-ex${allDone?' fin':''}" data-lgx="${l.id}:${ii}">
        <div class="lg-h">
          <b>${ENGINE.esc(i.name)}</b>
          <em>${lgd(gs)}</em>
          <span class="lg-dots">${dots(setsN,doneN)}</span>
          ${prSet.has(String(i.exId))?'<span class="lg-prch">PR</span>':''}
          <span class="lg-ar">▸</span>
        </div>
        <div class="lg-sets">${sets}</div>
      </div>`;
    }).join('');
    return `
      <div class="log-item tcard">
        <div class="log-head">
          <span class="log-type fit" style="color:#3DDCBF;border-color:#3DDCBF">训练</span>
          <span class="tag">${l.source==='auto'?'自动同步':'手动'}</span>
          <span class="log-time">${fmtTime(l.time)}</span>
          <button class="lg-more" data-lmenu="${l.id}" aria-label="更多" type="button">⋯</button>
        </div>
        <div class="lg-sum">${items.length} 动作 · ${doneSets}/${totalSets} 组 · ${vol?Math.round(vol).toLocaleString()+' kg':'—'}${prs.n?` · <b class="lg-pr">${prs.n} PR</b>`:''}</div>
        ${m.checkin?`<div class="tc-feel"><span>情绪 ${m.checkin.mood}/5 ${FEEL_MOOD[(m.checkin.mood||1)-1]||''}</span><span>状态 ${m.checkin.energy}/5 ${FEEL_ENERGY[(m.checkin.energy||1)-1]||''}</span>${m.checkin.note?`<em>“${ENGINE.esc(m.checkin.note)}”</em>`:''}</div>`:''}
        <div class="lg-list">${rows||'<div class="tc-empty">暂无明细</div>'}</div>
      </div>`;
  }
  function prOfItems(items,date){
    const set={}; let n=0;
    (items||[]).forEach(i=>{
      const a=(i.groups||[]).filter(g=>!g.warmup);
      const best=a.reduce((x,g)=>Math.max(x,g.weight||0),0);
      if(best<=0) return;
      let hist=0;
      (train.records||[]).forEach(r=>{
        if(r.exId!==i.exId || r.date>=date) return;
        (r.groups||[]).forEach(g=>{ if(!g.warmup) hist=Math.max(hist,g.weight||0); });
      });
      if(hist>0 && best>hist){ set[String(i.exId)]=1; n++; }
    });
    return {n:n,set:new Set(Object.keys(set))};
  }
  function logCard(l){
    if(l.kind==='train') return trainCard(l);
    return `
      <div class="log-item">
        <div class="log-head">
          <span class="log-type ${typeCls(l.type)}" style="color:${colorFor(l.type)};border-color:${colorFor(l.type)}">${ENGINE.esc(typeLabel(l.type))}</span>
          ${l.tags?`<span class="tag">${ENGINE.esc(l.tags)}</span>`:''}
          <span class="log-score ${moodClass(l.mood)}">精力 ${'●'.repeat(l.score||3)}${'○'.repeat(5-(l.score||3))} · 情绪 ${moodText(l.mood)}</span>
          <span class="log-time" data-lid="${l.id}" title="点击修改日期，可补记昨天">${fmtTime(l.time)}<i>改</i></span>
          <button class="lg-more" data-lmenu="${l.id}" aria-label="更多" type="button">⋯</button>
        </div>
        <div class="log-body">${ENGINE.esc(l.content)}</div>
      </div>`;
  }
  function dayLabel(ds){
    const d=new Date(ds+'T00:00:00');
    const p=n=>String(n).padStart(2,'0');
    const now=new Date();
    const tk=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}`;
    const y=new Date(now); y.setDate(y.getDate()-1);
    const yk=`${y.getFullYear()}-${p(y.getMonth()+1)}-${p(y.getDate())}`;
    const wd='日一二三四五六'[d.getDay()];
    const core=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wd;
    if(ds===tk) return '今天 · '+core;
    if(ds===yk) return '昨天 · '+core;
    return core+(d.getFullYear()!==now.getFullYear()?(' · '+d.getFullYear()):'');
  }
  function groupByDay(list){
    const order=[], map={};
    list.forEach(l=>{
      const d=l.date||dayKey(l.time);
      if(!map[d]){ map[d]=[]; order.push(d); }
      map[d].push(l);
    });
    order.sort((a,b)=> a<b?1:-1);
    const today=dayKey(new Date());
    return order.map(d=>{
      const open = logDayOpen[d]!==undefined ? logDayOpen[d] : (d===today);
      return `<div class="day-block${open?' open':''}" data-daygrp="${d}">
        <button class="day-tog" type="button" data-daytog="${d}" aria-expanded="${open?'true':'false'}">
          <span>${dayLabel(d)}</span><em>${map[d].length} 条</em><i class="day-ar">▸</i>
        </button>
        <div class="day-body"${open?'':' hidden'}>${map[d].map(logCard).join('')}</div>
      </div>`;
    }).join('');
  }
  function renderLogsPanel(){
    const body=$('reportBody');
    const list=[...filterLogs()].reverse();
    const typeOpts=`<option value="all">全部类型</option>`+settings.types.map(t=>`<option value="${t.key}" ${logFilter.type===t.key?'selected':''}>${ENGINE.esc(t.label)}</option>`).join('');
    body.innerHTML=`
      <div class="filter-bar">
        <select id="fType">${typeOpts}</select>
        <input type="text" id="fTag" placeholder="搜索标签或内容" value="${ENGINE.esc(logFilter.tag)}">
        <select id="fRange"><option value="0">全部时间</option><option value="7">近7天</option><option value="30">近30天</option><option value="90">近90天</option></select>
        <span class="fcount">共 ${list.length} 条</span>
      </div>
      <div class="log-panel">${ list.length ? groupByDay(list) : '<div class="empty">没有符合条件的日志。</div>' }</div>`;
    $('fRange').value=String(logFilter.range);
    $('fType').onchange=e=>{logFilter.type=e.target.value;renderLogsPanel();};
    $('fRange').onchange=e=>{logFilter.range=parseInt(e.target.value,10);renderLogsPanel();};
    let tmr;
    $('fTag').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{logFilter.tag=e.target.value.trim();renderLogsPanel();},250);};
    bindLogActions();
  }
  function openLogMenu(id,anchor){
    document.querySelectorAll('.lg-menu').forEach(x=>x.remove());
    const r=anchor.getBoundingClientRect();
    const el=document.createElement('div'); el.className='lg-menu';
    el.innerHTML='<button type="button" data-mact="edit">编辑</button><button type="button" data-mact="del">删除</button>';
    document.body.appendChild(el);
    el.style.top=Math.round(Math.max(8, Math.min(r.bottom+6, window.innerHeight-96)))+'px';
    el.style.left=Math.max(12, Math.round(Math.min(r.right-120, window.innerWidth-132)))+'px';
    el.querySelector('[data-mact="edit"]').onclick=()=>{
      el.remove();
      const l=logs.find(x=>String(x.id)===String(id)); if(!l) return;

      el.remove();
      if(!(await Modal.confirm({title:'删除记录', body:'这条记录会从当天分组移除；若是训练记录，当天的训练数据也会一起删除，不能恢复。', okText:'删除', cancelText:'保留', danger:true}))) return;
      const rowEl=anchor.closest('.log-item');
      keepDayOpen(id);
      collapseRemove(rowEl,()=>{ deleteLogById(id); renderLogs(); renderLogsPanel(); });
    };
    setTimeout(()=>{
      const h=e=>{ if(!el.contains(e.target)){ el.remove(); document.removeEventListener('click',h); } };
      document.addEventListener('click',h);
    },0);
  }
  function bindLogActions(){
    document.querySelectorAll('#reportBody [data-daytog]').forEach(b=>{
      b.addEventListener('click',()=>{
        const g=b.closest('.day-block'); if(!g) return;
        const body=g.querySelector('.day-body'); if(!body) return;
        const open=g.classList.contains('open');
        g.classList.toggle('open', !open);
        body.hidden = open;
        b.setAttribute('aria-expanded', open?'false':'true');
        logDayOpen[b.dataset.daytog] = !open;
      });
    });
    document.querySelectorAll('#reportBody [data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!(await Modal.confirm({title:'删除记录', body:'这条记录会从当天分组移除；若是训练记录，当天的训练数据也会一起删除，不能恢复。', okText:'删除', cancelText:'保留', danger:true}))) return;
        keepDayOpen(b.dataset.del);
        collapseRemove(b.closest('.lg-item,.day-row,.log-item')||b.parentElement,()=>{
          deleteLogById(b.dataset.del); renderLogs(); renderLogsPanel();
        });
      });
    });
    document.querySelectorAll('#reportBody [data-edit]').forEach(b=>{
      b.addEventListener('click',()=>openLogSheet(b.dataset.edit));
    });
    document.querySelectorAll('#reportBody [data-tedit]').forEach(b=>{
      b.addEventListener('click',()=>openTrainSheet(b.dataset.tedit));
    });
    document.querySelectorAll('#reportBody [data-lgx]').forEach(ex=>{
      const h=ex.querySelector('.lg-h'); if(!h) return;
      h.addEventListener('click',()=>{
        const open=ex.classList.contains('open');
        const list=ex.parentElement;
        list.querySelectorAll('.lg-ex.open').forEach(o=>o.classList.remove('open'));
        if(!open) ex.classList.add('open');
      });
    });
    document.querySelectorAll('#reportBody [data-lmenu]').forEach(b=>{
      b.addEventListener('click',ev=>{ ev.stopPropagation(); openLogMenu(b.dataset.lmenu, b); });
    });
  }


  /* ---------- 底部 sheet 编辑 ---------- */
  function ensureLogSheet(){
    let sh=$('logSheet');
    if(sh) return sh;

  /* ---------- 训练日志编辑 sheet ---------- */

  /* ---------- 统计面板 ---------- */
  const ST_RANGE_KEY='selfagent_stats_range_v1';
  let statsRange=(function(){
    try{ const o=JSON.parse(localStorage.getItem(ST_RANGE_KEY)||'null');
      if(o&&o.mode) return {mode:String(o.mode), start:o.start||null, end:o.end||null}; }catch(e){}
    return {mode:'30', start:null, end:null};
  })();
  function stSaveRange(){ try{ localStorage.setItem(ST_RANGE_KEY, JSON.stringify(statsRange)); }catch(e){} }
  const stDayOf=l=> l.date || dayKey(l.time);
  function stBounds(){
    const t=new Date(), end=dayKey(t);
    if(statsRange.mode==='custom' && statsRange.start && statsRange.end){
      let a=statsRange.start, b=statsRange.end; if(a>b){ const x=a; a=b; b=x; }
      return {start:a, end:b};
    }
    const n=parseInt(statsRange.mode,10)||30;
    const s2=new Date(t); s2.setDate(s2.getDate()-(n-1));
    return {start:dayKey(s2), end:end};
  }
  function stPrev(start,end){
    const a=new Date(start+'T00:00:00'), b=new Date(end+'T00:00:00');
    const len=Math.round((b-a)/86400000)+1;
    const pe=new Date(a); pe.setDate(pe.getDate()-1);
    const ps=new Date(pe); ps.setDate(pe.getDate()-(len-1));
    return {start:dayKey(ps), end:dayKey(pe)};
  }
  function stVolOf(r){
    const gs=Array.isArray(r.groups)?r.groups:[];
    if(gs.length) return gs.reduce((acc,g)=>acc+(g.warmup?0:(g.weight||0)*(g.reps||0)),0);
    return (r.sets||0)*(r.reps||0)*(r.weight||0);
  }
  function stMinOf(c){
    if(c.min!=null) return +c.min;
    if(c.dur!=null) return +c.dur;
    if(c.sec!=null) return (+c.sec)/60;
    return 0;
  }
  function stMetrics(a,b){
    const lg=logs.filter(l=>{ const k=stDayOf(l); return k>=a && k<=b; });
    const rs=(train.records||[]).filter(r=>r.date && r.date>=a && r.date<=b);
    const cs=(train.cardio||[]).filter(c=>c.date && c.date>=a && c.date<=b && !c.skipped);
    const done=cs.filter(c=>c.done!==false);
    const sc=lg.map(l=>+l.score).filter(v=>v>0);
    const md=lg.map(l=>+l.mood).filter(v=>v>0);
    return {
      lg, rs, cs:done, count:lg.length,
      sets: rs.reduce((acc,r)=>acc+(r.sets||0),0),
      vol: Math.round(rs.reduce((acc,r)=>acc+stVolOf(r),0)),
      mins: Math.round(done.reduce((acc,c)=>acc+stMinOf(c),0)),
      avg: sc.length? sc.reduce((x,y)=>x+y,0)/sc.length : null,
      mood: md.length? md.reduce((x,y)=>x+y,0)/md.length : null
    };
  }
  function stDelta(cur, prev, kind){
    if(cur==null) return {txt:'暂无同类数据', cls:'flat'};
    if(prev==null) return {txt:'首次统计', cls:'flat'};
    const d=cur-prev;
    const tiny = kind==='avg' ? 0.05 : 0.5;
    if(Math.abs(d)<tiny) return {txt:'→ 持平', cls:'flat'};
    const num = kind==='avg' ? Math.abs(d).toFixed(1) : String(Math.abs(Math.round(d)));
    return {txt:(d>0?'↑ ':'↓ ')+num, cls:(d>0?'up':'down')};
  }
  function stTodayLabel(k){
    const d=new Date(k+'T00:00:00');
    return '周'+'日一二三四五六'[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
  }
  function stHmColor(n){
    if(!n) return 'rgba(255,255,255,.05)';
    if(n===1) return '#11453B';
    if(n<=3) return '#17765F';
    if(n<=6) return '#21A986';
    return '#3BDCB4';
  }
  function stNum(n){ return (Math.round(n)).toLocaleString('en-US'); }
  function stDrillSheet(title, items){
    if(!items || !items.length){ return; }
    const rows=items.slice(0,120).map(it=>{
      const tm=it.time||'';
      return '<div class="st-row"><span class="t">'+(tm||'—')+'</span>'+
        (it.chip?it.chip:'')+
        '<span class="tx">'+ENGINE.esc(it.text||'')+'</span></div>';
    }).join('');
    openMs('<div class="ms-title">'+ENGINE.esc(title)+'</div>'+
      '<div class="st-list">'+rows+'</div>'+
      (items.length>120?'<div class="st-note" style="margin-top:8px">仅显示前 120 条</div>':''),
      {cls:'stats-drill', label:title});
  }
  function stLogItems(list){
    return list.map(l=>{
      const d=new Date(l.time);
      const chip='<span class="ty" style="color:'+colorFor(l.type)+'">'+ENGINE.esc(typeLabel(l.type))+'</span>';
      return {time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
        chip, text:(l.content||'')+((l.tags&&String(l.tags).trim())?' · '+l.tags:'')};
    });
  }
  function renderStatsPanel(){
    const body=$('reportBody');
    disposeCharts();
    if(typeof echarts==='undefined'){
      body.innerHTML='<div class="intro-empty"><div class="big">图表加载中…</div><p>首次进入统计页需要下载图表库，完成后自动出现。</p></div>';
      ensureEcharts(()=>{ if($('reportBody')) renderStatsPanel(); },
        ()=>{ body.innerHTML='<div class="intro-empty"><div class="big">图表库未加载</div><p>图表需要联网加载 ECharts，请检查网络后重试。</p></div>'; });
      return;
    }
    const b0=stBounds(), b1=stPrev(b0.start,b0.end);
    const cur=stMetrics(b0.start,b0.end), prev=stMetrics(b1.start,b1.end);
    const DAYS=(function(){
      const a=new Date(b0.start+'T00:00:00'), z=new Date(b0.end+'T00:00:00');
      const out=[]; for(const d=new Date(a); d<=z; d.setDate(d.getDate()+1)) out.push(dayKey(d));
      return out;
    })();
    if($('stStart')&&$('stEnd')&&statsRange.mode==='custom'){}

    body.innerHTML=
      '<div class="st-seg" id="stSeg">'+
        [['7','近7天'],['30','近30天'],['90','近90天'],['custom','自定义']].map(function(x){
          return '<button type="button" data-stm="'+x[0]+'" class="'+(statsRange.mode===x[0]?'on':'')+'">'+x[1]+'</button>';
        }).join('')+
      '</div>'+
      '<div class="st-custom" id="stCustom"'+(statsRange.mode==='custom'?'':' hidden')+'>'+
        '<input type="date" id="stStart" value="'+b0.start+'">'+
        '<span class="st-to">至</span>'+
        '<input type="date" id="stEnd" value="'+b0.end+'">'+
        '<span class="fcount" id="stSpan">'+DAYS.length+' 天</span>'+
      '</div>'+
      '<div class="st-kpi" id="stKpi"></div>'+
      '<div class="st-stack" id="stStack"></div>';

    document.querySelectorAll('#stSeg button').forEach(function(btn){
      btn.onclick=function(){
        statsRange.mode=btn.dataset.stm;
        if(statsRange.mode==='custom'&&(!statsRange.start||!statsRange.end)){ const z=stBounds(); statsRange.start=z.start; statsRange.end=z.end; }
        stSaveRange(); renderStatsPanel();
      };
    });
    if($('stStart')) $('stStart').onchange=function(e){ statsRange.start=e.target.value; statsRange.mode='custom'; stSaveRange(); renderStatsPanel(); };
    if($('stEnd')) $('stEnd').onchange=function(e){ statsRange.end=e.target.value; statsRange.mode='custom'; stSaveRange(); renderStatsPanel(); };

    /* --- KPI 读数行 --- */
    const dE=stDelta(cur.avg, prev.avg, 'avg'), dC=stDelta(cur.count, prev.count, 'n'),
          dS=stDelta(cur.sets, prev.sets, 'n'), dM=stDelta(cur.mins, prev.mins, 'n');
    $('stKpi').innerHTML=
      '<div class="k"><div class="k-l">平均精力</div><div class="k-v">'+(cur.avg!=null?cur.avg.toFixed(1):'—')+'<em>/5</em></div><div class="k-d '+dE.cls+'">'+dE.txt+'</div></div>'+
      '<div class="k"><div class="k-l">记录</div><div class="k-v">'+stNum(cur.count)+'<em>条</em></div><div class="k-d '+dC.cls+'">'+dC.txt+'</div></div>'+
      '<div class="k"><div class="k-l">训练</div><div class="k-v">'+stNum(cur.sets)+'<em>组</em></div><div class="k-d '+dS.cls+'">'+dS.txt+'</div></div>'+
      '<div class="k"><div class="k-l">有氧</div><div class="k-v">'+stNum(cur.mins)+'<em>分钟</em></div><div class="k-d '+dM.cls+'">'+dM.txt+'</div></div>';

    const stack=$('stStack');
    if(!cur.count && !cur.rs.length && !cur.cs.length){
      stack.innerHTML=emptyState('note','该时段还没有记录','去记一笔','stgo');
      const g=stack.querySelector('[data-stgo]'); if(g) g.onclick=function(){ goTab('logs'); };
      return;
    }

    /* --- 1 精力 & 情绪 --- */
    const perDay={}; DAYS.forEach(function(k){ perDay[k]={s:[],m:[]}; });
    cur.lg.forEach(function(l){ const k=stDayOf(l); if(perDay[k]){ if(+l.score>0) perDay[k].s.push(+l.score); if(+l.mood>0) perDay[k].m.push(+l.mood); } });
    const eData=DAYS.map(function(k){ const a=perDay[k].s; return a.length? +(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):null; });
    const mData=DAYS.map(function(k){ const a=perDay[k].m; return a.length? +(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):null; });
    const lowIdx=(function(){ let idx=-1, v=99; eData.forEach(function(v0,i2){ if(v0!=null&&v0<v){ v=v0; idx=i2; } }); return idx; })();
    const corr=(function(){ try{ const c=corrTrainingEnergy(); if(c&&c.n>=3) return '训练日次日精力 '+(c.diff>=0?'+':'')+c.diff.toFixed(1); }catch(e){} return ''; })();
    const noteE=(cur.avg!=null?('平均精力 <b>'+cur.avg.toFixed(1)+'</b>'):'暂无精力记录')+
      (lowIdx>=0?('，最低 '+stTodayLabel(DAYS[lowIdx])+' <b>'+eData[lowIdx].toFixed(1)+'</b>'):'')+
      (cur.mood!=null?(' · 平均情绪 <b>'+cur.mood.toFixed(1)+'</b>'):'')+
      (corr?(' · '+corr):'');

    stack.innerHTML=
      '<div class="chart-box"><h3>精力 & 情绪</h3><div class="st-note">'+noteE+'</div><div class="chart-canvas" id="cMood"></div></div>'+
      '<div class="chart-box"><h3>记录时钟 · 星期 × 时段</h3><div class="st-note" id="noteClock">—</div><div class="chart-canvas st-clock" id="cClock"></div></div>'+
      '<div class="chart-box"><h3>构成 · 类型与标签</h3><div class="st-note" id="noteComp">—</div><div class="chart-canvas st-comp" id="cComp"></div></div>'+
      '<div class="chart-box"><h3>训练容量 & 有氧</h3><div class="st-note" id="noteLoad">—</div><div class="chart-canvas" id="cLoad"></div></div>';

    const xInt=Math.max(1,Math.ceil(DAYS.length/8));
    makeChart('cMood',{
      tooltip:{trigger:'axis'},
      legend:{right:6,top:0,itemWidth:10,itemHeight:10,textStyle:{color:'#8695A5',fontSize:11}},
      grid:{left:30,right:12,top:26,bottom:26},
      xAxis:{type:'category',data:DAYS.map(k=>k.slice(5)),axisLabel:{color:'#8695A5',fontSize:10,interval:xInt-1},axisLine:{lineStyle:{color:'#1A2431'}}},
      yAxis:{type:'value',min:1,max:5,splitLine:{lineStyle:{color:'#1A2431'}},axisLabel:{color:'#8695A5',fontSize:10}},
      series:[
        {name:'精力',type:'line',data:eData,smooth:true,symbol:'circle',symbolSize:4,connectNulls:true,
          lineStyle:{color:'#5FD3A0',width:2},itemStyle:{color:'#5FD3A0'},areaStyle:{color:'rgba(95,211,160,.12)'}},
        {name:'情绪',type:'line',data:mData,smooth:true,symbol:'circle',symbolSize:4,connectNulls:true,
          lineStyle:{color:'#6D8CFF',width:1.6},itemStyle:{color:'#6D8CFF'}}
      ]
    });

    /* --- 2 记录时钟热力 --- */
    const hmCnt={}, hourTot=new Array(24).fill(0);
    cur.lg.forEach(function(l){
      const d=new Date(l.time); if(isNaN(d)) return;
      const wd=(d.getDay()+6)%7, h=d.getHours();
      hmCnt[wd+'_'+h]=(hmCnt[wd+'_'+h]||0)+1; hourTot[h]++;
    });
    const hmData=[];
    for(let wd=0;wd<7;wd++) for(let h=0;h<24;h++){
      const n=hmCnt[wd+'_'+h]||0;
      hmData.push({value:[h,wd,n], itemStyle:{color:stHmColor(n), borderRadius:2}});
    }
    const topH=hourTot.map((n,h)=>({h,n})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,3);
    let clockNote='该时段还没有记录';
    if(topH.length){
      const total=hourTot.reduce((a,b)=>a+b,0);
      const hs=topH.map(x=>x.h).sort((a,b)=>a-b);
      const span=(hs[hs.length-1]-hs[0]<=8);
      const pct=Math.round(topH.reduce((a,x)=>a+x.n,0)/total*100);
      clockNote='记录集中在 <b>'+(span?(hs[0]+'–'+hs[hs.length-1]+' 点'):(hs.map(h=>h+' 点').join('、')))+'</b>（占 '+pct+'%）';
    }
    const noteClock=$('noteClock'); if(noteClock) noteClock.innerHTML=clockNote;
    const clockChart=makeChart('cClock',{
      tooltip:{formatter:function(p){
        const v=p.value; if(!v) return '';
        return '周'+'一二三四五六日'[v[1]]+' '+String(v[0]).padStart(2,'0')+'–'+String(v[0]+1).padStart(2,'0')+' 点<br/>'+v[2]+' 条记录';
      }},
      grid:{left:34,right:8,top:8,bottom:22},
      xAxis:{type:'category',data:[...Array(24)].map((_,h)=>h),splitArea:{show:false},axisLabel:{color:'#8695A5',fontSize:9,interval:2},axisLine:{lineStyle:{color:'#1A2431'}},axisTick:{show:false}},
      yAxis:{type:'category',inverse:true,data:['一','二','三','四','五','六','日'],axisLabel:{color:'#8695A5',fontSize:10},axisLine:{lineStyle:{color:'#1A2431'}},axisTick:{show:false}},
      series:[{type:'heatmap',data:hmData,itemStyle:{borderColor:'rgba(0,0,0,0)',borderWidth:2}}]
    });
    if(clockChart){
      clockChart.on('click',function(p){
        const h=p.value[0], wd=p.value[1], n=p.value[2];
        if(!n) return;
        const sub=cur.lg.filter(function(l){ const d=new Date(l.time); return ((d.getDay()+6)%7)===wd && d.getHours()===h; });
        stDrillSheet('周'+'一二三四五六日'[wd]+' '+String(h).padStart(2,'0')+'–'+String(h+1).padStart(2,'0')+' 点 · '+sub.length+' 条', stLogItems(sub));
      });
    }

    /* --- 3 构成（类型 + 标签 横条） --- */
    const seenType={};
    cur.lg.forEach(function(l){ if(l.type) seenType[l.type]=(seenType[l.type]||0)+1; });
    const typeRows=settings.types.map(function(t){
      return {key:t.key, label:t.label, n:seenType[t.key]||0, color:colorFor(t.key)};
    });
    Object.keys(seenType).forEach(function(k){
      if(!settings.types.some(function(t){ return t.key===k; })){
        typeRows.push({key:k, label:'其他', n:seenType[k], color:colorFor(k)});
      }
    });
    const typeList=typeRows.filter(function(x){ return x.n>0; }).sort(function(a,b){ return b.n-a.n; });
    const tagCnt={};
    cur.lg.forEach(function(l){ String(l.tags||'').split(/[,，、\s]+/).filter(Boolean).forEach(function(t){ tagCnt[t]=(tagCnt[t]||0)+1; }); });
    const tagRows=Object.keys(tagCnt).sort((a,b)=>tagCnt[b]-tagCnt[a]).slice(0,5).map(function(t){ return {label:t, n:tagCnt[t], color:'#6D8CFF'}; });
    const catNames=typeList.map(x=>x.label).concat(tagRows.map(x=>'#'+x.label));
    const compChart=makeChart('cComp',{
      tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:function(ps){
        if(!ps.length) return '';
        const p=ps[0], i0=p.dataIndex, tot=cur.count||1;
        const name=catNames[i0], val=p.value||0;
        return name+': <b>'+val+'</b> 条（'+Math.round(val/tot*100)+'%）';
      }},
      grid:{left:76,right:38,top:10,bottom:8},
      xAxis:{type:'value',splitLine:{lineStyle:{color:'#1A2431'}},axisLabel:{color:'#8695A5',fontSize:10}},
      yAxis:{type:'category',data:catNames,inverse:true,axisLabel:{color:'#C9D6E2',fontSize:11},axisLine:{show:false},axisTick:{show:false}},
      series:[
        {name:'类型',type:'bar',stack:'all',barWidth:11,label:{show:true,position:'right',distance:4,color:'#8695A5',fontSize:10},data:typeList.map((x,i2)=>({value:x.n,itemStyle:{color:x.color,borderRadius:[3,3,3,3]}})).concat(tagRows.map(()=>null))},
        {name:'标签',type:'bar',stack:'all',barWidth:11,label:{show:true,position:'right',distance:4,color:'#8695A5',fontSize:10},data:typeList.map(()=>null).concat(tagRows.map(x=>({value:x.n,itemStyle:{color:x.color,borderRadius:[3,3,3,3]}})))}
      ]
    });
    const noteComp=$('noteComp');
    if(noteComp) noteComp.innerHTML='类型 <b>'+typeList.length+'</b> 类 · 标签 <b>'+tagRows.length+'</b> 个，合计 <b>'+cur.count+'</b> 条记录';
    if(compChart){
      compChart.on('click',function(p){
        const idx=p.dataIndex;
        if(idx<typeList.length){
          const tr2=typeList[idx];
          stDrillSheet('类型 · '+tr2.label+'（'+tr2.n+' 条）', stLogItems(cur.lg.filter(l=>l.type===tr2.key)));
        }else{
          const tg=tagRows[idx-typeList.length]; if(!tg) return;
          stDrillSheet('标签 · '+tg.label+'（'+tg.n+' 条）', stLogItems(cur.lg.filter(l=>String(l.tags||'').indexOf(tg.label)>=0)));
        }
      });
    }

    /* --- 4 训练容量 & 有氧 --- */
    const byWeek=DAYS.length>45;
    const buckets={}, order=[];
    DAYS.forEach(function(k){
      let key=k;
      if(byWeek){
        const d=new Date(k+'T00:00:00'); const w=new Date(d); w.setDate(d.getDate()-((d.getDay()+6)%7));
        key=dayKey(w);
      }
      if(!buckets[key]){ buckets[key]={vol:0,min:0,start:key}; order.push(key); }
    });
    cur.rs.forEach(function(r){
      let key=r.date;
      if(byWeek){ const d=new Date(r.date+'T00:00:00'); const w=new Date(d); w.setDate(d.getDate()-((d.getDay()+6)%7)); key=dayKey(w); }
      if(buckets[key]) buckets[key].vol+=stVolOf(r);
    });
    cur.cs.forEach(function(c){
      let key=c.date;
      if(byWeek){ const d=new Date(c.date+'T00:00:00'); const w=new Date(d); w.setDate(d.getDate()-((d.getDay()+6)%7)); key=dayKey(w); }
      if(buckets[key]) buckets[key].min+=stMinOf(c);
    });
    const loadLabels=order.map(k=>byWeek?('周 '+k.slice(5)):k.slice(5));
    const volData=order.map(k=>Math.round(buckets[k].vol));
    const minData=order.map(k=>Math.round(buckets[k].min));
    const noteLoad=$('noteLoad');
    const dV=stDelta(cur.vol, prev.vol, 'n');
    if(noteLoad) noteLoad.innerHTML='容量 <b>'+stNum(cur.vol)+'</b> kg（'+dV.txt+'）'+(cur.mins?(' · 有氧 <b>'+stNum(cur.mins)+'</b> 分钟'):'')+(byWeek?' · 按周汇总':'');
    makeChart('cLoad',{
      tooltip:{trigger:'axis'},
      legend:{right:6,top:0,itemWidth:10,itemHeight:10,textStyle:{color:'#8695A5',fontSize:11}},
      grid:{left:44,right:38,top:44,bottom:26},
      xAxis:{type:'category',data:loadLabels,axisLabel:{color:'#8695A5',fontSize:10,interval:Math.max(0,Math.ceil(loadLabels.length/8)-1)},axisLine:{lineStyle:{color:'#1A2431'}}},
      yAxis:[
        {type:'value',name:'kg',nameTextStyle:{color:'#8695A5',fontSize:10},splitLine:{lineStyle:{color:'#1A2431'}},axisLabel:{color:'#8695A5',fontSize:10}},
        {type:'value',name:'分',nameTextStyle:{color:'#8695A5',fontSize:10},splitLine:{show:false},axisLabel:{color:'#8695A5',fontSize:10}}
      ],
      series:[
        {name:'容量',type:'bar',data:volData,barWidth:'44%',barGap:'18%',itemStyle:{color:'rgba(61,220,191,.45)',borderRadius:[3,3,0,0]}},
        {name:'有氧',type:'bar',yAxisIndex:1,data:minData,barWidth:'30%',itemStyle:{color:'rgba(109,140,255,.55)',borderRadius:[3,3,0,0]}}
      ]
    });
  }
  /* ---------- 设置面板（类型 + 标签 + 档案） ---------- */
  const PROFILE_FIELDS = [
    {k:'nick', label:'称呼 / 昵称', type:'text'},
    {k:'gender', label:'性别', type:'select', opts:['保密','男','女','其他']},
    {k:'age', label:'年龄段', type:'select', opts:['保密','20岁以下','20-29','30-39','40-49','50岁以上']},
    {k:'job', label:'职业 / 工作性质', type:'text'},
    {k:'temper', label:'性格自述', type:'textarea'},
    {k:'sleep', label:'作息偏好', type:'select', opts:['规律早睡','夜猫型','不规律','随缘']},
    {k:'sport', label:'运动基础', type:'select', opts:['基本不动','偶尔','每周1-2次','每周3次以上']},
    {k:'health', label:'健康关注点', type:'textarea'},
    {k:'goal', label:'当前主要目标', type:'textarea'},
    {k:'note', label:'其他备注', type:'textarea'}
  ];
  function fieldHtml(f){
    if(f.type==='textarea') return `<label class="f-label">${f.label}</label><textarea id="pf_${f.k}" style="min-height:64px">${ENGINE.esc(profile[f.k]||'')}</textarea>`;
    if(f.type==='select'){
      const opts=f.opts.map(o=>`<option value="${o}" ${profile[f.k]===o?'selected':''}>${o}</option>`).join('');
      return `<label class="f-label">${f.label}</label><select id="pf_${f.k}">${opts}</select>`;
    }
    return `<label class="f-label">${f.label}</label><input type="text" id="pf_${f.k}" value="${ENGINE.esc(profile[f.k]||'')}">`;
  }
  function renderProfileForm(saved){
    return `<form class="form" id="profileForm">
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[0])}</div><div class="f-field">${fieldHtml(PROFILE_FIELDS[1])}</div></div>
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[2])}</div><div class="f-field">${fieldHtml(PROFILE_FIELDS[3])}</div></div>
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[4])}</div></div>
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[5])}</div><div class="f-field">${fieldHtml(PROFILE_FIELDS[6])}</div></div>
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[7])}</div></div>
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[8])}</div></div>
      <div class="f-row"><div class="f-field">${fieldHtml(PROFILE_FIELDS[9])}</div></div>
      <div class="edit-actions">
        <button type="submit" class="btn sm">保存</button>
        <button type="button" class="btn ghost sm danger" id="pfClear">清空</button>
        ${saved}
      </div>
      <div class="hint">填写的档案会作为 Agent 分析的固定上下文，与你的记录一起用于生成画像、规划与趋势推演。所有信息仅存本地。</div>
    </form>`;
  }
  function setSummaries(){
    const p=profile||{};

  function openSetPanel(key){
    const panels=$('setPanels'); const list=$('setList');
    if(!panels) return;
    let k=key||'';
    if(k && !panels.querySelector('[data-p="'+k+'"]')) k='';
    panels.querySelectorAll('.set-panel').forEach(p=>{ p.hidden = !(k && p.dataset.p===k); });
    panels.classList.toggle('open', !!k);
    if(list){
      list.querySelectorAll('.set-row').forEach(r=>r.classList.toggle('cur', r.getAttribute('data-panel')===k));
      list.classList.toggle('hide', !!k);
    }
    window.__setPanel=k;
    const narrow=window.matchMedia('(max-width:999px)').matches;
    const rpTop=document.querySelector('#pageSetting .rp-top');
    if(rpTop) rpTop.style.display=(narrow&&k)?'none':'';
    const setTop=document.querySelector('#reportBody .set-top');
    if(setTop) setTop.style.display=(narrow&&k)?'none':'';
    if(k) try{ window.scrollTo({top:0}); }catch(e){}
    try{ history.replaceState(null,'', k? '#setting/'+k : '#setting'); }catch(e){}
  }
  function syncThemeRow(){
    const light=document.documentElement.getAttribute('data-theme')==='light';
    const sw=$('setThemeSwitch'); if(sw) sw.setAttribute('aria-checked', light?'true':'false');
    const lb=$('themeSum'); if(lb) lb.textContent = light? '浅色':'深色';
  }
  (function watchTheme(){
    if(window.__themeWatch) return;
    window.__themeWatch=1;
    try{
      new MutationObserver(()=>{ try{ syncThemeRow(); }catch(e){} })
        .observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    }catch(e){}
  })();
  function bindSetPanels(){
    document.querySelectorAll('#setList .set-row[data-panel]').forEach(r=>{
      r.onclick=()=>{ const k=r.getAttribute('data-panel'); if(k==='appearance') return; openSetPanel(k); };
    });
    document.querySelectorAll('[data-spback]').forEach(b=>{ b.onclick=()=>openSetPanel(''); });
    const sw=$('setThemeSwitch');
    if(sw) sw.onclick=(ev)=>{ ev.stopPropagation(); const tb=document.getElementById('themeBtn'); if(tb) tb.click(); syncThemeRow(); };
    const rest=$('setRest');
    if(rest) rest.onchange=()=>{
      const v=parseInt(rest.value,10)||0;

      renderSettingsPanel(); try{ trToast('默认休息：'+(v>0?v+' 秒':'按动作推荐')); }catch(e){}

      if(typeof train!=='undefined'&&train){ train.autoNext=!train.autoNext; try{ saveTrain(); }catch(e){} }
      renderSettingsPanel();
    };
    syncThemeRow();
    const hm=/#setting\/([a-z]+)/.exec(location.hash||'');
    const keep=(hm&&hm[1])||window.__setPanel||'';
    if(keep) openSetPanel(keep);

  function aiSummary(){
    const c=aiCfg();
    if(c.engine==='api' && c.base && c.key) return 'API · '+c.model+' · 已用 '+c.count+' 次';
    if(c.engine==='api') return 'API · 未填 Key（仍走内置规则）';
    return '内置规则 · 离线';
  }
  function aiUsageText(){
    const c=aiCfg();
    const last=c.last? (Math.round((Date.now()-c.last)/60000)+' 分钟前') : '未使用';
    return '已调用 '+c.count+' 次 · 约 '+c.tokens.toLocaleString()+' tokens · 上次 '+last;
  }
  function aiLastText(){
    const fp=aiFingerprint();
    const hit=aiCacheGet('persona', fp, 24*3600e3);
    if(!hit) return '还没有 AI 分析结果';
    const mins=Math.round((Date.now()-hit.ts)/60000);
    return '基于 '+((typeof logs!=='undefined'?(logs||[]):[]).length)+' 条记录 · '+(mins<1?'刚刚':mins+' 分钟前');
  }
  function bindAISettings(){
    const c=aiCfg();
    const base=$('aiBase'), key=$('aiKey'), model=$('aiModel'), msg=$('aiMsg');
    if(base) base.value=c.base||'https://api.deepseek.com/v1';
    if(model && !model.value) model.value=c.model;
    if(key) key.value=c.key||'';
    if(model) model.value=c.model||'deepseek-chat';
    const seg=$('aiEngineSeg');
    if(seg) seg.querySelectorAll('[data-aie]').forEach(b=>{
      b.onclick=()=>{
        aiSave({engine:b.dataset.aie});
        seg.querySelectorAll('[data-aie]').forEach(x=>x.classList.toggle('on', x.dataset.aie===b.dataset.aie));
        try{ const f=$('aiFields'); if(f) f.hidden = b.dataset.aie!=='api'; }catch(e){}
        if($('aiSum')) $('aiSum').textContent=aiSummary();
        if(msg) msg.textContent = b.dataset.aie==='api' ? '已切到 API-KEY（填好 Base/Key 才会真正调用）' : '已切回内置规则引擎（完全离线）';
        try{ trToast(b.dataset.aie==='api' ? 'API-KEY 已启用' : '已切回内置规则'); }catch(e){}
        try{ renderReport(); }catch(e){}
      };
    });
    const save=()=>{
      const k=(key&&key.value||'').trim(), u=(base&&base.value||'').trim();
      const patch={base:u, key:k, model:(model&&model.value||'').trim()||'deepseek-chat'};
      if(k && u) patch.engine='api';
      aiSave(patch);
      if(patch.engine==='api' && seg){
        seg.querySelectorAll('[data-aie]').forEach(x=>x.classList.toggle('on', x.dataset.aie==='api'));
        try{ const f=$('aiFields'); if(f) f.hidden=false; }catch(e){}
      }
      if($('aiSum')) $('aiSum').textContent=aiSummary();
      if($('aiUsage')) $('aiUsage').textContent=aiUsageText();
      if(msg) msg.textContent='已保存到本机（不进备份）'+(patch.engine==='api'?' · 已启用 API-KEY':'');
      if(patch.engine==='api'){ try{ trToast('已启用 API-KEY'); }catch(e){} try{ renderReport(); }catch(e){} }
      return patch;
    };
    if($('aiSaveCfg')) $('aiSaveCfg').onclick=save;
    if($('aiClearKey')) $('aiClearKey').onclick=()=>{ aiSave({key:''}); if(key) key.value=''; if($('aiSum')) $('aiSum').textContent=aiSummary(); if(msg) msg.textContent='Key 已清除'; };
    if($('aiTest')) $('aiTest').onclick=()=>{
      save();
      const k=(key&&key.value||'').trim();
      if(!k || !(base&&base.value)){ if(msg) msg.textContent='先填 Base URL 与 Key'; return; }
      if(msg) msg.textContent='测试中…';
      const t0=Date.now();
      aiChat({system:'你是连通性测试助手。', user:'只回复 ok', stream:false, temp:0}).then(r=>{
        if(msg) msg.textContent='连通 · '+(Date.now()-t0)+'ms · 返回「'+String(r||'').trim().slice(0,20)+'」';
      }).catch(e=>{ if(msg) msg.textContent='失败：'+(e&&e.message||e); });
    };
    const anon=$('aiAnonSwitch');
    if(anon) anon.onclick=()=>{
      const v=anon.getAttribute('aria-checked')!=='true';
      aiSave({anon:v}); anon.setAttribute('aria-checked', v?'true':'false');
    };
    if($('aiPreview')) $('aiPreview').onclick=()=>{
      const el=$('aiPrev'); if(!el) return;
      if(!el.hidden){ el.hidden=true; el.value=''; return; }
      const d=aiDigest(false);
      el.hidden=false;
      el.value='【将发送给 AI 的全部内容 · 约 '+d.tokens+' tokens · 不含设备与账号信息】\n\n'+d.text;
    };
    if($('aiUsage')) $('aiUsage').textContent=aiUsageText();
    if($('aiLast')) $('aiLast').textContent=aiLastText();
  }

  const MD_PART_KW = [['腿', '腿'], ['胸', '胸'], ['背', '背'], ['肩', '肩'], ['二头', '臂'], ['三头', '臂'], ['手臂', '臂']];
  function mdHash(str){ let h = 5381; for (let i = 0; i < str.length; i++) { h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; } return h.toString(36); }
  function mdPart(title){
    for (const kv of MD_PART_KW){ if (String(title||'').indexOf(kv[0]) >= 0) return kv[1]; }
    return '其他';
  }
  function mdDate(mm, dd, now){
    const y0 = now.getFullYear(); const m = +mm, d = +dd;
    const guess = new Date(y0, m - 1, d);
    const y = guess > new Date(y0, now.getMonth(), now.getDate() + 7) ? y0 - 1 : y0;
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }
  function mdStrength(body){
    let txt = body.replace(/（(\d+)\s*\+\s*(\d+)）/g, '$1');
    const tk = [];
    const re = /(\d+(?:\.\d+)?)\s*[×xX]\s*(\d+(?:\.\d+)?)/g;
    let m;
    while ((m = re.exec(txt)) !== null) tk.push({ reps: +m[1], sets: +m[2], start: m.index, end: re.lastIndex });
    if (!tk.length) return null;
    const name = txt.slice(0, tk[0].start).replace(/[（(].*$/, '').replace(/[，,·]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!name) return null;
    const groups = [];
    tk.forEach((t, i) => {
      const seg = txt.slice(t.end, i + 1 < tk.length ? tk[i + 1].start : txt.length);
      let w = 0, unit = 'kg';
      const wm = seg.match(/(\d+(?:\.\d+)?)\s*(kg|lbs|lb|磅)/i);
      if (wm){ unit = /lb/i.test(wm[2]) ? 'lb' : 'kg'; w = +wm[1]; if (unit === 'lb') w = Math.round(w * 0.4536 * 10) / 10; }
      const warm = /热身/.test(seg);
      const n = Math.max(1, Math.min(20, t.sets));
      for (let k = 0; k < n; k++) groups.push({ reps: t.reps, weight: w, warmup: warm });
    });
    const work = groups.filter(g => !g.warmup);
    const anchor = work.length ? work : groups;
    return { name: name, groups: groups, sets: groups.length,
      reps: Math.max.apply(null, anchor.map(g => g.reps || 0)),
      weight: Math.max.apply(null, anchor.map(g => g.weight || 0)) };
  }
  function mdParse(texts){
    const now = new Date();
    const out = [];
    String(texts || '').replace(/\r/g, '').split('\n').forEach(function (raw) {
      const line = raw.trim(); if (!line) return;
      const dm = line.match(/(\d{2})(\d{2})\s*$/);
      const isItem = /^-\s*\[[xX ]\]/.test(line);
      if (!isItem && dm && !/：$/.test(line) && line.length > 4){
        const title = line.slice(0, dm.index).replace(/[：:]\s*$/, '').replace(/\s+/g, ' ').trim();
        out.push({ date: mdDate(dm[1], dm[2], now), title: title, part: mdPart(title), items: [] });
        return;
      }
      if (isItem && out.length){
        const body = line.replace(/^-\s*\[[xX ]\]\s*/, '').trim();
        if (!body) return;
        const cm = body.match(/^(.+?)\s*(\d+)\s*(?:min|分钟|′)/i);
        if (cm){ out[out.length - 1].items.push({ type: 'cardio', name: cm[1].trim(), min: +cm[2] }); return; }
        const st = mdStrength(body);
        if (st && st.sets) out[out.length - 1].items.push(Object.assign({ type: 'strength' }, st));
      }
    });
    return out;
  }
  function mdDupSet(){
    const set = {};
    (train.records || []).forEach(function (r){ set[r.date + '|' + r.name + '|' + (r.sets || 0) + '|' + (r.weight || 0)] = 1; });

  }

  function mdPreview(){

    sess.forEach(function (s){

        if (it.type === 'cardio'){ if (dup[s.date + '|cd|' + it.name + '|' + it.min]) nSkip++; else nCd++; }
        else { if (dup[s.date + '|' + it.name + '|' + it.sets + '|' + it.weight]) nSkip++; else nRec++; }
      });
    });
    __mdPending = { sess: sess, dup: dup };
    return { days: sess.length, rec: nRec, cd: nCd, skip: nSkip, first: sess.length ? sess[0].date : '', last: sess.length ? sess[sess.length - 1].date : '' };
  }
  function mdImport(){
    if (!__mdPending) return null;
    const { sess, dup } = __mdPending;
    const now = Date.now();
    const added = { rec: 0, cd: 0, log: 0 };
    const cdKeep = [];
    sess.forEach(function (s, si){
      const vol = s.items.filter(function (i){ return i.type === 'strength'; }).reduce(function (a, i){ return a + i.sets * i.reps * i.weight; }, 0);
      let groups = 0;
      s.items.forEach(function (it, ii){
        if (it.type === 'cardio'){
          const k = s.date + '|cd|' + it.name + '|' + it.min;
          if (dup[k]) return;
          dup[k] = 1;
          train.cardio.push({ uid: 'im' + mdHash(k + now), date: s.date, modal: it.name, dur: it.min, min: it.min, sec: it.min * 60,
            done: true, free: false, role: 'post', ts: now });
          added.cd++;
          return;
        }
        const k = s.date + '|' + it.name + '|' + it.sets + '|' + it.weight;
        if (dup[k]) return;
        dup[k] = 1;
        const exId = 'im' + mdHash(it.name);
        const uid = 'im' + mdHash(k + now + ii);
        const rec = { date: s.date, exId: exId, name: it.name, part: s.part, sets: it.sets, reps: it.reps, weight: it.weight, dur: 0, uid: uid };
        rec.groups = it.groups.map(function (g, gi){ return { no: gi + 1, reps: g.reps, weight: g.weight, done: true, warmup: !!g.warmup, uid: uid + 's' + gi }; });
        train.records.push(rec);
        groups += it.sets;
        added.rec++;
      });
      const has = added.rec || added.cd;
      const logId = 'im' + mdHash(s.date + '|' + s.title);
      if (has && !logs.some(function (l){ return l.id === logId; })){
        const nEx = s.items.filter(function (i){ return i.type === 'strength'; }).length;
        const nCd = s.items.filter(function (i){ return i.type === 'cardio'; });
        const parts = [];
        if (nEx) parts.push(nEx + ' 个动作');
        if (groups) parts.push(groups + ' 组');
        if (vol) parts.push(Math.round(vol).toLocaleString('en-US') + 'kg');
        if (nCd.length) parts.push(nCd.map(function (c){ return c.name + ' ' + c.min + '′'; }).join('、'));
        logs.push({ id: logId, kind: 'train', time: new Date(s.date + 'T20:00:00').toISOString(), date: s.date,
          day: '20:00', content: (s.title || '训练') + ' · ' + parts.join(' · '), tags: [s.part],
          score: 0, mood: 0, meta: { imported: true, part: s.part } });
        added.log++;
      }
    });
    logs.sort(function (a, b){ return String(b.time).localeCompare(String(a.time)); });
    train.records.sort(function (a, b){ return String(a.date).localeCompare(String(b.date)); });
    train.cardio.sort(function (a, b){ return String(a.date).localeCompare(String(b.date)); });
    __mdPending = null;
    return added;
  }

  /* ---------- 每周日回顾 ---------- */
  function weekRange(off){
    const t=new Date(); const wd=(t.getDay()+6)%7;
    const s=new Date(t); s.setDate(t.getDate()-wd-off*7);
    const e=new Date(s); e.setDate(s.getDate()+6);
    const p=n=>String(n).padStart(2,'0');
    const f=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
    const end = new Date(Math.min(e.getTime(), t.getTime()));
    return [f(s), f(end), s, e];
  }
  function reviewData(){
    const [aW,bW] = weekRange(0), [aP,bP] = weekRange(1);
    const inR=(l,a,b)=> (l.date||'')>=a && (l.date||'')<=b;
    const pick=(a,b)=>({
      logs:(logs||[]).filter(l=>l.kind!=='train' && inR(l,a,b)),
      trains:(logs||[]).filter(l=>l.kind==='train' && inR(l,a,b)),
      recs:(train.records||[]).filter(r=>r.date>=a && r.date<=b)
    });
    const cur=pick(aW,bW), prev=pick(aP,bP);
    const avg=(a,k)=>{ const v=a.filter(x=>typeof x[k]==='number'&&x[k]>0).map(x=>k==='mood'?moodNorm(x[k]):x[k]); return v.length?v.reduce((x,y)=>x+y,0)/v.length:null; };
    const sets=o=>o.recs.reduce((a,r)=>a+((r.groups&&r.groups.length)?r.groups.filter(g=>g.done).length:(r.sets||0)),0);
    const vol=o=>o.recs.reduce((a,r)=>a+(((r.groups||[]).filter(g=>g.done&&!g.warmup)).reduce((x,g)=>x+(g.reps||0)*(g.weight||0),0)),0);
    const kw=o=>{ const c={}; o.logs.forEach(l=>String(l.tags||'').split(/[,、，]/).filter(Boolean).forEach(t=>c[t]=(c[t]||0)+1));
      return Object.keys(c).sort((x,y)=>c[y]-c[x]).slice(0,3); };
    const s1={logs:cur.logs.length, sets:sets(cur), vol:Math.round(vol(cur)), sc:avg(cur.logs,'score'), md:avg(cur.logs,'mood'), kw:kw(cur)};
    const s2={logs:prev.logs.length, sets:sets(prev), vol:Math.round(vol(prev)), sc:avg(prev.logs,'score'), md:avg(prev.logs,'mood'), kw:kw(prev)};
    let rise='';
    if(s2.logs>=2 && s1.logs>0){
      if(s1.logs>s2.logs) rise=`记录比上周多 ${s1.logs-s2.logs} 条，节奏稳住了。`;
      else if(s1.logs<s2.logs) rise=`记录比上周少 ${s2.logs-s1.logs} 条，别让记录断掉。`;
      else rise='记录量和上周持平。';
    } else rise='数据还不够两周，下周就能看趋势了。';
    if(s1.md!=null && s2.md!=null && Math.abs(s1.md-s2.md)>=0.4) rise += ` 情绪均值 ${s2.md.toFixed(1)} → ${s1.md.toFixed(1)}。`;
    return {aW,bW,aP,bP,cur:s1,prev:s2,rise};
  }

  function corrTrainingEnergy(){
    const byDay={};
    logs.forEach(l=>{ const k=dk(new Date(l.time)); (byDay[k]=byDay[k]||[]).push(l.score||3); });
    const tds=new Set(train.records.map(r=>r.date).filter(Boolean));
    const A=[], B=[];
    Object.keys(byDay).forEach(k=>{
      const d=new Date(k); d.setDate(d.getDate()-1);
      const m=byDay[k].reduce((a,b)=>a+b,0)/byDay[k].length;
      (tds.has(dk(d))?A:B).push(m);
    });
    if(A.length<3||B.length<3) return null;
    const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
    return {diff:avg(A)-avg(B), n:A.length, n2:B.length, a:avg(A), b:avg(B)};
  }

      ${(function(){const c=corrTrainingEnergy();return c?`<div class="brief-signal">训练日次日精力 ${c.diff>=0?'+':''}${c.diff.toFixed(1)}（训练后 ${c.n} 天 vs 其他 ${c.n2} 天）</div>`:'';})()}
    </div>`;
  }
  function warnIfStale(){}


  /* ---------- 问自己的数据（规则问答） ---------- */
  const ASK_DK = d => { const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
  function askWindow(q){
    const now=new Date();
    const back=n=>{ const s=new Date(now); s.setDate(s.getDate()-n); return [ASK_DK(s), ASK_DK(now), '近'+(n+1)+'天']; };
    if(/今天|今日/.test(q)) return [ASK_DK(now), ASK_DK(now), '今天'];
    if(/昨天/.test(q)){ const y=new Date(now); y.setDate(y.getDate()-1); return [ASK_DK(y), ASK_DK(y), '昨天']; }
    if(/本周|这周|这星期|这一周/.test(q)){ const s=new Date(now); const wd=(s.getDay()+6)%7; s.setDate(s.getDate()-wd); return [ASK_DK(s), ASK_DK(now), '本周']; }
    if(/上周/.test(q)){ const e=new Date(now); const wd=(e.getDay()+6)%7; e.setDate(e.getDate()-wd-1); const s=new Date(e); s.setDate(s.getDate()-6); return [ASK_DK(s), ASK_DK(e), '上周']; }
    if(/本月|这个月/.test(q)){ const s=new Date(now.getFullYear(), now.getMonth(), 1); return [ASK_DK(s), ASK_DK(now), '本月']; }
    if(/上月|上个月/.test(q)){ const s=new Date(now.getFullYear(), now.getMonth()-1, 1); const e=new Date(now.getFullYear(), now.getMonth(), 0); return [ASK_DK(s), ASK_DK(e), '上月']; }
    if(/近30|一个月|30天/.test(q)) return back(29);
    if(/近14|两周/.test(q)) return back(13);
    if(/全部|所有|一直|总共|累计/.test(q)) return ['0000-00-00', ASK_DK(now), '全部'];
    return back(6);
  }
  const PART_RE = /背|胸|腿|臀|肩|臂|腹|腰腹|小腿|前臂|颈|有氧/;
  function askScope(a,b){
    const win = d => (d||'')>=a && (d||'')<=b;
    const lg = (logs||[]).filter(l=>l.kind!=='train' && win(l.date));
    const tr = (logs||[]).filter(l=>l.kind==='train' && win(l.date));
    const recs = ((train.records||[]).filter(r=>win(r.date)));
    return {win, lg, tr, recs};
  }
  function evRefHtml(items){
    if(!items.length) return '';
    return `<div class="ask-src"><span class="ask-src-t">依据 ${items.length} 条</span>`+
      items.slice(0,6).map(o=>`<button type="button" class="ev-chip" data-ev="${o.id}">${o.label}</span>`.replace('</span>','')+'</button>').join('')+`</div>`;
  }
  function answerAsk(q){
    q=String(q||'').trim(); if(!q) return null;
    const [a,b,rangeLabel]=askWindow(q);
    const sc=askScope(a,b);
    const fmt=n=>Math.round(n).toLocaleString();
    const dayShort=d=>{ const p=d.split('-'); return (+p[1])+'/'+(+p[2]); };
    const evOf=(l)=>({id:l.id, label:dayShort(l.date||'')+' '+(l.kind==='train'?'训练 · ':'')+String(l.content||'').slice(0,14)});
    const esc=ENGINE.esc;

    /* 1) 加班 × 睡眠/精力 关系 */
    if(/(加班|工作|压力).*(睡|精力|状态|情绪)|(睡|精力|状态|情绪).*(加班|工作)/.test(q)){
      const over=(logs||[]).filter(l=>l.kind!=='train' && /加班|熬夜|熬到/.test((l.content||'')+' '+(l.tags||'')));
      const next={};
      over.forEach(l=>{ const d=new Date((l.date||'')+'T00:00:00'); d.setDate(d.getDate()+1); next[ASK_DK(d)]=true; });
      const after=(logs||[]).filter(l=>l.kind!=='train' && next[l.date||'']);
      const calm=(logs||[]).filter(l=>l.kind!=='train' && !next[l.date||'']);
      const avg=arr=>{ const v=arr.filter(l=>typeof l.score==='number'&&l.score>0).map(l=>l.score); return v.length?v.reduce((x,y)=>x+y,0)/v.length:null; };
      const A=avg(after), C=avg(calm);
      if(A==null || C==null || over.length<2){
        return {title:'还不知道', main:'加班记录或次日精力样本不足（至少 2 次加班 + 有次日记录）。', sub:'多记几天再问，我不猜。', refs:over.map(evOf)};
      }
      const diff=(A-C);
      const verdict = Math.abs(diff)<0.3 ? '几乎没差别' : (diff<0?'明显更低':'反而更高');
      return {title:'加班 × 次日精力', range:rangeLabel,
        main:`加班后的第二天精力平均 ${A.toFixed(1)}，其它日子 ${C.toFixed(1)}，${verdict}（差 ${Math.abs(diff).toFixed(1)}）。`,
        sub:`加班 ${over.length} 次 · 有次日记录的 ${after.length} 天。基于你范围内的 ${sc.lg.length} 条日志，样本不大时只作参考。`,
        refs:over.map(evOf).concat(after.map(evOf)).slice(0,8)};
    }

    /* 2) 部位 / 最久没练 */
    if(/最久|多久没|没练/.test(q)){
      const parts=['胸','背','腿','肩','臂','腰腹','有氧'];
      const last={};
      (train.records||[]).forEach(r=>{ if(PART_RE.test(r.part||'')){ const k=(r.part||'').match(PART_RE)[0]; if(!last[k]||r.date>last[k]) last[k]=r.date; } });
      const rows=parts.map(p=>({p, d:last[p]||''})).filter(r=>r.d).sort((x,y)=> x.d<y.d?-1:1);
      if(!rows.length) return {title:'最久未练部位', range:'全部记录', main:'还没有带部位的训练记录，先练一次我就能算了。', sub:'', refs:[]};
      const top=rows[0];
      const days=Math.round((Date.now()-new Date(top.d+'T00:00:00').getTime())/864e5);
      return {title:'最久未练部位', range:'全部记录',
        main:`${top.p} 已经 ${days} 天没练（上次 ${top.d}）。`,
        sub: rows.map(r=>r.p+' · '+dayShort(r.d)+'（'+Math.round((Date.now()-new Date(r.d+'T00:00:00').getTime())/864e5)+' 天前）').join(' ／ '),
        refs:[]};
    }

    /* 3) 训练类：次数 / 组数 / 容量 / 部位 */
    if(/练了几次|训练几次|练了[几多]|几次训练|训练了|练了多少|几次/.test(q) || /(组|容量|总重|强度)/.test(q)){
      const part=(q.match(PART_RE)||[])[0]||'';
      const recs=part ? sc.recs.filter(r=>(r.part||'').indexOf(part)>=0) : sc.recs;
      if(!recs.length) return {title:'范围内没有训练', range:rangeLabel, main:`${rangeLabel}没有${part?'练'+part+'的':''}训练记录。`, sub:'去训练页排个计划，练完自动记账。', refs:[]};
      const days={}; recs.forEach(r=>days[r.date]=true);
      let sets=0, vol=0, done=0;
      recs.forEach(r=>{ const gs=(r.groups&&r.groups.length)?r.groups:[]; sets += gs.length||r.sets||0;
        gs.forEach(g=>{ if(g.done){ done++; if(!g.warmup) vol += (g.reps||0)*(g.weight||0); } }); });
      const partCnt={}; recs.forEach(r=>{ const k=(r.part||'其他'); partCnt[k]=(partCnt[k]||0)+1; });
      const topPart=Object.keys(partCnt).sort((x,y)=>partCnt[y]-partCnt[x])[0];
      if(/(容量|总重|强度|公斤|kg)/.test(q)){
        return {title:'训练容量', range:rangeLabel,
          main:`${rangeLabel}完成 ${done} 组，总容量 ${fmt(vol)} kg${part?'（只看'+part+'）':''}。`,
          sub:`${Object.keys(days).length} 个训练日 · ${recs.length} 个动作 · 平均每次 ${fmt(vol/Math.max(1,Object.keys(days).length))} kg`,
          refs:sc.tr.map(evOf)};
      }
      if(/组/.test(q)){
        return {title:'训练组数', range:rangeLabel, main:`${rangeLabel}计划 ${sets} 组，完成 ${done} 组${part?'（'+part+'）':''}。`,
          sub:`完成率 ${sets?Math.round(done/sets*100):0}% · ${Object.keys(days).length} 个训练日`, refs:sc.tr.map(evOf)};
      }
      return {title:'训练次数', range:rangeLabel,
        main:`${rangeLabel}练了 ${Object.keys(days).length} 天，共 ${recs.length} 个动作${part?'（'+part+'）':''}。`,
        sub:`最常练：${topPart}（${partCnt[topPart]} 次） · 完成 ${done} 组 · 容量 ${fmt(vol)} kg`,
        refs:sc.tr.map(evOf)};
    }

    /* 4) 精力/情绪 极值 */
    if(/状态|精力|情绪|心情|感觉/.test(q)){
      const good=/最好|最高|最棒|最佳|巅峰|精力好|状态好/.test(q);
      const pool=sc.lg.filter(l=>typeof l.score==='number'&&l.score>0);
      const moodPool=sc.lg.filter(l=>typeof l.mood==='number'&&l.mood>0);
      if(!pool.length && !moodPool.length) return {title:'没有可比的记录', range:rangeLabel, main:`${rangeLabel}还没有带精力/情绪的记录。`, sub:'写日志时拖动精力与情绪滑条，我就能做极值对比。', refs:[]};
      const useMood=/情绪|心情/.test(q);
      const val=l=>useMood?moodNorm(l.mood):l.score;
      const arr=(useMood?moodPool:pool).slice().sort((x,y)=>val(x)-val(y));
      const pick=good? arr[arr.length-1] : arr[0];
      const key=useMood?'mood':'score';
      const avg=arr.reduce((s,l)=>s+val(l),0)/arr.length;
      return {title:`${rangeLabel}${good?'状态最好':'状态最差'}的一天`, range:rangeLabel,
        main:`${pick.date}（${pick.date===ASK_DK(new Date())?'今天':dayShort(pick.date)}）${useMood?'情绪':'精力'} ${useMood?moodNorm(pick.mood):pick.score}/5，${good?'高于':'低于'}平均 ${avg.toFixed(1)}。`,
        sub:esc(String(pick.content||'').slice(0,60)) || '（这条没有正文）',
        refs:[evOf(pick)]};
    }

    /* 5) 睡眠 / 作息 */
    if(/睡|作息|熬夜/.test(q)){
      const hits=sc.lg.filter(l=>/睡|熬夜|作息/.test((l.content||'')+' '+(l.tags||'')));
      if(!hits.length) return {title:'睡眠记录还没有', range:rangeLabel, main:`${rangeLabel}没有提到睡眠的记录。`, sub:'写一条"昨晚一点才睡"，我就能开始看你的作息。', refs:[]};
      const avg=hits.filter(l=>l.score>0).map(l=>l.score);
      const mean=avg.length?avg.reduce((x,y)=>x+y,0)/avg.length:null;
      return {title:'作息记录', range:rangeLabel, main:`${rangeLabel}提到睡眠 ${hits.length} 次${mean?`，这些日子平均精力 ${mean.toFixed(1)}`:''}。`,
        sub:'想更准，可以连着记几天同一时间的入睡状态。', refs:hits.map(evOf)};
    }

    /* 6) 关键词 / 高频 */
    if(/最常|高频|关键词|频繁|最多/.test(q)){
      const cnt={};
      sc.lg.forEach(l=>{ String(l.tags||'').split(/[,、，]/).filter(Boolean).forEach(t=>cnt[t]=(cnt[t]||0)+1);
        String(l.content||'').replace(/[，,。、\s]+/g,' ').split(' ').filter(w=>w.length>=2).slice(0,8).forEach(w=>cnt[w]=(cnt[w]||0)+1); });
      const top=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x]).slice(0,6);
      if(!top.length) return {title:'关键词还不够', range:rangeLabel, main:'范围内记录太少，看不出高频词。', sub:'多记几条再问。', refs:[]};
      return {title:'高频词', range:rangeLabel, main: top.map(k=>`${k}（${cnt[k]}）`).join(' · '), sub:`基于 ${sc.lg.length} 条日志`, refs:[]};
    }

    /* 7) 记录条数 / 摘要（兜底） */
    if(/几条|多少条|记录数|记了多少/.test(q)){
      return {title:'记录量', range:rangeLabel, main:`${rangeLabel}写了 ${sc.lg.length} 条日志、${sc.tr.length} 张训练卡。`, sub:'日志与训练分开统计，都按记录日归档。', refs:[]};
    }
    const dayCnt={}; sc.lg.forEach(l=>dayCnt[l.date]=true);
    const moodAvg=(()=>{ const v=sc.lg.filter(l=>l.mood>0).map(l=>moodNorm(l.mood)); return v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(1):'—'; })();
    return {title:rangeLabel+' 概况', range:rangeLabel,
      main:`${sc.lg.length} 条日志 · ${Object.keys(dayCnt).length} 个记录日 · 平均情绪 ${moodAvg} · ${sc.recs.length} 个训练动作。`,
      sub:'可以继续问：训练次数 / 组数 / 容量 / 状态最差的一天 / 加班和睡眠 / 最久没练的部位。',
      refs:sc.lg.slice(0,4).map(evOf)};
  }
  function aiAskEnhance(q, r, box){
    if(!aiReady()) return;

    bar.innerHTML='<i class="ai-dot"></i><span class="ai-txt">AI 正在回答… 0.0s</span>';
    box.appendChild(bar);
    const t0=Date.now();
    const tick=setInterval(()=>{
      const el=bar.querySelector('.ai-txt');
      if(!el){ clearInterval(tick); return; }
      const sec=Math.round((Date.now()-t0)/100)/10;
      el.textContent='AI 正在回答… '+sec+'s'+(sec>=8?'　网络慢时可先看上面的本地结论':'');
    },400);
    const stop=()=>{ clearInterval(tick); };
    const run=(attempt)=> aiAsk(q, r, box).then(out=>{
      stop();
      let a=box.querySelector('.ask-a');
      if(!a){ a=document.createElement('div'); a.className='ask-a'; box.appendChild(a); }
      const pretty=(txt)=>String(txt||'').replace(/(\d{10,16})/g, (m)=>{
        const l=(logs||[]).find(x=>String(x.id)===m);
        if(!l) return m;
        const p=String(l.date||'').split('-');
        return '（'+((p[1]||'')+'/'+(p[2]||''))+'：'+String(l.content||'').slice(0,12)+'…）';
      });
      a.innerHTML='<b>AI 回答</b><p>'+ENGINE.esc(pretty(out.answer))+'</p>'+
        '<div class="ask-sub">'+(out.confidence!=null?('置信度 '+Math.round(out.confidence*100)+'% · '):'')+'模型 '+ENGINE.esc(aiCfg().model)+' · 原文依据见下</div>';
      const ids=(out.evidence||[]).filter(Boolean);

        let src=box.querySelector('.ask-src');
        if(!src){ src=document.createElement('div'); src.className='ask-src'; box.appendChild(src); }
        src.innerHTML='<span class="ask-src-t">依据 '+ids.length+' 条</span>'+ids.map(id=>{

      bar.innerHTML='<i class="ai-dot"></i><span class="ai-txt">AI 未返回（'+ENGINE.esc(why)+'）· 已用内置规则</span><button type="button" class="ai-retry" id="aiAskRetry">重试</button>';
      const rb=bar.querySelector('#aiAskRetry');
      if(rb) rb.onclick=()=>{ try{ bar.remove(); }catch(e3){} aiAskEnhance(q, r, box); };
      try{ trToast('AI 未返回 · 已用内置规则'); }catch(e2){}

  /* ==================== Agent 接入层：规则引擎 / LLM 共用同一份契约 ==================== */
  const AI_KEY='selfagent_ai_v1';

  let __aiCfg=null;
  function aiCfg(){

      model:String(c.model||'deepseek-chat').trim(), anon:c.anon!==false, count:+c.count||0, tokens:+c.tokens||0,
      last:+c.last||0, lastFp:String(c.lastFp||'')};

  function aiSave(patch){

    const raw={engine:c.engine,base:c.base,key:c.key,model:c.model,anon:c.anon,count:c.count,tokens:c.tokens,last:c.last,lastFp:c.lastFp};

  function aiChat(o){
    o=o||{};

    if(!c.base||!c.key) return Promise.reject(new Error('未配置 AI'));
    const base=c.base.replace(/\/+$/,'');
    const url=base.indexOf('/chat/completions')>=0 ? base : base+'/chat/completions';
    const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    const to=setTimeout(()=>{ try{ ctrl&&ctrl.abort(); }catch(e){} }, (o.timeout>0?o.timeout:60000));
    const body={model:c.model||'deepseek-chat',
      messages:[{role:'system',content:(o.system||'')+(aiMemText()?('\n\n【长期记忆】\n'+aiMemText()):'')},
        {role:'user',content:o.image?[{type:'text',text:o.user||''},{type:'image_url',image_url:{url:o.image}}]:(o.user||'')}],
      temperature:(o.temp!=null?+o.temp:0.4), stream:!!o.stream};
    if(o.maxTok) body.max_tokens=+o.maxTok;
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify(body), signal:ctrl?ctrl.signal:undefined}).then(r=>{
      if(!r.ok){ clearTimeout(to); return r.text().catch(()=>'').then(t=>{ throw new Error('HTTP '+r.status+(t?' · '+String(t).slice(0,80):'')); }); }
      if(!o.stream){
        return r.json().then(j=>{
          clearTimeout(to); aiUsage(j.usage, 0);
          const str=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
          if(o.onLine) String(str).split(/\r?\n/).forEach(x=>{ const t=x.trim(); if(t) try{ o.onLine(t); }catch(e){} });
          return str;
        });
      }
      const rd=r.body.getReader(), dec=new TextDecoder();
      let buf='', full='', lineBuf='';
      const pump=()=>rd.read().then(({done,value})=>{
        if(done){
          clearTimeout(to); aiUsage(null, full.length);
          if(lineBuf.trim() && o.onLine) try{ o.onLine(lineBuf.trim()); }catch(e){}
          return full;
        }
        buf+=dec.decode(value,{stream:true});
        let idx;
        while((idx=buf.indexOf('\n'))>=0){
          const raw=buf.slice(0,idx).replace(/\r$/,''); buf=buf.slice(idx+1);
          if(raw.indexOf('data:')!==0) continue;
          const data=raw.slice(5).trim();
          if(data==='[DONE]') continue;
          let j; try{ j=JSON.parse(data); }catch(e){ continue; }
          const d=(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';
          if(!d) continue;
          full+=d; lineBuf+=d;
          if(o.onDelta) try{ o.onDelta(d, full); }catch(e){}
          let nl;
          while((nl=lineBuf.indexOf('\n'))>=0){
            const ln=lineBuf.slice(0,nl).trim(); lineBuf=lineBuf.slice(nl+1);
            if(ln && o.onLine) try{ o.onLine(ln); }catch(e){}
          }
        }
        return pump();
      });
      return pump();
    }).catch(e=>{
      clearTimeout(to);
      if(e&&e.name==='AbortError') throw new Error('请求超时');
      const raw=String(e&&e.message||e);
      if(/Failed to fetch|NetworkError|Load failed|ERR_|net::/i.test(raw)) throw new Error('网络不可达');
      throw (e instanceof Error)?e:new Error(raw);
    });
  }

  /* ---------- Agent 契约层（AgentProvider）：换模型只改这一层 ---------- */

    try{ return JSON.parse(s.slice(i,j+1)); }catch(e){ return null; }
  }

  /* ---------- 事件归一 / 统计摘要 / 三级压缩 ---------- */
  function aiP2(n){ return String(n).padStart(2,'0'); }
  function aiDayStr(t){ const d=new Date(t); return d.getFullYear()+'-'+aiP2(d.getMonth()+1)+'-'+aiP2(d.getDate()); }
  function aiMask(t){
    return String(t||'')
      .replace(/1\d{10}/g,'[手机号]')
      .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[邮箱]')
      .replace(/身份证[:：]?\d{6,}/g,'身份证[已隐去]');
  }
  function aiStat(){
    const lg=((typeof logs!=='undefined'?(logs||[]):[])).filter(l=>l.kind!=='train');
    const recs=(typeof train!=='undefined'&&train&&Array.isArray(train.records))?train.records:[];
    const types=(typeof settings!=='undefined'&&settings&&Array.isArray(settings.types))?settings.types:[];
    const lab=k=>{ const t=types.find(x=>x.key===k); return t?t.label:('其他'); };
    const sc=lg.filter(l=>typeof l.score==='number'&&l.score>0).map(l=>l.score);
    const md=lg.filter(l=>l.mood>0).map(l=>moodNorm(l.mood));
    const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const tmap={}; lg.forEach(l=>{ tmap[l.type]=(tmap[l.type]||0)+1; });
    const tagmap={}; lg.forEach(l=>{ String(l.tags||'').split(/[,、，]/).filter(Boolean).forEach(t=>tagmap[t]=(tagmap[t]||0)+1); });
    const daySet={}; lg.forEach(l=>{ if(l.date) daySet[l.date]=1; });
    const dates=Object.keys(daySet).sort();
    let done=0, vol=0, rpe={easy:0,ok:0,hard:0};
    const partLast={};
    recs.forEach(r=>{
      (Array.isArray(r.groups)?r.groups:[]).forEach(g=>{ if(!g.done) return; done++; if(!g.warmup) vol+=(g.reps||0)*(g.weight||0); if(g.rpe&&rpe[g.rpe]!=null) rpe[g.rpe]++; });
      const pt=(r.part||''); if(pt){ if(!partLast[pt]||r.date>partLast[pt]) partLast[pt]=r.date; }
    });
    const weeks=[];
    for(let w=3;w>=0;w--){
      const lo=Date.now()-(w+1)*7*864e5, hi=Date.now()-w*7*864e5;
      let v=0,n=0;
      recs.forEach(r=>{ const t=new Date((r.date||'')+'T00:00:00').getTime(); if(t>lo&&t<=hi){ n++; (r.groups||[]).forEach(g=>{ if(g.done&&!g.warmup) v+=(g.reps||0)*(g.weight||0); }); } });
      weeks.push({w:'T-'+(w+1), n:n, v:Math.round(v)});
    }
    const gaps={};
    Object.keys(partLast).forEach(p=>{ gaps[p]=Math.round((Date.now()-new Date(partLast[p]+'T00:00:00').getTime())/864e5); });
    return {logsN:lg.length, days:dates.length, from:dates[0]||'', to:dates[dates.length-1]||'',
      energy:mean(sc), mood:mean(md), streak:(typeof streakDays==='function'?streakDays():0),
      tmap:Object.keys(tmap).sort((a,b)=>tmap[b]-tmap[a]).map(k=>lab(k)+'×'+tmap[k]),
      tags:Object.keys(tagmap).sort((a,b)=>tagmap[b]-tagmap[a]).slice(0,6).map(k=>k+'×'+tagmap[k]),
      recs:recs.length, done:done, vol:Math.round(vol), rpe:rpe, gaps:gaps, weeks:weeks,
      lg:lg, recsRaw:recs};
  }
  function aiDigest(slim){
    const st=aiStat();
    const c=aiCfg();
    const anon=c.anon!==false;
    const f1=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1);
    const lines=[];
    lines.push('【统计摘要】');
    lines.push('日志 '+st.logsN+' 条 / '+st.days+' 个记录日 / 跨度 '+(st.from||'—')+' ~ '+(st.to||'—')+' / 连续打卡 '+st.streak+' 天');
    lines.push('平均精力 '+f1(st.energy)+'/5 · 平均情绪 '+f1(st.mood)+'/5');
    if(st.tmap.length) lines.push('类型分布：'+st.tmap.join(' · '));
    if(st.tags.length) lines.push('高频标签：'+st.tags.join(' · '));
    lines.push('训练：'+st.recs+' 个动作 / 完成 '+st.done+' 组 / 总容量 '+st.vol+' kg / RPE 轻松'+st.rpe.easy+' 适中'+st.rpe.ok+' 吃力'+st.rpe.hard);
    const gaps=Object.keys(st.gaps);
    if(gaps.length) lines.push('各部位距今天数：'+gaps.map(p=>p+' '+st.gaps[p]+' 天').join(' / '));
    lines.push('近 4 周（旧→新）动作数/容量：'+st.weeks.map(w=>w.w+': '+w.n+' / '+w.v+'kg').join(' | '));
    const now=Date.now();
    const recent=st.lg.filter(l=>{ const t=new Date(l.time||'');
      return now-t.getTime()<=14*864e5; }).slice(-40);
    if(recent.length){
      lines.push(''); lines.push('【近 14 天记录原文】');
      recent.forEach(l=>{
        lines.push((l.date||aiDayStr(l.time||''))+' 精力'+(l.score||0)+' 情绪'+(l.mood||0)+
          (l.tags?' ['+l.tags+']':'')+'｜'+((c.anon!==false)?aiMask(String(l.content||'').slice(0,70)):String(l.content||'').slice(0,70)));
      });
    }
    const older=st.lg.filter(l=>{ const t=new Date(l.time||''); return now-t.getTime()>14*864e5; });
    if(older.length && !slim){
      const mm={}; older.forEach(l=>{ const k=String(l.date||'').slice(0,7); mm[k]=(mm[k]||0)+1; });
      const kws={};
      older.forEach(l=>{ String(l.content||'').replace(/[，,。、\s]+/g,' ').split(' ').filter(w=>w.length>=2).slice(0,6).forEach(w=>kws[w]=(kws[w]||0)+1); });
      lines.push(''); lines.push('【更早记录（仅摘要）】');
      lines.push('按月份：'+Object.keys(mm).sort().map(k=>k+' '+mm[k]+' 条').join(' · '));
      lines.push('关键词：'+Object.keys(kws).sort((a,b)=>kws[b]-kws[a]).slice(0,10).join(' · '));
    }
    const p=(typeof profile!=='undefined'?profile:{})||{};
    const ptxt=[p.gender,p.age,p.job,p.height,p.weight].filter(Boolean).join(' / ');
    if(ptxt){ lines.push(''); lines.push('【人物档案】'+ptxt); }
    const text=lines.join('\n');
    return {text:text, tokens:Math.ceil(text.length/1.6), anon:anon, st:st};
  }
  function aiFingerprint(){
    const lg=((typeof logs!=='undefined'?(logs||[]):[])); const recs=((typeof train!=='undefined'&&train&&train.records)||[]);
    const s=[lg.length, recs.length, (lg[lg.length-1]||{}).id||'', (recs[recs.length-1]||{}).date||'',
      JSON.stringify((typeof profile!=='undefined'?profile:{})||{}).length, aiCfg().model].join('|');
    let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
    return h.toString(36);
  }

  /* ---------- 报告 / 问答的 LLM 实现 ---------- */
  function aiCacheAll(){ try{ return JSON.parse(localStorage.getItem(AIC_KEY)||'{}')||{}; }catch(e){ return {}; } }
  function aiCacheGet(tab, fp, ttl){
    /* 命中也必须带 data，否则视为未命中 */
    const all=aiCacheAll(); const it=all[tab];
    if(!it || it.fp!==fp) return null;
    if(ttl && (Date.now()-it.ts)>ttl) return null;
    return it;
  }
  function aiCacheDel(tab){

  }
  function aiCacheSet(tab, fp, data){
    const all=aiCacheAll(); all[tab]={fp:fp, ts:Date.now(), data:data};
    const keys=Object.keys(all).filter(k=>k.indexOf('ins:')!==0);
    if(keys.length>8) keys.slice(0,keys.length-8).forEach(k=>{ delete all[k]; });
    try{ localStorage.setItem(AIC_KEY, JSON.stringify(all)); }catch(e){}
  }
  function aiSecHtml(o){

  const AI_SYS='你是 SelfAgent 的自我认知教练，只依据用户给出的记录做归纳，不编造数字、不做医疗诊断。'+
    '输出必须是纯 NDJSON（每行一个 JSON 对象），不要代码块、不要解释、不要多余文字，字段严格按用户要求。';
  function aiReport(tab, box, onState){

      plan:'5-8 节：本周重点、每次训练的动作与组数建议（含重量建议）、负荷安排、恢复与睡眠安排、卡点与替代方案',
      trend:'5-7 节：当前基线、三种情景（维持/加强/过载）各自 2-4 周后的样子、早期预警信号、干预点'}[tab];
    const usr=[
      '契约字段：'+spec.join(', '),

    ].join('\n');

  /* ---------- 问答 ---------- */
  function aiAskCtx(q){
    const st=aiStat();
    const hist=(window.__askHist||[]).slice(-3);
    const related=[];
    const kw=String(q||'').replace(/[？?。，,\s]/g,'').slice(0,8);
    (st.lg||[]).slice(-60).forEach(l=>{
      if(kw && (String(l.content||'').indexOf(kw.slice(0,2))>=0 || (l.tags||'').indexOf(kw.slice(0,2))>=0)) related.push(l);
    });
    return {hist:hist, related:related.slice(0,6)};
  }
  function aiAsk(q, ruleAns, box){
    const c=aiAskCtx(q);
    const d=aiDigest(true);
    const refs=(ruleAns&&ruleAns.refs)||[];
    const usr=[
      '输出：第 1 行 {"answer":"2-3 句中文回答，先给结论再给依据"}；第 2 行 {"evidence":["记录id",...],"confidence":0-1}。',
      '可引用的记录 id：'+refs.map(r=>r.id).join(', '),
      (c.hist.length?('\n【对话历史】'+c.hist.map(h=>'问：'+h.q+'\n答：'+String(h.a||'').slice(0,120)).join('\n')):''),
      '\n【用户问题】'+q,
      '\n【数据】'+d.text
    ].join('\n');
    const out={answer:'', evidence:[], confidence:null};
    return aiChat({system:AI_SYS, user:usr, stream:false, temp:0.3, timeout:26000, maxTok:420, onLine:line=>{
      let o; try{ o=JSON.parse(line); }catch(e){ return; }
      if(o.answer) out.answer=String(o.answer);
      if(Array.isArray(o.evidence)) out.evidence=o.evidence.map(String);
      if(o.confidence!=null) out.confidence=+o.confidence;
    }}).then(()=>{
      if(!out.answer) throw new Error('空回答');
      return out;
    });
  }

  /* 把模型输出收敛成一句可直接显示的话（防 JSON、防长句、防引号） */
  function aiOneLine(t, max){
    let s=String(t==null?'':t).split(/\r?\n/).map(x=>x.trim()).filter(Boolean)[0]||'';
    if(s.charAt(0)==='{' || s.charAt(0)==='['){
      try{
        let o=JSON.parse(String(t).trim());
        if(Array.isArray(o)) o=o[0]||{};
        s=o.answer||o.insight||o.rationale||o.oneline||o.text||'';
        s=String(s);
      }catch(e){}
    }
    s=s.replace(/^["'「『]+|["'」』]+$/g,'').replace(/\s+/g,' ').trim();
    const n=max||60;
    return s.length>n ? s.slice(0,n)+'…' : s;
  }

    if(!inp || inp.dataset.sug) return; inp.dataset.sug='1';
    const box=document.createElement('div'); box.className='sug';
    if(inp.parentNode) inp.parentNode.insertBefore(box, inp.nextSibling);

      const v=(inp.value||'').trim();

      const seen={}, hits=[];
      (logs||[]).forEach(l=>{
        const t=(l.content||'').trim();

        if(t.indexOf(v)>=0 && !seen[t]){ seen[t]=1; hits.push(t); }
      });
      // 也匹配“相同开头”的短句
      (logs||[]).forEach(l=>{
        const t=(l.content||'').trim();
        if(t.length>=6 && t.slice(0,3)===v.slice(0,3) && !seen[t] && hits.length<6){ seen[t]=1; hits.push(t); }
      });
      const list=hits.slice(0,3).filter(t=>t.length<=60).map(t=>`<button type="button" class="sug-i">${ENGINE.esc(t)}</button>`).join('');

      }));
    };

  }

  /* ---------- 洞察 Feed：规则引擎产出 insights[]（与 LLM 契约同构） ---------- */
  let __feed={items:[],tab:'persona'};
  function insAgg(){
    const now=Date.now(), ms=864e5;
    const lg=(logs||[]).filter(l=>l.kind!=='train');
    const win=(arr,a,b)=>arr.filter(l=>{ const t=now-new Date(l.time||(l.date+'T12:00:00')).getTime(); return t>a && t<=b; });
    const avg=(arr,k)=>{ const v=arr.map(l=>l[k]).filter(x=>typeof x==='number'&&x>=0); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
    const moodAvg=arr=>{ const v=arr.map(l=>moodNorm(l.mood)).filter(x=>x>0); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
    const R=win(lg,0,7*ms), P=win(lg,7*ms,14*ms);
    const rAvg=avg(R,'score'), pAvg=avg(P,'score'), rMood=moodAvg(R), pMood=moodAvg(P);
    const rec7=(train.records||[]).filter(r=>{ const t=now-new Date((r.date||'')+'T00:00:00').getTime(); return t<=7*ms && t>=0; });
    const recP=(train.records||[]).filter(r=>{ const t=now-new Date((r.date||'')+'T00:00:00').getTime(); return t>7*ms && t<=14*ms; });
    const sets7=rec7.reduce((a,b)=>a+(b.sets||0),0), setsP=recP.reduce((a,b)=>a+(b.sets||0),0);
    const days7=Array.from(new Set(rec7.map(r=>r.date))).length;
    const night=lg.filter(l=>{ const h=new Date(l.time||(l.date+'T12:00:00')).getHours(); return h>=23||h<=3; });
    const nd=d=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()+1); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
    const chk=d=>d||'';
    const nightNext={};
    night.forEach(l=>{ const d=(l.date||'').slice(0,10); if(d) nightNext[nd(d)]=true; });
    const aN=lg.filter(l=>nightNext[(l.date||'').slice(0,10)]);
    const aO=lg.filter(l=>!nightNext[(l.date||'').slice(0,10)]);
    const nA=avg(aN,'score'), nO=avg(aO,'score');
    const nightDiff=(nA!=null&&nO!=null&&aN.length>=2)?(nA-nO):null;
    const anx=win(lg,0,14*ms).filter(l=>/焦虑|烦|压抑|崩溃|累到|情绪低|失眠/.test(String((l.content||'')+' '+(l.tags||''))));
    const evOf=l=>({id:l.id, label:((l.date||'').slice(5)||'')+' '+String(l.content||'').slice(0,8)});
    return {now,ms,lg,R,P,rAvg,pAvg,rMood,pMood,rec7,recP,sets7,setsP,days7,night,nightDiff,anx,evOf};
  }
  function insPartGap(){
    const now=Date.now();
    const last={};
    (train.records||[]).forEach(r=>{ if(!r.part) return; const p=(r.part||'').match(/胸|背|腿|臀|肩|臂|腹|腰腹|有氧/)||[]; const k=p[0]||r.part; if(!last[k]||r.date>last[k]) last[k]=r.date; });
    let worst=null;
    Object.keys(last).forEach(k=>{ const g=Math.round((now-new Date(last[k]+'T00:00:00').getTime())/864e5); if(g>=0 && (!worst||g>worst.gap)) worst={part:k,gap:g,date:last[k]}; });
    return worst;
  }
  function insStall(){
    const byEx={};
    (train.records||[]).sort((a,b)=>(a.date>b.date?1:-1)).forEach(r=>{ if(!r.exId||!r.weight) return; (byEx[r.exId]=byEx[r.exId]||[]).push(r); });
    let best=null;
    Object.keys(byEx).forEach(k=>{
      const rs=byEx[k].slice(-3);
      if(rs.length<2) return;
      const w0=rs[rs.length-1].weight, w1=rs[rs.length-2].weight;
      if(Math.abs(w0-w1)>0.01) return;
      const gap=Math.round((Date.now()-new Date(rs[rs.length-1].date+'T00:00:00').getTime())/864e5);
      if(gap>21) return;
      if(!best || rs.length>best.n) best={n:rs.length, name:rs[rs.length-1].name||'该动作', weight:w0, exId:rs[rs.length-1].exId, recs:rs};
    });
    return best;
  }
  function genInsights(){
    const g=insAgg(), out=[];
    const f1=v=>v==null?null:(Math.round(v*10)/10).toFixed(1);
    const push=o=>{ if(o) out.push(o); };
    /* 精力 */
    if(g.rAvg!=null && g.pAvg!=null){
      const diff=g.rAvg-g.pAvg;
      if(diff<=-0.5) push({cat:'energy',catLabel:'精力',lv:'warn',head:'近 7 天精力 '+f1(g.rAvg)+'，比前一周低 '+f1(Math.abs(diff)),
        why:'7 天均值对比：本周 '+f1(g.rAvg)+' vs 上周 '+f1(g.pAvg)+'（'+g.R.length+' 条 vs '+g.P.length+' 条记录）',
        conf:'基于 '+(g.R.length+g.P.length)+' 条记录', refs:g.R.slice().sort((a,b)=>(a.score||5)-(b.score||5)).slice(0,3).map(g.evOf)});
      else if(diff>=0.5) push({cat:'energy',catLabel:'精力',lv:'up',head:'精力在回升，本周均值 '+f1(g.rAvg)+'，高出 '+f1(diff),
        why:'7 天均值对比：本周 '+f1(g.rAvg)+' vs 上周 '+f1(g.pAvg)+'，保持当前作息',
        conf:'基于 '+(g.R.length+g.P.length)+' 条记录', refs:g.R.slice(-3).map(g.evOf)});
    }
    /* 作息 → 次日精力 */
    if(g.nightDiff!=null){
      const bad=g.nightDiff<0;
      push({cat:'rest',catLabel:'作息',lv:bad?'warn':'up',

      if(!panel) return;

      const host=panel.closest('#planSheet,.msheet,.log-sheet'); if(!host) return;
      const y0=e.touches[0].clientY, x0=e.touches[0].clientX;
      let dy=0, dragging=false;
      const move=ev=>{
        const y=ev.touches[0].clientY, x=ev.touches[0].clientX;
        if(!dragging){
          if(y-y0>9 && Math.abs(y-y0)>Math.abs(x-x0)+4){ dragging=true; panel.classList.add('dragging'); }
          else if(Math.abs(x-x0)>12){ cleanup(); return; }
        }
        if(dragging){ dy=Math.max(0,y-y0); panel.style.transform='translateY('+dy+'px)'; ev.preventDefault(); }
      };
      const up=()=>{
        cleanup();
        if(!dragging) return;
        panel.style.transition='transform .2s var(--ease)';
        if(dy>86){
          panel.style.transform='translateY(105%)';
          setTimeout(()=>{ CLOSE.close(host); panel.style.transition=''; panel.style.transform=''; panel.classList.remove('dragging'); }, 200);
        }else{
          panel.style.transform='';
          setTimeout(()=>{ panel.style.transition=''; panel.classList.remove('dragging'); }, 220);
        }
      };
      const cleanup=()=>{ document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up); document.removeEventListener('touchcancel',up); };

      document.addEventListener('touchend',up);

      });
    };

    mo.observe(document.body,{childList:true,subtree:true});
